tions for Rheumatology：欧州リウマチ学会）/ACR（American College of Rheumatology：米国リウマチ学会） の SLE（systemic lupus erythematosus：全身性エリテマトーデス） 分類基準について正しいものはどれか。","ch":["ANA（antinuclear antibody：抗核抗体） 80倍以上が入口で、合計10点以上","ANA（antinuclear antibody：抗核抗体） 陰性でも腎炎なら必ず分類できる","11項目のうち4項目以上を満たせば分類","同じ領域の項目はすべて足して数える"],"a":0,"cx":["","2019年基準では抗核抗体（80倍以上の陽性歴）が必ず必要な入口条件。","11項目中4項目は 1997年の ACR 基準。","同じ領域（ドメイン）の中では、最も点数の高い項目1つだけを数える。"],"core":"2019基準：入口＝ANA 80倍以上 → 7つの臨床領域＋3つの免疫領域の重みづけ → 10点以上（臨床を1つ以上含む）。","e":"主な配点（覚えるのは高い点の項目）：\n・腎：ループス腎炎 III/IV 型 10点、II/V 型 8点、蛋白尿 0.5 g/日以上 4点\n・皮膚粘膜：急性皮膚ループス 6点、亜急性・円板状 4点、口腔潰瘍 2点、非瘢痕性脱毛 2点\n・漿膜：急性心膜炎 6点、胸水・心嚢水 5点\n・関節：2関節以上の滑膜炎または圧痛＋朝のこわばり 6点\n・神経：けいれん 5点、精神病 3点、せん妄 2点\n・血液：自己免疫性溶血 4点、血小板減少 4点、白血球減少 3点\n・全身：発熱 2点\n・免疫：抗dsDNA（double-stranded DNA：二本鎖DNA） または抗Sm 抗体 6点、低補体（C3 と C4 両方 4点・どちらか 3点）、抗リン脂質抗体 2点\nほかの原因で説明できる項目は数えない。腎生検で III/IV 型＋ANA 陽性なら、それだけで10点に届く。","tg":["gl"],"mt":["slecrit"]},{"id":"sle-2f0d438f","f":"sle","u":36,"o":177,"lv":2,"q":"SLE（systemic lupus erythematosus：全身性エリテマトーデス） の皮膚症状とその特徴の組み合わせで正しいものはどれか。","ch":["SLE の脱毛 ― すべて瘢痕性で回復しない","頬部紅斑 ― 鼻唇溝まで広くおおうのが特徴","亜急性皮膚ループス ― 抗Sm 抗体と強く関連","円板状エリテマトーデス ― 瘢痕を残す"],"a":3,"cx":["SLE の活動期の脱毛は非瘢痕性（びまん性・前頭部の「ループスヘア」）で回復する。瘢痕性は円板状の病変。","頬部紅斑は鼻唇溝を避けるのが特徴（皮膚筋炎のヘリオトロープ疹・脂漏性皮膚炎との違い）。","亜急性皮膚エリテマトーデスは抗SS-A 抗体と関連し、日光で環状・乾癬様の皮疹が出る。薬剤（PPI（proton pump inhibitor：プロトンポンプ阻害薬）・テルビナフィン・サイアザイドなど）で起こることもある。",""],"core":"急性（頬部紅斑・瘢痕なし）・亜急性（環状・抗SS-A・光線過敏・瘢痕なし）・慢性＝円板状（瘢痕・萎縮・永久脱毛）。","e":"円板状エリテマトーデスは顔・耳・頭皮に多く、SLE にならない「皮膚だけ」の例も多い（SLE に進むのは 5〜10%）。\n皮膚ループスの治療：遮光、ステロイド外用・タクロリムス外用、ヒドロキシクロロキン（国内で皮膚エリテマトーデスに適応）。喫煙はヒドロキシクロロキンの効果を下げる。\n口腔潰瘍は硬口蓋に多く、痛みが少ない（ベーチェット病のアフタは痛い）。","tg":[]},{"id":"sle-c60fcff3","f":"sle","u":36,"o":178,"lv":3,"q":"32歳の女性。SLE（systemic lupus erythematosus：全身性エリテマトーデス） で治療中。腹痛と嘔吐、腹部膨満が数日続き、CT で小腸の壁が全周性に厚く、層状に造影される（target sign）。腹水があり、両側の水腎症もある。最も考えられる病態はどれか。","ch":["ループス腸炎とループス膀胱炎","過敏性腸症候群（機能性）","急性虫垂炎（穿孔を伴う）","急性膵炎（単独の病変）"],"a":0,"cx":["","CT で壁肥厚と腹水があり、器質的な病変がある。","虫垂炎では小腸のびまん性の壁肥厚と水腎症は説明できない。","膵炎も SLE で起こるが、target sign の小腸壁肥厚と水腎症を説明できない。"],"core":"SLE の消化器病変＝ループス腸炎（target sign）・偽性腸閉塞・ループス膀胱炎（水腎症）が日本人に多く、まとめて起こることがある。治療は大量ステロイド。","e":"ループス腸炎は腸間膜の血管炎や免疫複合体による腸の浮腫で、早く大量ステロイドを使えば多くは良くなる。腸管の虚血・穿孔に注意する。\nループス膀胱炎は間質性膀胱炎の形で、膀胱の壁が厚く・小さくなり、両側の水腎症を起こす。\nほかに、SLE の腹痛：漿膜炎（腹膜炎）、膵炎、抗リン脂質抗体症候群による腸間膜動脈の血栓、薬（ステロイド・NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） による潰瘍）。","tg":["cs"]},{"id":"sle-754aa7f9","f":"sle","u":36,"o":179,"lv":3,"q":"25歳の女性。SLE（systemic lupus erythematosus：全身性エリテマトーデス） でプレドニゾロン（プレドニン） 60 mg/日を始めて10日目、急に興奮して「誰かに見張られている」と言い、眠らなくなった。発熱なし、髄液の細胞数・蛋白は正常、頭部 MRI（magnetic resonance imaging） は正常、抗リボソームP 抗体は陰性。最も考えられるものと対応の組み合わせはどれか。","ch":["細菌性髄膜炎：抗菌薬の大量投与を始める","統合失調症の初発：SLE の治療は中止する","精神神経ループス（NPSLE（neuropsychiatric SLE：精神神経ループス））の確定：ステロイドパルスとシクロホスファミド（エンドキサン）を追加する","ステロイド精神病の可能性が高い：可能ならステロイドを減らし、抗精神病薬を使う"],"a":3,"cx":["発熱がなく髄液が正常で、髄膜炎は考えにくい。","SLE の治療を自己判断で止めるのは危険。精神症状の原因を整理して治療を調整する。","抗リボソームP 抗体陰性・髄液正常・MRI 正常・大量ステロイド開始から2週以内は、ステロイドによる精神症状をまず考える（完全な区別は難しい）。",""],"core":"ステロイド精神病＝大量（PSL（prednisolone：プレドニゾロン） 40 mg/日以上）開始後数日〜2週に多い、躁・不眠が中心。NPSLE＝抗リボソームP 抗体・髄液 IL-6（interleukin-6：インターロイキン6） 上昇・MRI 病変・ほかの SLE の活動性。","e":"精神神経ループス（NPSLE）は、精神病・けいれん・脳血管障害・無菌性髄膜炎・横断性脊髄炎・末梢神経障害など19の病型がある（ACR（American College of Rheumatology：米国リウマチ学会） の定義）。\n区別に役立つもの：髄液の IL-6 上昇（NPSLE を示す）、抗リボソームP 抗体（精神症状と関連）、抗リン脂質抗体（脳梗塞）、MRI、ほかの臓器の活動性（補体低下・抗dsDNA（double-stranded DNA：二本鎖DNA） 上昇）。\n感染症（髄膜炎・PML（progressive multifocal leukoencephalopathy：進行性多巣性白質脳症）・ヘルペス脳炎）・高血圧性脳症（PRES）・電解質異常・薬剤も必ず除外する。","tg":["cs"]},{"id":"sle-1b30a794","f":"sle","u":36,"o":180,"lv":1,"q":"SLE（systemic lupus erythematosus：全身性エリテマトーデス） の疫学について正しいものはどれか。","ch":["小児期の発症が大半を占める","男女差はほとんどない","高齢男性に最も多い","20〜40歳代の女性に多い"],"a":3,"cx":["小児期の発症（小児 SLE）もあるが一部で、腎炎が多く重い。","女性が圧倒的に多い（エストロゲン・X 染色体の TLR7 など）。","高齢男性に多いのは巨細胞性動脈炎の一部や封入体筋炎など。SLE ではない。",""],"core":"SLE＝妊娠可能な年齢の女性（男女比 1：9）。国内の患者は約6万人。紫外線・感染・妊娠・薬で再燃する。","e":"死亡の原因：発症初期は活動性の臓器病変（腎・中枢）と感染症、長い経過では心血管病（動脈硬化）と感染症。\n抗リン脂質抗体・ステロイド・腎炎・高血圧は動脈硬化を進める。\n男性・小児・高齢発症の SLE は、典型的でない経過をとることがある。","tg":["ae"]},{"id":"sle-ba0868ca","f":"sle","u":36,"o":181,"lv":2,"q":"SLE（systemic lupus erythematosus：全身性エリテマトーデス） の血液の異常として正しいものはどれか。","ch":["クームス陽性の溶血とリンパ球減少","真性多血症のような赤血球の増加","好酸球の著しい増加（1万以上）","好中球の著しい増加と血小板の増加"],"a":0,"cx":["","赤血球の増加は SLE の所見ではない。","好酸球の著しい増加は EGPA（eosinophilic granulomatosis with polyangiitis：好酸球性多発血管炎性肉芽腫症）・薬剤性・寄生虫などを考える。","SLE では白血球・リンパ球はむしろ減る。好中球が増えていれば感染症やステロイドの影響を考える。"],"core":"SLE の血液＝自己免疫性溶血（温式・IgG）・白血球減少（とくにリンパ球）・血小板減少（ITP 様）。重い血小板減少と破砕赤血球→TMA（thrombotic microangiopathy：血栓性微小血管症） を考える。","e":"リンパ球減少は活動性と相関し、感染症の危険因子にもなる。\n溶血の検査：網赤血球↑・LDH↑・間接ビリルビン↑・ハプトグロビン↓・直接クームス陽性。\n血栓性微小血管症（TMA）：破砕赤血球・血小板減少・腎障害・LDH 高値。TTP（ADAMTS13（von Willebrand 因子を切断する酵素） 活性の著減）なら血漿交換。抗リン脂質抗体・強皮症腎クリーゼ・悪性高血圧も原因になる。","tg":[]},{"id":"sle-3e129505","f":"sle","u":36,"o":182,"lv":2,"q":"SLE（systemic lupus erythematosus：全身性エリテマトーデス） の患者で、急に息切れが出て、胸部 X 線で横隔膜が挙上し、肺は小さく、肺の実質には異常がない。呼吸機能は拘束性障害。最も考えられるのはどれか。","ch":["shrinking lung","肺胞出血（びまん性）","肺血栓塞栓症（急性）","ニューモシスチス肺炎"],"a":0,"cx":["","肺胞出血では CT でびまん性のすりガラス影・浸潤影が出て、貧血が進む。","肺血栓塞栓症では肺容量の低下・横隔膜の挙上は典型的でなく、造影 CT で血栓を確認する。","PCP（Pneumocystis pneumonia：ニューモシスチス肺炎） は CT でびまん性のすりガラス影が出る。"],"core":"shrinking lung syndrome＝横隔膜の筋力低下（筋炎・神経障害など）で肺が小さくなる SLE のまれな合併症。胸膜炎の痛みを伴うことが多い。ステロイドで改善することが多い。","e":"SLE の肺・胸膜の病変：胸膜炎（最多）、急性ループス肺炎、肺胞出血（重い・死亡率が高い）、間質性肺疾患（少ない）、肺高血圧症、肺血栓塞栓症（抗リン脂質抗体）、感染症。\n肺胞出血はループス腎炎の活動期に多く、急なヘモグロビンの低下が手がかり。治療はステロイドパルス・シクロホスファミド・血漿交換など。","tg":[]},{"id":"sle-f1155d0c","f":"sle","u":36,"o":183,"lv":3,"q":"22歳の女性。1か月前から発熱、両頬の紅斑、手指の関節痛、胸痛がある。尿蛋白 1.4 g/gCr、尿沈渣で赤血球円柱、抗核抗体 1,280倍、抗dsDNA（double-stranded DNA：二本鎖DNA） 抗体陽性、C3・C4 低値、胸水少量。腎機能は正常。次に行うべきこととして最も適切なのはどれか。","ch":["蛋白尿が増えるまで NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） で経過を見る","腎生検で腎炎の型を決めて治療を選ぶ","ヒドロキシクロロキン（プラケニル）だけで1年経過を見る","腎生検は不要なので MTX（methotrexate：メトトレキサート） だけを始める"],"a":1,"cx":["NSAIDs は腎機能を悪くし、腎炎は待つほど進む。","","HCQ（hydroxychloroquine：ヒドロキシクロロキン） は全員に使うが、増殖性腎炎にはステロイド＋免疫抑制薬が必要。","蛋白尿 0.5 g 以上・活動性沈渣は腎生検の適応。MTX は腎炎の治療薬ではない（腎排泄でもある）。"],"core":"SLE（皮膚・関節・漿膜・腎・低補体・抗dsDNA）＋蛋白尿 0.5 g/日以上・活動性沈渣＝腎生検（ISN/RPS（International Society of Nephrology/Renal Pathology Society） 分類）で導入療法を決める。HCQ（hydroxychloroquine：ヒドロキシクロロキン） は全員。","e":"腎生検の前に：血小板・凝固（出血の危険）、血圧、腎の大きさ（エコー）。\n生検の結果、III/IV 型なら GC（glucocorticoid：グルココルチコイド）＋MMF（mycophenolate mofetil：ミコフェノール酸モフェチル）/IVCY（＋ベリムマブ（ベンリスタ））、V 型単独で蛋白尿が多ければ MMF・CNI。\n2019 分類基準では、腎炎 III/IV 型（10点）＋ANA（antinuclear antibody：抗核抗体） 陽性だけで SLE と分類できる。\nほかにも：ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬/ARB（蛋白尿）、血圧管理、遮光、PCP（Pneumocystis pneumonia：ニューモシスチス肺炎） 予防・GIOP（glucocorticoid-induced osteoporosis：グルココルチコイド誘発性骨粗鬆症） の予防（ステロイド開始時）。","tg":["ae","cs"],"mt":["slecrit","ln"]},{"id":"sle-eafd012e","f":"sle","u":36,"o":184,"lv":3,"q":"35歳の女性。SLE（systemic lupus erythematosus：全身性エリテマトーデス） でプレドニゾロン（プレドニン） 10 mg/日とミコフェノール酸を内服中。2日前から 39℃の発熱と咳。CRP（C-reactive protein：C反応性タンパク） 14 mg/dL、プロカルシトニン上昇、胸部 X 線で右下肺野の浸潤影。補体と抗dsDNA（double-stranded DNA：二本鎖DNA） 抗体は前回と変わらない。最も考えられるものと対応はどれか。","ch":["細菌性肺炎：培養を出して抗菌薬を始める","SLE の再燃：ステロイドパルスを行う","薬剤熱：すべての薬を中止して様子を見る","ループス肺炎：シクロホスファミド（エンドキサン）を使う"],"a":0,"cx":["","補体・抗dsDNA が変わらず、CRP・プロカルシトニンが高く、肺炎の陰影がある → 感染症をまず考える。","発熱と浸潤影は薬剤熱では説明しにくい。免疫抑制薬を急に全部止めるとステロイドの離脱も起こる。","ループス肺炎はまれで、ほかの臓器の活動性（補体低下など）を伴うことが多い。区別がつくまで感染の治療を優先する。"],"core":"SLE の発熱＝まず感染症。SLE で CRP が高い・プロカルシトニン↑・補体と抗dsDNA が変わらない → 感染。治療中の死因の上位が感染症。","e":"感染症のときの免疫抑制薬の扱い：ミコフェノール酸など免疫抑制薬は一時休薬を考える。ステロイドは急に止めず、ストレス時の量の調整も考える。\n免疫抑制中の肺炎の原因：肺炎球菌などの一般細菌、PCP（Pneumocystis pneumonia：ニューモシスチス肺炎）、CMV（cytomegalovirus：サイトメガロウイルス）、結核・非結核性抗酸菌、真菌（アスペルギルス・クリプトコッカス）、ノカルジア。\n肺炎球菌・インフルエンザワクチンで予防する。","tg":["ae","cs"]},{"id":"sle-f2790b41","f":"sle","u":36,"o":185,"lv":3,"q":"28歳の女性。SLE（systemic lupus erythematosus：全身性エリテマトーデス） で治療中。急に血小板 2万/μL、ヘモグロビン 7.5 g/dL、破砕赤血球が多数、LDH 1,800 U/L、意識の変動、クレアチニン上昇。直接クームス陰性。ADAMTS13（von Willebrand 因子を切断する酵素） 活性 5% 未満。最も適切な治療はどれか。","ch":["血小板輸血を急いで大量に行う","血漿交換とステロイド（＋リツキシマブ（リツキサン））","NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） で発熱を抑えて様子を見る","ワルファリン（ワーファリン）を始める"],"a":1,"cx":["TTP（thrombotic thrombocytopenic purpura：血栓性血小板減少性紫斑病） で血小板輸血は血栓を悪化させるおそれがあり、命に関わる出血がなければ避ける。","","NSAIDs は血小板機能と腎機能を悪くする。","ワルファリンは TTP（thrombotic thrombocytopenic purpura：血栓性血小板減少性紫斑病） の治療ではない（APS（antiphospholipid syndrome：抗リン脂質抗体症候群） の血栓の治療）。"],"core":"SLE に合併する TTP（ADAMTS13 活性の著減・抗体）＝緊急の血漿交換＋ステロイド（＋リツキシマブ、カプラシズマブ（カブリビ））。破砕赤血球＋血小板減少＋溶血＋精神症状・腎障害。","e":"TMA（血栓性微小血管症）の原因の区別：\n・TTP：ADAMTS13 活性 10% 未満（インヒビター）\n・劇症型 APS（antiphospholipid syndrome：抗リン脂質抗体症候群）：抗リン脂質抗体・多臓器の血栓\n・強皮症腎クリーゼ：強皮症・高血圧・レニン高値\n・非典型溶血性尿毒症症候群（補体の異常）：エクリズマブ（ソリリス）\n・悪性高血圧・薬剤（カルシニューリン阻害薬など）\nカプラシズマブ（カブリビ）は von Willebrand 因子と血小板の結合を止める薬で、後天性 TTP に使われる。","tg":["cs"]},{"id":"sle-690021fb","f":"sle","u":37,"o":186,"lv":1,"q":"ループス腎炎の ISN/RPS（International Society of Nephrology/Renal Pathology Society） 分類で、積極的な寛解導入療法（ステロイド＋免疫抑制薬）の対象になる型はどれか。","ch":["VI 型（進行した硬化性）","I 型（微小メサンギウム）だけ","III 型と IV 型（± V 型）","II 型（メサンギウム増殖性）だけ"],"a":2,"cx":["VI 型は糸球体の 90%以上が硬化した状態で、免疫抑制は効かず、腎代替療法の準備をする。","I 型は光学顕微鏡でほぼ正常で、腎炎としての治療は不要（腎外症状で治療）。","","II 型はふつう腎外の症状に合わせた治療で、強い免疫抑制はいらない（蛋白尿が多ければ別）。"],"core":"III（巣状：50%未満）・IV（びまん性：50%以上）＝増殖性で強い治療。V（膜性）＝ネフローゼ型、蛋白尿が多ければ免疫抑制。VI＝硬化（治療で戻らない）。","e":"腎生検の適応：蛋白尿 0.5 g/日以上（尿蛋白/クレアチニン比 0.5 g/gCr 以上）、活動性の尿沈渣（赤血球円柱など）、原因のわからない腎機能低下。\n活動性病変（A：細胞性半月体・管内増殖・ワイヤーループなど）と慢性病変（C：線維性半月体・糸球体硬化・間質線維化）を分けて評価する（2018年の改訂で NIH の活動性・慢性度指数を使う）。\nIV 型が最も多く、腎予後が悪い。","tg":[],"mt":["ln"]},{"id":"sle-247a3e40","f":"sle","u":37,"o":187,"lv":2,"q":"ループス腎炎 IV 型の寛解導入療法として、現在の国際的な推奨に沿うものはどれか。","ch":["アザチオプリン（イムラン、アザニン）だけで導入する","NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） と利尿薬だけで経過を見る","GC（glucocorticoid：グルココルチコイド）＋MMF（mycophenolate mofetil：ミコフェノール酸モフェチル） か低用量 IVCY（＋ベリムマブ（ベンリスタ））","ステロイドだけを大量に長く使う"],"a":2,"cx":["アザチオプリンは主に維持療法の選択肢（寛解導入の効果は MMF（mycophenolate mofetil：ミコフェノール酸モフェチル）・IVCY（intravenous cyclophosphamide：シクロホスファミド間欠静注） に劣る）。","NSAIDs は腎機能を悪くする。","","ステロイド単独は再燃・腎予後が悪く、副作用も多い。"],"core":"LN（III/IV）の導入＝ステロイド＋MMF（2〜3 g/日）または Euro-Lupus IVCY（500 mg×2週ごと×6）。上乗せにベリムマブ・カルシニューリン阻害薬。維持は MMF（またはアザチオプリン）を少なくとも3年。","e":"ステロイドは、メチルプレドニゾロン（ソル・メドロール）・パルス（250〜1,000 mg×1〜3日）の後、プレドニゾロン（プレドニン） 0.5 mg/kg/日程度から始めて早めに減らし、半年で 5〜7.5 mg/日以下を目標にする（EULAR（European Alliance of Associations for Rheumatology：欧州リウマチ学会） 2023・KDIGO 2024）。\n上乗せ：ベリムマブ（ベンリスタ）を併用すると腎の反応が高まり、腎の再燃が減る（BLISS-LN 試験）。カルシニューリン阻害薬（国内ではタクロリムス（プログラフ）がループス腎炎に適応、MMF との「マルチターゲット療法」）。\n治療目標：3か月で蛋白尿 25%以上減少、6か月で 50%以上減少、12か月で 0.5〜0.7 g/日未満（完全寛解）。\n腎の保護：ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬・ARB（蛋白尿）、血圧管理、ヒドロキシクロロキン（プラケニル）。","tg":["ae","gl"],"mt":["ln","sletx"]},{"id":"sle-48a2700a","f":"sle","u":37,"o":188,"lv":2,"q":"ループス腎炎の維持療法について正しいものはどれか。","ch":["MMF（または AZA（azathioprine：アザチオプリン））を3年以上続ける","ステロイドを 30 mg/日以上一生続ける","寛解したらすぐにすべての薬をやめる","シクロホスファミド（エンドキサン）を毎月使い続ける"],"a":0,"cx":["","ステロイドの維持は 5〜7.5 mg/日以下が目標。","すぐ止めると再燃しやすい。再燃のたびに腎機能が落ちる。","シクロホスファミドの長期使用は累積の毒性（性腺・癌）が大きく、維持には使わない。"],"core":"LN（lupus nephritis：ループス腎炎） の維持＝MMF（1〜2 g/日）かアザチオプリン（妊娠希望）、ステロイドは最少量、HCQ（hydroxychloroquine：ヒドロキシクロロキン）。治療期間は少なくとも3〜5年。","e":"完全寛解が長く続いたら、まずステロイド、次に免疫抑制薬を慎重に減らす。\n腎の再燃の手がかり：尿蛋白の再増加、活動性の尿沈渣、補体の低下、抗dsDNA（double-stranded DNA：二本鎖DNA） の上昇。\n腎機能を守る治療：血圧（130/80 未満）、ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬/ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬）、脂質、SGLT2 阻害薬（CKD（chronic kidney disease：慢性腎臓病） として）を考える。","tg":["ae"],"mt":["ln"]},{"id":"sle-4ed3839e","f":"sle","u":38,"o":189,"lv":1,"q":"SLE（systemic lupus erythematosus：全身性エリテマトーデス） の治療で、禁忌がなければ「すべての患者に勧められる」薬はどれか。","ch":["プレドニゾロン（プレドニン） 30 mg/日の長期投与","ヒドロキシクロロキン（プラケニル）","リツキシマブ（リツキサン）","シクロホスファミド（エンドキサン）"],"a":1,"cx":["ステロイドは必要最小限にし、維持は 5 mg/日以下・できれば中止を目指す。","","リツキシマブは難治例の選択肢（国内では SLE に保険適用がない）。","シクロホスファミドは重い臓器病変（腎炎・NPSLE（neuropsychiatric SLE：精神神経ループス））のときに使う。"],"core":"HCQ（hydroxychloroquine：ヒドロキシクロロキン）＝SLE の土台。再燃・血栓・臓器障害・死亡を減らす。妊娠中も継続。網膜症の検査を年1回。","e":"EULAR（European Alliance of Associations for Rheumatology：欧州リウマチ学会） 2023 推奨：\n・HCQ は全員（禁忌がなければ）。網膜症を防ぐため 5 mg/kg（実体重）/日を超えない（国内は理想体重の表で決める）。\n・ステロイドの維持量は PSL（prednisolone：プレドニゾロン） 5 mg/日以下、可能なら中止。\n・効果不十分・ステロイドを減らせないとき：免疫抑制薬（MTX（methotrexate：メトトレキサート）・アザチオプリン・MMF（mycophenolate mofetil：ミコフェノール酸モフェチル））や生物学的製剤（ベリムマブ（ベンリスタ）・アニフロルマブ）を早めに追加。\n・治療の目標：寛解（DORIS）か低疾患活動性（LLDAS（lupus low disease activity state：低疾患活動性の状態））。","tg":["ae"],"mt":["sletx"]},{"id":"sle-a93dceaa","f":"sle","u":38,"o":190,"lv":2,"q":"SLE（systemic lupus erythematosus：全身性エリテマトーデス） の生物学的製剤とその標的の組み合わせで正しいものはどれか。","ch":["ベリムマブ（ベンリスタ） ― B 細胞の CD20","ベリムマブ（ベンリスタ） ― IL-6（interleukin-6：インターロイキン6） 受容体","アニフロルマブ（サフネロー） ― BLyS（BAFF）","アニフロルマブ（サフネロー） ― I 型 IFN（interferon：インターフェロン） 受容体"],"a":3,"cx":["ベリムマブは可溶性の BLyS（BAFF）に対する抗体。CD20 はリツキシマブ（リツキサン）。","IL-6 受容体はトシリズマブ（アクテムラ）・サリルマブ。","BLyS はベリムマブ（ベンリスタ）の標的。",""],"core":"ベリムマブ＝抗 BLyS（B 細胞の生存因子）：腎炎にも上乗せ。アニフロルマブ＝抗 IFNAR1：皮膚・関節に効く、帯状疱疹が増える。","e":"投与法：\n・ベリムマブ：点滴 10 mg/kg を 0・2・4週→4週ごと、または皮下注 200 mg を週1回。\n・アニフロルマブ：点滴 300 mg を4週ごと。重い活動性のループス腎炎・NPSLE（neuropsychiatric SLE：精神神経ループス） の患者では十分に調べられていない。\n共通：既存の治療（ステロイド・免疫抑制薬・HCQ（hydroxychloroquine：ヒドロキシクロロキン））に上乗せして使う。生ワクチンは禁忌。\nインターフェロンの働きを抑えるとウイルス感染（帯状疱疹・上気道炎）が増える。","tg":[],"fig":["cyto"],"mt":["sletx"]},{"id":"sle-6a10b536","f":"sle","u":38,"o":191,"lv":2,"q":"薬剤誘発性ループスについて正しいものはどれか。","ch":["腎炎と中枢神経症状が特発性 SLE（systemic lupus erythematosus：全身性エリテマトーデス） より多い","原因の薬はステロイドが最も多い","抗ヒストン抗体が陽性になり、中止で治る","補体が強く下がり、抗dsDNA（double-stranded DNA：二本鎖DNA） 抗体が必ず陽性"],"a":2,"cx":["腎・中枢神経の病変はまれ。関節痛・漿膜炎・発熱が中心。","原因薬はプロカインアミド・ヒドララジン・イソニアジド・ミノサイクリン・TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬など。","","補体はふつう正常で、抗dsDNA 抗体は陰性が多い（TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬による例では陽性になることがある）。"],"core":"薬剤誘発性ループス＝抗ヒストン抗体・関節炎と漿膜炎・腎/中枢は少ない・補体正常・中止で数週〜数か月で消える。","e":"原因になりやすい薬：プロカインアミド、ヒドララジン（アセチル化が遅い人）、イソニアジド（イスコチン）、ミノサイクリン（ミノマイシン）、キニジン、TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬、インターフェロン、免疫チェックポイント阻害薬。\n亜急性皮膚エリテマトーデス型（抗SS-A 陽性）の薬剤性：PPI（proton pump inhibitor：プロトンポンプ阻害薬）、テルビナフィン、サイアザイド、カルシウム拮抗薬、抗癌剤（タキサン）。","tg":["ae"]},{"id":"sle-db7f813c","f":"sle","u":38,"o":192,"lv":2,"q":"SLE（systemic lupus erythematosus：全身性エリテマトーデス） の治療目標として使われる「LLDAS（低疾患活動性）」の条件に含まれるものはどれか。","ch":["すべての薬を中止していること","抗dsDNA（double-stranded DNA：二本鎖DNA） 抗体が完全に陰性になること","PSL（prednisolone：プレドニゾロン） 7.5 mg/日以下で主要臓器の活動性なし","ステロイドを 20 mg/日以上続けていること"],"a":2,"cx":["免疫抑制薬・HCQ（hydroxychloroquine：ヒドロキシクロロキン）・生物学的製剤を使っていてもよい。","LLDAS は血清の活動性（抗dsDNA 陽性・低補体）が残っていてもよい。","","ステロイドは 7.5 mg/日以下が条件。"],"core":"LLDAS：SLEDAI（SLE Disease Activity Index）-2K ≦4（主要臓器の活動性なし）・新しい活動性なし・医師全般評価≦1・PSL 7.5 mg/日以下・維持量の免疫抑制薬は可。寛解（DORIS）：臨床の SLEDAI 0・PSL 5 mg/日以下。","e":"LLDAS を長く保つ人は、臓器障害の進行・再燃・死亡が少ない。\nステロイドの累積量が多いほど、臓器障害（骨・眼・心血管）が増える。だから「ステロイドを減らすこと」自体が治療目標の一部。\nベリムマブ（ベンリスタ）・アニフロルマブ・免疫抑制薬は、ステロイドを減らす目的でも早めに使う。","tg":["gl"],"mt":["sletx"]},{"id":"sle-23d0d6f5","f":"sle","u":38,"o":193,"lv":2,"q":"皮下脂肪に炎症が起こり、陥凹した瘢痕を残す SLE（皮膚ループス）の病型はどれか。","ch":["亜急性皮膚エリテマトーデス","ループス脂肪織炎","凍瘡状エリテマトーデス","急性皮膚エリテマトーデス"],"a":1,"cx":["亜急性皮膚エリテマトーデスは環状・乾癬様の紅斑で、瘢痕を残さない。","","凍瘡状エリテマトーデスは寒冷で手指・耳に出る紫紅色の皮疹。","頬部紅斑は瘢痕を残さない。"],"core":"ループス脂肪織炎＝顔・上腕・殿部の深い硬結→陥凹。慢性皮膚ループスの一つ。HCQ（hydroxychloroquine：ヒドロキシクロロキン）・ステロイドで治療。皮下脂肪織炎様 T 細胞リンパ腫との区別が大切。","e":"慢性皮膚ループスには、円板状エリテマトーデス・深在性・凍瘡状がある。\n凍瘡状ループスは、TREX1 遺伝子の異常による家族性のものもある。\n皮膚ループスの悪化因子：紫外線・喫煙・寒冷。","tg":[]},{"id":"sle-c02ecc58","f":"sle","u":38,"o":194,"lv":3,"q":"48歳の女性。SLE（systemic lupus erythematosus：全身性エリテマトーデス） でヒドロキシクロロキン（プラケニル）を7年間内服中。最近、読書のときに文字の一部が欠けて見える。眼科で両眼の傍中心部の視野の欠損と、OCT（optical coherence tomography：光干渉断層計） で網膜の外層の菲薄化がある。対応として最も適切なのはどれか。","ch":["ヒドロキシクロロキンを増量する","1年後にもう一度だけ眼科を受診する","ヒドロキシクロロキンを中止する","網膜の所見は SLE によるものなので続ける"],"a":2,"cx":["増量すると網膜症は進む。","網膜症は中止後も進むことがあり、すぐ対応する。","","SLE の網膜血管炎とは違い、傍中心の視野欠損と外層の菲薄化は HCQ（hydroxychloroquine：ヒドロキシクロロキン） 網膜症の典型。"],"core":"HCQ（hydroxychloroquine：ヒドロキシクロロキン） 網膜症＝傍中心暗点・OCT の外層菲薄化・ブルズアイ黄斑症。見つかったら中止（不可逆で、中止後も進むことがある）。危険因子：5年以上・累積量・高用量・腎機能低下・タモキシフェン併用。","e":"検査：開始時（1年以内）と、その後は年1回の眼科検査（国内のガイドラインは毎年、危険が低ければ海外では5年後から毎年）。視野（10-2）・OCT・眼底自発蛍光など。\nアジア人では黄斑の周辺（傍中心より外側）から始まることがあり、広い範囲の検査が必要。\nHCQ をやめたあとの SLE の再燃に注意し、ほかの薬（免疫抑制薬・ベリムマブ・アニフロルマブ）を考える。","tg":["ae","cs"],"mt":["sletx"]},{"id":"sle-ecafffb0","f":"sle","u":39,"o":195,"lv":2,"q":"抗リン脂質抗体症候群で、深部静脈血栓症を起こした患者の長期の抗凝固療法として最も適切なのはどれか。","ch":["低用量アスピリンだけを使う","DOAC（リバーロキサバンなど）を第一に選ぶ（とくにトリプルポジティブで）","3か月だけ抗凝固を行い、その後は中止する","ワルファリン（PT-INR 2〜3）を長く続ける"],"a":3,"cx":["アスピリンだけでは静脈血栓の再発を防げない。","DOAC は、とくに3種の抗体がすべて陽性（トリプルポジティブ）の人で、ワルファリン（ワーファリン）より動脈血栓が多かった（TRAPS（TNF receptor-associated periodic syndrome：TNF受容体関連周期性症候群） 試験）。勧められない。","APS（antiphospholipid syndrome：抗リン脂質抗体症候群） の血栓は再発が多く、原則として長く（多くは生涯）続ける。",""],"core":"APS（antiphospholipid syndrome：抗リン脂質抗体症候群） の血栓症＝ワルファリン（INR 2〜3）を長く。DOAC は避ける（とくにトリプルポジティブ・動脈血栓）。妊娠中はヘパリン＋低用量アスピリン。","e":"・静脈血栓：ワルファリン INR 2〜3。\n・動脈血栓（脳梗塞など）：ワルファリン INR 2〜3（＋低用量アスピリン）か、INR 3〜4 を考える。\n・血栓の既往がない抗体陽性（高リスクの抗体のパターン）：低用量アスピリンを考える。\n・産科 APS（流産・死産・早産の既往）：妊娠中は低用量アスピリン＋ヘパリン（未分画ヘパリンの自己注射など）。ワルファリンは催奇形性があるので妊娠中は使わない。\n・劇症型 APS（数日で3臓器以上の血栓）：抗凝固＋大量ステロイド＋血漿交換または IVIG（効かなければリツキシマブ（リツキサン）・エクリズマブ）。","tg":["ae"],"mt":["aps"]},{"id":"sle-44e57c60","f":"sle","u":39,"o":196,"lv":2,"q":"抗リン脂質抗体症候群の「妊娠の合併症」として、分類基準（Sydney 改変基準）に含まれるものはどれか。","ch":["妊娠糖尿病（妊娠中の耐糖能異常）","10週未満の原因不明の連続3回以上の流産","妊娠悪阻（重いつわり）","1回だけの妊娠初期の自然流産"],"a":1,"cx":["妊娠糖尿病は APS（antiphospholipid syndrome：抗リン脂質抗体症候群） と関係しない。","","妊娠悪阻は APS（antiphospholipid syndrome：抗リン脂質抗体症候群） の合併症ではない。","1回の初期流産は一般の妊娠でもよく起こり、基準に入らない。"],"core":"Sydney 基準の産科項目：①10週以降の原因不明の胎児死亡、②重症妊娠高血圧腎症・胎盤機能不全による34週未満の早産、③10週未満の原因不明の連続3回以上の流産。","e":"臨床基準（血栓症か妊娠の合併症）＋検査基準（LA（lupus anticoagulant：ループスアンチコアグラント）・抗カルジオリピン抗体〔中等度以上〕・抗β2GPI 抗体〔99パーセンタイル超〕のどれかが、12週以上あけて2回以上陽性）で分類する。\n2023年の ACR（American College of Rheumatology：米国リウマチ学会）/EULAR（European Alliance of Associations for Rheumatology：欧州リウマチ学会） 分類基準では、臨床（大静脈・動脈の血栓、微小血管の病変、産科、心臓弁、血小板減少）と検査をそれぞれ点数化し、両方3点以上で分類する（抗体陽性は臨床症状から3年以内）。\nAPS（antiphospholipid syndrome：抗リン脂質抗体症候群） のほかの症状：網状皮斑、血小板減少、心臓弁の肥厚（Libman-Sacks 心内膜炎）、腎の血栓性微小血管症。","tg":["ae","gl"],"mt":["aps"]},{"id":"sle-1dce4bc4","f":"sle","u":39,"o":197,"lv":3,"q":"40歳の女性。抗リン脂質抗体症候群（3種の抗体が陽性）でワルファリン（ワーファリン）を内服中。手術のためワルファリンを中止したあと、数日のうちに腎機能の急な悪化、肝機能障害、意識障害、血小板減少が出た。造影 CT で多臓器の梗塞がある。最も適切な治療はどれか。","ch":["ビタミン K を大量に投与する","血小板輸血だけを行う","ヘパリン＋大量 GC（glucocorticoid：グルココルチコイド）＋血漿交換","低用量アスピリンだけを使う"],"a":2,"cx":["ビタミン K は抗凝固をさらに弱め、血栓を悪化させる。","血小板輸血は血栓を悪化させるおそれがあり、出血がなければ避ける。","","アスピリンだけでは劇症型の血栓は止まらない。"],"core":"劇症型 APS（CAPS）＝1週以内に3臓器以上の血栓・小血管の血栓。誘因：感染・手術・抗凝固の中止。治療＝抗凝固（ヘパリン）＋大量ステロイド＋血漿交換/IVIG（三本柱）、難治でリツキシマブ（リツキサン）・エクリズマブ。","e":"死亡率は30%前後と高い。誘因の感染症の治療も同時に。\nHIT（ヘパリン起因性血小板減少症）・TTP（thrombotic thrombocytopenic purpura：血栓性血小板減少性紫斑病）・DIC（disseminated intravascular coagulation：播種性血管内凝固）・HELLP 症候群との区別が必要。\n手術などで抗凝固を中断するときは、ヘパリンでつなぐ（ブリッジング）。","tg":["ae","cs"],"mt":["aps"]},{"id":"sle-567713c8","f":"sle","u":39,"o":198,"lv":2,"q":"抗リン脂質抗体陽性だが、血栓症も妊娠合併症もない人（高リスクの抗体パターン）が妊娠した。一般的な予防として勧められるものはどれか。","ch":["プレドニゾロン（プレドニン） 30 mg/日","治療量のワルファリン（ワーファリン）","何も行わない（予防は禁忌）","低用量アスピリン"],"a":3,"cx":["大量のステロイドは妊娠の成績を良くせず、母体の副作用が増える。","ワルファリンは妊娠中は催奇形性があり使わない。","予防は勧められる。",""],"core":"抗体陽性・既往なしの妊娠＝低用量アスピリン。産科 APS（antiphospholipid syndrome：抗リン脂質抗体症候群） の既往＝アスピリン＋予防量ヘパリン。血栓の既往＝アスピリン＋治療量ヘパリン（ワルファリンから切り替え）。","e":"産後6週間は血栓の危険が高いので、ヘパリン（またはワルファリン：授乳中も可）を続ける。\nヒドロキシクロロキン（プラケニル）が APS の妊娠の成績を良くする可能性も研究されている。\n低用量アスピリンは妊娠高血圧腎症の予防にもなる。","tg":["ae"],"mt":["aps"]},{"id":"ssc-c55d1717","f":"ssc","u":40,"o":199,"lv":1,"q":"2013 ACR（American College of Rheumatology：米国リウマチ学会）/EULAR（European Alliance of Associations for Rheumatology：欧州リウマチ学会） の全身性強皮症分類基準で、それだけで「強皮症」と分類できる（9点）所見はどれか。","ch":["MCP（metacarpophalangeal：中手指節） より近位まで及ぶ手指の皮膚硬化","爪郭の毛細血管の異常（拡張・出血）","抗セントロメア抗体の陽性","レイノー現象（寒冷での指の色の変化）"],"a":0,"cx":["","爪郭毛細血管の異常は2点。","強皮症に関連する抗体（抗セントロメア・抗トポイソメラーゼI・抗RNAポリメラーゼIII）は3点。","レイノー現象は3点。"],"core":"MCP より近位の手指の皮膚硬化（両手）＝9点で単独で分類。それ以外は合計9点以上。","e":"配点：\n・手指の皮膚硬化（各項目は最も高い1つ）：手指の浮腫（puffy fingers）2点、MCP より遠位の手指硬化（強指症）4点\n・指先の病変：指尖潰瘍 2点、指尖の陥凹性瘢痕 3点\n・毛細血管拡張 2点、爪郭毛細血管の異常 2点\n・肺動脈性肺高血圧症 および/または 間質性肺疾患 2点\n・レイノー現象 3点\n・強皮症関連の自己抗体 3点\n例：レイノー現象（3）＋強指症（4）＋抗セントロメア抗体（3）＝10点 → 分類。\n皮膚硬化が手指にないのに全身の硬化がある場合は、腎性全身性線維症（ガドリニウム）・好酸球性筋膜炎・硬化性浮腫などを考える（この基準は使わない）。","tg":["gl"],"mt":["sscab"]},{"id":"ssc-6bb4958b","f":"ssc","u":40,"o":200,"lv":2,"q":"全身性強皮症の自己抗体と、関連の深い臨床像の組み合わせで正しいものはどれか。","ch":["抗U1-RNP ― 強皮症腎クリーゼが最も多い","抗トポイソメラーゼI ― 限局型・肺病変はまれ","抗セントロメア ― びまん型・早期の重い ILD（interstitial lung disease：間質性肺疾患）","抗RNAポリメラーゼIII ― 腎クリーゼ・癌"],"a":3,"cx":["抗U1-RNP 抗体は MCTD（mixed connective tissue disease：混合性結合組織病）・オーバーラップで、肺高血圧症が問題。腎クリーゼは少ない。","抗トポイソメラーゼI（Scl-70）抗体はびまん皮膚硬化型で、間質性肺疾患が多い。","抗セントロメア抗体は限局皮膚硬化型で、晩期の肺動脈性肺高血圧症が問題。重い間質性肺疾患は少ない。",""],"core":"抗トポI＝びまん型・ILD。抗セントロメア＝限局型・PAH（晩期）。抗RNAP III＝急速な皮膚硬化・腎クリーゼ・癌・胃前庭部毛細血管拡張症。抗U1-RNP＝MCTD（mixed connective tissue disease：混合性結合組織病）・PAH。","e":"ほかの抗体：抗Th/To（限局型だが ILD・PAH）、抗PM（polymyositis：多発性筋炎）-Scl（筋炎とのオーバーラップ）、抗Ku（筋炎・SLE（systemic lupus erythematosus：全身性エリテマトーデス） とのオーバーラップ）。\n抗RNAポリメラーゼIII 抗体陽性の人は、強皮症の発症の前後数年に癌（乳癌など）が見つかることがあり、検索する。\n病型：限局皮膚硬化型（肘・膝より遠位と顔）、びまん皮膚硬化型（肘・膝より近位・体幹まで）。びまん型は発症から5年以内に皮膚硬化と内臓病変が進む。","tg":[],"fig":["ana"],"mt":["sscab"]},{"id":"ssc-644a1159","f":"ssc","u":40,"o":201,"lv":2,"q":"皮膚が硬くなるが、レイノー現象と手指の硬化がなく、四肢に「オレンジの皮」のような皮膚と静脈に沿ったくぼみ（groove sign）があり、末梢血の好酸球が増えている。最も考えられるのはどれか。","ch":["限局性強皮症（モルフェア）","強皮症腎クリーゼ","限局皮膚硬化型の全身性強皮症","好酸球性筋膜炎"],"a":3,"cx":["モルフェアは斑状・線状の硬化で、四肢全体の筋膜の硬化や好酸球増加は典型でない（重なることはある）。","腎クリーゼは高血圧と腎不全で、皮膚の所見ではない。","全身性強皮症ではレイノー現象と手指の硬化がほぼ必ずある。",""],"core":"好酸球性筋膜炎＝激しい運動などの後に四肢の筋膜が硬くなる。手指・顔は保たれ、レイノーなし。好酸球↑・高γグロブリン。MRI（magnetic resonance imaging） で筋膜の肥厚、全層の生検で診断。ステロイドが効く。","e":"強皮症と区別すべき「皮膚が硬くなる病気」：\n・限局性強皮症（モルフェア）：内臓病変・レイノーなし。小児の線状強皮症（顔の剣創状）。\n・腎性全身性線維症：腎不全の人のガドリニウム造影剤。\n・硬化性浮腫（糖尿病・感染後・単クローン性γグロブリン）：首・背中。\n・硬化性粘液水腫：単クローン性γグロブリン（IgG-λ）。\n好酸球性筋膜炎は血液の病気（再生不良性貧血など）を合併することがある。","tg":[]},{"id":"ssc-de3eb97f","f":"ssc","u":41,"o":202,"lv":3,"q":"48歳の女性。半年前から急に手から腕・胸の皮膚が硬くなってきた（抗RNAポリメラーゼIII 抗体陽性）。1週間前から、他院で関節痛にプレドニゾロン（プレドニン） 30 mg/日を始めた。頭痛が出て、血圧 210/120 mmHg、クレアチニン 0.7 → 2.4 mg/dL、血小板減少と破砕赤血球がある。最も適切な治療はどれか。","ch":["ステロイドパルス療法を行う","ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬） だけで血圧を下げる","ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬を少量から増やす","血漿交換を第一に行う"],"a":2,"cx":["強皮症腎クリーゼでは大量ステロイドは危険因子で、悪化させる。","ARB は ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬ほどの効果が示されていない。ACE 阻害薬が第一選択。","","血漿交換は血栓性血小板減少性紫斑病（TTP（thrombotic thrombocytopenic purpura：血栓性血小板減少性紫斑病））の治療。強皮症腎クリーゼの第一の治療ではない（TTP との区別は ADAMTS13（von Willebrand 因子を切断する酵素） で）。"],"core":"強皮症腎クリーゼ＝びまん型の早期・抗RNAP III・PSL（prednisolone：プレドニゾロン） 15 mg/日以上が危険因子 → 急な高血圧・腎不全・血栓性微小血管症。ACE 阻害薬を最大量まで（透析になっても続ける）。","e":"腎の弓状動脈・小葉間動脈の内膜の肥厚で腎血流が落ち、レニンが著増して高血圧になる悪循環。\nACE 阻害薬の登場で死亡率は大きく下がった。透析になっても ACE 阻害薬を続けると、数か月〜2年で透析を離脱できる人がいる。\n予防：びまん型の早期（とくに抗RNAP III 陽性）では、ステロイドは PSL 15 mg/日未満にとどめ、家庭血圧を測ってもらう。ACE 阻害薬の予防投与は勧められない（発症時に効きにくくなる可能性）。\n約1割は血圧が正常のまま起こる（正常血圧腎クリーゼ）。","tg":["cs"]},{"id":"ssc-63c960d1","f":"ssc","u":41,"o":203,"lv":2,"q":"全身性強皮症に伴う間質性肺疾患（SSc（systemic sclerosis：全身性強皮症）-ILD（interstitial lung disease：間質性肺疾患））の治療として、国内で使える薬の組み合わせとして正しいものはどれか。","ch":["ボセンタン（ERA（endothelin receptor antagonist：エンドセリン受容体拮抗薬））だけを使う","ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬だけを使う","MMF（mycophenolate mofetil：ミコフェノール酸モフェチル）・IVCY（intravenous cyclophosphamide：シクロホスファミド間欠静注）・ニンテダニブ・リツキシマブ","大量ステロイドの単独長期投与"],"a":2,"cx":["ボセンタンは肺動脈性肺高血圧症・指尖潰瘍の予防の薬で、間質性肺疾患には効かない。","ACE 阻害薬は腎クリーゼの治療で、肺には効かない。","","大量ステロイドは肺への効果が乏しく、強皮症腎クリーゼの危険を上げる。"],"core":"SSc-ILD＝NSIP（nonspecific interstitial pneumonia：非特異性間質性肺炎） パターンが多い。免疫抑制（MMF・シクロホスファミド・リツキシマブ）＋抗線維化（ニンテダニブ（オフェブ））。ステロイドは少量まで。","e":"評価：HRCT（すりガラス影・網状影の範囲）、呼吸機能（FVC（forced vital capacity：努力肺活量）・%DLco（diffusing capacity for carbon monoxide：肺拡散能））。発症から数年の、病変が広い（HRCT で20%以上）・FVC が下がっていく人は早く治療する。\n国内では、リツキシマブ（リツキサン）が2021年に全身性強皮症（皮膚硬化と肺）に適応となり、ニンテダニブ（オフェブ）は SSc-ILD に適応がある。\nニンテダニブの副作用：下痢（最も多い）、肝障害、出血・血栓。\n皮膚硬化の評価は mRSS（17部位を 0〜3 点でつける、最大51点）。","tg":[],"mt":["ctdild"]},{"id":"ssc-6bc61356","f":"ssc","u":41,"o":204,"lv":2,"q":"全身性強皮症の肺動脈性肺高血圧症（PAH（pulmonary arterial hypertension：肺動脈性肺高血圧症））について正しいものはどれか。","ch":["免疫抑制薬で PAH は治る","症状が出てから調べれば十分である","治療はβ遮断薬が第一選択である","毎年スクリーニングし、右心カテで確定"],"a":3,"cx":["強皮症の PAH は免疫抑制薬では良くならない（SLE（systemic lupus erythematosus：全身性エリテマトーデス）・MCTD（mixed connective tissue disease：混合性結合組織病） の PAH は免疫抑制で良くなることがある）。","症状（労作時の息切れ）が出た時には進んでいることが多い。早期発見のため毎年調べる。","β遮断薬は PAH の治療薬ではない。肺血管拡張薬を使う。",""],"core":"SSc（systemic sclerosis：全身性強皮症）-PAH＝毎年スクリーニング（心エコー・%DLco（diffusing capacity for carbon monoxide：肺拡散能） の低下・NT-proBNP（N 末端プロ脳性ナトリウム利尿ペプチド））→右心カテで確定→エンドセリン受容体拮抗薬＋PDE5（phosphodiesterase 5：ホスホジエステラーゼ5） 阻害薬の初期併用など。","e":"肺高血圧症の定義は2022年の ESC/ERS で平均肺動脈圧 20 mmHg 超に下がった。\nPAH の薬：エンドセリン受容体拮抗薬（ボセンタン（トラクリア）：トラクリア、アンブリセンタン（ヴォリブリス）：ヴォリブリス、マシテンタン（オプスミット）：オプスミット）、PDE5 阻害薬（シルデナフィル（レバチオ）：レバチオ、タダラフィル（アドシルカ）：アドシルカ）、可溶性グアニル酸シクラーゼ刺激薬（リオシグアト（アデムパス）：アデムパス）、プロスタサイクリン系（エポプロステノール（フローラン）：フローラン、セレキシパグ（ウプトラビ）：ウプトラビ）。\nスクリーニング：DETECT アルゴリズム（%DLco が 60% 未満の人などで）。抗セントロメア抗体陽性・限局型・病歴の長い人に多い。\n強皮症では左心不全や間質性肺疾患による肺高血圧もあり、右心カテで分けて考える。","tg":["ae"]},{"id":"ssc-18fc5fc6","f":"ssc","u":41,"o":205,"lv":2,"q":"レイノー現象について、原発性よりも「二次性（膠原病に伴う）」を考える所見はどれか。","ch":["10代で始まり、左右対称で、指の痛みが軽い","寒冷で白→紫→赤と色が変わるだけで、ほかの症状がない","爪郭の毛細血管の拡張・出血・消失や、指尖潰瘍がある","抗核抗体が陰性"],"a":2,"cx":["10代の発症・対称性・軽症は原発性（レイノー病）の特徴。","色の3相の変化はどちらにも起こる。","","抗核抗体陰性は原発性を支持する。"],"core":"二次性レイノー＝爪郭毛細血管の異常・指尖潰瘍/瘢痕・抗核抗体陽性・30歳以降の発症・非対称。強皮症ではほぼ全員にあり、最初の症状のことが多い。","e":"治療：\n・保温（手だけでなく体を冷やさない）、禁煙、血管を収縮させる薬（β遮断薬・エルゴタミン・交感神経刺激薬）を避ける。\n・薬：カルシウム拮抗薬（ニフェジピン（アダラート））、プロスタグランジン製剤（ベラプロスト（ドルナー、プロサイリン）：ドルナー、プロサイリン）、PDE5（phosphodiesterase 5：ホスホジエステラーゼ5） 阻害薬、エンドセリン受容体拮抗薬。国内ではボセンタン（トラクリア）が「全身性強皮症の手指潰瘍の発症抑制」に適応がある。\n・指尖潰瘍が感染したら抗菌薬、壊死には外科。\n爪郭毛細血管顕微鏡：強皮症では巨大毛細血管・出血・毛細血管の消失（avascular area）。皮膚筋炎でも異常が出る。","tg":[]},{"id":"ssc-2ce3ae57","f":"ssc","u":41,"o":206,"lv":2,"q":"全身性強皮症の消化管病変とその対策の組み合わせで正しいものはどれか。","ch":["逆流性食道炎 ― PPI（proton pump inhibitor：プロトンポンプ阻害薬） を使い、食後すぐに横にならない","偽性腸閉塞 ― 緊急の開腹手術が第一選択","胃前庭部毛細血管拡張症（GAVE（gastric antral vascular ectasia：胃前庭部毛細血管拡張症））― 鉄欠乏は起こらない","小腸の細菌の異常増殖 ― 下痢は起こさない"],"a":0,"cx":["","偽性腸閉塞は保存的治療（腸管の安静・栄養・腸を動かす薬）が中心で、むやみに手術しない。","GAVE（watermelon stomach）は消化管出血による鉄欠乏性貧血の原因になる。内視鏡で焼灼する。","小腸の運動低下で細菌が増え、下痢・吸収不良・体重減少を起こす。抗菌薬をローテーションで使う。"],"core":"強皮症の消化管＝平滑筋の線維化による運動低下。食道（逆流・嚥下障害）・胃（GAVE）・小腸（細菌異常増殖・偽性腸閉塞）・大腸（便秘・憩室）・肛門（便失禁）。","e":"逆流性食道炎は90%近くに起こり、誤嚥による間質性肺疾患の悪化にもつながる。PPI と生活の工夫（少量ずつ食べる、寝る前に食べない、枕を高くする）。\n栄養障害（体重減少・低アルブミン）は予後不良の因子。","tg":["ae"]},{"id":"ssc-c66770fa","f":"ssc","u":41,"o":207,"lv":2,"q":"早期のびまん皮膚硬化型の全身性強皮症で、皮膚硬化が急速に進んでいる。皮膚硬化の治療として使われるものはどれか。","ch":["硬くなりきるまで経過観察","大量ステロイドの単独長期投与","D-ペニシラミンの大量投与","MTX（methotrexate：メトトレキサート）・MMF（mycophenolate mofetil：ミコフェノール酸モフェチル）・IVCY（intravenous cyclophosphamide：シクロホスファミド間欠静注）・リツキシマブ"],"a":3,"cx":["発症早期（5年以内）が最も進みやすく、治療の効果も出やすい時期。","大量ステロイドは強皮症腎クリーゼを起こしやすく、皮膚にも効果が乏しい。","D-ペニシラミンは以前使われたが、試験で効果が示されなかった。",""],"core":"びまん型の早期の皮膚硬化＝免疫抑制（MTX・MMF・IVCY・リツキシマブ）。重症・進行例では自家造血幹細胞移植も。ステロイドは少量（PSL（prednisolone：プレドニゾロン） 15 mg/日未満）まで。","e":"皮膚硬化の評価：mRSS（17部位×0〜3点、最大51点）。\n発症から数年で皮膚硬化はピークを越え、その後は軟らかくなる（萎縮期）ことが多い。\n関節拘縮を防ぐリハビリも大切。\n国内ではリツキシマブ（リツキサン）が全身性強皮症に保険適用がある。","tg":[]},{"id":"ssc-147d0973","f":"ssc","u":41,"o":208,"lv":2,"q":"全身性強皮症の指尖潰瘍について正しいものはどれか。","ch":["ボセンタン（トラクリア）が発症抑制に使える","喫煙を続けても治りに影響しない","感染しないので抗菌薬は不要","寒冷に当てると早く治る"],"a":0,"cx":["","喫煙は血管を縮め、潰瘍を悪化・再発させる。禁煙が必須。","潰瘍は感染（骨髄炎を含む）しやすく、感染があれば抗菌薬が必要。","寒冷は血管を縮め、悪化させる。保温が基本。"],"core":"指尖潰瘍＝保温・禁煙・血管拡張薬（カルシウム拮抗薬・プロスタグランジン製剤・PDE5（phosphodiesterase 5：ホスホジエステラーゼ5） 阻害薬）、予防にボセンタン（エンドセリン受容体拮抗薬）。感染には抗菌薬、壊死には外科。","e":"潰瘍の場所：指先の虚血性の潰瘍と、関節の伸側（皮膚が引き伸ばされる所）の潰瘍がある。石灰沈着の上にできる潰瘍もある。\n重い虚血ではプロスタサイクリンの点滴、交感神経切除術、ボツリヌス毒素の局所注射が試みられることがある。\nボセンタンの副作用：肝障害（毎月の肝機能検査）、貧血、催奇形性（妊娠禁忌）。","tg":[]},{"id":"ssc-b77c32e8","f":"ssc","u":41,"o":209,"lv":2,"q":"全身性強皮症の心臓病変について正しいものはどれか。","ch":["心筋の線維化で不整脈・伝導障害","太い冠動脈の狭窄だけが起こる","心臓はまったく侵されない","心臓病変は予後に影響しない"],"a":0,"cx":["","主に心筋の微小血管の障害（レイノー現象の心臓版）と線維化による。","心臓も侵され、強皮症の死因の上位に入る。","心臓病変（不整脈・心不全）は予後不良の因子。"],"core":"強皮症の心臓＝心筋の斑状の線維化（微小血管の障害）→不整脈・伝導障害・拡張障害・心膜液。心電図・Holter・心エコー・心臓 MRI（magnetic resonance imaging）・トロポニン・NT-proBNP（N 末端プロ脳性ナトリウム利尿ペプチド） で調べる。","e":"肺高血圧症や間質性肺疾患による右心不全も起こる。\n筋炎とのオーバーラップ（抗PM（polymyositis：多発性筋炎）-Scl・抗Ku）では心筋炎が起こることがある。\n強皮症の死因：間質性肺疾患・肺高血圧症・心臓病変が上位（腎クリーゼは ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬の登場で減った）。","tg":[]},{"id":"ssc-bddfecd5","f":"ssc","u":41,"o":210,"lv":3,"q":"62歳の女性。限局皮膚硬化型の全身性強皮症（抗セントロメア抗体陽性）、罹病15年。この半年で階段での息切れが強くなった。胸部 HRCT（high-resolution CT：高分解能CT） で間質性陰影はほとんどなく、FVC（forced vital capacity：努力肺活量） は 95% だが %DLco（diffusing capacity for carbon monoxide：肺拡散能） が 42% と著しく低い。NT-proBNP（N 末端プロ脳性ナトリウム利尿ペプチド） 上昇。次に行う検査として最も適切なのはどれか。","ch":["気管支肺胞洗浄（BAL（bronchoalveolar lavage：気管支肺胞洗浄））","筋生検","心エコーと右心カテーテル検査","冠動脈 CT だけ"],"a":2,"cx":["間質性肺疾患がほとんどなく、BAL では原因がわからない。","筋力低下ではなく息切れで、筋生検は役立たない。","","虚血性心疾患の除外も考えるが、強皮症で FVC が保たれ DLco だけ低いときは、まず PAH（pulmonary arterial hypertension：肺動脈性肺高血圧症） を調べる。"],"core":"FVC 正常・%DLco だけ著しく低い（FVC/%DLco 比 1.6 以上）＋NT-proBNP↑＝PAH（pulmonary arterial hypertension：肺動脈性肺高血圧症） を疑う → 心エコー → 右心カテ（平均肺動脈圧 20 mmHg 超・肺動脈楔入圧 15 以下・PVR（pulmonary vascular resistance：肺血管抵抗） 2 WU 超）。","e":"PAH と診断したら、初期からエンドセリン受容体拮抗薬＋PDE5（phosphodiesterase 5：ホスホジエステラーゼ5） 阻害薬の併用を考え、重症ならプロスタサイクリンの静注・皮下注も。\n強皮症の PAH は特発性 PAH より予後が悪い。早期発見のため毎年スクリーニングする（DETECT アルゴリズムなど）。\n間質性肺疾患や左心疾患による肺高血圧とは治療が違うので、右心カテで分けて考える。","tg":["cs"]},{"id":"ssc-3f5fb58c","f":"ssc","u":42,"o":211,"lv":2,"q":"混合性結合組織病（MCTD（mixed connective tissue disease：混合性結合組織病））について正しいものはどれか。","ch":["抗Sm 抗体の陽性が診断に必須である","抗U1-RNP 抗体高値、予後は PAH（pulmonary arterial hypertension：肺動脈性肺高血圧症） で決まる","レイノー現象はまれにしか起こらない","腎炎が最も多く、予後を決める"],"a":1,"cx":["抗Sm 抗体は SLE（systemic lupus erythematosus：全身性エリテマトーデス） に特異的。MCTD の必須の抗体は抗U1-RNP。","","レイノー現象はほぼ全員にあり、手指・手背の腫脹とともに共通の所見。","MCTD は SLE（systemic lupus erythematosus：全身性エリテマトーデス） より腎炎が少ない（あっても軽いことが多い）。"],"core":"MCTD＝抗U1-RNP 抗体（高力価）＋レイノー現象・手のむくみ＋SLE（systemic lupus erythematosus：全身性エリテマトーデス） 様・強皮症様・筋炎様の所見の混在。予後は PAH で決まる。","e":"国内の診断基準（2019年改訂）：共通所見（レイノー現象、指ないし手背の腫脹）、免疫学的所見（抗U1-RNP 抗体陽性）、特徴的な臓器所見（肺動脈性肺高血圧症・無菌性髄膜炎・三叉神経障害）、混合所見（SLE 様・強皮症様・筋炎様）。\n無菌性髄膜炎は NSAIDs（とくにイブプロフェン）で誘発されることがある。\nMCTD の PAH は、強皮症の PAH と違い、早期なら免疫抑制療法（ステロイド・シクロホスファミド）で良くなることがあり、肺血管拡張薬と組み合わせる。","tg":[],"mt":["autoab"]},{"id":"ssc-69c0c6de","f":"ssc","u":42,"o":212,"lv":2,"q":"MCTD（mixed connective tissue disease：混合性結合組織病） の患者が頭痛・発熱で受診し、髄液でリンパ球優位の細胞増加があり、細菌培養は陰性だった。数日前からイブプロフェンを飲んでいた。最も考えられるのはどれか。","ch":["片頭痛（髄液は正常のはず）","NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） による無菌性髄膜炎","細菌性髄膜炎","強皮症腎クリーゼによる高血圧性脳症"],"a":1,"cx":["片頭痛では髄液の細胞は増えない。","","培養は陰性で、細菌性は考えにくい（抗菌薬の前に検体を採ったかは確認する）。","腎クリーゼは MCTD ではまれで、高血圧・腎障害の情報がない。"],"core":"MCTD・SLE（systemic lupus erythematosus：全身性エリテマトーデス） の無菌性髄膜炎＝病気そのものか、NSAIDs（とくにイブプロフェン）で起こる。MCTD の特徴的な臓器所見の一つ（ほかに PAH（pulmonary arterial hypertension：肺動脈性肺高血圧症）・三叉神経障害）。","e":"薬剤性の無菌性髄膜炎の原因：NSAIDs（イブプロフェン）、IVIG（intravenous immunoglobulin：免疫グロブリン大量静注療法）、ST合剤（スルファメトキサゾール・トリメトプリム：バクタ）、ラモトリギンなど。中止で数日で良くなる。\n三叉神経障害：顔のしびれ（感覚障害）。MCTD・シェーグレン病・強皮症で起こる。","tg":[]},{"id":"myo-7e4f82ed","f":"myo","u":43,"o":213,"lv":1,"q":"皮膚筋炎に特徴的な皮疹はどれか。","ch":["環状の遠心性紅斑","Gottron 丘疹","鼻唇溝を避ける頬部の紅斑","下腿の触知できる紫斑"],"a":1,"cx":["環状紅斑はシェーグレン病・亜急性皮膚エリテマトーデスなど。","","鼻唇溝を避ける頬の紅斑は SLE（systemic lupus erythematosus：全身性エリテマトーデス） の頬部紅斑（皮膚筋炎の顔の紅斑は鼻唇溝にも及ぶことが多い）。","触知できる紫斑は小型血管炎（IgA 血管炎など）。"],"core":"皮膚筋炎＝Gottron 丘疹・徴候、ヘリオトロープ疹（上まぶたの紫紅色の浮腫）、V ネック・ショール徴候、爪囲紅斑、機械工の手、むち打ち様紅斑。","e":"・Gottron 丘疹：MCP（metacarpophalangeal：中手指節）・PIP（proximal interphalangeal：近位指節間） 関節の伸側の丘疹（Gottron 徴候は肘・膝の伸側の紅斑）。\n・逆 Gottron 徴候（手掌の関節屈側の丘疹・潰瘍）：抗MDA5（melanoma differentiation-associated gene 5） 抗体陽性に多い。\n・機械工の手（mechanic's hands）：指の側面の角化・亀裂。抗ARS（aminoacyl-tRNA synthetase：アミノアシルtRNA合成酵素） 抗体に多い。\n・むち打ち様紅斑（flagellate erythema）：背中の線状の紅斑。\n・皮膚の石灰沈着：若年性皮膚筋炎（抗NXP2 抗体）に多い。\n筋症状がない（または軽い）皮膚筋炎を「臨床的無筋症性皮膚筋炎（CADM（clinically amyopathic dermatomyositis：臨床的無筋症性皮膚筋炎））」という。","tg":[],"mt":["myoab"]},{"id":"myo-623e25c5","f":"myo","u":43,"o":214,"lv":2,"q":"筋炎を疑う患者の検査について正しいものはどれか。","ch":["心筋の障害はトロポニン T が最も特異的","筋炎ではアルドラーゼは上がらない","MRI（magnetic resonance imaging） の STIR 像で浮腫を見て生検部位を選ぶ","筋電図は神経原性との区別に役立たない"],"a":2,"cx":["トロポニン T は再生中の骨格筋からも出るため、筋炎では心筋の障害がなくても上がる。心筋の評価にはトロポニン I の方が特異的。","アルドラーゼも筋から出る酵素で、CK（creatine kinase：クレアチンキナーゼ） が正常でも上がることがある（筋膜の病変など）。","","筋電図は筋原性（低振幅・短持続・多相性の電位と安静時の異常放電）と神経原性を区別できる。"],"core":"筋炎の検査＝CK（creatine kinase：クレアチンキナーゼ）・アルドラーゼ・ミオグロビン、筋炎特異抗体、MRI（STIR で浮腫）、筋電図、筋生検。心筋はトロポニン I・心電図・心エコー・心臓 MRI。","e":"筋生検の所見：\n・皮膚筋炎：筋束の周辺の萎縮（perifascicular atrophy）、血管周囲の炎症、MxA の発現（I型 IFN（interferon：インターフェロン））。\n・多発性筋炎・封入体筋炎：壊死のない筋線維へ CD8 陽性 T 細胞が入り込む（endomysial）。\n・IMNM（immune-mediated necrotizing myopathy：免疫介在性壊死性ミオパチー）：炎症細胞が少なく、筋線維の壊死と再生が中心。\n・封入体筋炎：縁取り空胞（rimmed vacuole）。\n鑑別：甲状腺機能低下症、薬剤（スタチン・ステロイド・コルヒチン・ジドブジン）、筋ジストロフィー、代謝性ミオパチー、ポンペ病、横紋筋融解症。","tg":[]},{"id":"myo-11cf994a","f":"myo","u":43,"o":215,"lv":2,"q":"近位筋の筋力低下と CK（creatine kinase：クレアチンキナーゼ） 2,000 U/L の中年女性。むくみ・寒がり・便秘があり、アキレス腱反射の弛緩が遅い。筋炎特異抗体は陰性。まず調べるべきものはどれか。","ch":["側頭動脈の生検","HLA（human leukocyte antigen：ヒト白血球抗原）-B27 の検査","抗dsDNA（double-stranded DNA：二本鎖DNA） 抗体の測定","甲状腺機能（TSH）"],"a":3,"cx":["側頭動脈生検は巨細胞性動脈炎の検査で、筋力低下の検査ではない。","HLA-B27 は脊椎関節炎の検査。","SLE（systemic lupus erythematosus：全身性エリテマトーデス） でも筋症状は出るが、この症状の組み合わせは甲状腺機能低下症が先。",""],"core":"筋炎に似る病気：甲状腺機能低下症（CK↑・反射の弛緩遅延）、薬剤（スタチン・コルヒチン・ステロイド）、筋ジストロフィー、代謝性ミオパチー、電解質（低K・低P）。筋炎を疑ったら TSH を必ず測る。","e":"甲状腺機能低下症は CK を数千まで上げることがあり、補充療法で戻る。\nスタチンによる筋症状は中止で多くは戻る（戻らなければ抗HMGCR（3-hydroxy-3-methylglutaryl-CoA reductase：HMG-CoA還元酵素） 抗体陽性の IMNM（immune-mediated necrotizing myopathy：免疫介在性壊死性ミオパチー） を考える）。\n若い人で筋生検が非典型的なら、遺伝性の筋疾患（筋ジストロフィー・ポンペ病）を考える。","tg":[]},{"id":"myo-5947b601","f":"myo","u":43,"o":216,"lv":2,"q":"若年性皮膚筋炎の特徴として正しいものはどれか。","ch":["筋炎特異抗体は陽性にならない","間質性肺疾患が必ず起こる","石灰沈着と血管障害が多い","悪性腫瘍の合併が成人より多い"],"a":2,"cx":["抗TIF1-γ・抗NXP2・抗MDA5（melanoma differentiation-associated gene 5） 抗体などが陽性になる。","ILD（interstitial lung disease：間質性肺疾患） は抗MDA5（melanoma differentiation-associated gene 5） 抗体陽性例などで起こるが、必ずではない。","","小児の皮膚筋炎では悪性腫瘍の合併はまれ（成人とは違う）。"],"core":"若年性 DM（dermatomyositis：皮膚筋炎）＝石灰沈着（とくに抗NXP2）・血管障害（皮膚潰瘍・消化管の血管炎）。癌の合併はまれ。早期の十分な治療で石灰沈着を減らせる。","e":"治療：ステロイド＋MTX（methotrexate：メトトレキサート） が基本。重症にはパルス・IVIG（intravenous immunoglobulin：免疫グロブリン大量静注療法）・シクロホスファミド。\n石灰沈着の治療は難しく、早期の炎症の抑制が最も大切。\n小児の長期のステロイドは成長障害を起こすので、免疫抑制薬で減らす。","tg":[]},{"id":"myo-b6a30f14","f":"myo","u":44,"o":217,"lv":1,"q":"筋炎特異自己抗体とその特徴の組み合わせで正しいものはどれか。","ch":["抗SRP（signal recognition particle：シグナル認識粒子） ― 典型的な皮膚筋炎の皮疹が多い","抗Mi-2 ― 急速進行性の ILD（interstitial lung disease：間質性肺疾患） が多い","抗TIF1-γ ― 成人で悪性腫瘍が多い","抗ARS（aminoacyl-tRNA synthetase：アミノアシルtRNA合成酵素） ― 間質性肺疾患はまれである"],"a":2,"cx":["抗SRP 抗体は IMNM（皮疹のない、重い筋力低下と著明な CK（creatine kinase：クレアチンキナーゼ） 上昇）。","抗Mi-2 抗体は典型的な皮膚筋炎（皮疹と筋炎）で、ステロイドがよく効き、間質性肺疾患や癌は少ない。","","抗ARS 抗体は間質性肺疾患がほぼ必発（抗ARS 抗体症候群）。"],"core":"抗TIF1-γ・抗NXP2＝癌（成人）。抗MDA5（melanoma differentiation-associated gene 5）＝CADM（clinically amyopathic dermatomyositis：臨床的無筋症性皮膚筋炎）＋急速進行性 ILD。抗ARS＝ILD＋関節炎＋機械工の手＋発熱＋レイノー。抗Mi-2＝典型的 DM（dermatomyositis：皮膚筋炎） で予後良い。抗SRP・抗HMGCR（3-hydroxy-3-methylglutaryl-CoA reductase：HMG-CoA還元酵素）＝IMNM（immune-mediated necrotizing myopathy：免疫介在性壊死性ミオパチー）。","e":"抗TIF1-γ 抗体陽性の成人では、診断の前後3年以内に癌が見つかることが多い（胃・大腸・肺・乳房・卵巣・上咽頭など）。全身の癌の検索（CT・内視鏡・婦人科・乳腺）を行う。小児の抗TIF1-γ 陽性では癌は少ない。\n抗NXP2 抗体：小児の石灰沈着、成人の癌、強い筋力低下・嚥下障害。\n抗SAE 抗体：皮疹が先に出て、のちに筋炎・嚥下障害。","tg":[],"fig":["myoab"],"mt":["myoab"]},{"id":"myo-d1e02409","f":"myo","u":44,"o":218,"lv":3,"q":"52歳の女性。1か月前から手指の関節の伸側の皮疹と、手掌の痛みのある丘疹・潰瘍が出てきた。筋力は保たれ CK（creatine kinase：クレアチンキナーゼ） 正常。1週間前から乾いた咳と息切れが急に強くなった。フェリチン 1,800 ng/mL、KL-6（Krebs von den Lungen-6：間質性肺炎のマーカー） は 480 U/mL、胸部 CT で両側下葉の胸膜下のすりガラス影・浸潤影。最も考えられる抗体と、治療の組み合わせはどれか。","ch":["抗Jo-1：無治療で経過を見る","抗TIF1-γ：癌の検索を終えてから治療","抗MDA5（melanoma differentiation-associated gene 5）：大量 GC（glucocorticoid：グルココルチコイド）＋タクロリムス（プログラフ）＋IVCY（intravenous cyclophosphamide：シクロホスファミド間欠静注）","抗Mi-2：プレドニゾロン（プレドニン）単独で治療"],"a":2,"cx":["抗ARS（aminoacyl-tRNA synthetase：アミノアシルtRNA合成酵素） 抗体の ILD（interstitial lung disease：間質性肺疾患） は慢性のことが多いが、無治療で見ることはない。この経過は抗MDA5（melanoma differentiation-associated gene 5） 抗体に典型的。","抗TIF1-γ 抗体は癌が問題だが、急速進行性 ILD（interstitial lung disease：間質性肺疾患） は少ない。急速な肺病変があれば治療を待てない。","","抗Mi-2 抗体は筋炎がはっきりした典型的な皮膚筋炎で、急速な肺病変は少ない。"],"core":"筋症状の乏しい皮膚筋炎（CADM（clinically amyopathic dermatomyositis：臨床的無筋症性皮膚筋炎））＋逆 Gottron・皮膚潰瘍＋フェリチン高値＋急速進行性 ILD（interstitial lung disease：間質性肺疾患）＝抗MDA5 抗体。三剤（大量 GC＋タクロリムス＋IVCY）を早く始める。","e":"抗MDA5 抗体陽性の急速進行性 ILD は、治療しても半年以内の死亡率が高い（日本・東アジアに多い）。予後不良因子：高齢、フェリチン高値、抗MDA5 抗体価の高値、CRP（C-reactive protein：C反応性タンパク） 高値、低酸素。\n効果不十分なら血漿交換・トファシチニブ・リツキシマブなどが試みられる。ニューモシスチス肺炎・サイトメガロウイルス（CMV（cytomegalovirus：サイトメガロウイルス））の予防・監視も必須（強い免疫抑制のため）。\nKL-6 は早期にはあまり上がらないことがあり、正常でも否定できない。","tg":["cs"],"mt":["myoab","ctdild"]},{"id":"myo-142d3533","f":"myo","u":44,"o":219,"lv":2,"q":"抗ARS（aminoacyl-tRNA synthetase：アミノアシルtRNA合成酵素） 抗体症候群（抗Jo-1 抗体など）の治療と経過の特徴として正しいものはどれか。","ch":["再燃はほとんど起こらない","ステロイドがまったく効かない","悪性腫瘍の合併が最も多い抗体","再燃が多く、早くから免疫抑制薬を併用"],"a":3,"cx":["再燃が多い（とくにステロイド単独では半数以上）。","ステロイドの初期の反応は良い。問題は減量中の再燃。","癌の合併が多いのは抗TIF1-γ・抗NXP2 抗体。",""],"core":"抗ARS＝ILD（NSIP（nonspecific interstitial pneumonia：非特異性間質性肺炎）・器質化肺炎）・関節炎・機械工の手・発熱・レイノー。初期反応良好・再燃が多い → ステロイド＋カルシニューリン阻害薬。","e":"抗ARS 抗体は8種類ほど（抗Jo-1・PL-7・PL-12・EJ・OJ・KS など）。抗Jo-1 は筋炎が目立ち、抗PL-7・PL-12 は肺が中心で筋炎が軽い傾向。\nHEp-2 の抗核抗体は細胞質が染まり、陰性と報告されることがある（「抗核抗体陰性の間質性肺炎」でも抗ARS 抗体を測る）。\n関節炎は RA（rheumatoid arthritis：関節リウマチ） に似るが、亜脱臼を伴う非びらん性の変形をきたすことがある。","tg":["ae"],"mt":["myoab"]},{"id":"myo-ff0ca652","f":"myo","u":44,"o":220,"lv":3,"q":"67歳の男性。2か月前から顔・首・胸の V 字の部分・背中に紫紅色の紅斑が広がり、ものを飲み込みにくい。近位筋の筋力低下があり CK（creatine kinase：クレアチンキナーゼ） 1,800 U/L。抗TIF1-γ 抗体陽性。治療と並行して最も重要な検査はどれか。","ch":["関節液の偏光顕微鏡（結晶の検査）","側頭動脈の生検（GCA（giant cell arteritis：巨細胞性動脈炎） の検査）","仙腸関節の MRI（SpA（spondyloarthritis：脊椎関節炎） の検査）","全身の悪性腫瘍の検索"],"a":3,"cx":["関節液の結晶の検査は痛風・偽痛風の検査。","側頭動脈生検は巨細胞性動脈炎の検査。","仙腸関節の MRI は脊椎関節炎の検査。",""],"core":"成人の抗TIF1-γ 抗体陽性 DM（dermatomyositis：皮膚筋炎）＝癌の合併が高率（診断の前後3年）。胸腹部 CT・上下部内視鏡・婦人科・乳腺・PSA・上咽頭（アジア人）など。癌の治療で筋炎も良くなることがある。","e":"癌が見つからなくても、数年は定期的に検索をくり返す。\n嚥下障害が強く、誤嚥性肺炎・栄養障害に注意（嚥下評価・食形態の工夫）。\n皮膚症状が強く治療に抵抗しやすい。IVIG（intravenous immunoglobulin：免疫グロブリン大量静注療法） が皮膚・嚥下に効くことがある。","tg":["cs"],"mt":["myoab"]},{"id":"myo-c81ffb57","f":"myo","u":45,"o":221,"lv":2,"q":"58歳の男性。スタチンを2年内服中。数か月かけて太もも・腕の筋力が落ち、CK（creatine kinase：クレアチンキナーゼ） 8,500 U/L。スタチンを中止しても良くならない。皮疹なし。最も考えられる抗体はどれか。","ch":["抗MDA5（melanoma differentiation-associated gene 5） 抗体","抗セントロメア抗体","抗HMGCR（3-hydroxy-3-methylglutaryl-CoA reductase：HMG-CoA還元酵素） 抗体","抗Mi-2 抗体"],"a":2,"cx":["抗MDA5 抗体は筋症状の乏しい皮膚筋炎と急速進行性 ILD（interstitial lung disease：間質性肺疾患）。","抗セントロメア抗体は限局皮膚硬化型の強皮症。","","抗Mi-2 抗体は皮疹のある典型的な皮膚筋炎。"],"core":"スタチン中止後も続く近位筋力低下＋CK 著増＝抗HMGCR 抗体陽性 IMNM（immune-mediated necrotizing myopathy：免疫介在性壊死性ミオパチー）。中止で治る「スタチンの筋症状」とは別物で、免疫抑制が必要。","e":"IMNM（免疫介在性壊死性ミオパチー）の抗体：抗SRP（signal recognition particle：シグナル認識粒子） 抗体（重く急速、嚥下障害・心筋障害、治療抵抗性）、抗HMGCR 抗体（スタチンとの関係、若年ではスタチンなしでも）、抗体陰性。\n治療：ステロイド＋免疫抑制薬（MTX（methotrexate：メトトレキサート）・タクロリムス）、効かなければ IVIG（国内でステロイドが効かない多発性筋炎・皮膚筋炎に適応）、リツキシマブ（国内は筋炎に保険適用外）。\nスタチンは再開しない（脂質は PCSK9 阻害薬などで）。","tg":["ae","cs"],"mt":["myoab"]},{"id":"myo-c93f1779","f":"myo","u":45,"o":222,"lv":2,"q":"封入体筋炎の特徴として正しいものはどれか。","ch":["高齢男性・大腿四頭筋と指の屈筋・GC（glucocorticoid：グルココルチコイド） 無効","筋生検で筋束周辺の萎縮が特徴である","近位筋だけが対称に侵され、嚥下障害はない","若い女性に多く、ステロイドが著効する"],"a":0,"cx":["","筋束周辺の萎縮は皮膚筋炎。封入体筋炎は縁取り空胞と CD8 T 細胞の浸潤。","深指屈筋（指を曲げる）と大腿四頭筋・前脛骨筋が特徴で、非対称のことが多い。嚥下障害が多い。","若い女性に多くステロイドがよく効くのは多発性筋炎・皮膚筋炎。"],"core":"封入体筋炎＝高齢男性・ゆっくり進行・大腿四頭筋と手指屈筋（握力・つまずき）・嚥下障害・ステロイド無効・縁取り空胞・抗 cN1A 抗体。","e":"CK（creatine kinase：クレアチンキナーゼ） は正常〜軽度上昇（1,000 U/L 程度まで）。「ステロイドが効かない多発性筋炎」と診断されていた人の中に多い。\n有効な薬物療法は確立しておらず、リハビリ・嚥下訓練・転倒予防が中心。嚥下障害が強ければ輪状咽頭筋切断術なども。","tg":[]},{"id":"myo-140c7f2a","f":"myo","u":45,"o":223,"lv":2,"q":"多発性筋炎・皮膚筋炎の初期治療として最も一般的なものはどれか。","ch":["NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） の単独投与","PSL（prednisolone：プレドニゾロン） 0.75〜1 mg/kg/日＋早期の免疫抑制薬","まず筋力訓練だけで、薬は使わない","ヒドロキシクロロキン（プラケニル）の単独投与"],"a":1,"cx":["NSAIDs は筋炎の炎症を抑えない。","","活動期の筋炎には薬が必要。リハビリは炎症が落ち着いてから強めていく（安静すぎも筋力を落とす）。","ヒドロキシクロロキンは皮膚筋炎の皮疹に使うことはあるが、筋炎の治療にはならない（皮疹が悪化することもある）。"],"core":"筋炎の導入＝PSL 0.75〜1 mg/kg/日（重症は mPSL（methylprednisolone：メチルプレドニゾロン） パルス）＋早期の免疫抑制薬（ステロイドを減らすため）。難治・重症で IVIG（intravenous immunoglobulin：免疫グロブリン大量静注療法）。","e":"ステロイドは筋力と CK（creatine kinase：クレアチンキナーゼ） を見ながら 2〜4週ごとに減らす。減らす途中の再燃を防ぐため、多くの施設で最初から免疫抑制薬を併用する。\n嚥下障害・呼吸筋の障害・心筋炎・急速進行性 ILD（interstitial lung disease：間質性肺疾患） があれば重症として、パルス・IVIG・シクロホスファミドを考える。\n皮膚筋炎の皮疹：遮光、ステロイド外用・タクロリムス外用。\nニューモシスチス肺炎の予防（ST合剤（スルファメトキサゾール・トリメトプリム：バクタ））と GIOP（glucocorticoid-induced osteoporosis：グルココルチコイド誘発性骨粗鬆症） の予防を忘れない。","tg":[]},{"id":"myo-dbd10ca8","f":"myo","u":45,"o":224,"lv":2,"q":"筋炎で嚥下障害が強いとき、とくに注意すべき合併症と対応の組み合わせはどれか。","ch":["尿路結石：水分を控えさせる","低血糖：ブドウ糖を内服させる","誤嚥性肺炎：嚥下評価と強い治療","高尿酸血症：プリン体を制限する"],"a":2,"cx":["尿路結石とは関係しない。水分制限は誤り。","嚥下障害で低血糖になるわけではない。","","高尿酸血症とは関係しない。"],"core":"筋炎の嚥下障害（咽頭筋の障害）＝誤嚥性肺炎・栄養障害の原因。重症として扱い、嚥下評価・食形態の工夫・経管栄養、IVIG（intravenous immunoglobulin：免疫グロブリン大量静注療法） などの強い治療を考える。","e":"嚥下障害が多い病型：抗TIF1-γ・抗NXP2・抗SRP（signal recognition particle：シグナル認識粒子） 抗体、封入体筋炎。\nIVIG は嚥下障害の改善に効果があるとの報告が多い（国内でステロイド抵抗性の PM（polymyositis：多発性筋炎）/DM（dermatomyositis：皮膚筋炎） に適応）。\n呼吸筋の障害（横隔膜）で換気不全になることもあり、呼吸機能も確認する。","tg":[]},{"id":"sjd-f6468be9","f":"sjd","u":46,"o":225,"lv":1,"q":"2016 ACR（American College of Rheumatology：米国リウマチ学会）/EULAR（European Alliance of Associations for Rheumatology：欧州リウマチ学会） のシェーグレン病（症候群）分類基準で、それぞれ3点になる項目の組み合わせはどれか。","ch":["Schirmer 試験 5 mm/5分以下 と 安静時唾液分泌量 0.1 mL/分以下","抗SS-A（Ro）抗体陽性 と 口唇小唾液腺生検のフォーカススコア 1 以上","抗SS-B 抗体陽性 と RF（rheumatoid factor：リウマトイド因子） 陽性","眼の染色スコア と 耳下腺の腫脹"],"a":1,"cx":["Schirmer 試験・唾液分泌量はそれぞれ1点。","","2016年基準では抗SS-B 抗体単独・RF は項目に入らない（抗SS-A が必要）。","眼の染色スコア（OSS 5以上・van Bijsterveld 4以上）は1点。耳下腺腫脹は項目にない。"],"core":"2016基準：抗SS-A 抗体（3）・フォーカススコア1以上（3）・眼染色（1）・Schirmer 5 mm以下（1）・安静時唾液 0.1 mL/分以下（1）で、合計4点以上。","e":"乾燥症状（眼か口）または ESSDAI の腺外症状が1つ以上あることが入口。除外：頭頸部の放射線治療、活動性の C 型肝炎、AIDS、サルコイドーシス、アミロイドーシス、移植片対宿主病、IgG4関連疾患。\n抗SS-A 抗体陰性でも、口唇の生検で4点に届けば分類できる（逆に抗体陽性でも生検なしなら他の項目が必要）。\n国内では 1999年の厚生省改訂診断基準も使われる（生検・口腔検査・眼科検査・抗SS-A/B 抗体のうち2項目以上）。\n2023年ごろから国際的に「シェーグレン病（Sjögren's disease）」と呼ぶ流れになっている。","tg":["gl"],"mt":["autoab"]},{"id":"sjd-d74f30c6","f":"sjd","u":46,"o":226,"lv":2,"q":"シェーグレン病の患者で、リンパ腫の発症の危険が高いことを示す所見はどれか。","ch":["若い年齢での口の乾燥","抗SS-A 抗体だけが陽性であること","眼の乾燥が強いこと","耳下腺の持続腫脹・紫斑・C4 低値"],"a":3,"cx":["乾燥症状の発症年齢とリンパ腫の関係は乏しい（若い発症で腺外病変が多い傾向はある）。","抗SS-A 抗体だけではリンパ腫の危険を示さない。","乾燥症状の強さそのものはリンパ腫の予測因子ではない。",""],"core":"シェーグレン病のリンパ腫（一般の約15〜20倍、多くは唾液腺の MALT（mucosa-associated lymphoid tissue：粘膜関連リンパ組織） リンパ腫）の危険因子＝耳下腺の持続腫脹・紫斑・低 C4・クリオグロブリン・単クローン性 γ グロブリン・リンパ球減少。","e":"腺外病変：関節痛・関節炎（非びらん性）、環状紅斑（抗SS-A）、高ガンマグロブリン血症性紫斑、間質性肺疾患（リンパ球性間質性肺炎・NSIP（nonspecific interstitial pneumonia：非特異性間質性肺炎））、尿細管間質性腎炎（遠位尿細管性アシドーシス→低カリウム血症・周期性四肢麻痺・腎結石）、末梢神経障害（感覚性失調性ニューロパチー）、自己免疫性肝炎・原発性胆汁性胆管炎、甲状腺炎。\n疾患活動性は ESSDAI（臓器ごとの活動性）、自覚症状は ESSPRI。\n抗SS-A 抗体陽性の女性の妊娠：先天性心ブロック（約1〜2%）と新生児ループス。","tg":[]},{"id":"sjd-5b620e74","f":"sjd","u":46,"o":227,"lv":2,"q":"シェーグレン病の口の乾燥に使う薬と、その注意として正しい組み合わせはどれか。","ch":["ピロカルピン（サラジェン） ― 発汗・吐き気が出る","ステロイドの大量内服 ― 唾液が回復する","HCQ（hydroxychloroquine：ヒドロキシクロロキン） ― 口の乾燥に保険適用がある","抗コリン薬 ― 唾液の分泌を増やす"],"a":0,"cx":["","ステロイドで唾液腺の機能は回復しない（腺外病変の治療で使う）。","ヒドロキシクロロキン（プラケニル）は国内ではシェーグレン病に保険適用がない。","抗コリン薬は唾液を減らし、乾燥を悪化させる（抗ヒスタミン薬・抗うつ薬なども）。"],"core":"乾燥症状の治療＝ムスカリン受容体刺激薬（ピロカルピン・セビメリン）、人工唾液、点眼（ヒアルロン酸・ジクアホソル・レバミピド）、涙点プラグ。免疫抑制薬は腺外病変に使う。","e":"口腔ケア：虫歯・口腔カンジダ症が増えるので歯科で定期管理。\n眼：ドライアイの点眼（ジクアホソル（ジクアス）：ジクアス、レバミピド：ムコスタ点眼）、重症なら涙点プラグ。\n腺外病変の治療：関節炎には HCQ・MTX（methotrexate：メトトレキサート）、間質性肺疾患・腎炎・神経障害・血管炎にはステロイドや免疫抑制薬、リツキシマブ（保険適用外）。","tg":[]},{"id":"sjd-e143487c","f":"sjd","u":46,"o":228,"lv":3,"q":"42歳の女性。シェーグレン病。急に手足に力が入らなくなり、救急搬送された。血清カリウム 1.9 mEq/L、代謝性アシドーシス（アニオンギャップ正常）、尿 pH 7.0。最も考えられる病態はどれか。","ch":["ギラン・バレー症候群","甲状腺中毒性周期性四肢麻痺","重症筋無力症の発症","遠位尿細管性アシドーシス"],"a":3,"cx":["ギラン・バレー症候群は感染後の上行性の麻痺で、電解質異常で起こるものではない。","甲状腺中毒性の麻痺も低カリウムだが、アシドーシスと尿のアルカリ化は説明できない。","重症筋無力症では低カリウム血症・アシドーシスは起こらない。",""],"core":"シェーグレン病の腎＝尿細管間質性腎炎→遠位（I 型）尿細管性アシドーシス：酸を尿に出せない（アシドーシスなのに尿 pH 5.5 超）→低 K 血症（周期性四肢麻痺）・腎結石・骨軟化症。","e":"治療：カリウムとアルカリ（クエン酸カリウム）の補充。重い低カリウムでは、アシドーシスを先に補正するとカリウムがさらに下がるので、カリウムの補充を先に行う。\n尿細管間質性腎炎そのものには、ステロイドを使うこともある。\nシェーグレン病の糸球体腎炎（膜性増殖性）はまれで、クリオグロブリンを伴うことが多い。","tg":["cs"]},{"id":"sjd-1f28b29b","f":"sjd","u":46,"o":229,"lv":2,"q":"シェーグレン病の神経病変で、手足の位置の感覚が失われ、ふらつく（感覚性運動失調）のが特徴のものはどれか。","ch":["重症筋無力症（全身型）","後根神経節炎","筋萎縮性側索硬化症","多発性単神経炎だけ"],"a":1,"cx":["重症筋無力症は神経筋接合部の病気で、感覚障害はない。","","ALS は運動神経の病気で、感覚は保たれる。","多発性単神経炎は血管炎・クリオグロブリンで起こる、別々の神経の障害。"],"core":"シェーグレン病の末梢神経＝感覚性ニューロノパチー（後根神経節炎：失調・腱反射消失）、小径線維ニューロパチー（灼熱痛）、多発性単神経炎。中枢病変（脊髄炎・視神経炎）もある。","e":"感覚性ニューロノパチーは乾燥症状より先に出ることがあり、原因不明の失調では抗SS-A 抗体・口唇生検を調べる。\n視神経脊髄炎（抗アクアポリン4 抗体）がシェーグレン病に合併することがある。\n治療は IVIG（intravenous immunoglobulin：免疫グロブリン大量静注療法）・ステロイド・免疫抑制薬だが、効果は限られることが多い。","tg":[]},{"id":"sjd-beaffcf4","f":"sjd","u":46,"o":230,"lv":3,"q":"58歳の女性。シェーグレン病で10年経過を見ている。半年前から右の耳下腺が硬く腫れたままで引かない。下腿に紫斑が出るようになり、C4 低値、血清に単クローン性の IgM がある。次に行うべきこととして最も適切なのはどれか。","ch":["ピロカルピン（サラジェン）を増量する","耳下腺の画像検査と生検でリンパ腫を調べる","唾液腺の腫れなので経過観察だけにする","抗菌薬を長期に内服させる"],"a":1,"cx":["ピロカルピンは乾燥症状の薬で、腫瘍の検索にはならない。","","リンパ腫の危険因子がそろっており、経過観察だけでは見逃す。","細菌の耳下腺炎なら痛み・発熱・膿を伴い、半年も硬く腫れ続けるのは典型でない。"],"core":"シェーグレン病のリンパ腫（MALT（mucosa-associated lymphoid tissue：粘膜関連リンパ組織） リンパ腫が多い）の危険因子＝持続する耳下腺腫脹・紫斑（クリオグロブリン）・低 C4・単クローン性γグロブリン・リンパ球減少。エコー/MRI（magnetic resonance imaging）→生検。","e":"MALT リンパ腫は唾液腺に多く、ゆっくり進むことが多いが、びまん性大細胞型 B 細胞リンパ腫に変わることもある。\n治療は血液内科と相談（放射線・リツキシマブ・化学療法）。\nリンパ腫の危険因子がない人も、年に1回程度は唾液腺の腫れ・リンパ節・血液検査を見る。","tg":["cs"]},{"id":"sjd-95c71e73","f":"sjd","u":47,"o":231,"lv":2,"q":"IgG4関連疾患について正しいものはどれか。","ch":["ステロイドが効かないことが特徴","IgG4 135 以上、花筵状線維化を伴う","高力価の抗核抗体が診断に必須","若い女性に最も多い"],"a":1,"cx":["ステロイドがよく効くのが特徴（効かなければ癌・リンパ腫を疑い直す）。","","抗核抗体は診断に必要ない。","中高年の男性に多い。"],"core":"IgG4-RD（IgG4-related disease：IgG4関連疾患）＝中高年男性・膵（自己免疫性膵炎）・涙腺/唾液腺（ミクリッツ病）・胆管・後腹膜・腎・大動脈。血清 IgG4≧135、IgG4/IgG>40%・10個超/HPF、花筵状線維化・閉塞性静脈炎。","e":"2020年改訂の包括診断基準：①臓器のびまん性・限局性の腫大や腫瘤、②血清 IgG4 135 mg/dL 以上、③病理（著しいリンパ球・形質細胞の浸潤と線維化、IgG4 陽性形質細胞が10個を超える/強拡大視野かつ IgG4/IgG 陽性細胞比 40%超、花筵状線維化または閉塞性静脈炎）。\n鑑別：悪性腫瘍（膵癌・胆管癌・リンパ腫）、多中心性キャッスルマン病（IL-6（interleukin-6：インターロイキン6） 高値・CRP（C-reactive protein：C反応性タンパク） 高値）、ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） 関連血管炎、シェーグレン病、サルコイドーシス。IgG4 の上昇は他の病気でも起こり、IgG4 高値だけで診断しない。\nミクリッツ病は、シェーグレン病と違って抗SS-A/B 抗体陰性で、唾液の分泌は比較的保たれ、ステロイドで腫れが引く。","tg":[]},{"id":"sjd-975bc95b","f":"sjd","u":47,"o":232,"lv":2,"q":"IgG4関連疾患の治療として正しいものはどれか。","ch":["手術での切除が第一選択である","ステロイドがよく効くが再燃が多い","自然に治るので治療はいらない","抗菌薬の長期内服が第一選択である"],"a":1,"cx":["腫瘤が悪性と区別できないときは生検・切除もあるが、治療の基本はステロイド。","","重要な臓器（膵・胆管・腎・大動脈・後腹膜）の病変は不可逆な線維化になるので、治療する（無症状の涙腺・リンパ節だけなら経過観察もある）。","感染症ではない。"],"core":"IgG4-RD（IgG4-related disease：IgG4関連疾患）＝ステロイド（PSL（prednisolone：プレドニゾロン） 0.6 mg/kg/日→2〜3か月で減量→少量で維持）がよく効く。再燃が多い。イネビリズマブ（抗CD19）が国内初の再燃抑制薬。","e":"ステロイドを止めると再燃しやすく、国内では少量（PSL 5 mg/日前後）の維持が多い。\n再燃・ステロイド依存例：免疫抑制薬（アザチオプリン（イムラン、アザニン）・MMF（mycophenolate mofetil：ミコフェノール酸モフェチル））、リツキシマブ（保険適用外）、イネビリズマブ（2025年11月に「IgG4関連疾患の再燃抑制」で承認）。\n治療の効果判定は画像（CT・FDG-PET（fluorodeoxyglucose positron emission tomography））と血清 IgG4。\n後腹膜線維症は尿管を圧迫して水腎症を起こし、尿管ステントが必要になることがある。","tg":["ae"]},{"id":"sjd-753ed2bd","f":"sjd","u":47,"o":233,"lv":2,"q":"IgG4関連疾患の検査所見として、知っておくべき特徴はどれか。","ch":["低補体と IgE・好酸球の上昇","ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） が高い割合で陽性","CRP（C-reactive protein：C反応性タンパク） が必ず 10 mg/dL 以上","血清 IgG が必ず低下する"],"a":0,"cx":["","ANCA はふつう陰性。陽性なら ANCA 関連血管炎を考える。","CRP は正常〜軽度上昇のことが多い（著しく高ければキャッスルマン病・感染・悪性腫瘍を考える）。","血清 IgG はむしろ上がる（高ガンマグロブリン血症）。"],"core":"IgG4-RD（IgG4-related disease：IgG4関連疾患）：IgG・IgG4 高値、低補体（とくに尿細管間質性腎炎で）、IgE・好酸球↑、CRP は低め。アレルギー（喘息・鼻炎）の既往が多い。","e":"IgG4 関連の腎臓病は、尿細管間質性腎炎が中心で、造影 CT で多発する造影不良域として見つかる。\n自己免疫性膵炎（1型）は膵臓のびまん性の腫大（ソーセージ様）・膵管の狭細化で、膵癌との区別が重要。\nIgG4 関連の硬化性胆管炎は、原発性硬化性胆管炎・胆管癌と区別が必要（IgG4 関連はステロイドが効く）。","tg":[]},{"id":"sjd-bbd86528","f":"sjd","u":47,"o":234,"lv":3,"q":"66歳の男性。黄疸で受診。CT で膵臓がびまん性に腫れて（ソーセージ様）、膵内の胆管の狭窄があり、両側の顎下腺も腫れている。血清 IgG4 520 mg/dL。ステロイドを始める前に必ず行うべきことはどれか。","ch":["すぐにステロイドを大量に始めて効果で診断する","膵癌・胆管癌の除外（細胞診・組織診など）","膵頭十二指腸切除術を行う","抗菌薬を2週間使って反応を見る"],"a":1,"cx":["ステロイドの反応だけで診断すると、癌を見逃して治療が遅れる。","","自己免疫性膵炎ならステロイドで治る。悪性が否定できれば大きな手術は不要。","感染症ではないので、抗菌薬の反応を見る意味はない。"],"core":"自己免疫性膵炎（1型）＝IgG4関連疾患の膵病変。膵癌・胆管癌とよく似るので、超音波内視鏡下の穿刺吸引などで悪性を除外してからステロイド（PSL（prednisolone：プレドニゾロン） 0.6 mg/kg/日）。","e":"黄疸があれば、胆道ドレナージ（ステント）を先に行うこともある。\n膵外病変（顎下腺・涙腺・腎・後腹膜）があると診断の手がかりになる。\nステロイドの反応（2週間ほどで画像が改善）は診断の補助になるが、悪性の除外が先。\n治療後、膵臓の内分泌（糖尿病）・外分泌の機能が落ちることがある。","tg":["cs"]},{"id":"vasc-f0e48e41","f":"vasc","u":48,"o":235,"lv":1,"q":"CHCC2012（Chapel Hill 分類）で「中型血管炎」に分類されるのはどれか。","ch":["結節性多発動脈炎と川崎病","顕微鏡的多発血管炎と多発血管炎性肉芽腫症","IgA 血管炎とクリオグロブリン血症性血管炎","高安動脈炎と巨細胞性動脈炎"],"a":0,"cx":["","MPA（microscopic polyangiitis：顕微鏡的多発血管炎） と GPA（granulomatosis with polyangiitis：多発血管炎性肉芽腫症） は小型血管炎の ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） 関連血管炎。","IgA 血管炎とクリオグロブリン血症性血管炎は小型血管炎の免疫複合体性血管炎。","高安動脈炎と巨細胞性動脈炎は大型血管炎（大動脈とその主な分枝）。"],"core":"大型＝高安・巨細胞性。中型＝結節性多発動脈炎・川崎病。小型＝ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） 関連（MPA（microscopic polyangiitis：顕微鏡的多発血管炎）・GPA（granulomatosis with polyangiitis：多発血管炎性肉芽腫症）・EGPA（eosinophilic granulomatosis with polyangiitis：好酸球性多発血管炎性肉芽腫症））と免疫複合体性（抗GBM・IgA・クリオ・低補体性蕁麻疹様）。さまざまな血管＝ベーチェット・Cogan。","e":"血管のサイズで症状が決まる：\n・大型：脈が触れない・血圧の左右差・血管雑音・跛行・大動脈弁閉鎖不全・大動脈瘤。\n・中型：皮膚潰瘍・結節・網状皮斑、多発性単神経炎、腎梗塞・腎血管性高血圧（糸球体腎炎は起こさない）、腸管の虚血、精巣痛。\n・小型：触知できる紫斑、糸球体腎炎（RPGN（rapidly progressive glomerulonephritis：急速進行性糸球体腎炎））、肺胞出血、多発性単神経炎、上強膜炎。\nどのサイズの血管炎も、血管の大きさは「主に」侵される大きさで、重なりがある。","tg":[],"fig":["vessel"],"mt":["vasc"]},{"id":"vasc-b11a1218","f":"vasc","u":48,"o":236,"lv":2,"q":"高安動脈炎について正しいものはどれか。","ch":["大動脈弁閉鎖不全は起こらない","50歳以上の発症が診断に必要である","若い女性・HLA（human leukocyte antigen：ヒト白血球抗原）-B52・潰瘍性大腸炎","側頭動脈の生検で診断する"],"a":2,"cx":["大動脈弁閉鎖不全（上行大動脈の拡大）は予後に関わる重要な合併症。","50歳以上の発症は巨細胞性動脈炎の特徴。高安動脈炎は40歳未満の発症が多い。","","側頭動脈の生検は巨細胞性動脈炎の検査。高安動脈炎は CT・MR 血管造影、FDG-PET（fluorodeoxyglucose positron emission tomography）、血管エコーで診断する。"],"core":"高安動脈炎＝若い女性・HLA-B52・潰瘍性大腸炎・脈なし・血圧左右差・頸動脈痛（carotidynia）・大動脈弁閉鎖不全。治療は GC（glucocorticoid：グルココルチコイド）＋トシリズマブ（2017年承認）など。","e":"初期は発熱・倦怠感・体重減少だけのことが多く、不明熱として見つかる（CRP（C-reactive protein：C反応性タンパク） 高値）。\n画像：大動脈とその分枝の壁肥厚・狭窄・拡張。頸動脈の壁の全周性の肥厚（マカロニサイン）。\n治療：プレドニゾロン（プレドニン） 0.5〜1 mg/kg/日。再燃が多いので、MTX（methotrexate：メトトレキサート）・アザチオプリン・タクロリムス、トシリズマブを併用する（TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬は国内では保険適用外）。\n血管の狭窄には、炎症が落ち着いてからカテーテル治療・バイパス術。大動脈弁閉鎖不全には弁置換。\n血圧は狭窄のない側の腕（または下肢）で測る。","tg":[],"mt":["vasc"]},{"id":"vasc-6d93966f","f":"vasc","u":48,"o":237,"lv":3,"q":"76歳の女性。2週間前から右のこめかみの頭痛と、食事中に顎がだるくなる。両肩のこわばりもある。今朝から右眼が一時的に見えにくくなった。赤沈 95 mm/時、CRP（C-reactive protein：C反応性タンパク） 8.2 mg/dL。最初に行うべき対応はどれか。","ch":["生検を待たずに大量ステロイドを始める","PMR（polymyalgia rheumatica：リウマチ性多発筋痛症） としてプレドニゾロン（プレドニン） 10 mg/日を始める","生検の結果が出るまでステロイドは始めない","NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） で頭痛を抑えて外来で様子を見る"],"a":0,"cx":["","PMR の量（少量）では巨細胞性動脈炎の失明を防げない。","生検を待つ間に失明（前部虚血性視神経症）が起こりうる。ステロイド開始後1〜2週以内なら生検の所見は残る。","視力症状のある巨細胞性動脈炎は緊急疾患で、外来での経過観察は危険。"],"core":"高齢者の新しい頭痛・顎跛行・視力症状・赤沈著増＝巨細胞性動脈炎。視力症状があれば、すぐに大量ステロイド（失明の予防）→診断は後から（エコーの halo sign・生検）。","e":"巨細胞性動脈炎（50歳以上）：側頭動脈の圧痛・拍動の低下、頭皮の痛み、顎跛行（特異度が高い）、視力障害（一度失明すると戻らないことが多い）、PMR の合併（約半数）、大動脈炎（大動脈瘤）。\n診断：側頭動脈エコーの halo sign（壁の浮腫による低エコーの輪）、側頭動脈生検（病変が飛び石状なので 1 cm 以上採る）、FDG-PET（大型血管の病変）。\n治療：プレドニゾロン 40〜60 mg/日（視力症状があればパルス）。再燃予防とステロイド減量にトシリズマブ（国内で承認）、ウパダシチニブ（2025年6月に国内承認）。低用量アスピリンを併用することもある。","tg":["cs"],"mt":["vasc","elderly"]},{"id":"vasc-18dedbd6","f":"vasc","u":48,"o":238,"lv":2,"q":"巨細胞性動脈炎の長期経過で、数年たってから特に注意すべき合併症はどれか。","ch":["胸部大動脈瘤・解離","肺動脈性肺高血圧症","骨髄異形成症候群","膜性腎症（ネフローゼ）"],"a":0,"cx":["","PAH（pulmonary arterial hypertension：肺動脈性肺高血圧症） は強皮症・MCTD（mixed connective tissue disease：混合性結合組織病） の合併症。","MDS は再発性多発軟骨炎・VEXAS 症候群で問題になる。","膜性腎症は巨細胞性動脈炎の典型的な合併症ではない（ブシラミン（リマチル）や SLE（systemic lupus erythematosus：全身性エリテマトーデス） V 型など）。"],"core":"GCA（giant cell arteritis：巨細胞性動脈炎） は大動脈炎を伴うことが多く、数年後に胸部大動脈瘤・解離が一般の数倍に増える。定期的に画像（CT・MRI（magnetic resonance imaging）・エコー）で大動脈を確認する。","e":"ステロイドの減量中の再燃が多い（とくに最初の2年）。PMR（polymyalgia rheumatica：リウマチ性多発筋痛症） の症状の再燃として出ることも多い。\nトシリズマブ（アクテムラ）はステロイドを減らし、持続寛解を増やした（GiACTA 試験）。中止すると再燃することがある。\n高安動脈炎でも大動脈瘤・大動脈弁閉鎖不全・狭窄による臓器虚血の長期管理が必要。","tg":[],"mt":["vasc"]},{"id":"vasc-937e5289","f":"vasc","u":48,"o":239,"lv":2,"q":"川崎病について正しいものはどれか。","ch":["ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） が高い割合で陽性になる","IVIG（intravenous immunoglobulin：免疫グロブリン大量静注療法） とアスピリンで冠動脈瘤を防ぐ","高齢者に多い大型血管炎である","治療しなくても冠動脈は侵されない"],"a":1,"cx":["ANCA は陰性。","","主に5歳未満の乳幼児に起こる中型血管炎。","治療しないと約25%に冠動脈瘤ができる。"],"core":"川崎病＝乳幼児の中型血管炎（冠動脈）。発熱・両側の眼球結膜充血・口唇の紅潮/いちご舌・不定形発疹・四肢末端の変化（硬性浮腫→膜様落屑）・頸部リンパ節腫脹。IVIG（2 g/kg）＋アスピリン。","e":"診断の手引きは2019年の第6版（発熱の日数を問わない、主要症状6つのうち5つ以上など）。BCG 接種部位の発赤も特徴的。\nIVIG 不応例：IVIG の追加、ステロイド、インフリキシマブ（国内で適応）、シクロスポリン（ネオーラル）、血漿交換。\n成人に近い年齢で起こることはまれ。","tg":[]},{"id":"vasc-8fe5bb52","f":"vasc","u":48,"o":240,"lv":3,"q":"24歳の女性。3か月前から微熱と倦怠感、左腕を使うとだるくなる。左の橈骨動脈の拍動が弱く、血圧は右 128/70・左 96/60 mmHg、左鎖骨の上で血管雑音がある。CRP（C-reactive protein：C反応性タンパク） 4.5 mg/dL。最も適切な検査と治療の組み合わせはどれか。","ch":["血管造影 CT・PET（positron emission tomography）、GC（glucocorticoid：グルココルチコイド）＋トシリズマブ（アクテムラ）","側頭動脈の生検をしてからステロイド","頸椎の MRI（magnetic resonance imaging） と鎮痛薬で経過を見る","心臓カテーテル検査と冠動脈ステント"],"a":0,"cx":["","側頭動脈の生検は50歳以上の巨細胞性動脈炎の検査。若い女性の大型血管炎は高安動脈炎。","頸椎の病気では血圧の左右差・血管雑音は説明できない。","冠動脈の病気を示す症状はなく、ステントは炎症が落ち着いてから狭窄に対して考えるもの。"],"core":"若い女性・腕の跛行・脈の左右差・血管雑音・炎症反応＝高安動脈炎。CT/MR 血管造影・FDG-PET（fluorodeoxyglucose positron emission tomography）・頸動脈エコーで評価し、ステロイド（0.5〜1 mg/kg）＋トシリズマブなど。","e":"血圧の測り方：狭窄のない腕（または下肢）で測る。両腕とも狭窄があると、本当の血圧より低く測ってしまう。\n合併症：大動脈弁閉鎖不全（上行大動脈の拡張）、腎動脈の狭窄（腎血管性高血圧）、冠動脈の入口部の狭窄、脳虚血。\n潰瘍性大腸炎・HLA（human leukocyte antigen：ヒト白血球抗原）-B52 との関連がある。妊娠の計画は病気が落ち着いてから。","tg":["cs"],"mt":["vasc"]},{"id":"vasc-c94d63aa","f":"vasc","u":49,"o":241,"lv":2,"q":"結節性多発動脈炎（PAN（polyarteritis nodosa：結節性多発動脈炎））について正しいものはどれか。","ch":["ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） 陰性で、糸球体腎炎を起こさない","毛細血管など小型血管の血管炎である","肺胞出血が最も多い症状である","MPO（myeloperoxidase：ミエロペルオキシダーゼ）-ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） が高い割合で陽性になる"],"a":0,"cx":["","PAN は中型の筋性動脈の壊死性血管炎。毛細血管・細動脈・細静脈は侵さない。","PAN は肺をほとんど侵さない（肺胞出血・肺病変があれば MPA（microscopic polyangiitis：顕微鏡的多発血管炎） を考える）。","ANCA 陽性なら MPA（microscopic polyangiitis：顕微鏡的多発血管炎） などの ANCA 関連血管炎を考える。"],"core":"PAN＝中型動脈・ANCA 陰性・糸球体腎炎なし・肺病変なし。多発性単神経炎・皮膚潰瘍/網状皮斑・腎梗塞と腎血管性高血圧・腸間膜動脈の虚血・精巣痛。HBV（hepatitis B virus：B型肝炎ウイルス） 関連あり。","e":"診断：血管造影の微小動脈瘤（腎・腸間膜動脈）、皮膚・筋・神経の生検（中型動脈のフィブリノイド壊死）。\n治療：ステロイド、重症（腎・腸・心・中枢神経）ではシクロホスファミド（エンドキサン）を併用。\nHBV 関連 PAN：免疫抑制はウイルスを増やすので、抗ウイルス薬（核酸アナログ）＋短期のステロイド＋血漿交換で治療する。\n皮膚だけの皮膚動脈炎（皮膚型 PAN）は、下腿の結節・網状皮斑・潰瘍だけで、全身に広がることは少ない。\nADA2 欠損症（DADA2）は、小児期からの PAN 様の血管炎・脳梗塞の遺伝性の病気（TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬が有効）。","tg":["ae"],"mt":["vasc"]},{"id":"vasc-78326f08","f":"vasc","u":50,"o":242,"lv":1,"q":"ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） 関連血管炎の3疾患の特徴の組み合わせで正しいものはどれか。","ch":["MPA（microscopic polyangiitis：顕微鏡的多発血管炎） ― 肉芽腫性の炎症が特徴","EGPA（eosinophilic granulomatosis with polyangiitis：好酸球性多発血管炎性肉芽腫症） ― 鞍鼻と眼窩の肉芽腫が最多","GPA（granulomatosis with polyangiitis：多発血管炎性肉芽腫症） ― 上気道・肺の結節・腎、PR3（proteinase 3：プロテイナーゼ3）","MPA（microscopic polyangiitis：顕微鏡的多発血管炎） ― 喘息と好酸球増加が先行する"],"a":2,"cx":["MPA は肉芽腫を作らない（肉芽腫がないことが GPA（granulomatosis with polyangiitis：多発血管炎性肉芽腫症） との違い）。","鞍鼻・眼窩の肉芽腫は GPA（granulomatosis with polyangiitis：多発血管炎性肉芽腫症）。EGPA は喘息・好酸球・神経（多発性単神経炎）・心臓（心筋炎）が特徴。","","喘息と好酸球増加が先行するのは EGPA（eosinophilic granulomatosis with polyangiitis：好酸球性多発血管炎性肉芽腫症）。"],"core":"GPA＝上気道→肺→腎（ELK）＋肉芽腫・PR3。MPA＝腎（RPGN（rapidly progressive glomerulonephritis：急速進行性糸球体腎炎））・肺（間質性肺疾患・肺胞出血）・神経、肉芽腫なし・MPO（日本で最多）。EGPA＝喘息・好酸球・神経・心臓・MPO は3〜4割。","e":"GPA の上気道：慢性副鼻腔炎、鼻出血・痂皮、鞍鼻、中耳炎（難聴）、声門下狭窄。肺：多発結節（空洞化）。眼：強膜炎・眼窩の腫瘤。\nMPA は日本の高齢者に多く、間質性肺疾患（UIP（usual interstitial pneumonia：通常型間質性肺炎） など）を伴うことが多い。間質性肺炎が先に見つかり、あとで MPO-ANCA と腎炎が出ることもある。\nEGPA：喘息（成人発症）・好酸球増加（10%以上）・多発性単神経炎・紫斑・心筋炎（死因として重要）・消化管病変。ANCA 陽性例は腎炎・神経障害が、陰性例は心臓病変が多い。","tg":[],"fig":["vessel"],"mt":["vasc"]},{"id":"vasc-e3360416","f":"vasc","u":50,"o":243,"lv":2,"q":"ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） 関連血管炎（MPA（microscopic polyangiitis：顕微鏡的多発血管炎）・GPA（granulomatosis with polyangiitis：多発血管炎性肉芽腫症））の寛解導入療法として、ANCA関連血管炎診療ガイドライン2023 と国際的な推奨に沿うものはどれか。","ch":["MTX（methotrexate：メトトレキサート） の単独で寛解導入を行う","すべての患者に血漿交換を行う","ステロイド単独で長く大量に使う","GC（glucocorticoid：グルココルチコイド）＋リツキシマブ（リツキサン）か IVCY（＋アバコパン（タブネオス））"],"a":3,"cx":["MTX は重い臓器病変のない例の選択肢になりうるが、腎炎のある例には使わない（腎排泄でもある）。","PEXIVAS 試験で、血漿交換は死亡・末期腎不全を減らさなかった。全例には行わず、重い腎障害や肺胞出血で個別に考える。","ステロイド単独は再燃が多く、重症例の予後が悪い。",""],"core":"AAV（ANCA-associated vasculitis：ANCA関連血管炎） の導入＝GC＋リツキシマブ（375 mg/m²×4回）または IVCY。GC は減量レジメン（PEXIVAS）。アバコパン（C5a 受容体拮抗薬）で GC を減らせる。維持＝リツキシマブ（6か月ごと）またはアザチオプリン（イムラン、アザニン）。","e":"・リツキシマブ：RAVE 試験でシクロホスファミド（エンドキサン）と同等、再燃例・PR3（proteinase 3：プロテイナーゼ3）-ANCA 陽性例ではより良い。若い人の性腺毒性を避けたいときにも選ぶ。\n・ステロイド：PEXIVAS 試験の減量レジメンは、標準量と同等の効果で重い感染症が少なかった。\n・アバコパン：ADVOCATE 試験で、ステロイドの代わりに使っても寛解率が劣らず、52週の持続寛解は優れた。副作用は肝障害。\n・維持療法：リツキシマブ 500 mg を6か月ごと（MAINRITSAN 試験でアザチオプリンより再燃が少ない）、またはアザチオプリン。少なくとも2年程度は続ける。\n・ニューモシスチス肺炎の予防（ST合剤（スルファメトキサゾール・トリメトプリム：バクタ））と B 型肝炎の確認は必須。","tg":["ae","gl"],"mt":["vasc"]},{"id":"vasc-c9ad6091","f":"vasc","u":50,"o":244,"lv":2,"q":"好酸球性多発血管炎性肉芽腫症（EGPA（eosinophilic granulomatosis with polyangiitis：好酸球性多発血管炎性肉芽腫症））の治療で、国内で使える薬として正しい組み合わせはどれか。","ch":["IL-17（interleukin-17：インターロイキン17） 阻害薬（セクキヌマブ（コセンティクス）など）","JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬（第一選択として）","メポリズマブ（ヌーカラ）・ベンラリズマブ","TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬（第一選択として）"],"a":2,"cx":["IL-17 阻害薬は EGPA の治療薬ではない。","JAK 阻害薬は EGPA の承認薬ではない。","","TNF 阻害薬は EGPA には使わない。"],"core":"EGPA＝ステロイド（重症はシクロホスファミド（エンドキサン）・リツキシマブ）＋抗IL-5（interleukin-5：インターロイキン5） 系（メポリズマブ 300 mg を4週ごと・ベンラリズマブ：IL-5 受容体α）。神経障害には IVIG（国内で承認）。","e":"メポリズマブ（抗 IL-5 抗体）は、EGPA では喘息の量（100 mg）より多い 300 mg を4週ごとに皮下注射する。ベンラリズマブ（抗 IL-5 受容体α抗体）は EGPA でメポリズマブに劣らないことが示され、国内でも使える。\n重症（心臓・消化管・腎・中枢神経の病変）では、ステロイドにシクロホスファミドを併用する。\n予後の指標：Five Factor Score（年齢65歳超・心不全・消化管病変・腎機能障害〔クレアチニン 1.7 mg/dL 以上〕・耳鼻咽喉の症状がない〔GPA（granulomatosis with polyangiitis：多発血管炎性肉芽腫症） と MPA（microscopic polyangiitis：顕微鏡的多発血管炎） で〕）。\n喘息の治療薬（ロイコトリエン受容体拮抗薬など）の開始やステロイドの減量で EGPA が表に出ることがある。","tg":[],"mt":["vasc"]},{"id":"vasc-503be607","f":"vasc","u":50,"o":245,"lv":3,"q":"70歳の男性。1か月前から微熱・体重減少。この1週間で血痰と息切れ、クレアチニン 1.0 → 3.8 mg/dL、尿潜血 3+・赤血球円柱。胸部 CT で両側のびまん性すりガラス影、ヘモグロビンが低下。MPO（myeloperoxidase：ミエロペルオキシダーゼ）-ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） 陽性、抗GBM 抗体陰性。最も適切な対応はどれか。","ch":["外来で経口ステロイド 10 mg/日を始める","腎生検の結果が出る2週後まで待つ","入院してパルス＋RTX/IVCY（intravenous cyclophosphamide：シクロホスファミド間欠静注） を始める","細菌性肺炎として抗菌薬だけで治療する"],"a":2,"cx":["少量の経口ステロイドでは不十分。入院での強い治療が必要。","生検は大切だが、肺胞出血と RPGN（rapidly progressive glomerulonephritis：急速進行性糸球体腎炎） は命と腎に関わり、待てない。治療と並行して行う。","","血痰・急な貧血・腎炎の悪化は感染だけでは説明できない。感染症の検査は同時に行う。"],"core":"肺腎症候群＝MPO-ANCA（MPA（microscopic polyangiitis：顕微鏡的多発血管炎））か抗GBM 病。緊急入院・パルス＋リツキシマブ（リツキサン）/シクロホスファミド（エンドキサン）。抗GBM 抗体陽性なら血漿交換が必須。","e":"肺胞出血の手がかり：血痰（ない人もいる）、急なヘモグロビン低下、CT のすりガラス影、気管支肺胞洗浄液がだんだん赤くなる（ヘモジデリン貪食マクロファージ）。\n抗GBM 病（Goodpasture 病）：腎生検で糸球体基底膜への IgG の線状沈着。血漿交換＋ステロイド＋シクロホスファミド。MPO-ANCA と抗GBM 抗体の両方陽性（double positive）は、抗GBM 病として扱う。\n腎の予後：透析が必要なほどの重い腎障害でも、早い治療で離脱できることがある。","tg":["cs"],"mt":["vasc"]},{"id":"vasc-97d2a4f6","f":"vasc","u":50,"o":246,"lv":1,"q":"ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） 関連血管炎の腎生検で典型的な所見はどれか。","ch":["基底膜のスパイク形成（膜性腎症）","メサンギウムへの IgA の沈着","pauci-immune の半月体形成性腎炎","糸球体基底膜への IgG の線状沈着"],"a":2,"cx":["スパイク形成は膜性腎症。","IgA のメサンギウム沈着は IgA 腎症・IgA 血管炎。","","IgG の線状沈着は抗GBM 病。"],"core":"ANCA 関連の腎炎＝pauci-immune（免疫沈着が乏しい）の壊死性半月体形成性糸球体腎炎。臨床では急速進行性糸球体腎炎（RPGN（rapidly progressive glomerulonephritis：急速進行性糸球体腎炎））。","e":"蛍光抗体法の沈着のパターン：\n・線状（IgG）：抗GBM 病\n・顆粒状（免疫複合体）：ループス腎炎（フルハウス：IgG・IgA・IgM・C3・C1q）、感染後腎炎、IgA 腎症、クリオグロブリン血症\n・乏しい：ANCA 関連\n半月体の割合や慢性病変（硬化・線維化）は腎の予後を予測する。","tg":[],"mt":["vasc"]},{"id":"vasc-3d1684f7","f":"vasc","u":50,"o":247,"lv":2,"q":"アバコパン（タブネオス）について正しいものはどれか。","ch":["IL-5（interleukin-5：インターロイキン5） を中和する皮下注の抗体","EGPA（eosinophilic granulomatosis with polyangiitis：好酸球性多発血管炎性肉芽腫症） の第一選択として承認","C5a 受容体拮抗薬で肝障害に注意","抗 CD20 抗体の点滴製剤である"],"a":2,"cx":["IL-5 を中和する抗体はメポリズマブ（ヌーカラ）。","国内の適応は顕微鏡的多発血管炎・多発血管炎性肉芽腫症で、EGPA ではない。","","抗 CD20 抗体はリツキシマブ（リツキサン）。"],"core":"アバコパン＝内服の C5a 受容体（C5aR1）拮抗薬。C5a による好中球の呼び寄せ・活性化を止める。MPA（microscopic polyangiitis：顕微鏡的多発血管炎）・GPA（granulomatosis with polyangiitis：多発血管炎性肉芽腫症） の寛解導入でステロイドを減らせる。副作用は肝障害（定期の肝機能検査）。","e":"使い方：リツキシマブ（リツキサン）かシクロホスファミド（エンドキサン）と併用し、1回 30 mg を1日2回内服。\nCYP3A4（cytochrome P450 3A4：薬物代謝酵素） で代謝されるので、強い誘導薬・阻害薬との併用に注意。\nANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） は好中球を活性化して NETs（neutrophil extracellular traps：好中球細胞外トラップ） を出させ、補体の第二経路が活性化されて C5a ができ、さらに好中球が集まるという悪循環がある。","tg":["ae"],"mt":["vasc"]},{"id":"vasc-9b2f4997","f":"vasc","u":50,"o":248,"lv":2,"q":"多発血管炎性肉芽腫症（GPA（granulomatosis with polyangiitis：多発血管炎性肉芽腫症））で、喉頭の下の気管が狭くなる病変はどれか。","ch":["眼窩の偽腫瘍","中耳炎","声門下狭窄","鞍鼻"],"a":2,"cx":["眼窩の偽腫瘍は眼球突出・視力障害を起こす GPA の所見。","中耳炎は難聴の原因になる GPA の所見。","","鞍鼻は鼻中隔の軟骨の破壊で起こる GPA の所見（気道狭窄ではない）。"],"core":"GPA の声門下狭窄＝嗄声・喘鳴・呼吸困難。全身治療で良くならないことがあり、局所の拡張術・ステロイド注入。再発性多発軟骨炎の気道病変との区別も。","e":"GPA の上気道・眼の病変は「肉芽腫」が主体で、全身の免疫抑制の反応が遅いことがある。\nリツキシマブ（リツキサン）は肉芽腫性の病変にも効くが、眼窩の病変は難治のことがある。\n鼻の症状（鼻閉・痂皮・鼻出血）は再燃の最初のサインになりやすい。","tg":[]},{"id":"vasc-66700309","f":"vasc","u":50,"o":249,"lv":2,"q":"抗甲状腺薬のプロピルチオウラシル（チウラジール）で起こりうる血管炎はどれか。","ch":["HLA（human leukocyte antigen：ヒト白血球抗原）-B51 関連のベーチェット病","IgG4関連疾患","巨細胞性動脈炎","MPO（myeloperoxidase：ミエロペルオキシダーゼ）-ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） 陽性の薬剤性血管炎"],"a":3,"cx":["ベーチェット病は薬剤で起こる病気ではない。","IgG4関連疾患は薬で起こるものではない。","巨細胞性動脈炎は薬剤性ではない。",""],"core":"薬剤性 ANCA 関連血管炎＝プロピルチオウラシル（最多）・ヒドララジン・ミノサイクリン・アロプリノール・レバミゾール（コカイン）。MPO-ANCA が高く、抗ヒストン抗体などを伴うことも。中止で良くなることが多い。","e":"皮膚の血管炎・関節痛が中心のことが多いが、腎炎・肺胞出血を起こす重症もある。重ければステロイド・免疫抑制薬。\nヒドララジン（アプレゾリン）では薬剤性ループス（抗ヒストン抗体）と ANCA 血管炎が重なることがある。\nANCA は中止後も長く陽性が続くことがある。","tg":["ae"]},{"id":"vasc-484f3d0a","f":"vasc","u":50,"o":250,"lv":3,"q":"45歳の男性。半年前から鼻閉・膿性鼻汁と鼻出血、最近は耳の聞こえが悪い。胸部 CT で両肺に多発する結節（一部に空洞）、尿潜血陽性、PR3（proteinase 3：プロテイナーゼ3）-ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） 陽性。鼻の生検で壊死を伴う肉芽腫性の炎症。寛解導入療法として最も適切なのはどれか。","ch":["外科的に肺の結節を切除する","抗菌薬だけを長期に使う","抗結核薬の4剤併用","グルココルチコイド＋リツキシマブ（リツキサン）"],"a":3,"cx":["肺の結節は全身の治療で小さくなる。切除は不要。","副鼻腔炎の症状でも、PR3-ANCA と肉芽腫・肺の空洞・腎炎があれば GPA（granulomatosis with polyangiitis：多発血管炎性肉芽腫症） で、抗菌薬だけでは治らない。","抗酸菌の検査で結核は除外すべきだが、この所見の組み合わせは GPA（granulomatosis with polyangiitis：多発血管炎性肉芽腫症）。",""],"core":"GPA（上気道→肺→腎、PR3-ANCA、肉芽腫）＝GC（glucocorticoid：グルココルチコイド）＋リツキシマブ（PR3 陽性・再燃例ではとくにリツキシマブが勧められる）またはシクロホスファミド（エンドキサン）。維持はリツキシマブ（6か月ごと）。","e":"PR3-ANCA 陽性の GPA は MPO（myeloperoxidase：ミエロペルオキシダーゼ）-ANCA の MPA（microscopic polyangiitis：顕微鏡的多発血管炎） より再燃が多い。維持療法を長めに続ける。\n鼻腔の黄色ブドウ球菌の保菌は再燃と関連するとされ、ST合剤（PCP（Pneumocystis pneumonia：ニューモシスチス肺炎） 予防も兼ねる）が使われる。\n眼窩・声門下の病変は全身治療に反応しにくいことがある。","tg":["cs"],"mt":["vasc"]},{"id":"vasc-bf2fd0a3","f":"vasc","u":50,"o":251,"lv":3,"q":"55歳の女性。3年前から成人発症の喘息。最近、両下肢のしびれと足首が上がらない（下垂足）、紫斑、好酸球 6,800/μL（35%）。MPO（myeloperoxidase：ミエロペルオキシダーゼ）-ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） 陽性。心電図・心エコー・トロポニンは正常、腎機能正常。最も適切な治療はどれか。","ch":["喘息の吸入薬だけを増やして様子を見る","治療せずに神経の回復を待つ","抗菌薬と抗寄生虫薬だけを使う","GC（glucocorticoid：グルココルチコイド）＋重症度に応じ免疫抑制薬・抗IL-5（interleukin-5：インターロイキン5）"],"a":3,"cx":["喘息だけの治療では、血管炎（神経障害・紫斑）は抑えられない。","多発性単神経炎は放置すると後遺症が残る。早く治療する。","寄生虫による好酸球増加は除外すべきだが、ANCA 陽性・多発性単神経炎は EGPA（eosinophilic granulomatosis with polyangiitis：好酸球性多発血管炎性肉芽腫症） の所見。",""],"core":"EGPA（eosinophilic granulomatosis with polyangiitis：好酸球性多発血管炎性肉芽腫症）＝喘息＋好酸球増加＋多発性単神経炎・紫斑。GC が基本、重症（心・消化管・腎・中枢）は IVCY（intravenous cyclophosphamide：シクロホスファミド間欠静注） やリツキシマブ（リツキサン）、再燃予防とステロイド減量にメポリズマブ（ヌーカラ）・ベンラリズマブ。神経障害が残れば IVIG（intravenous immunoglobulin：免疫グロブリン大量静注療法）。","e":"心臓病変（心筋炎）は死因になるので、心臓 MRI（magnetic resonance imaging）・トロポニン・心エコーで必ず調べる。\n好酸球の原因の区別：寄生虫（糞線虫：ステロイドで播種するので事前に検査）、薬剤、アレルギー性気管支肺アスペルギルス症、好酸球増加症候群（FIP1L1-PDGFRA：イマチニブ（グリベック））、リンパ腫。\nANCA 陽性例は腎炎・神経障害が多く、陰性例は心臓・肺の病変が多い傾向。","tg":["ae","cs"],"mt":["vasc"]},{"id":"vasc-460bc0ab","f":"vasc","u":51,"o":252,"lv":2,"q":"成人の IgA 血管炎について正しいものはどれか。","ch":["紫斑・腹痛・腎炎、血管壁に IgA","紫斑は上半身にだけ出る","ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） が陽性になる","血小板が著明に減少する"],"a":0,"cx":["","紫斑は下腿・殿部など重力のかかる場所に出る。","ANCA は陰性。","血小板は正常（紫斑は血管炎による）。血小板減少があれば ITP・TTP（thrombotic thrombocytopenic purpura：血栓性血小板減少性紫斑病） などを考える。"],"core":"IgA 血管炎＝IgA1 の免疫複合体の小型血管炎。触知できる紫斑（下肢）・関節痛・腹痛（腸重積）・IgA 腎症様の腎炎。成人は腎炎が重く、癌の合併がある。","e":"消化管：腹痛・血便・腸重積（小児）。腹痛が紫斑より先に出ると診断が難しい。\n治療：皮膚・関節だけなら対症療法。腹痛が強いとき・腎炎（蛋白尿が多い・腎機能低下・半月体）ではステロイド・免疫抑制薬。\n第XIII因子が下がることがあり、腹痛が強い例で補充することがある。","tg":[],"mt":["vasc"]},{"id":"vasc-78ba861a","f":"vasc","u":51,"o":253,"lv":2,"q":"C 型肝炎に伴う混合型クリオグロブリン血症性血管炎について正しいものはどれか。","ch":["C4 が著明に低く、RF（rheumatoid factor：リウマトイド因子） が陽性","採血後すぐ冷やすと正確に測れる","MPO（myeloperoxidase：ミエロペルオキシダーゼ）-ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） が陽性になる","補体は上昇する"],"a":0,"cx":["","クリオグロブリンは冷えると沈殿するので、37℃に保って運び、分離する。冷やすと偽陰性になる。","ANCA は陰性がふつう。","C4（古典経路）が著明に下がる。"],"core":"クリオグロブリン血症性血管炎＝HCV（混合型 II 型：単クローン IgM-RF）・紫斑・関節痛・神経障害・MPGN・C4 低値・RF 陽性。治療は抗ウイルス薬、重症はリツキシマブ（リツキサン）・血漿交換。","e":"クリオグロブリンの型：\n・I 型：単クローン性（多発性骨髄腫・マクログロブリン血症）。過粘稠・血栓・指の壊死。\n・II 型：単クローン性 IgM（RF 活性）＋多クローン性 IgG。HCV に最も多い。\n・III 型：多クローン性 IgM＋IgG。膠原病・感染症。\nシェーグレン病でもクリオグロブリン血症が起こり、リンパ腫の危険因子になる。","tg":[],"mt":["complement"]},{"id":"vasc-9dea633d","f":"vasc","u":51,"o":254,"lv":2,"q":"24時間以上続く蕁麻疹様の皮疹（色素沈着を残す）、関節痛、低補体、抗C1q 抗体陽性。最も考えられるのはどれか。","ch":["慢性蕁麻疹（特発性）","低補体性蕁麻疹様血管炎","成人スチル病（サーモン疹）","遺伝性血管性浮腫（C1-INH）"],"a":1,"cx":["ふつうの蕁麻疹は24時間以内に消え、色素沈着を残さず、補体は正常。","","成人スチル病の皮疹は発熱とともに出て消えるサーモンピンク疹で、低補体はない。","遺伝性血管性浮腫は痒みのない深い浮腫で、蕁麻疹は出ない（C4 低値・C1 インヒビター低下）。"],"core":"蕁麻疹様血管炎＝24時間以上続く・痛み/灼熱感・紫斑や色素沈着を残す。低補体型（HUVS：抗C1q 抗体）は SLE（systemic lupus erythematosus：全身性エリテマトーデス） との関連・COPD・ぶどう膜炎・腎炎を伴う。皮膚生検で白血球破砕性血管炎。","e":"治療：抗ヒスタミン薬は効きにくい。ダプソン（レクチゾール）・コルヒチン・ヒドロキシクロロキン、重ければステロイド・免疫抑制薬。\n低補体性蕁麻疹様血管炎の一部は SLE に移行する。\n抗C1q 抗体はループス腎炎とも関連する。","tg":[],"mt":["complement"]},{"id":"vasc-5e1a0483","f":"vasc","u":51,"o":255,"lv":2,"q":"若い喫煙男性で、四肢末端の虚血（指の潰瘍・間欠性跛行）と遊走性の静脈炎がある。動脈硬化の危険因子は喫煙だけ。最も考えられるのはどれか。","ch":["バージャー病","結節性多発動脈炎","巨細胞性動脈炎","閉塞性動脈硬化症"],"a":0,"cx":["","PAN（polyarteritis nodosa：結節性多発動脈炎） でも指の虚血は起こるが、遊走性静脈炎・喫煙との強い関係は典型的でない。","巨細胞性動脈炎は50歳以上の頭部の動脈・大動脈。","閉塞性動脈硬化症は高齢・多くの動脈硬化の危険因子で、太い動脈に起こる。"],"core":"バージャー病＝若い喫煙男性の四肢の中小動脈・静脈の炎症性閉塞。禁煙が唯一の根本治療（続けると切断）。","e":"血管造影：末梢の動脈のなだらかな閉塞と、コルク栓抜き様の側副血行路。\n治療：完全な禁煙（受動喫煙・ニコチン製剤も避ける）、抗血小板薬・プロスタグランジン製剤、血行再建は難しいことが多い。\n国の指定難病。","tg":[]},{"id":"oth-c4383b83","f":"oth","u":52,"o":256,"lv":1,"q":"ベーチェット病の主症状（国内の診断基準）に含まれないものはどれか。","ch":["眼のぶどう膜炎","腸管の潰瘍","皮膚症状（結節性紅斑様皮疹・毛嚢炎様皮疹など）","口腔粘膜の再発性アフタ性潰瘍"],"a":1,"cx":["眼症状（ぶどう膜炎）は主症状で、失明の原因になる。","","皮膚症状は主症状。針反応（パテルギー）も参考になる。","口腔内アフタは最も多く、ほぼ全員に出る主症状。"],"core":"主症状＝口腔アフタ・皮膚症状・眼症状（ぶどう膜炎）・外陰部潰瘍の4つ。腸管・血管・神経は「特殊病型」（副症状）。","e":"副症状：関節炎（変形しない）、精巣上体炎、消化器病変（回盲部の深い潰瘍）、血管病変（静脈血栓・動脈瘤）、中枢神経病変。\n完全型（主症状4つ）・不全型・疑い に分ける。HLA（human leukocyte antigen：ヒト白血球抗原）-B51（日本人の患者で約5〜6割）、HLA-A26。\n腸管型（回盲部の打ち抜き潰瘍・穿孔）、血管型（深部静脈血栓・肺動脈瘤）、神経型（急性型：髄膜脳炎・脳幹病変、慢性進行型：認知機能低下・人格変化、髄液 IL-6（interleukin-6：インターロイキン6） が高い）は命に関わる。","tg":["gl"],"mt":["behcet"]},{"id":"oth-69b8d6da","f":"oth","u":52,"o":257,"lv":2,"q":"ベーチェット病の症状と治療薬の組み合わせで正しいものはどれか。","ch":["口腔潰瘍 ― アプレミラスト（オテズラ）","神経ベーチェット病 ― シクロスポリン（ネオーラル）を第一選択","腸管ベーチェット病 ― IL-17（interleukin-17：インターロイキン17） 阻害薬","網膜ぶどう膜炎（難治） ― アスピリン単独"],"a":0,"cx":["","シクロスポリンは眼病変に使うが、神経ベーチェット病を誘発・悪化させるので神経型では避ける。","腸管型にはアダリムマブ（ヒュミラ）・インフリキシマブ（国内で適応）。IL-17 阻害薬は腸炎を悪化させうる。","網膜ぶどう膜炎にはコルヒチン・シクロスポリン、難治にはインフリキシマブ（レミケード）・アダリムマブ（抗 TNF（tumor necrosis factor：腫瘍壊死因子） 抗体）。アスピリンは効かない。"],"core":"口腔潰瘍＝アプレミラスト・コルヒチン・外用ステロイド。眼＝コルヒチン・シクロスポリン→抗TNF（tumor necrosis factor：腫瘍壊死因子）抗体。腸管・血管・神経＝ステロイド＋抗TNF抗体（神経の慢性進行型は MTX（methotrexate：メトトレキサート））。シクロスポリンは神経型を起こす。","e":"・粘膜皮膚症状：外用ステロイド、コルヒチン（とくに結節性紅斑・関節炎）、アプレミラスト（2019年に国内で「口腔潰瘍」に適応）。\n・眼：発作の予防にコルヒチン、シクロスポリン。重いもの・難治はインフリキシマブ（最も早く承認された）・アダリムマブ。発作時はステロイドの点眼・局所注射。\n・腸管型：5-ASA、ステロイド、アダリムマブ（ヒュミラ）・インフリキシマブ。\n・血管型：ステロイド＋免疫抑制薬（シクロホスファミド（エンドキサン）・アザチオプリン）、抗TNF抗体。\n・神経型：急性型はステロイド大量、慢性進行型は MTX 少量。インフリキシマブも。\nコルヒチンの注意：下痢、骨髄抑制、CYP3A4（cytochrome P450 3A4：薬物代謝酵素） 阻害薬・腎機能障害で中毒。男性・女性とも妊娠への影響は少ないとされ、FMF（familial Mediterranean fever：家族性地中海熱） では妊娠中も続ける。","tg":[],"mt":["behcet"]},{"id":"oth-f1337cf9","f":"oth","u":52,"o":258,"lv":2,"q":"腸管ベーチェット病の典型的な潰瘍はどれか。","ch":["回盲部の深い打ち抜き潰瘍","直腸から連続するびまん性の潰瘍","胃の前庭部の毛細血管拡張","縦走潰瘍と敷石像が全消化管に飛び飛びに"],"a":0,"cx":["","直腸から連続するびまん性の病変は潰瘍性大腸炎。","胃前庭部毛細血管拡張症（GAVE（gastric antral vascular ectasia：胃前庭部毛細血管拡張症））は全身性強皮症などで起こる。","縦走潰瘍・敷石像はクローン病（肉芽腫を伴う）。"],"core":"腸管ベーチェット＝回盲部の大きく深い円形〜類円形の打ち抜き潰瘍（穿孔・出血しやすい）。治療は 5-ASA・ステロイド・抗 TNF（tumor necrosis factor：腫瘍壊死因子） 抗体（アダリムマブ（ヒュミラ）・インフリキシマブ）。","e":"口腔内アフタなどの主症状がそろわない「単純性潰瘍」も同じような回盲部潰瘍をつくる。\n穿孔・大出血・狭窄では手術が必要だが、術後の吻合部の再発が多い。\n腸管型・血管型・神経型は特殊病型として、国の指定難病の重症度でも重く扱われる。","tg":[],"mt":["behcet"]},{"id":"oth-4572513b","f":"oth","u":52,"o":259,"lv":3,"q":"29歳の男性。年に何回も口内炎ができる。最近、陰嚢の痛い潰瘍、下腿の痛い赤いしこり、採血した所が膿をもつようになった。昨日から右眼が見えにくく、眼科で前房蓄膿と網膜血管炎を指摘された。眼病変の治療として最も適切なのはどれか。","ch":["抗菌薬の点眼だけで治療する","NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） の点眼だけで治療する","コルヒチン・シクロスポリン→抗TNF（tumor necrosis factor：腫瘍壊死因子）","自然に治るので経過観察する"],"a":2,"cx":["前房蓄膿は感染ではなく炎症（無菌性）による。抗菌薬は効かない。","網膜血管炎は失明の原因で、NSAIDs の点眼では抑えられない。","","網膜の発作をくり返すと視力が落ちていく。放置はできない。"],"core":"ベーチェット病（口腔アフタ・陰部潰瘍・結節性紅斑・針反応・眼）＝完全型。網膜ぶどう膜炎は発作の予防が大切：コルヒチン→シクロスポリン（ネオーラル）→インフリキシマブ（レミケード）・アダリムマブ。発作時はステロイドの局所治療。","e":"眼の発作の頻度を減らすことが視力を守る。重い眼病変では早めにインフリキシマブを使う。\nシクロスポリンを使っている人に神経症状（頭痛・発熱・意識障害・麻痺）が出たら、神経ベーチェット病を疑い中止して MRI（magnetic resonance imaging）・髄液を調べる。\n針反応（パテルギー）：針を刺した所が24〜48時間後に赤く膿をもつ。","tg":["cs"],"mt":["behcet"]},{"id":"oth-6c39ec3a","f":"oth","u":53,"o":260,"lv":3,"q":"28歳の女性。2週間前から夕方に 39℃台の発熱があり、熱が出るときに体幹にサーモンピンクの皮疹が出て、熱が下がると消える。咽頭痛と両手首・膝の痛みがある。白血球 18,000/μL（好中球 88%）、AST・ALT 上昇、フェリチン 12,000 ng/mL。RF（rheumatoid factor：リウマトイド因子）・抗核抗体は陰性。血液培養は陰性。診断を確定する前に特に除外しなければならないものはどれか。","ch":["変形性関節症（膝・手）","線維筋痛症（慢性疼痛）","感染症と悪性リンパ腫","骨粗鬆症（脆弱性骨折）"],"a":2,"cx":["変形性関節症は高熱・白血球増加・フェリチン著増を説明できない。","線維筋痛症は発熱・炎症反応の上昇を起こさない。","","骨粗鬆症は発熱・皮疹を起こさない。"],"core":"成人スチル病＝除外診断。山口の基準：大項目（39℃以上の発熱1週以上・関節痛2週以上・定型的皮疹・白血球1万以上で好中球80%以上）、小項目（咽頭痛・リンパ節/脾腫・肝機能障害・RF と ANA（antinuclear antibody：抗核抗体） 陰性）。感染・悪性腫瘍・膠原病を除外する。","e":"山口の分類基準：大項目2つ以上を含む合計5項目以上で、除外項目（感染症・悪性腫瘍・他の膠原病）がないこと。\nフェリチン著増（基準値の5倍以上）は大事な手がかりで、糖鎖化フェリチンの割合が低い（20%未満）と特異度が高い。\n悪性リンパ腫は同じような発熱・皮疹・フェリチン高値・LDH 高値を起こすので、リンパ節生検・骨髄検査・PET（positron emission tomography）-CT を考える。\n合併症：マクロファージ活性化症候群（MAS（macrophage activation syndrome：マクロファージ活性化症候群）：血球減少・フェリチンのさらなる上昇・中性脂肪↑・フィブリノゲン↓・肝障害・凝固異常）、DIC（disseminated intravascular coagulation：播種性血管内凝固）、心膜炎・心筋炎。","tg":["ae","cs"],"mt":["fever"]},{"id":"oth-24ad06b9","f":"oth","u":53,"o":261,"lv":2,"q":"成人スチル病の治療について正しいものはどれか。","ch":["治療しなくても全員が数日で治る","GC（glucocorticoid：グルココルチコイド） が基本、難治は IL-6（interleukin-6：インターロイキン6）・IL-1（interleukin-1：インターロイキン1）β 阻害","抗菌薬の長期投与が必要である","NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） だけで全員が治る"],"a":1,"cx":["自然に治る例もあるが、多くは治療が必要で、MAS（macrophage activation syndrome：マクロファージ活性化症候群） など重い合併症もある。","","感染症ではない。","NSAIDs だけで治まるのは一部の軽症。多くはステロイドが必要。"],"core":"AOSD（adult-onset Still disease：成人発症スチル病）＝プレドニゾロン（プレドニン） 0.5〜1 mg/kg/日（重症はパルス）→ステロイドを減らすため MTX（methotrexate：メトトレキサート）・シクロスポリン、生物学的製剤（IL-6：トシリズマブ（アクテムラ）、IL-1β：カナキヌマブ（イラリス））。MAS（macrophage activation syndrome：マクロファージ活性化症候群） は緊急。","e":"病型：単周期性（一度で治まる）・多周期性（再燃をくり返す）・慢性関節型（RA（rheumatoid arthritis：関節リウマチ） のような関節破壊）。\nIL-1 と IL-18 が病態の中心で、IL-18 が著しく高いことも特徴（国内で測れる施設は限られる）。\nMAS の治療：ステロイドパルス、シクロスポリン（ネオーラル）、IVIG（intravenous immunoglobulin：免疫グロブリン大量静注療法）、重症例はエトポシド（ベプシド、ラステット）など。\nトシリズマブ使用中は CRP（C-reactive protein：C反応性タンパク）・発熱が隠れるので、MAS や感染症の評価にはフェリチン・血球数・肝機能を使う（トシリズマブ投与中の MAS の報告もある）。","tg":[],"mt":["fever"]},{"id":"oth-ab66f884","f":"oth","u":53,"o":262,"lv":3,"q":"30歳の女性。成人スチル病でプレドニゾロン（プレドニン） 40 mg/日を使用中。発熱が続き、この3日で血小板 25万→6万/μL、フェリチン 8,000→56,000 ng/mL、フィブリノゲン 120 mg/dL、中性脂肪 420 mg/dL、AST・ALT 上昇。最も適切な対応はどれか。","ch":["ステロイドを 20 mg/日に減らす","MAS（macrophage activation syndrome：マクロファージ活性化症候群） としてパルスとシクロスポリン（ネオーラル）","鉄剤を静注で補う","血小板輸血だけを行う"],"a":1,"cx":["悪化している状態で減量するのは誤り。","","フェリチンの上昇は炎症で、鉄欠乏ではない。鉄剤は不要。","血小板輸血は原因の治療にならない（出血があれば考える）。"],"core":"MAS（反応性血球貪食症候群）＝血球減少・フェリチン著増・フィブリノゲン↓・中性脂肪↑・肝障害・LDH↑。成人スチル病の命に関わる合併症。パルス＋シクロスポリン（＋IVIG（intravenous immunoglobulin：免疫グロブリン大量静注療法））、重症でエトポシド（ベプシド、ラステット）。","e":"骨髄で血球貪食像が見つかることがあるが、早期には見えないこともあり、待たずに治療する。\nウイルス感染（EBV（Epstein-Barr virus）・CMV（cytomegalovirus：サイトメガロウイルス））や薬が誘因のことがあり、同時に調べる。\nトシリズマブ（アクテムラ）の使用中は症状が隠れやすく、血球・フェリチン・肝機能の変化で早く気づく。","tg":["cs"],"mt":["fever"]},{"id":"oth-5f9d5565","f":"oth","u":54,"o":263,"lv":2,"q":"リウマチ性多発筋痛症（PMR（polymyalgia rheumatica：リウマチ性多発筋痛症））について正しいものはどれか。","ch":["CK（creatine kinase：クレアチンキナーゼ） が著明に上がるのが特徴である","ステロイドは 1 mg/kg/日の大量が必要","若い女性に多く、筋生検で炎症が見つかる","50歳以上、少量 PSL（prednisolone：プレドニゾロン） が著効、GCA（giant cell arteritis：巨細胞性動脈炎） を確認"],"a":3,"cx":["CK は正常。CK が上がれば筋炎・甲状腺機能低下症・スタチンなどを考える。","少量で数日のうちに劇的に良くなるのが特徴。大量が必要なら巨細胞性動脈炎の合併を考える。","PMR は50歳以上（多くは70歳前後）の病気で、筋そのものに炎症はない（滑液包炎・滑膜炎）。",""],"core":"PMR＝50歳以上・両肩/腰帯の痛み・朝のこわばり45分以上・赤沈/CRP（C-reactive protein：C反応性タンパク）↑・CK 正常・少量 PSL で劇的改善。エコーで三角筋下滑液包炎・上腕二頭筋腱鞘炎。GCA の合併を必ず確認。","e":"2012 EULAR（European Alliance of Associations for Rheumatology：欧州リウマチ学会）/ACR（American College of Rheumatology：米国リウマチ学会） の暫定分類基準（50歳以上・両肩の痛み・CRP/赤沈の異常が前提）：朝のこわばり45分超（2点）、股関節の痛み・可動域制限（1点）、RF（rheumatoid factor：リウマトイド因子）・ACPA（anti-citrullinated protein antibody：抗シトルリン化タンパク抗体） 陰性（2点）、ほかの関節の症状がない（1点）で、エコーなしなら4点以上。エコー所見を加えた方式もある。\n治療：プレドニゾロン（プレドニン） 12.5〜25 mg/日で始め、ゆっくり（1〜2年かけて）減らす。再燃が多い。ステロイドを減らすために MTX（methotrexate：メトトレキサート） を併用することがある。\n鑑別：高齢発症 RA（rheumatoid arthritis：関節リウマチ）、RS3PE（remitting seronegative symmetrical synovitis with pitting edema）、偽痛風、悪性腫瘍（多発性骨髄腫など）、感染性心内膜炎、甲状腺機能低下症、パーキンソン病。\nサリルマブ（ケブザラ）は海外で PMR に承認されているが、国内では未承認（2026年10月時点、学会が要望中）。","tg":[],"mt":["elderly"]},{"id":"oth-ca58b2bf","f":"oth","u":54,"o":264,"lv":2,"q":"RS3PE（remitting seronegative symmetrical synovitis with pitting edema） 症候群の特徴はどれか。","ch":["手背・足背の圧痕性浮腫を伴う滑膜炎","RF（rheumatoid factor：リウマトイド因子）・ACPA（anti-citrullinated protein antibody：抗シトルリン化タンパク抗体） 高力価で骨びらんを伴う関節炎","若い女性の慢性の DIP（distal interphalangeal：遠位指節間） 関節炎","片側の膝の化膿性関節炎"],"a":0,"cx":["","RF・ACPA 陽性で骨びらんがあれば RA（rheumatoid arthritis：関節リウマチ）。","DIP 関節炎は変形性関節症・乾癬性関節炎。","RS3PE は両側・対称性で、感染症ではない。"],"core":"RS3PE＝remitting（寛解する）・seronegative（血清反応陰性）・symmetrical synovitis（対称性滑膜炎）・pitting edema（圧痕性浮腫）。高齢男性に多く、VEGF が高い。癌（胃・大腸・前立腺・血液）を探す。","e":"手の腱鞘滑膜炎とむくみで「グローブのような手」になる。プレドニゾロン（プレドニン） 10〜15 mg/日程度で速やかに良くなり、関節破壊は残さない。\nステロイドの効きが悪いとき・再燃をくり返すときは、腫瘍随伴症候群として悪性腫瘍をさらに探す。\nPMR（polymyalgia rheumatica：リウマチ性多発筋痛症） と同じ人に起こることもある。","tg":[],"mt":["elderly"]},{"id":"oth-b9ef6c9e","f":"oth","u":54,"o":265,"lv":3,"q":"74歳の女性。リウマチ性多発筋痛症でプレドニゾロン（プレドニン） 15 mg/日から始め、1年で 5 mg/日まで減らしたところ、再び両肩のこわばりと CRP（C-reactive protein：C反応性タンパク） の上昇が出た。頭痛・視力障害・顎跛行はない。対応として最も適切なのはどれか。","ch":["プレドニゾロン 60 mg/日に増やす","ステロイドを急に中止する","NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） だけに切り替える","再燃前の量に戻し、MTX（methotrexate：メトトレキサート） の併用を考える"],"a":3,"cx":["PMR（polymyalgia rheumatica：リウマチ性多発筋痛症） の再燃に大量は不要。大量が必要になるのは巨細胞性動脈炎の合併があるとき。","急な中止は副腎不全と再燃を起こす。","NSAIDs だけで PMR（polymyalgia rheumatica：リウマチ性多発筋痛症） を抑えることはふつう難しい。",""],"core":"PMR（polymyalgia rheumatica：リウマチ性多発筋痛症） の再燃＝再燃前の量（一つ前の段階）に戻して4〜8週後にまたゆっくり減らす。再燃をくり返す・ステロイドの副作用が心配な人は MTX を併用（ステロイド減量効果）。","e":"PMR は再燃が多く、治療期間は1〜2年以上になることが多い。\n減量の目安：最初の4〜8週で 10 mg/日まで、その後は 4〜8週ごとに 1 mg ずつなど、ゆっくり。\n再燃のたびに巨細胞性動脈炎の症状（頭痛・顎跛行・視力障害）と大型血管の炎症（PET（positron emission tomography））を確認する。\nGIOP（glucocorticoid-induced osteoporosis：グルココルチコイド誘発性骨粗鬆症） の予防（高齢なので年齢だけで4点）を忘れない。","tg":["ae","cs"],"mt":["elderly"]},{"id":"oth-c8afcfcd","f":"oth","u":55,"o":266,"lv":2,"q":"家族性地中海熱（FMF（familial Mediterranean fever：家族性地中海熱））について正しいものはどれか。","ch":["半日〜3日の発熱発作、コルヒチンが第一選択","発熱の発作は2週間以上続くのがふつう","ステロイドが発作に最もよく効く","コルヒチンが効かないときの選択肢はない"],"a":0,"cx":["","2週間以上続く発熱発作は TRAPS（TNF receptor-associated periodic syndrome：TNF受容体関連周期性症候群） などを考える。FMF は半日〜3日。","ステロイドは FMF の発作にあまり効かない。","コルヒチンが効かない・使えないときは、カナキヌマブ（イラリス）が国内で使える。"],"core":"FMF＝MEFV（パイリン）→IL-1（interleukin-1：インターロイキン1）β 過剰。12〜72時間の発熱＋漿膜炎（腹痛・胸痛）・関節炎・丹毒様紅斑。コルヒチン（1日 0.5〜1 mg から）を一生続ける。無効なら抗IL-1（カナキヌマブ（イラリス））。","e":"日本では発作の症状がそろわない「非典型例」も多い（エクソン10以外の変異など）。\nコルヒチンは発作を減らすだけでなく、AA アミロイドーシス（腎）を防ぐ。妊娠中も続ける。\nほかの自己炎症性疾患：\n・TRAPS（TNFRSF1A）：1週間以上の発熱、移動性の筋痛と紅斑、眼窩周囲の浮腫。ステロイド・エタネルセプト・カナキヌマブ。\n・CAPS（NLRP3）：寒冷で出る蕁麻疹様皮疹、感音難聴、髄膜炎（重症型 CINCA/NOMID）。カナキヌマブ。\n・高IgD 症候群（メバロン酸キナーゼ欠損症）：乳児期からの発熱、頸部リンパ節腫脹。カナキヌマブ。\n・PFAPA（小児）：周期性発熱・アフタ性口内炎・咽頭炎・頸部リンパ節炎。ステロイド1回でよく効く。","tg":[],"mt":["fever"]},{"id":"oth-08b2dc13","f":"oth","u":55,"o":267,"lv":2,"q":"自己炎症性疾患と、原因遺伝子・特徴の組み合わせで正しいものはどれか。","ch":["CAPS ― NLRP3 ― 寒冷で皮疹と難聴","PFAPA ― NLRP3 ― 成人の難聴","FMF（familial Mediterranean fever：家族性地中海熱） ― TNFRSF1A ― 1か月続く発熱","TRAPS（TNF receptor-associated periodic syndrome：TNF受容体関連周期性症候群） ― MEFV（Mediterranean fever 遺伝子） ― 12〜72時間の発熱"],"a":0,"cx":["","PFAPA は小児の周期性発熱（アフタ・咽頭炎・頸部リンパ節炎）で、原因遺伝子は特定されていない。","FMF の原因は MEFV（Mediterranean fever 遺伝子） で、発作は半日〜3日。","TRAPS の原因は TNFRSF1A で、1週間以上続く発熱と移動性の筋痛が特徴。MEFV は家族性地中海熱。"],"core":"FMF＝MEFV（12〜72時間）、TRAPS＝TNFRSF1A（1週以上・筋痛と紅斑）、CAPS＝NLRP3（寒冷・蕁麻疹様・難聴・髄膜炎）、高IgD 症候群＝MVK（乳児期・リンパ節）。抗IL-1（interleukin-1：インターロイキン1） のカナキヌマブ（イラリス）が共通の切り札。","e":"自己炎症性疾患は「自然免疫の異常」で、自己抗体や自己反応性の T 細胞は主役でない。\nくり返す発熱の鑑別：感染症（膿瘍・結核・感染性心内膜炎）、悪性腫瘍（リンパ腫）、薬剤熱、周期性好中球減少症、成人スチル病。\n長期の炎症は AA アミロイドーシスを起こすので、発作のない時期の CRP（C-reactive protein：C反応性タンパク）・SAA（serum amyloid A：血清アミロイドA） も見る。","tg":[],"mt":["fever"]},{"id":"oth-3f2034b4","f":"oth","u":55,"o":268,"lv":3,"q":"26歳の女性。10代から、月に1回ほど 39℃の発熱と強い腹痛が出て、2日ほどで自然に治る。発作中は CRP（C-reactive protein：C反応性タンパク） が 15 mg/dL まで上がり、発作のない時期は正常。腹部 CT は発作時に少量の腹水のみ。父も同じような症状がある。最初の治療として最も適切なのはどれか。","ch":["発作のたびの抗菌薬","コルヒチンの毎日の内服","プレドニゾロン（プレドニン）の長期内服","診断のための開腹手術"],"a":1,"cx":["感染症ではないので、抗菌薬は発作を防がない。","","ステロイドは FMF（familial Mediterranean fever：家族性地中海熱） の発作にあまり効かず、長期の副作用が大きい。","自然に治る腹膜炎の発作で、開腹は不要（不要な開腹手術を受けている人もいる）。"],"core":"半日〜3日の発熱＋漿膜炎（腹膜炎）をくり返す・家族歴＝家族性地中海熱。コルヒチン（0.5〜1 mg/日）を毎日続ける。MEFV（Mediterranean fever 遺伝子） の遺伝子検査は診断の補助。","e":"コルヒチンで発作が減ることも診断の手がかり（治療的診断）。\nコルヒチンが効かない（量を増やしても発作が続く）・副作用で使えない場合はカナキヌマブ（イラリス）。\n妊娠中もコルヒチンは続ける。AA アミロイドーシス（腎）の予防のため、発作のない時期の CRP・SAA（serum amyloid A：血清アミロイドA） を確認する。","tg":["cs"],"mt":["fever"]},{"id":"oth-923ef4f0","f":"oth","u":56,"o":269,"lv":2,"q":"再発性多発軟骨炎で、予後を左右し、注意が必要な病変はどれか。","ch":["鼻の軟骨炎（鞍鼻）","耳介の軟骨炎（耳たぶを除く）","気道の軟骨炎（気道狭窄）","非びらん性の関節炎"],"a":2,"cx":["鞍鼻は見た目の変化で、命には直接関わらない。","耳介軟骨炎は最も多い症状だが、命には関わらない（軟骨のない耳たぶは侵されない）。","","関節炎は非びらん性で、予後への影響は小さい。"],"core":"再発性多発軟骨炎＝耳介（耳たぶを除く）・鼻・気道の軟骨炎、眼の炎症、大動脈弁閉鎖不全。気道病変が死因になる（呼気 CT・呼吸機能で評価）。","e":"治療：ステロイド、効果不十分なら MTX（methotrexate：メトトレキサート）・アザチオプリン・シクロホスファミドや生物学的製剤（TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬・トシリズマブなど、保険適用外）。気道狭窄にはステントや気管切開。\nほかの合併：骨髄異形成症候群（MDS）。高齢男性で、大球性貧血・発熱・皮疹・肺の浸潤影・再発性多発軟骨炎様の症状があれば、VEXAS 症候群を考える。","tg":[]},{"id":"oth-08354a9c","f":"oth","u":56,"o":270,"lv":2,"q":"VEXAS 症候群について正しいものはどれか。","ch":["ステロイドがまったく効かない","若い女性に多い先天性の病気である","高齢男性・UBA1 の体細胞変異で起こる","抗核抗体の高力価陽性が特徴である"],"a":2,"cx":["ステロイドはよく効くが、減らすと再燃し、大量が必要になりやすい（ステロイド依存）。","X 染色体にある UBA1 の、生まれた後に骨髄で起こる変異（体細胞変異）で、高齢男性に多い。","","自己抗体は特徴的ではない。"],"core":"VEXAS＝Vacuoles・E1 enzyme・X-linked・Autoinflammatory・Somatic。高齢男性の「再発性多発軟骨炎・皮膚の好中球性皮膚症・肺浸潤・血栓・大球性貧血・MDS」。","e":"2020年に報告された比較的新しい病気。ステロイド依存性で、JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬（ルキソリチニブ（ジャカビ））や造血幹細胞移植が試みられている。\n手がかり：高齢男性、原因不明の発熱、大球性貧血・血小板減少、再発性多発軟骨炎・Sweet 病様皮疹・血管炎、静脈血栓、骨髄の骨髄系・赤芽球系前駆細胞の細胞質の空胞。","tg":[]},{"id":"oth-dd454dc6","f":"oth","u":56,"o":271,"lv":2,"q":"線維筋痛症の治療として、国内で適応があり勧められるものはどれか。","ch":["NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） を大量に長期投与する","運動療法＋プレガバリン（リリカ）・デュロキセチン","強オピオイドを長期に投与する","プレドニゾロン（プレドニン）を長期に投与する"],"a":1,"cx":["NSAIDs は効果が乏しく、長期大量は副作用が多い。","","強オピオイドは効果が乏しく、依存・痛覚過敏の害が大きい。","線維筋痛症は炎症の病気ではなく、ステロイドは効かない。"],"core":"線維筋痛症＝全身の慢性の痛み・疲労・睡眠障害・認知の症状。炎症反応は正常。治療は教育・運動・睡眠の改善＋プレガバリン・デュロキセチン。","e":"2016年改訂の基準：広範な痛みの指数（WPI：19部位）と症状の重症度（SSS：疲労・起床時の不快感・認知の症状など）で判断し、症状が3か月以上続く。圧痛点（18か所）は2010年以降の基準では必須ではない。\n関節リウマチ・SLE（systemic lupus erythematosus：全身性エリテマトーデス） などに合併すると、患者全般評価や圧痛関節数が高く出て、疾患活動性を過大評価しやすい（治療を強めすぎない）。\nミロガバリン（タリージェ）は末梢性神経障害性疼痛の薬で、線維筋痛症の適応はない。","tg":[]},{"id":"oth-d753520f","f":"oth","u":56,"o":272,"lv":3,"q":"66歳の男性。肺癌でペムブロリズマブ（抗PD-1抗体）を使用中。2週間前から両手と膝の関節が腫れて痛む。RF（rheumatoid factor：リウマトイド因子）・ACPA（anti-citrullinated protein antibody：抗シトルリン化タンパク抗体） 陰性。癌の治療は効いている。対応として最も適切なのはどれか。","ch":["癌の骨転移として放射線治療を行う","irAE として重症度に応じ NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）・GC（glucocorticoid：グルココルチコイド） で治療","RA（rheumatoid arthritis：関節リウマチ） として MTX（methotrexate：メトトレキサート） と TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬を始め ICI は中止","治療の必要はなく、そのまま様子を見る"],"a":1,"cx":["多関節の滑膜炎は骨転移では説明しにくい。","","irAE の関節炎は、まず NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） やステロイドで治療する。難治なら csDMARD（conventional synthetic DMARD：従来型合成抗リウマチ薬）・生物学的製剤を考えるが、癌の治療を自己判断で止めない。","痛みと腫れで生活に支障があり、治療が必要。"],"core":"免疫チェックポイント阻害薬の irAE＝関節炎・PMR（polymyalgia rheumatica：リウマチ性多発筋痛症） 様・筋炎（心筋炎・重症筋無力症の合併に注意：トロポニン・CK（creatine kinase：クレアチンキナーゼ））・シッカ症候群。重症度に応じてステロイド、腫瘍内科と連携。","e":"irAE の筋炎は、心筋炎と重症筋無力症（眼瞼下垂・複視・嚥下障害・呼吸筋麻痺）を合併すると致死的になることがあり、すぐに CK・トロポニン・心電図・抗AChR 抗体を調べて、大量ステロイドで治療する。\n関節炎は、ステロイドを減らすと再燃して長く続くことがあり、MTX・IL-6（interleukin-6：インターロイキン6） 阻害薬・TNF 阻害薬を使うこともある。\nもともと膠原病がある人に免疫チェックポイント阻害薬を使うと、持病の悪化（再燃）が起こりやすい。","tg":["cs"]},{"id":"oth-706474ca","f":"oth","u":56,"o":273,"lv":2,"q":"サルコイドーシスの急性型で、両側肺門リンパ節腫脹・結節性紅斑・足関節周囲の関節炎（発熱）がそろうものはどれか。","ch":["Heerfordt 症候群","Caplan 症候群","Felty 症候群","Löfgren 症候群"],"a":3,"cx":["Heerfordt 症候群はぶどう膜炎・耳下腺腫脹・顔面神経麻痺・発熱（ぶどう膜耳下腺熱）。","Ca
