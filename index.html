斑、頸部リンパ節の腫れ、肝機能障害、好酸球増加が出た。薬を止めても悪化している。最も考えられる病態と対応はどれか。","ch":["光線過敏症：日焼け止めだけで様子を見る","関節リウマチの悪化：MTX（methotrexate：メトトレキサート） を追加する","溶連菌感染症：ペニシリン系を使う","DIHS：原因薬の中止と全身ステロイド"],"a":3,"cx":["全身の症状を伴い、日焼け止めだけでは不十分。","発熱・皮疹・好酸球・肝障害の組み合わせは RA（rheumatoid arthritis：関節リウマチ） の悪化では説明できない。","抗菌薬（とくにペニシリン系）は DIHS の皮疹を悪化させることがあり、感染の根拠なく使わない。",""],"core":"DIHS（薬剤性過敏症症候群）＝開始2〜6週後・発熱・広い紅斑・リンパ節腫脹・好酸球↑・肝障害・HHV-6 の再活性化。中止後も悪化しうる。治療は中止＋ステロイド。","e":"原因になりやすい薬：サラゾスルファピリジン、アロプリノール（ザイロリック）、カルバマゼピン・フェニトイン・ラモトリギン、ダプソン（レクチゾール）、メキシレチン、ミノサイクリン（ミノマイシン）。\nステロイドは急に減らすと再燃し、CMV（cytomegalovirus：サイトメガロウイルス） などの再活性化も起こるので、ゆっくり減らす。\n回復後に甲状腺炎・1型糖尿病などの自己免疫疾患が起こることがある。","tg":["ae","cs"]},{"id":"ratx-b16f8477","f":"ratx","u":12,"o":76,"lv":3,"q":"58歳の女性。関節リウマチでタクロリムス（プログラフ） 3 mg/日を内服中。肺炎でクラリスロマイシン（クラリス）が処方されて5日後、手のふるえとクレアチニンの上昇（0.8→1.9 mg/dL）、高カリウム血症が出た。最も考えられる原因はどれか。","ch":["タクロリムスの効果が落ちたことによる RA（rheumatoid arthritis：関節リウマチ） の悪化","肺炎による甲状腺機能亢進症","CYP3A4（cytochrome P450 3A4：薬物代謝酵素） 阻害によるタクロリムス濃度の上昇","クラリスロマイシンによる低カリウム血症"],"a":2,"cx":["RA の悪化では手のふるえ・急な腎機能低下は説明できない。","甲状腺機能亢進を示す所見はない。","","カリウムは上がっている（タクロリムスの腎毒性・低アルドステロン）。"],"core":"タクロリムス・シクロスポリン＝CYP3A4 で代謝。マクロライド・アゾール系・カルシウム拮抗薬（一部）・グレープフルーツで濃度↑→腎障害・振戦・高K・高血糖。リファンピシン（リファジン）・抗てんかん薬で濃度↓。","e":"対応：タクロリムスを休薬・減量し、トラフ濃度を測る。抗菌薬は相互作用の少ないもの（アジスロマイシン（ジスロマック）は比較的少ない、β-ラクタム系など）を選ぶ。\nカルシニューリン阻害薬の腎障害は、輸入細動脈の収縮による機能的なもの（量に依存し、減らすと戻る）と、長期の慢性的な線維化がある。","tg":["cs"]},{"id":"bio-75a0d9ac","f":"bio","u":13,"o":77,"lv":1,"q":"インフリキシマブ（レミケード）を関節リウマチに使うときの条件として正しいものはどれか。","ch":["MTX（methotrexate：メトトレキサート） を併用するとかえって効果が落ちる","MTX（methotrexate：メトトレキサート） と併用しなければならない","心不全（NYHA（New York Heart Association：心不全の重症度分類） III〜IV）の患者に第一選択で使う","皮下注射で2週ごとに投与する"],"a":1,"cx":["MTX はキメラ抗体に対する抗薬物抗体を減らし、効果と安全性を保つ。","","TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬は中等度以上の心不全を悪化させるので禁忌。","インフリキシマブは点滴静注（0・2・6週、以後8週ごと）。"],"core":"インフリキシマブ＝キメラ型の抗TNF（tumor necrosis factor：腫瘍壊死因子）抗体・点滴（3 mg/kg、0・2・6週→8週ごと）・RA（rheumatoid arthritis：関節リウマチ） では MTX 併用が必須（抗薬物抗体と投与時反応を減らす）。","e":"効果が不十分なら、量を最大10 mg/kg まで増やすか、間隔を4週まで短くできる（6 mg/kg のとき）。\n投与時反応（infusion reaction）：発熱・悪寒・蕁麻疹・血圧低下。抗薬物抗体ができると起こりやすい。前投薬（抗ヒスタミン薬・アセトアミノフェン・ステロイド）や投与速度で対応する。\nTNF 阻害薬に共通の注意：結核（とくに肺外・播種性）、B型肝炎の再活性化、中等度以上の心不全（NYHA III/IV）は禁忌、脱髄疾患（多発性硬化症など）は禁忌、逆説的乾癬（掌蹠膿疱症様の皮疹）、薬剤誘発性ループス（抗dsDNA（double-stranded DNA：二本鎖DNA） 抗体陽性）。","tg":["ae"],"mt":["bdmard"]},{"id":"bio-eaee4325","f":"bio","u":13,"o":78,"lv":2,"q":"TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬とその特徴の組み合わせで正しいものはどれか。","ch":["セルトリズマブペゴル（シムジア） ― Fc がなく胎盤を通りにくい","アダリムマブ（ヒュミラ） ― 4週ごとに点滴で静注する","ゴリムマブ（シンポニー） ― 錠剤を毎日1回内服する","エタネルセプト（エンブレル） ― キメラ型抗体で MTX（methotrexate：メトトレキサート） 併用が必須"],"a":0,"cx":["","アダリムマブは完全ヒト型抗体で、40 mg を2週ごとに皮下注射（MTX（methotrexate：メトトレキサート） を併用しないときは 80 mg まで増量可）。","ゴリムマブは4週ごとの皮下注射（MTX（methotrexate：メトトレキサート） 併用で 50 mg、効果不十分や MTX 非併用で 100 mg）。","エタネルセプトは TNF 受容体と Fc の融合タンパク（抗体ではない）。MTX 併用は必須ではなく、単独でも使える。"],"core":"セルトリズマブペゴル＝Fab′断片＋PEG、Fc がない → 胎盤の FcRn で運ばれず、妊娠中も使いやすい。","e":"TNF 阻害薬の一覧：\n・インフリキシマブ：キメラ抗体・点滴・8週ごと・MTX 必須\n・エタネルセプト：受容体融合タンパク・皮下注・週1〜2回（10〜25 mg 週2回 または 25〜50 mg 週1回）\n・アダリムマブ：ヒト型抗体・皮下注・2週ごと 40 mg\n・ゴリムマブ：ヒト型抗体・皮下注・4週ごと 50/100 mg\n・セルトリズマブペゴル：PEG 化 Fab′・皮下注・400 mg を 0・2・4週 → 200 mg を2週ごと（安定したら 400 mg を4週ごとも可）\n・オゾラリズマブ（ナノゾラ）：ナノボディ（抗TNF×2＋抗アルブミン）・皮下注・4週ごと 30 mg\nIgG は妊娠後期に胎盤の FcRn で胎児に運ばれる。Fc をもつ抗体を妊娠後期まで使うと、出生児に薬が残るため、生後6か月まではロタウイルス・BCG などの生ワクチンを避ける。","tg":["ae"],"mt":["bdmard","preg"]},{"id":"bio-ca82c276","f":"bio","u":13,"o":79,"lv":2,"q":"TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬で起こる「逆説的反応（paradoxical reaction）」として知られるものはどれか。","ch":["関節リウマチの完全な治癒","骨密度の急な増加","血清の尿酸値の著しい低下","乾癬様の皮疹の出現"],"a":3,"cx":["TNF 阻害薬は RA（rheumatoid arthritis：関節リウマチ） を抑えるが、治す（中止しても再燃しない状態にする）わけではない。","骨密度の急な増加は起こらない（炎症が抑えられて骨量の低下が止まることはある）。","尿酸値への大きな影響はない。",""],"core":"TNF を止めると、本来は治療される乾癬・ぶどう膜炎・炎症性腸疾患・サルコイドーシスが新たに出ることがある（逆説的反応）。代表は手足の膿疱性の乾癬様皮疹。","e":"仕組み：TNF が抑えている形質細胞様樹状細胞の I 型インターフェロンが増えると考えられている。\n対応：外用治療で続けられることが多いが、重ければ TNF 阻害薬を止め、IL-17（interleukin-17：インターロイキン17）・IL-23（interleukin-23：インターロイキン23） 阻害薬などへ替える。\nほかの TNF 阻害薬の注意：薬剤誘発性ループス（抗dsDNA（double-stranded DNA：二本鎖DNA） 抗体陽性）、脱髄疾患（視神経炎・多発性硬化症様）、心不全の悪化、間質性肺疾患の悪化。","tg":["ae"]},{"id":"bio-d5e056f2","f":"bio","u":13,"o":80,"lv":2,"q":"多発性硬化症の既往がある関節リウマチ患者に「避けるべき」生物学的製剤はどれか。","ch":["アバタセプト（CTLA-4（cytotoxic T-lymphocyte-associated protein 4）-Ig）","TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬","サリルマブ（IL-6R 抗体）","トシリズマブ（IL-6R 抗体）"],"a":1,"cx":["アバタセプトは脱髄疾患の悪化の報告が少なく、選択肢になる。","","サリルマブも同じく IL-6（interleukin-6：インターロイキン6） 受容体の抗体で、脱髄疾患は禁忌ではない。","IL-6（interleukin-6：インターロイキン6） 阻害薬は脱髄疾患で禁忌ではない（視神経脊髄炎ではむしろ IL-6 阻害薬が治療薬：サトラリズマブ（エンスプリング））。"],"core":"TNF 阻害薬の禁忌：脱髄疾患（多発性硬化症）・中等度以上の心不全（NYHA（New York Heart Association：心不全の重症度分類） III/IV）・活動性結核・重い感染症。","e":"多発性硬化症に TNF を止める薬（レネルセプト）を使った試験で、むしろ悪化した。\nTNF 阻害薬の使用中に、しびれ・視力低下などの神経症状が出たら中止して MRI（magnetic resonance imaging） で調べる。\n心不全：中等度以上は禁忌、軽度でも慎重に（心不全の悪化・死亡が増えた試験がある）。","tg":["ae"],"mt":["bdmard"]},{"id":"bio-bb5ac808","f":"bio","u":14,"o":81,"lv":2,"q":"トシリズマブ（アクテムラ）使用中の患者の管理で、特に注意すべきことはどれか。","ch":["CRP（C-reactive protein：C反応性タンパク） が上がらないので感染症は起こらない","脂質が下がるので脂質の検査は不要","MTX（methotrexate：メトトレキサート） と併用しないと効果がまったくない","感染症でも CRP（C-reactive protein：C反応性タンパク）・発熱が出にくい"],"a":3,"cx":["感染症は起こる。CRP が上がらないため気づくのが遅れるのが問題。","LDL コレステロールなど脂質はむしろ上がる。定期的に測る。","IL-6（interleukin-6：インターロイキン6） 阻害薬は単独でも効果が高く、MTX が使えない人の選択肢になる。",""],"core":"IL-6（interleukin-6：インターロイキン6） 阻害中は CRP・赤沈・発熱が隠れる（感染・腸管穿孔の見逃し）。脂質↑・好中球↓・肝障害。憩室炎の既往に注意。","e":"トシリズマブ：点滴 8 mg/kg を4週ごと、または皮下注 162 mg を2週ごと（効果不十分なら1週ごとに短縮可）。サリルマブ（ケブザラ）：皮下注 200 mg を2週ごと（150 mg に減量可）。\n副作用：感染症、消化管穿孔（大腸憩室のある人で多い。腹痛があれば CT）、好中球減少、肝障害、脂質上昇。\n使える病気（トシリズマブ）：RA（rheumatoid arthritis：関節リウマチ）、若年性特発性関節炎、成人スチル病、高安動脈炎、巨細胞性動脈炎、キャッスルマン病、サイトカイン放出症候群、COVID-19 など。","tg":["ae"],"mt":["bdmard"]},{"id":"bio-6407a2ea","f":"bio","u":14,"o":82,"lv":2,"q":"アバタセプト（オレンシア）について正しいものはどれか。","ch":["細胞の中の JAK（Janus kinase：ヤヌスキナーゼ） を阻害する内服薬である","IL-6（interleukin-6：インターロイキン6） 受容体に結合して IL-6 の信号を止める","T 細胞の共刺激（CD80/86–CD28）を止める","B 細胞の CD20 に結合して B 細胞を除く"],"a":2,"cx":["JAK 阻害薬はトファシチニブ（ゼルヤンツ）などの低分子の内服薬。","IL-6 受容体はトシリズマブ（アクテムラ）・サリルマブ。","","CD20 を標的とするのはリツキシマブ（リツキサン）。国内では RA（rheumatoid arthritis：関節リウマチ） に保険適用がない。"],"core":"アバタセプト＝T 細胞活性化の入口（共刺激）を止める。感染症が比較的少なく、高齢者・合併症の多い人に選ばれやすい。","e":"投与法：点滴（体重 60 kg 未満 500 mg・60〜100 kg 750 mg・100 kg 超 1 g を 0・2・4週→以後4週ごと）、または皮下注 125 mg を週1回。\n特徴：ACPA（anti-citrullinated protein antibody：抗シトルリン化タンパク抗体） 陽性・RF（rheumatoid factor：リウマトイド因子） 陽性の RA（rheumatoid arthritis：関節リウマチ） でよく効くとされる。重い感染症の頻度は TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬より低いとする報告が多い。慢性閉塞性肺疾患（COPD）の悪化に注意。\n共刺激を止める薬なので、効果が出るまでやや時間がかかる。","tg":["ae"],"fig":["cyto"],"mt":["bdmard"]},{"id":"bio-14a2deca","f":"bio","u":14,"o":83,"lv":3,"q":"70歳の男性。関節リウマチで MTX（methotrexate：メトトレキサート） 効果不十分。3年前に大腸憩室炎で入院し、CT で多発する憩室がある。COPD はない。次の生物学的製剤を選ぶとき、特に避けたいのはどれか。","ch":["IL-6（interleukin-6：インターロイキン6） 受容体阻害薬","エタネルセプト（TNF（tumor necrosis factor：腫瘍壊死因子） 阻害）","アバタセプト（CTLA-4（cytotoxic T-lymphocyte-associated protein 4）-Ig）","セルトリズマブペゴル（TNF（tumor necrosis factor：腫瘍壊死因子） 阻害）"],"a":0,"cx":["","TNF 阻害薬も消化管穿孔は IL-6（interleukin-6：インターロイキン6） 阻害薬より少ないとされる。","アバタセプトは消化管穿孔の危険が特に高いわけではない。","セルトリズマブペゴルも同じく TNF 阻害薬で、選択肢になる。"],"core":"IL-6 阻害薬（トシリズマブ（アクテムラ）・サリルマブ）＝下部消化管穿孔が多い（とくに憩室炎の既往・ステロイド・NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） の併用）。しかも CRP（C-reactive protein：C反応性タンパク）・発熱が出ないので見逃しやすい。","e":"JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬でも消化管穿孔の注意喚起がある。\n腹痛が出たら、CRP が正常でもためらわず CT を撮る。\n憩室炎の既往のある人で IL-6 阻害薬を使うときは、患者に腹痛時の連絡を指導する。","tg":["ae","cs"],"mt":["bdmard"]},{"id":"bio-da307155","f":"bio","u":15,"o":84,"lv":1,"q":"JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬で、日本人で特に多い副作用として知られ、予防に組換えワクチンの接種が勧められるのはどれか。","ch":["結核","脱髄疾患","間質性肺炎","帯状疱疹"],"a":3,"cx":["結核はどの免疫抑制薬でも注意が必要で、JAK 阻害薬だけに特に多いわけではない（スクリーニングは全員）。","脱髄疾患は TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬で禁忌とされる。","間質性肺炎は MTX（methotrexate：メトトレキサート）・レフルノミドなどで有名。",""],"core":"JAK 阻害薬＝帯状疱疹が多い（日本人・高齢・ステロイド併用で↑）。組換え帯状疱疹ワクチン（シングリックス：不活化）を使う。","e":"帯状疱疹のワクチン：\n・組換え（シングリックス）：不活化（サブユニット）ワクチン。免疫抑制中でも接種できる。2回（2か月あけて）。\n・乾燥弱毒生水痘ワクチン（ビケン）：生ワクチンなので、免疫抑制薬・生物学的製剤・JAK 阻害薬の使用中は禁忌。\nJAK 阻害薬はそのほか：静脈血栓塞栓症（VTE（venous thromboembolism：静脈血栓塞栓症））、心血管イベント（MACE（major adverse cardiovascular events：主要心血管イベント））・悪性腫瘍（50歳以上で心血管の危険因子がある人で TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬より多いと ORAL Surveillance 試験で示された）、リンパ球減少、CK（creatine kinase：クレアチンキナーゼ） 上昇、脂質上昇、肝障害。","tg":["ae"],"mt":["jak","vaccine"]},{"id":"bio-f6867134","f":"bio","u":15,"o":85,"lv":2,"q":"JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬とその1日の標準量の組み合わせで正しいものはどれか（関節リウマチ、腎機能正常）。","ch":["ウパダシチニブ（リンヴォック） ― 200 mg を1日1回","バリシチニブ（オルミエント） ― 4 mg を1日1回","トファシチニブ（ゼルヤンツ） ― 15 mg を1日1回","フィルゴチニブ（ジセレカ） ― 5 mg を1日2回"],"a":1,"cx":["ウパダシチニブは 15 mg を1日1回。","","トファシチニブは 5 mg を1日2回。","フィルゴチニブは 200 mg を1日1回（腎機能や状態により 100 mg）。"],"core":"トファシチニブ 5 mg×2・バリシチニブ 4 mg×1・ペフィシチニブ 150 mg×1・ウパダシチニブ 15 mg×1・フィルゴチニブ 200 mg×1。","e":"腎機能による調整（よく問われる）：\n・バリシチニブ：腎排泄が多い。eGFR（estimated glomerular filtration rate：推算糸球体濾過量） 30〜60 は 2 mg、30 未満は禁忌。\n・フィルゴチニブ：中等度の腎機能低下では 100 mg。\n・トファシチニブ：中等度以上の腎機能障害・肝機能障害では 5 mg を1日1回。\n・ペフィシチニブ（スマイラフ）：国内で開発。中等度の肝機能障害では減量。\n・ウパダシチニブ：重い腎機能障害では慎重に。RA（rheumatoid arthritis：関節リウマチ） 以外にも乾癬性関節炎・体軸性脊椎関節炎・アトピー性皮膚炎・潰瘍性大腸炎・クローン病・巨細胞性動脈炎（2025年）に使える。\nどれも生ワクチンは禁忌、妊娠中は使わない（催奇形性の動物データ）。","tg":["ae"],"mt":["jak"]},{"id":"bio-6e00bc91","f":"bio","u":15,"o":86,"lv":3,"q":"67歳の男性。関節リウマチで MTX（methotrexate：メトトレキサート） 週12 mg を使用中で、中等度の活動性が続く。喫煙歴あり、2年前に心筋梗塞。次に追加する薬を選ぶときの考え方として最も適切なのはどれか。","ch":["ステロイドを長期に追加して活動性を抑える","JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬より生物学的製剤を優先する","心筋梗塞の既往があり MTX だけを続ける","内服で便利な JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬を第一に選ぶ"],"a":1,"cx":["ステロイドの長期使用は心血管病・骨粗鬆症・感染を増やす。","","活動性が残ると関節破壊と心血管リスクがさらに増える。治療は強める。","ORAL Surveillance 試験で、50歳以上・心血管の危険因子ありでは、JAK 阻害薬は TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬より MACE（major adverse cardiovascular events：主要心血管イベント）・悪性腫瘍が多かった。"],"core":"65歳以上・喫煙（歴）・心血管病・悪性腫瘍の既往・VTE（venous thromboembolism：静脈血栓塞栓症） の危険がある人では、JAK 阻害薬は「ほかに適切な選択肢がないとき」に限る。","e":"国内外の注意喚起：JAK 阻害薬は、65歳以上、喫煙者・喫煙歴、心血管疾患の危険因子、悪性腫瘍の危険因子、VTE の危険因子のある患者では、ほかの治療で十分でない場合に使う。\nガイドライン2024：フェーズII では、長期安全性と医療経済の観点から生物学的製剤を優先して考える。\nRA（rheumatoid arthritis：関節リウマチ） 自体が心血管病の危険因子（炎症による動脈硬化）なので、治療で炎症を抑えることも心血管の予防になる。脂質・血圧・禁煙の管理も合わせて行う。","tg":["ae","cs"],"mt":["jak"]},{"id":"bio-0fdc0665","f":"bio","u":15,"o":87,"lv":2,"q":"JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬の開始を見送る（または中止を考える）血液検査の目安として正しいものはどれか。","ch":["リンパ球 500/μL 未満","血小板 20万/μL 以上","ヘモグロビン 12 g/dL 以上","白血球 12,000/μL 以上"],"a":0,"cx":["","血小板 20万/μL は正常範囲。","ヘモグロビン 12 g/dL は正常範囲。開始を見送る目安は 8〜9 g/dL 未満。","白血球の増加は JAK 阻害薬の開始を見送る基準ではない（感染の評価は必要）。"],"core":"JAK 阻害薬：リンパ球 500 未満・好中球 1,000 未満・ヘモグロビン 8〜9 g/dL 未満では始めない（添付文書の目安）。JAK は造血のサイトカインの信号も通るため。","e":"定期検査：血算（リンパ球・好中球・ヘモグロビン）、肝機能、脂質（開始後8〜12週）、腎機能、CK（creatine kinase：クレアチンキナーゼ）。\nリンパ球の減少は、帯状疱疹などの感染症の危険と関係する。\n脂質（LDL・HDL）は上がるが、心血管病との関係ははっきりしない部分もある。","tg":["ae"],"mt":["jak"]},{"id":"bio-c8e5d4c3","f":"bio","u":16,"o":88,"lv":2,"q":"関節リウマチで MTX（methotrexate：メトトレキサート） を使えない（間質性肺炎の既往）患者に生物学的製剤を単独で使うとき、単独での効果が比較的高いとされるのはどれか。","ch":["ウステキヌマブ（IL-12/23 阻害）","インフリキシマブ（抗 TNF（tumor necrosis factor：腫瘍壊死因子） キメラ抗体）","IL-6（interleukin-6：インターロイキン6） 受容体阻害薬","リツキシマブ（抗 CD20 抗体）"],"a":2,"cx":["ウステキヌマブ（IL-12/23 阻害）は乾癬・乾癬性関節炎・クローン病の薬で、RA（rheumatoid arthritis：関節リウマチ） には効果が乏しい。","インフリキシマブは RA（rheumatoid arthritis：関節リウマチ） では MTX 併用が必須で、単独では使えない。","","リツキシマブは国内で RA（rheumatoid arthritis：関節リウマチ） に保険適用がない。"],"core":"MTX が使えない RA（rheumatoid arthritis：関節リウマチ） の単独療法＝IL-6 阻害薬（単独でも MTX 併用とほぼ同じ効果）。JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬も単独で効く。","e":"TNF 阻害薬は、抗体製剤では抗薬物抗体ができやすく、MTX 併用で効果が高まる（エタネルセプト（エンブレル）・セルトリズマブペゴルは単独でも比較的よく効く）。\nアバタセプト（オレンシア）も単独で使える。\nRA に効かない（または効果の乏しい）生物学的製剤：IL-17（interleukin-17：インターロイキン17） 阻害薬・IL-12/23 阻害薬・IL-23（interleukin-23：インターロイキン23） 阻害薬（乾癬性関節炎には効く）、IL-1（interleukin-1：インターロイキン1） 阻害薬。","tg":["ae"],"mt":["bdmard"]},{"id":"bio-6881697b","f":"bio","u":16,"o":89,"lv":2,"q":"TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬で一度よく効いたあとに効果が落ちてきた（二次無効）。原因として最も考えられ、対策として正しいものはどれか。","ch":["薬が効きすぎた：投与の間隔を延ばす","RA（rheumatoid arthritis：関節リウマチ） が自然に治った：すべての薬を中止する","TNF の産生が止まった：中止して様子を見る","抗薬物抗体：MTX（methotrexate：メトトレキサート） 併用か作用の違う薬へ"],"a":3,"cx":["効果が落ちているのに間隔を延ばすのは逆。","症状が再び出ているので、自然寛解ではない。","TNF の産生が止まるわけではない。効果が落ちたら治療を変える必要がある。",""],"core":"二次無効＝抗薬物抗体（とくにキメラ・ヒト型の抗体製剤）。MTX 併用で予防。切り替えは「同じ TNF 阻害薬の別製剤」か「作用の違う薬」。","e":"一次無効（最初から効かない）なら、TNF 以外の経路が主と考えて作用の違う薬（IL-6（interleukin-6：インターロイキン6） 阻害薬・アバタセプト・JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬）を選ぶ。\n二次無効なら、別の TNF 阻害薬でも効くことがあるが、作用の違う薬への切り替えも同等に勧められる（ガイドライン2024 フェーズIII）。\nインフリキシマブ（レミケード）では、量を増やすか間隔を短くする方法もある。","tg":["ae"]},{"id":"bio-e99d9d07","f":"bio","u":16,"o":90,"lv":3,"q":"66歳の女性。関節リウマチで MTX（methotrexate：メトトレキサート） 効果不十分。2年前に乳癌の手術を受け、再発はない。追加の治療を選ぶときの考え方として最も適切なのはどれか。","ch":["内服で便利な JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬を第一に選ぶ","腫瘍内科と相談し、生物学的製剤を慎重に選ぶ","悪性腫瘍の既往があるので、追加の治療は一生できない","ステロイドを大量に長期間使う"],"a":1,"cx":["JAK 阻害薬は悪性腫瘍の危険因子のある人では、ほかの手段がないときに限る。","","悪性腫瘍の既往があっても、多くの生物学的製剤は慎重に使える（再発の危険を大きく上げない報告が多い）。","ステロイドの大量長期は害が大きい。"],"core":"悪性腫瘍の既往：腫瘍内科と相談。生物学的製剤（TNF（tumor necrosis factor：腫瘍壊死因子）・IL-6（interleukin-6：インターロイキン6）・アバタセプト）は慎重に使用可。JAK 阻害薬は避ける方向。リンパ腫の既往ならリツキシマブ（保険適用外）も選択肢。","e":"治療から5年以上たって再発がなければ、一般の人に近い扱いをする考え方が多い。\n皮膚癌（非黒色腫）は TNF 阻害薬・JAK 阻害薬で増えるとの報告があり、皮膚の診察も行う。\n癌の検診（乳癌・大腸癌・子宮頸癌など）を年齢に応じて勧める。","tg":["ae","cs"]},{"id":"ae-5dcf322c","f":"ae","u":17,"o":91,"lv":1,"q":"生物学的製剤・JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬を始める前の結核のスクリーニングとして、正しい組み合わせはどれか。","ch":["問診＋IGRA（interferon-gamma release assay：インターフェロンγ遊離試験）＋胸部画像（X線・CT）","喀痰の抗酸菌培養を全員に3回","血清の β-D-グルカンの測定","ツベルクリン反応だけを行う"],"a":0,"cx":["","喀痰検査は、画像で活動性結核を疑うときに行う。全員には不要。","β-D-グルカンは深在性真菌症・ニューモシスチス肺炎の検査。","ツベルクリン反応は BCG 接種の影響を受けやすく、免疫抑制中は偽陰性も多い。IGRA（interferon-gamma release assay：インターフェロンγ遊離試験） が基本。"],"core":"結核スクリーニング＝問診＋IGRA（QFT（QuantiFERON（IGRAの一つ））・T-SPOT（T-SPOT.TB（IGRAの一つ）））＋胸部画像。どれかで潜在性結核（LTBI（latent tuberculosis infection：潜在性結核感染症））を疑えば、治療してから始める。","e":"IGRA は BCG の影響を受けない。ステロイド内服中やリンパ球が少ないと「判定不可」・偽陰性になりやすい。IGRA 陰性でも、胸部 CT の陳旧性病変・接触歴があれば LTBI として治療を考える。\n生物学的製剤の使用中に起こる結核は、肺外結核・播種性結核（粟粒結核）が多く、発熱だけのこともある。治療中も年1回などで再評価する。","tg":["ae"],"fig":["tb"]},{"id":"ae-83635549","f":"ae","u":17,"o":92,"lv":2,"q":"潜在性結核感染症（LTBI（latent tuberculosis infection：潜在性結核感染症））と判断した関節リウマチの患者に生物学的製剤を始めるときの対応として正しいものはどれか。","ch":["4剤併用の結核治療を6か月行ってから始める","INH を6〜9か月、3週後から生物学的製剤","INH を1週間内服し、止めてから開始する","先に生物学的製剤を始め、発症したら治療"],"a":1,"cx":["4剤併用は活動性結核の治療。LTBI は1剤（イソニアジド（イスコチン））でよい。","","予防内服は6〜9か月続ける。1週間で止めるのは不十分。","発症してから治療では遅い。予防が原則。"],"core":"LTBI＝イソニアジド（イスコチン） 5 mg/kg（最大 300 mg/日）を6〜9か月。生物学的製剤は INH 開始3週間後から（国内の手引き）。","e":"イソニアジドの副作用：肝障害（高齢・飲酒で多い）、末梢神経障害（ビタミンB6＝ピリドキシンの併用で予防）。\nイソニアジドが使えない（副作用・耐性）ときは、リファンピシン（リファジン）を4か月。ただしリファンピシンは CYP3A4（cytochrome P450 3A4：薬物代謝酵素） を強く誘導するので、ステロイド・タクロリムス・シクロスポリン・JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬・ワルファリン・アゾール系の血中濃度を大きく下げる（ステロイドは約2倍量が必要になることも）。\n活動性結核なら、まず標準の結核治療（イソニアジド・リファンピシン・ピラジナミド・エタンブトール）を行い、生物学的製剤は使わない。","tg":["ae"],"fig":["tb"],"mt":["infscreen"]},{"id":"ae-e9407b4a","f":"ae","u":17,"o":93,"lv":3,"q":"34歳の女性。SLE（systemic lupus erythematosus：全身性エリテマトーデス） でプレドニゾロン（プレドニン） 30 mg/日を内服中。潜在性結核と判断されたが、イソニアジド（イスコチン）で肝障害が出たため、リファンピシン（リファジン）に替えた。2週間後から関節痛と発熱、補体の低下が出てきた。最も考えられる原因はどれか。","ch":["ステロイドの効果が落ちた","活動性の結核に進行した","リファンピシンの薬剤性ループス","イソニアジドの遅れた副作用"],"a":0,"cx":["","結核の進行でも発熱は起こるが、補体の低下・関節痛は SLE の再燃を示す。","リファンピシンは薬剤性ループスの代表的な原因薬ではない（イソニアジドは原因になる）。","イソニアジドは中止しており、この経過は説明しにくい。"],"core":"リファンピシン＝CYP3A4（cytochrome P450 3A4：薬物代謝酵素） の強い誘導薬。ステロイド・タクロリムス・シクロスポリン・JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬・ワルファリン・アゾール系の濃度を下げる → 原病の再燃。併用中はステロイドを増やす（約2倍）などの調整が必要。","e":"誘導の効果は開始から1〜2週で出て、中止後も2週間ほど続く。\nリファンピシンで尿・涙・汗がオレンジ色になる（ソフトコンタクトレンズが染まる）。\nLTBI（latent tuberculosis infection：潜在性結核感染症） の治療として、国内ではイソニアジド6〜9か月、リファンピシン4か月、両方を3〜4か月などが使われる。","tg":["ae","cs"],"mt":["infscreen"]},{"id":"ae-236cd2e5","f":"ae","u":17,"o":94,"lv":2,"q":"気管支拡張症があり、肺の非結核性抗酸菌症（MAC 症）を合併した関節リウマチ患者の生物学的製剤の使用について、正しい考え方はどれか。","ch":["原則慎重に考え、使うなら呼吸器専門医と連携する","MAC 症は IGRA（interferon-gamma release assay：インターフェロンγ遊離試験） で必ず陽性になる","生物学的製剤を使うと MAC 症は治る","MAC 症は結核ではないので、気にせず使ってよい"],"a":0,"cx":["","IGRA は結核菌群を調べる検査で、MAC ではふつう陰性（一部の菌種を除く）。","免疫抑制で悪化しうるので、治ることはない。","非結核性抗酸菌症も、生物学的製剤で悪化することがある。日本では患者が多い。"],"core":"肺 MAC 症：日本の中高年女性に多い。RA（rheumatoid arthritis：関節リウマチ） の気道病変（気管支拡張）に合併しやすい。生物学的製剤は慎重に（軽症・安定・治療可能なら専門医と相談して使用可）。","e":"日本リウマチ学会の手引きでは、非結核性抗酸菌症の患者には原則として生物学的製剤を使わず、使う場合は菌種・病状・治療の見込みを呼吸器の専門医と検討する。\n治療前の胸部 CT で、気管支拡張・小結節・空洞がないかを確認する。\nアバタセプト（オレンシア）など感染の少ない薬が選ばれることがある。","tg":["ae"]},{"id":"ae-52aa9a28","f":"ae","u":17,"o":95,"lv":3,"q":"72歳の男性。関節リウマチで生物学的製剤を考えている。プレドニゾロン（プレドニン） 10 mg/日を内服中。IGRA（interferon-gamma release assay：インターフェロンγ遊離試験） は「判定不可」、胸部 CT で右肺尖部に石灰化を伴う陳旧性の病変があり、若いころに家族が結核だった。対応として最も適切なのはどれか。","ch":["ツベルクリン反応が陰性なら結核は否定できる","潜在性結核として治療してから始める","IGRA が陽性ではないので、そのまま始める","生物学的製剤は一生使えないと伝える"],"a":1,"cx":["ツベルクリン反応も免疫抑制中は偽陰性が多く、否定の根拠にならない。","","判定不可は陰性ではない（ステロイド・リンパ球減少で起こる）。画像と接触歴があれば LTBI（latent tuberculosis infection：潜在性結核感染症） として扱う。","LTBI（latent tuberculosis infection：潜在性結核感染症） を治療すれば生物学的製剤は使える。"],"core":"IGRA が判定不可・陰性でも、陳旧性の結核病変・接触歴があれば LTBI（latent tuberculosis infection：潜在性結核感染症） としてイソニアジド（イスコチン）を使い、3週後から生物学的製剤。活動性の結核は喀痰検査で除外する。","e":"IGRA の判定不可（陽性対照の反応が弱い）は、ステロイド・リンパ球減少・高齢で起こりやすい。\n胸部 CT の所見（肺尖部の線維化・石灰化結節・胸膜肥厚）は既感染の手がかり。\n生物学的製剤の使用中も、発熱・体重減少・咳・リンパ節腫脹が出たら結核を疑い、肺外結核（リンパ節・腸・粟粒）も探す。","tg":["ae","cs"],"fig":["tb"],"mt":["infscreen"]},{"id":"ae-6b2b42c6","f":"ae","u":18,"o":96,"lv":1,"q":"免疫抑制療法を始める前の B 型肝炎のスクリーニングで、最初に全員に測るものはどれか。","ch":["HBs（hepatitis B surface：B型肝炎ウイルス表面） 抗原（陰性なら HBc（hepatitis B core：B型肝炎ウイルスコア）・HBs 抗体）","HBe 抗原と HBe 抗体だけを測る","AST・ALT（肝酵素）だけを測る","HBV（hepatitis B virus：B型肝炎ウイルス）-DNA の定量だけを全員に"],"a":0,"cx":["","HBe 抗原は HBs（hepatitis B surface：B型肝炎ウイルス表面） 抗原陽性者のウイルス量の目安で、スクリーニングの入口ではない。","肝酵素が正常でも既往感染（HBc（hepatitis B core：B型肝炎ウイルスコア） 抗体陽性）はわからない。","HBV-DNA はスクリーニングで HBs（hepatitis B surface：B型肝炎ウイルス表面） 抗原陰性・HBc（hepatitis B core：B型肝炎ウイルスコア） 抗体か HBs 抗体が陽性のときに測る。"],"core":"スクリーニング＝HBs 抗原 → 陰性なら HBc 抗体・HBs 抗体 → どちらか陽性なら HBV-DNA。","e":"HBs 抗原陰性でも、HBc 抗体や HBs 抗体が陽性なら「既往感染」で、肝臓にウイルスのDNA（cccDNA）が残っている。強い免疫抑制で再び増え（再活性化）、「de novo B 型肝炎」として劇症化することがある。\nワクチン接種だけによる HBs 抗体陽性（HBc 抗体陰性）は既往感染ではない（接種歴を確認）。","tg":["ae"],"fig":["hbv"],"mt":["infscreen"]},{"id":"ae-ab54a2c9","f":"ae","u":18,"o":97,"lv":2,"q":"HBs（hepatitis B surface：B型肝炎ウイルス表面） 抗原陰性・HBc（hepatitis B core：B型肝炎ウイルスコア） 抗体陽性の関節リウマチ患者。HBV（hepatitis B virus：B型肝炎ウイルス）-DNA は検出感度未満。生物学的製剤を始めるときの対応として正しいものはどれか。","ch":["この状態では生物学的製剤は全例で禁忌である","HBV-DNA を1〜3か月ごと、20 IU/mL 以上で核酸アナログ","既往感染なので、とくに何もしなくてよい","HBs 抗体が陽性なら HBV-DNA の測定は不要である"],"a":1,"cx":["禁忌ではない。モニタリングか予防投与をしながら使える。","","既往感染でも再活性化は起こる。モニタリングが必要。","HBs 抗体陽性でも再活性化は起こりうる（頻度は下がる）。"],"core":"既往感染＝HBV-DNA を1〜3か月ごと。20 IU/mL 以上で核酸アナログ（エンテカビル（バラクルード）など）。肝炎（ALT 上昇）を待たない。","e":"日本肝臓学会の「免疫抑制・化学療法により発症する B 型肝炎対策ガイドライン」に沿う。\n・HBs 抗原陽性：肝臓専門医に相談し、免疫抑制の前から核酸アナログ（エンテカビル：バラクルード、テノホビル アラフェナミド：ベムリディ）を始める。\n・HBs 抗原陰性で HBc 抗体または HBs 抗体陽性：HBV-DNA を測る。20 IU/mL 以上なら核酸アナログ。未満なら1〜3か月ごとに HBV-DNA を測り、20 IU/mL 以上になった時点で核酸アナログ。\n・リツキシマブ（抗 CD20 抗体）や大量ステロイドは再活性化の危険が特に高い。リツキシマブ（リツキサン）の後は、少なくとも12か月は監視を続ける。","tg":["ae"],"fig":["hbv"],"mt":["infscreen"]},{"id":"ae-b3039f8e","f":"ae","u":18,"o":98,"lv":3,"q":"68歳の男性。HBs（hepatitis B surface：B型肝炎ウイルス表面） 抗原陰性・HBc（hepatitis B core：B型肝炎ウイルスコア） 抗体陽性。ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） 関連血管炎でリツキシマブ（リツキサン）を使ったが、HBV（hepatitis B virus：B型肝炎ウイルス）-DNA の定期測定をしていなかった。8か月後に倦怠感が出て、ALT 680 U/L、HBs 抗原陽性、HBV-DNA 6.5 LogIU/mL。最も適切な対応はどれか。","ch":["肝庇護薬だけで経過を見る","インターフェロン単独で治療する","すぐ核酸アナログを始め、肝臓専門医と治療する","ALT が下がるまでリツキシマブを追加する"],"a":2,"cx":["肝庇護薬ではウイルスの増殖を止められない。","インターフェロンは免疫を賦活する治療で、再活性化の急性期には核酸アナログを使う。","","免疫抑制を強めるとウイルスがさらに増え、劇症化の危険が上がる。"],"core":"de novo B 型肝炎＝既往感染者の再活性化。劇症化すると死亡率が高い。すぐエンテカビル（バラクルード）・テノホビル アラフェナミドを始め、肝臓専門医と管理する。予防：HBV-DNA を1〜3か月ごとに測る。","e":"リツキシマブ・大量ステロイド・造血幹細胞移植は、再活性化の危険が特に高い。リツキシマブでは予防的に核酸アナログを使う施設も多い。\n肝炎が起きてから核酸アナログを始めても、劇症化を防げないことがある。だから「DNA が増えた時点」で始める。\n再活性化は治療の終了後にも起こる（リツキシマブでは1年以上後も）。","tg":["ae","cs"],"fig":["hbv"],"mt":["infscreen"]},{"id":"ae-1c0d084c","f":"ae","u":19,"o":99,"lv":2,"q":"膠原病の治療中に、ニューモシスチス肺炎の予防投与を考える目安として、一般的に用いられるのはどれか。","ch":["ヒドロキシクロロキン（プラケニル）を使うとき","PSL（prednisolone：プレドニゾロン） 20 mg/日以上を4週以上使うとき","NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） を長く使い続けるとき","プレドニゾロン（プレドニン） 5 mg/日を使うとき"],"a":1,"cx":["ヒドロキシクロロキンは感染症を増やさない（むしろ減らす）薬。","","NSAIDs は免疫抑制を起こさない。","少量（5 mg/日）だけでは、ふつう予防投与の対象にならない。"],"core":"PCP（Pneumocystis pneumonia：ニューモシスチス肺炎） 予防＝PSL 20 mg/日以上が4週以上＋免疫抑制薬・高齢・リンパ球減少・肺病変など。ST合剤（スルファメトキサゾール・トリメトプリム：バクタ） 1日1錠（または週3回2錠など）。","e":"膠原病（とくに AAV（ANCA-associated vasculitis：ANCA関連血管炎）・筋炎・SLE（systemic lupus erythematosus：全身性エリテマトーデス） の大量ステロイド、シクロホスファミド（エンドキサン）・リツキシマブ併用）のニューモシスチス肺炎は、HIV 患者より急速に進み、死亡率が高い。\n危険因子：高齢、ステロイドの量、リンパ球減少（とくに CD4 低下）、既存の肺病変、腎機能低下、生物学的製剤と MTX（methotrexate：メトトレキサート） の併用。\nRA（rheumatoid arthritis：関節リウマチ） の生物学的製剤使用中でも、高齢・肺病変・ステロイド併用・リンパ球減少などがあれば予防を考える。","tg":["ae"],"mt":["infscreen"]},{"id":"ae-e8400e8e","f":"ae","u":19,"o":100,"lv":2,"q":"ST合剤（バクタ）で起こりやすい副作用として正しいものはどれか。","ch":["徐脈と高カルシウム血症","高カリウム血症とクレアチニン上昇","低カリウム血症と多尿（尿崩症）","低血糖は起こさず糖尿病で使いやすい"],"a":1,"cx":["徐脈・高カルシウム血症は ST合剤の典型ではない。","","トリメトプリムは遠位尿細管の Na チャネル（ENaC）をふさぎ、カリウムを上げる（下げない）。","まれに低血糖を起こす（とくに腎機能低下・高齢者）。"],"core":"ST合剤：高 K・クレアチニン上昇（尿細管分泌の阻害で、GFR は変わらない）・皮疹・血球減少・肝障害・低 Na。MTX（methotrexate：メトトレキサート） との併用で骨髄抑制。","e":"トリメトプリムはアミロライドと同じように集合管の ENaC を阻害して、カリウムの排泄を減らす。ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬・ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬）・スピロノラクトン併用や腎機能低下で高カリウム血症が強くなる。\nクレアチニンの尿細管分泌を阻害するので、血清クレアチニンが 0.2〜0.3 mg/dL ほど上がるが、真の腎機能低下とは限らない。\n副作用で使えないときの予防の代わり：アトバコン（サムチレール）内服、ペンタミジン（ベナンバックス）吸入（月1回）。","tg":["ae"],"mt":["infscreen"]},{"id":"ae-ec5c1d25","f":"ae","u":19,"o":101,"lv":3,"q":"70歳の女性。関節リウマチで MTX（methotrexate：メトトレキサート） 週10 mg とアダリムマブ（ヒュミラ）を使用中。3日前から発熱と乾いた咳、急に息苦しくなった。SpO2 88%、胸部 CT で両側のびまん性すりガラス影（胸膜直下は保たれる）、LDH 高値、β-D-グルカン 120 pg/mL（高値）。最も適切な対応はどれか。","ch":["MTX 肺炎：パルスだけを行い MTX は続ける","RA（rheumatoid arthritis：関節リウマチ） の ILD（interstitial lung disease：間質性肺疾患） の悪化：ニンテダニブ（オフェブ）を始める","細菌性肺炎：経口抗菌薬で外来で様子を見る","PCP（Pneumocystis pneumonia：ニューモシスチス肺炎）：ST合剤（スルファメトキサゾール・トリメトプリム：バクタ）の治療量、MTX と ADA（adenosine deaminase：アデノシンデアミナーゼ） は中止"],"a":3,"cx":["β-D-グルカン高値で PCP（Pneumocystis pneumonia：ニューモシスチス肺炎） の可能性が高い。PCP を治療せずにステロイドだけでは悪化する。MTX は続けない。","急性経過・β-D-グルカン高値は慢性に進む ILD の悪化では説明しにくい。","低酸素があり入院が必要。細菌性肺炎の画像とも合わない。",""],"core":"免疫抑制中の急な乾性咳・低酸素・びまん性すりガラス影・β-D-グルカン高値＝PCP。ST合剤治療量（トリメトプリム 15〜20 mg/kg/日）、免疫抑制薬は中止。","e":"診断：喀痰・気管支肺胞洗浄液の PCR、β-D-グルカン、LDH、KL-6（Krebs von den Lungen-6：間質性肺炎のマーカー）。非 HIV の PCP は菌量が少なく、PCR で見つかることが多い。\n治療：ST合剤（トリメトプリム量で 15〜20 mg/kg/日を3〜4回に分けて、21日間が目安）。副作用で使えなければペンタミジン（ベナンバックス）静注・アトバコン。\n低酸素の強い例では、ステロイドの併用が検討される（HIV 患者での有効性が確立しており、非 HIV でも使われることが多い）。\n回復後に免疫抑制を再開するときは、ST合剤の予防投与を必ず行う。","tg":["ae","cs"],"mt":["infscreen"]},{"id":"ae-de9bdd5f","f":"ae","u":19,"o":102,"lv":2,"q":"大量ステロイドで治療中の膠原病患者で、定期的に調べるべきウイルスの再活性化と、その検査の組み合わせはどれか。","ch":["インフルエンザ ― 毎週の迅速検査","パルボウイルスB19 ― IgG 抗体","CMV（cytomegalovirus：サイトメガロウイルス） ― アンチゲネミア（pp65）","EB ウイルス ― VCA-IgG 抗体"],"a":2,"cx":["インフルエンザは流行期の症状で検査する。再活性化するウイルスではない。","パルボウイルスB19 の IgG は既往を示すだけで、再活性化の監視には使わない。","","EBV（Epstein-Barr virus） の VCA-IgG は既往感染の確認で、再活性化の監視には使わない（必要なら EBV-DNA 量）。"],"core":"大量ステロイド・シクロホスファミド・タクロリムスの併用中は、サイトメガロウイルス（CMV）を1〜2週ごとにアンチゲネミアか PCR で監視。陽性が増えればガンシクロビル（デノシン）・バルガンシクロビル。","e":"CMV の症状：発熱、血球減少、肝障害、肺炎、腸炎（下血）、網膜炎。抗MDA5（melanoma differentiation-associated gene 5） 抗体陽性の筋炎・ループス腎炎・ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） 関連血管炎の強い治療でとくに多い。\nアンチゲネミアは白血球が少ないと偽陰性になりやすい（そのときは PCR）。\nバルガンシクロビル（バリキサ）・ガンシクロビル（デノシン）の副作用：骨髄抑制（腎機能で量を調整）。","tg":["ae"]},{"id":"ae-8108ca2a","f":"ae","u":19,"o":103,"lv":2,"q":"免疫抑制中の患者の帯状疱疹について正しいものはどれか。","ch":["発症したら生ワクチンをすぐ打つ","早めに抗ウイルス薬（播種性は静注）","免疫抑制中は抗ウイルス薬を使わない","帯状疱疹は人にうつることは全くない"],"a":1,"cx":["発症中の治療にワクチンは使わない。生ワクチンは免疫抑制中は禁忌。","","免疫抑制中ほど重くなりやすく、早めに抗ウイルス薬を使う。","水疱の内容液から、水痘にかかったことのない人へ水痘としてうつる。播種性では空気感染対策も必要。"],"core":"帯状疱疹（免疫抑制中）：早期にバラシクロビル（バルトレックス）・ファムシクロビル・アメナメビル。播種性・眼部・重症はアシクロビル（ゾビラックス）静注で入院。予防は組換えワクチン。","e":"バラシクロビル・アシクロビルは腎排泄なので、腎機能で量を減らす（過量で意識障害などのアシクロビル脳症）。アメナメビル（アメナリーフ）は腎機能での調整が不要。\n帯状疱疹のあとの神経痛（帯状疱疹後神経痛）にはプレガバリン（リリカ）・ミロガバリンなど。\nJAK（Janus kinase：ヤヌスキナーゼ） 阻害薬の使用中に発症したら、一時中止を考える。","tg":["ae"],"mt":["vaccine"]},{"id":"ae-971b7394","f":"ae","u":19,"o":104,"lv":3,"q":"58歳の女性。皮膚筋炎でプレドニゾロン（プレドニン） 50 mg/日とタクロリムス（プログラフ）を始め、ST合剤（スルファメトキサゾール・トリメトプリム：バクタ） 1錠/日で予防をしていた。2週間後に血清カリウム 6.2 mEq/L、クレアチニンが少し上がった。ニューモシスチス肺炎の予防として最も適切な対応はどれか。","ch":["予防をやめて経過を見る","ST合剤を倍量にする","ST合剤を続け、カリウム制限だけにする","アトバコン（サムチレール）など別の予防薬に替える"],"a":3,"cx":["大量ステロイド＋免疫抑制薬の時期で、予防をやめるのは危険。","倍量では高カリウム血症がさらに悪化する。","タクロリムス（高カリウム・腎障害）と ST合剤（ENaC 阻害）が重なり、カリウム制限だけでは不十分なことが多い。",""],"core":"ST合剤が使えない（高 K・皮疹・血球減少・肝障害）ときの PCP（Pneumocystis pneumonia：ニューモシスチス肺炎） 予防＝アトバコン内服（1日1回、食後）か、ペンタミジン（ベナンバックス）吸入（月1回）。","e":"高カリウム血症が軽ければ、ST合剤を週3回に減らす・利尿薬の併用で続けられることもある。\n皮疹で使えなくなった場合、少量から増やす「減感作」で再開できることがある。\nアトバコンは脂肪の多い食事と一緒に飲むと吸収が良い。下痢・皮疹が副作用。","tg":["ae","cs"],"mt":["infscreen"]},{"id":"ae-2de48a3d","f":"ae","u":20,"o":105,"lv":1,"q":"生物学的製剤・JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬・中等量以上のステロイドを使用中の患者に「禁忌」のワクチンはどれか。","ch":["組換え帯状疱疹ワクチン（シングリックス）","肺炎球菌ワクチン","インフルエンザ HA ワクチン","麻疹・風疹（MR）ワクチン"],"a":3,"cx":["組換え帯状疱疹ワクチンは不活化（サブユニット）で、接種できる。","肺炎球菌ワクチンは不活化（多糖体・結合型）。勧められる。","インフルエンザ HA ワクチンは不活化ワクチン。免疫抑制中でも毎年接種を勧める。",""],"core":"免疫抑制中は「生ワクチン」が禁忌（MR・水痘・おたふくかぜ・BCG・黄熱・ロタ・弱毒生帯状疱疹）。不活化は接種を勧める。","e":"生ワクチンが必要なら、免疫抑制を始める少なくとも4週間前に接種を済ませる。\n免疫抑制中に勧める不活化ワクチン：インフルエンザ（毎年）、肺炎球菌（結合型＋多糖体）、組換え帯状疱疹（とくに JAK 阻害薬を使う人・50歳以上）、新型コロナ、B 型肝炎（HBs（hepatitis B surface：B型肝炎ウイルス表面） 抗体陰性で危険がある人）。\n妊娠中に生物学的製剤（Fc をもつ抗体）を使った母親から生まれた児は、生後6か月までは BCG・ロタなどの生ワクチンを避ける。","tg":["ae"],"mt":["vaccine"]},{"id":"ae-7e8666d8","f":"ae","u":20,"o":106,"lv":2,"q":"不活化ワクチンの効果を高めるための工夫として、正しいものはどれか。","ch":["MTX（methotrexate：メトトレキサート） は接種の前後に増量すると効果が上がる","免疫抑制中は効かないので、接種しない","リツキシマブ（リツキサン）は投与の2週前か6か月後に接種","ステロイドを大量にしてから接種するとよい"],"a":2,"cx":["MTX はワクチンの効果を下げる。インフルエンザワクチンのあと2週間 MTX を休むと抗体の上がりが良くなる（ACR（American College of Rheumatology：米国リウマチ学会） の推奨）。","効果は落ちても、重症化を防ぐ利益が大きい。接種を勧める。","","ステロイドの量が多いほど効果は落ちる。"],"core":"リツキシマブは B 細胞を消すのでワクチンが効きにくい。接種は投与の2週間以上前、または6か月以上後。MTX は接種後2週間の休薬で効果が上がる。","e":"免疫抑制薬ごとのワクチン反応：リツキシマブ・アバタセプト・MMF（mycophenolate mofetil：ミコフェノール酸モフェチル）・大量ステロイドで低下が大きい。TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬・IL-6（interleukin-6：インターロイキン6） 阻害薬は低下が小さい。\nJAK（Janus kinase：ヤヌスキナーゼ） 阻害薬・MTX は中等度に低下させる。\n接種は病気が落ち着いている時期が望ましい。","tg":["ae"],"mt":["vaccine"]},{"id":"ae-01b3d445","f":"ae","u":20,"o":107,"lv":3,"q":"62歳の女性。関節リウマチでバリシチニブ（オルミエント）を内服中。右胸部に帯状に並ぶ水疱が出て痛む。発熱なし、ほかの部位には広がっていない。対応として最も適切なのはどれか。","ch":["弱毒生水痘ワクチンを接種する","ステロイドの外用だけで様子を見る","JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬を増量して炎症を抑える","抗ウイルス薬を始め、JAK（Janus kinase：ヤヌスキナーゼ） を休む"],"a":3,"cx":["発症中の治療にワクチンは使わない。生ワクチンは JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬の使用中は禁忌。","ステロイドの外用は帯状疱疹の治療にならず、悪化させうる。","増量は帯状疱疹を悪化させる。",""],"core":"JAK 阻害薬中の帯状疱疹＝早期に抗ウイルス薬（バラシクロビル（バルトレックス）・アメナメビルなど）、JAK 阻害薬は一時休薬、播種性なら入院・静注。治ったあとに組換えワクチン（シングリックス）を考える。","e":"帯状疱疹の既往があっても再発しうるので、組換えワクチン（不活化）は勧められる（発症から少しあけて）。\nJAK 阻害薬を始める前に接種しておくのが理想（2回、2か月あけて）。\n眼の周り（三叉神経第1枝）は眼科の診察を。","tg":["ae","cs"],"mt":["vaccine","jak"]},{"id":"ae-aafd45c2","f":"ae","u":21,"o":108,"lv":1,"q":"次のステロイドの量のうち、プレドニゾロン（プレドニン） 5 mg と「ほぼ同じ強さ（糖質コルチコイド作用）」のものはどれか。","ch":["ヒドロコルチゾン（静注はソル・コーテフ、内服はコートリル） 5 mg（錠剤）","デキサメタゾン（デカドロン） 4 mg（錠剤）","ベタメタゾン（リンデロン） 5 mg（錠剤）","メチルプレドニゾロン（ソル・メドロール） 4 mg"],"a":3,"cx":["ヒドロコルチゾンは弱く、プレドニゾロン 5 mg は約 20 mg に相当する。","デキサメタゾンは約25〜30倍強く、プレドニゾロン 5 mg に相当するのは約 0.75 mg。","ベタメタゾンもデキサメタゾン（デカドロン）と同じくらい強く、約 0.5〜0.75 mg に相当。",""],"core":"PSL（prednisolone：プレドニゾロン） 5 mg ＝ mPSL（methylprednisolone：メチルプレドニゾロン） 4 mg ＝ ヒドロコルチゾン 20 mg ＝ デキサメタゾン・ベタメタゾン 0.75 mg。","e":"作用時間：ヒドロコルチゾン（短い：8〜12時間）、プレドニゾロン・メチルプレドニゾロン（中間：12〜36時間）、デキサメタゾン・ベタメタゾン（長い：36〜72時間）。\n鉱質コルチコイド作用（Na 貯留・K 排泄）：ヒドロコルチゾンが最も強く、デキサメタゾン・ベタメタゾンはほとんどない。\nデキサメタゾン・ベタメタゾンは胎盤の酵素（11β-HSD2）で分解されにくく、胎児に届く（胎児の肺成熟・先天性心ブロックの治療に使われる）。プレドニゾロンは胎盤でほとんど不活化されるので、母体の治療に向く。","tg":["ae"],"mt":["steroid"]},{"id":"ae-85c2d1ae","f":"ae","u":21,"o":109,"lv":1,"q":"ステロイドの副作用と、出始める時期の組み合わせで正しいものはどれか。","ch":["骨粗鬆症による骨折 ― 開始後10年以上たってから","満月様顔貌 ― 開始当日","高血糖・不眠・気分の変化 ― 開始後数日以内","大腿骨頭壊死 ― 中止して数年後にだけ起こる"],"a":2,"cx":["骨量はステロイド開始後3〜6か月で最も急に減り、骨折は早期から増える（だから開始時に予防する）。","満月様顔貌・中心性肥満は数週〜数か月で出てくる。","","大腿骨頭壊死は大量投与の開始から数か月以内（多くは3か月以内）に起こり始める。"],"core":"日：高血糖・精神症状・食欲↑・高血圧 → 週：感染症・満月様顔貌・ミオパチー → 月：骨粗鬆症・白内障・緑内障・大腿骨頭壊死・副腎抑制。","e":"対策をセットで覚える：\n・高血糖：昼〜夕方に高くなる（朝1回の内服では夕食前・食後の血糖を測る）。\n・感染症：ニューモシスチス肺炎の予防（ST合剤（スルファメトキサゾール・トリメトプリム：バクタ））、結核・B 型肝炎の確認、ワクチン。\n・骨粗鬆症：開始時から GIOP（glucocorticoid-induced osteoporosis：グルココルチコイド誘発性骨粗鬆症） の点数で判断し、ビスホスホネートなど。\n・消化性潰瘍：ステロイド単独では増加は小さいが、NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） と併用・高齢では PPI（proton pump inhibitor：プロトンポンプ阻害薬） を使う。\n・大腿骨頭壊死：股関節・鼠径部の痛みに注意し MRI（magnetic resonance imaging）。\n・白内障（後嚢下）・緑内障：眼科で定期検査。\n・副腎抑制：急に止めない。手術・重い感染ではストレス量を補う。\n・ステロイドミオパチー：近位筋の筋力低下で CK（creatine kinase：クレアチンキナーゼ） は正常。","tg":["ae"],"fig":["steroid"],"mt":["steroid"]},{"id":"ae-eac5ac0f","f":"ae","u":21,"o":110,"lv":2,"q":"プレドニゾロン（プレドニン） 15 mg/日を1年以上内服中の SLE（systemic lupus erythematosus：全身性エリテマトーデス） の患者が、大腸癌の手術（全身麻酔）を受ける。周術期のステロイドの扱いとして正しいものはどれか。","ch":["当日だけデキサメタゾン（デカドロン） 20 mg を内服","手術の前日からステロイドを中止する","通常量を続け、ヒドロコルチゾン（静注はソル・コーテフ、内服はコートリル）で補う","術後1か月中止してから、また始める"],"a":2,"cx":["内服は麻酔中にできず、量も根拠がない。","長く使っている人は副腎が抑えられていて、急に止めると副腎クリーゼ（ショック）になる。","","術後の中止も副腎不全を起こす。食事がとれない間は静注で補う。"],"core":"PSL（prednisolone：プレドニゾロン） 20 mg/日以上を3週間以上（目安）使った人は副腎抑制ありとみなす。手術では通常量を続け、ヒドロコルチゾンで補う（大手術なら 100 mg 前後/日から漸減）。","e":"副腎の抑制が起こりにくい：PSL 5 mg/日未満の朝1回、または3週間未満の使用（量によらず）。\n副腎の抑制がある（とみなす）：PSL 20 mg/日以上を3週間以上、クッシング徴候がある人。\nその中間はどちらとも言えず、ACTH 刺激試験で確かめるか、カバーを行う。\n副腎不全の症状：倦怠感・食欲低下・低血圧・低ナトリウム血症・高カリウム血症（原発性で）・低血糖・好酸球増加。シックデイ（発熱・嘔吐）で量を2〜3倍にする指導も大切。","tg":["ae"],"mt":["steroid"]},{"id":"ae-9601e703","f":"ae","u":21,"o":111,"lv":3,"q":"45歳の女性。SLE（systemic lupus erythematosus：全身性エリテマトーデス） でプレドニゾロン（プレドニン） 50 mg/日を始めて2か月。右の鼠径部の痛みで歩きにくくなった。股関節の X線は正常。次に行う検査として最も適切なのはどれか。","ch":["股関節の MRI（magnetic resonance imaging）","鎮痛薬だけを出して様子を見る","関節液の検査（痛風の結晶）","骨シンチグラフィー（骨転移）"],"a":0,"cx":["","X 線は早期の骨頭壊死では正常。見逃すと骨頭が潰れる。","若い女性の股関節痛で、痛風は考えにくい。","骨転移を疑う経過ではない（若い SLE の大量ステロイド中）。"],"core":"大量ステロイド（とくに SLE）開始後数か月の股関節痛・鼠径部痛＝大腿骨頭壊死を疑い MRI（X線は早期に正常）。","e":"MRI の T1 強調像で、骨頭の帯状の低信号（band pattern）が特徴。両側に起こることが多いので、反対側も調べる。\n危険因子：SLE、大量ステロイド（とくにパルス療法）、飲酒、抗リン脂質抗体。\n早期に見つければ免荷・骨切り術で温存できることもあり、骨頭が潰れたら人工骨頭・人工股関節。","tg":["ae","cs"]},{"id":"ae-970eb7b6","f":"ae","u":21,"o":112,"lv":3,"q":"62歳の男性。多発性筋炎でプレドニゾロン（プレドニン） 50 mg/日を開始し、一度は CK（creatine kinase：クレアチンキナーゼ） が正常化して筋力も回復した。開始から2か月後、再び太ももの筋力が落ちてきた。CK は正常のまま。最も考えられるのはどれか。","ch":["筋炎の再燃：ステロイドを倍量にする","甲状腺機能亢進症：抗甲状腺薬を始める","ステロイドミオパチー：減量とリハビリ","横紋筋融解症：大量の補液を行う"],"a":2,"cx":["筋炎の再燃なら CK が上がることが多い。CK 正常のまま増量すると、ミオパチーを悪化させるおそれがある。","甲状腺の病気を示す情報がない。","","横紋筋融解症なら CK が著明に上がる。"],"core":"CK が正常の近位筋力低下（ステロイド大量中）＝ステロイドミオパチー。CK が上がっている＝筋炎の再燃。MRI（筋の浮腫）も区別に役立つ。","e":"ステロイドミオパチーは、近位筋（とくに下肢）の萎縮と筋力低下で、筋電図・MRI で炎症の所見がない。フッ素を含むステロイド（デキサメタゾン（デカドロン）・ベタメタゾン）で起こりやすい。\n対策：ステロイドの減量、運動療法（レジスタンス運動）。\n筋炎の再燃の目安：CK・アルドラーゼの再上昇、MRI の STIR 像での筋の高信号。","tg":["ae","cs"]},{"id":"ae-5dc2a707","f":"ae","u":21,"o":113,"lv":2,"q":"プレドニゾロン（プレドニン）を朝1回内服している人のステロイド糖尿病について正しいものはどれか。","ch":["昼〜夕方の血糖が上がる","空腹時血糖が正常なら否定できる","夜間の低血糖に夕食を増やす","量によらず血糖は変わらない"],"a":0,"cx":["","朝の空腹時血糖は正常のことが多く、それだけでは見逃す。","夜間〜早朝は血糖が下がってくる。夕食を増やす必要はない。","量が多いほど血糖は上がる。"],"core":"ステロイド糖尿病＝食後高血糖・昼〜夕方が高く、早朝は戻る。HbA1c や空腹時血糖では見逃す → 昼食後・夕食前の血糖を測る。治療は朝の中間型インスリンや食前の速効型など。","e":"ステロイドは肝臓での糖新生を増やし、筋肉・脂肪でのインスリンの効きを落とす。\nプレドニゾロンの作用は内服の4〜8時間後に最も強い。\nステロイドを減らすと血糖も下がるので、インスリンや内服薬を同時に減らして低血糖を防ぐ。","tg":["ae"],"mt":["steroid"]},{"id":"ae-dc5ecac0","f":"ae","u":22,"o":114,"lv":1,"q":"グルココルチコイド誘発性骨粗鬆症の管理と治療のガイドライン2023（点数のつけ方は2014年版と同じ）で、3か月以上ステロイドを使う（予定を含む）人の薬物治療を決める点数の項目に含まれないのはどれか。","ch":["年齢","既存の脆弱性骨折","血清カルシウム値","ステロイドの1日量"],"a":2,"cx":["年齢：65歳以上 4 点、50〜65歳未満 2 点。","既存骨折は 7 点（あればそれだけで治療対象）。","","1日量（PSL（prednisolone：プレドニゾロン） 換算）：7.5 mg 以上 4 点、5〜7.5 mg 未満 1 点。"],"core":"GIOP（glucocorticoid-induced osteoporosis：グルココルチコイド誘発性骨粗鬆症） の点数＝既存骨折（7）＋年齢（65歳以上 4・50〜65歳未満 2）＋PSL（7.5 mg以上 4・5〜7.5 mg 1）＋腰椎骨密度（%YAM（young adult mean：若年成人平均値） 70未満 4・70〜80未満 2）。3点以上で治療。","e":"使い方：3か月以上の使用（予定を含む）で計算する。3点以上なら、骨密度がよくても治療する（ステロイドは骨の「質」を落とすので、骨密度が高めでも骨折する）。\n例：65歳以上なら年齢だけで4点 → 必ず治療。50〜65歳でも PSL 7.5 mg 以上なら 2＋4＝6 点。\n2023年版の変化：ステロイド開始時に胸腰椎 X線で椎体骨折を確認する、半年〜1年ごとに骨密度を測る。薬の推奨では、アレンドロン酸（フォサマック、ボナロン）・リセドロン酸が引き続き中心で、デノスマブ（プラリア）・テリパラチドの位置づけが上がった。","tg":["ae","gl"],"mt":["giop","osteo"]},{"id":"ae-10ad943a","f":"ae","u":22,"o":115,"lv":3,"q":"55歳の女性。皮膚筋炎でプレドニゾロン（プレドニン） 40 mg/日を始め、少なくとも半年は 7.5 mg/日以上が続く見込み。骨折の既往なし、腰椎骨密度 %YAM（young adult mean：若年成人平均値） 85%、腎機能正常、歯科治療の予定なし。骨粗鬆症の対応として最も適切なのはどれか。","ch":["骨密度が下がってから治療を始める","カルシウム製剤だけを処方しておく","開始と同時にビスホスホネートを始める","PSL（prednisolone：プレドニゾロン） を 7.5 mg 未満に減らしてから考える"],"a":2,"cx":["点数は年齢2点＋PSL（prednisolone：プレドニゾロン） 4点＝6点で治療対象。ステロイドの骨折は骨密度が保たれていても起こる。","カルシウムだけでは骨折予防の根拠が乏しい（ビタミンD・カルシウムは補助）。","","骨量は開始後3〜6か月で最も急に減る。開始時に予防するのが原則。"],"core":"50〜65歳（2点）＋PSL 7.5 mg 以上（4点）＝6点 ≧3 → 開始と同時に第一選択のビスホスホネート。","e":"ビスホスホネートの注意：\n・飲み方：朝起きてすぐ、コップ1杯の水で、30分は横にならず飲食しない（食道炎・吸収低下を防ぐ）。\n・顎骨壊死（ONJ（osteonecrosis of the jaw：顎骨壊死））：開始前に歯科の確認と口腔衛生。抜歯のときは歯科と相談。\n・非定型大腿骨骨折（AFF（atypical femoral fracture：非定型大腿骨骨折））：長期使用で大腿骨の外側の痛み（前駆痛）に注意。\n・腎機能が低い（クレアチニンクリアランス 35 mL/分未満など）ときは使いにくい → デノスマブ（プラリア）など。\n若い女性で妊娠の可能性があるときは、骨に長く残るビスホスホネートは慎重に（活性型ビタミンD などを考える）。","tg":["ae","cs"],"mt":["giop","osteo"]},{"id":"ae-6ffb19ba","f":"ae","u":22,"o":116,"lv":2,"q":"デノスマブ（プラリア）について正しいものはどれか。","ch":["使えるのは生涯で24か月までである","中止でリバウンド骨折が増える","腎機能が悪くても低 Ca 血症の心配はない","連日の皮下注射が必要である"],"a":1,"cx":["期間の上限があるのはテリパラチド（24か月）・ロモソズマブ（12か月）。","","腎機能低下・ビタミンD 不足の人ほど低カルシウム血症が起こりやすい。カルシウム・天然型ビタミンD の配合剤（デノタス）を併用する。","6か月ごとの皮下注射。"],"core":"デノスマブ＝抗RANKL（receptor activator of NF-κB ligand）抗体・6か月ごと皮下注・低 Ca 血症（腎障害で）・中止でリバウンド骨折→後をビスホスホネートでつなぐ。","e":"骨粗鬆症の薬のまとめ：\n・テリパラチド（フォルテオ：連日、テリボン：週1・2回）：骨をつくる。生涯で24か月まで。骨肉腫の危険がある人（骨パジェット病・骨への放射線治療歴）には使わない。高カルシウム血症。\n・アバロパラチド（オスタバロ）：18か月まで。\n・ロモソズマブ（イベニティ）：抗スクレロスチン抗体。月1回・12か月まで。心筋梗塞・脳卒中の既往（とくに1年以内）がある人では避ける。\n・デノスマブの後と、骨形成薬の後は、骨吸収抑制薬でつなぐ。","tg":["ae"],"mt":["osteo"]},{"id":"ae-d10590d3","f":"ae","u":22,"o":117,"lv":2,"q":"ビスホスホネート内服中の患者が抜歯を予定している。顎骨壊死の予防の考え方として、国内のポジションペーパー（2023年）に沿うものはどれか。","ch":["必ず1年間休薬してから抜歯する","抜歯の前日に倍量を内服させる","抜歯は一生してはいけない","原則休薬せず、口腔衛生を保つ"],"a":3,"cx":["休薬で顎骨壊死が減るという根拠は乏しく、休薬すると骨折が増える危険がある。","倍量にする根拠はなく、危険。","必要な抜歯は行う（感染した歯を残す方が顎骨壊死の危険になる）。",""],"core":"顎骨壊死（ONJ（osteonecrosis of the jaw：顎骨壊死））の予防＝治療前の歯科の確認と口腔衛生。抜歯のために骨吸収抑制薬を原則休薬しない（2023年ポジションペーパー）。","e":"顎骨壊死の危険因子：抜歯などの侵襲的な歯科治療、口腔の感染（歯周病）、ステロイド、糖尿病、喫煙、悪性腫瘍に使う高用量の骨吸収抑制薬（ゾレドロン酸（リクラスト）・デノスマブの高用量製剤）。骨粗鬆症の量ではまれ。\nデノスマブ（プラリア）の休薬は骨折のリバウンドが特に危険。\n医科と歯科の連携（お薬手帳での情報共有）が大切。","tg":["ae"],"mt":["osteo"]},{"id":"ae-9ebe6b72","f":"ae","u":22,"o":118,"lv":3,"q":"72歳の女性。骨粗鬆症でアレンドロン酸（フォサマック、ボナロン）を8年内服中、SLE（systemic lupus erythematosus：全身性エリテマトーデス） でプレドニゾロン（プレドニン） 7 mg/日も内服している。数週間前から右の太ももの外側が鈍く痛む。転倒はない。まず行う検査として最も適切なのはどれか。","ch":["腰椎の骨密度の測定だけ","膝関節の関節液の検査","血清の尿酸値の測定","両側の大腿骨全長の X 線"],"a":3,"cx":["骨密度では非定型骨折の前ぶれはわからない。","痛むのは太ももの外側で、膝関節の病変を示す情報はない。","尿酸値はこの症状と関係しない。",""],"core":"ビスホスホネート長期使用＋太ももの外側・鼠径部の前駆痛＝非定型大腿骨骨折（AFF（atypical femoral fracture：非定型大腿骨骨折））の前ぶれ。両側の大腿骨の X 線（外側の皮質の肥厚・横の骨折線）。","e":"非定型大腿骨骨折は大腿骨の骨幹部（転子下〜骨幹）に、軽い力で起こる横の骨折。半数近くは両側に起こる。\n危険因子：ビスホスホネート・デノスマブの長期使用（5年以上）、ステロイド、アジア人、大腿骨の弯曲。\n見つかったら骨吸収抑制薬を中止し、テリパラチド（連日はフォルテオ、週1・2回はテリボン）への切り替えや予防的な手術を整形外科と考える。\nビスホスホネートは5年ほど使ったら、骨折の危険を見て休薬（drug holiday）を考える。","tg":["ae","cs"],"mt":["osteo"]},{"id":"ae-e16e3c15","f":"ae","u":23,"o":119,"lv":2,"q":"NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） の副作用と対策の組み合わせで正しいものはどれか。","ch":["心血管 ― COX（cyclooxygenase：シクロオキシゲナーゼ）-2 選択的なら危険はない","消化性潰瘍 ― 高齢・ステロイド併用で PPI（proton pump inhibitor：プロトンポンプ阻害薬）","腎障害 ― 脱水のときほど安全に使える","アスピリン喘息 ― どの NSAIDs も安全"],"a":1,"cx":["COX-2 選択的阻害薬も心血管イベントを増やしうる（量と期間による）。","","脱水・利尿薬・ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬併用（\"triple whammy\"）で腎前性の急性腎障害を起こしやすい。","NSAIDs 過敏喘息では COX（cyclooxygenase：シクロオキシゲナーゼ）-1 を阻害する NSAIDs で発作が出る。COX-2 選択的阻害薬（セレコキシブ（セレコックス））は比較的安全とされるが、慎重に使う。"],"core":"NSAIDs＝胃（PPI）・腎（脱水・ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬/ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬）・利尿薬併用で AKI）・心血管・喘息（COX-1）。高齢者は少量・短期。","e":"・胃腸：COX-1 阻害でプロスタグランジンが減り、粘膜の防御が落ちる。危険因子は高齢・潰瘍の既往・ステロイド・抗血小板薬・抗凝固薬の併用。PPI か、COX-2 選択的阻害薬（セレコキシブ（セレコックス）：セレコックス）を選ぶ。\n・腎：腎血流はプロスタグランジンで保たれているので、脱水・心不全・肝硬変のときに急に悪くなる。高カリウム血症、ナトリウム貯留（浮腫・高血圧）も。\n・MTX（methotrexate：メトトレキサート） の腎排泄を減らす（併用中は腎機能に注意）。\n・妊娠：妊娠後期は胎児の動脈管を閉じさせるので禁忌。妊娠中期以降の長期使用は羊水過少の報告がある。\n・アセトアミノフェン（カロナール）は抗炎症作用が弱いが、胃腸・腎への影響が少ない（大量で肝障害）。","tg":["ae"]},{"id":"ae-a0b76da8","f":"ae","u":23,"o":120,"lv":2,"q":"アセトアミノフェン（カロナール）について正しいものはどれか。","ch":["国内の成人の1日最大量は 1,000 mg である","消化性潰瘍を NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） より多く起こす","腎血流を強く下げ、腎障害を起こしやすい","抗炎症作用は弱く、大量で肝障害が起こる"],"a":3,"cx":["国内の成人の1日最大量は 4,000 mg（1回 1,000 mg まで）。","胃粘膜への害は NSAIDs よりずっと少ない。","腎への影響も NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） より少なく、腎機能の悪い人・高齢者で使いやすい。",""],"core":"アセトアミノフェン＝解熱鎮痛（抗炎症は弱い）、胃・腎にやさしい、肝障害（大量・飲酒・低栄養で）。成人1日 4,000 mg まで。","e":"過量服用の解毒薬は N-アセチルシステイン。\n市販薬の風邪薬にも入っているので重複に注意。\n変形性関節症・高齢者の痛み・妊娠中の鎮痛に使いやすい。","tg":["ae"]},{"id":"ae-b16c5130","f":"ae","u":24,"o":121,"lv":2,"q":"シクロホスファミド（エンドキサン）大量間欠静注療法（IVCY（intravenous cyclophosphamide：シクロホスファミド間欠静注））の副作用と対策の組み合わせで正しいものはどれか。","ch":["膀胱癌 ― 累積量とは関係がない","骨髄抑制 ― 投与翌日が最低値になる","卵巣機能不全 ― 増量すると防げる","出血性膀胱炎 ― 補液とメスナ（ウロミテキサン）"],"a":3,"cx":["膀胱癌・血液腫瘍は累積量が多いほど増える（とくに経口の長期使用）。","白血球の最低値（nadir）は投与の 10〜14 日後。その頃に血算を測って次回の量を決める。","卵巣機能不全は累積量と年齢で増える。GnRH アゴニスト（リュープロレリン（リュープリン）：リュープリン）で卵巣を守る方法がある。",""],"core":"IVCY：代謝物アクロレインが膀胱を傷つける → 補液・メスナ・頻回排尿。nadir は 10〜14 日後。卵巣・精巣毒性は累積量と年齢で増える。","e":"代表的なレジメン：\n・NIH 法（ループス腎炎）：0.5〜1 g/m² を月1回×6回。\n・Euro-Lupus 法：500 mg を2週ごと×6回（累積 3 g）。性腺毒性が少なく、欧州の白人で NIH 法と同等。\n・ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） 関連血管炎：15 mg/kg（年齢・腎機能で減量）を2〜3週ごと。\nそのほか：吐き気（制吐薬）、脱毛、感染症（ニューモシスチス肺炎の予防）、催奇形性（妊娠中は使わない）、低ナトリウム血症（抗利尿作用）。\n精子の凍結保存・卵子の凍結保存の相談も、可能なら治療前に行う。","tg":["ae"]},{"id":"ae-4026758d","f":"ae","u":24,"o":122,"lv":2,"q":"アザチオプリン（イムラン、アザニン）を始める前に、日本人で確認が勧められ、保険で測れる遺伝子検査はどれか。","ch":["HLA（human leukocyte antigen：ヒト白血球抗原）-B*58:01","TPMT（thiopurine S-methyltransferase） の遺伝子多型だけ","G6PD（glucose-6-phosphate dehydrogenase：グルコース-6-リン酸脱水素酵素） 欠損","NUDT15（nudix hydrolase 15（チオプリンを分解する酵素の遺伝子）） の遺伝子多型"],"a":3,"cx":["HLA-B*58:01 はアロプリノール（ザイロリック）の重症薬疹（SJS/TEN）の危険因子。","TPMT は欧米で重要だが、日本人では変異が少なく、NUDT15（nudix hydrolase 15（チオプリンを分解する酵素の遺伝子）） の方が重要。","G6PD 欠損はダプソン（レクチゾール）・プリマキン・ラスブリカーゼなどで溶血を起こす。",""],"core":"日本人のチオプリン（アザチオプリン）の重い白血球減少・全脱毛＝NUDT15 の Cys/Cys 型。開始前に検査し、Cys/Cys は使わない。","e":"NUDT15 の R139C（Arg/Cys・Cys/Cys）をもつ人は、チオプリンの活性代謝物が多く残り、ごく少量でも重い骨髄抑制・脱毛が起こる。日本人の約1%が Cys/Cys で、約2割がヘテロ。ヘテロは少ない量から始める。\n相互作用：アザチオプリンはキサンチンオキシダーゼ（XO（xanthine oxidase：キサンチンオキシダーゼ））で分解されるので、フェブキソスタット（フェブリク）・トピロキソスタット（トピロリック）とは併用禁忌、アロプリノール（ザイロリック）と併用するなら量を 1/3〜1/4 に減らす。\n妊娠中も使える免疫抑制薬（SLE（systemic lupus erythematosus：全身性エリテマトーデス）・炎症性腸疾患で使われる）。","tg":["ae"],"mt":["preg"]},{"id":"ae-2beddf12","f":"ae","u":24,"o":123,"lv":2,"q":"リツキシマブ（リツキサン）の副作用として、くり返し使う人で特に注意するものはどれか。","ch":["間質性腎炎による腎不全","高カリウム血症と不整脈","低ガンマグロブリン血症と感染症","甲状腺機能亢進症（バセドウ病）"],"a":2,"cx":["間質性腎炎はリツキシマブの典型的な副作用ではない。","高カリウム血症はリツキシマブの典型ではない（ST合剤（スルファメトキサゾール・トリメトプリム：バクタ）・ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬など）。","","甲状腺の副作用は免疫チェックポイント阻害薬で多い。"],"core":"リツキシマブ＝B細胞を数か月〜1年消す。投与時反応（初回）・低ガンマグロブリン血症・B型肝炎の再活性化（最も危険が高い薬の一つ）・PML（progressive multifocal leukoencephalopathy：進行性多巣性白質脳症）・ワクチン効果の低下。","e":"投与時反応（発熱・悪寒・血圧低下・気管支れん縮）は初回に多く、抗ヒスタミン薬・アセトアミノフェン・ステロイドの前投与と、ゆっくりした点滴で減らす。\nくり返し使う前に IgG を測り、低い（とくに 400 mg/dL 未満）で感染をくり返すなら、免疫グロブリンの補充を考える。\nPML（進行性多巣性白質脳症：JC ウイルス）はまれだが重い（認知・運動の障害）。\n国内で膠原病に使える病気：多発血管炎性肉芽腫症・顕微鏡的多発血管炎、全身性強皮症、難治性のネフローゼ症候群、免疫性血小板減少症など（RA（rheumatoid arthritis：関節リウマチ） には適応がない）。","tg":["ae"]},{"id":"ae-5f632bbe","f":"ae","u":24,"o":124,"lv":3,"q":"64歳の男性。顕微鏡的多発血管炎の維持療法でアザチオプリン（イムラン、アザニン） 100 mg/日を内服中。痛風で他院からフェブキソスタット（フェブリク）を処方され、3週間後に白血球 900/μL、血小板 4万/μL、口内炎が出た。最も考えられる原因はどれか。","ch":["XO（xanthine oxidase：キサンチンオキシダーゼ） 阻害による AZA（azathioprine：アザチオプリン） の蓄積","MPA（microscopic polyangiitis：顕微鏡的多発血管炎） の再燃による骨髄の障害","フェブキソスタット単独の重い薬疹","痛風発作による一時的な白血球減少"],"a":0,"cx":["","MPA の再燃で汎血球減少は典型ではない（むしろ白血球は増える）。","皮疹の記載がなく、骨髄抑制の説明にならない。","痛風発作では白血球はむしろ増える。"],"core":"アザチオプリン（6-MP）はキサンチンオキシダーゼで分解される。フェブキソスタット・トピロキソスタットとは併用禁忌、アロプリノール（ザイロリック）なら AZA を1/3〜1/4 に。","e":"対応：アザチオプリンとフェブキソスタットを中止し、G-CSF・感染対策。回復後に、尿酸の治療は排泄促進薬（ベンズブロマロン（ユリノーム）・ドチヌラド）などへ替えることを考える。\n同じ相互作用は 6-メルカプトプリン（ロイケリン）でも起こる。\n処方の重なりを防ぐため、お薬手帳と病院どうしの情報共有を勧める。","tg":["ae","cs"],"fig":["urate"]},{"id":"ae-4bcc50d1","f":"ae","u":24,"o":125,"lv":3,"q":"70歳の男性。家族性地中海熱でコルヒチン 1 mg/日を内服中。肺炎でクラリスロマイシン（クラリス）が処方され、4日後から激しい下痢、四肢の筋力低下、CK（creatine kinase：クレアチンキナーゼ） 上昇、白血球減少が出た。最も考えられるのはどれか。","ch":["コルヒチン中毒","敗血症性ショックだけ","家族性地中海熱の発作","偽膜性腸炎だけ"],"a":0,"cx":["","ショックの所見はなく、筋障害と骨髄抑制の組み合わせはコルヒチン中毒に典型的。","FMF（familial Mediterranean fever：家族性地中海熱） の発作は発熱と漿膜炎で、骨髄抑制・筋障害は起こさない。","偽膜性腸炎でも下痢は出るが、筋障害・骨髄抑制は説明できない。"],"core":"コルヒチン＋強い CYP3A4（cytochrome P450 3A4：薬物代謝酵素）/P 糖蛋白阻害薬（クラリスロマイシン・シクロスポリン・アゾール系など）＝中毒（下痢・横紋筋融解・骨髄抑制・多臓器不全）。腎・肝障害のある人では併用禁忌。","e":"コルヒチンには解毒薬がなく、透析でも除けない。中止と支持療法が中心で、死亡することもある。\nコルヒチンを飲んでいる人の抗菌薬は、相互作用の少ないものを選ぶ。\n長期のコルヒチンと高齢・腎障害でもミオパチー・神経障害が起こる。","tg":["ae","cs"]},{"id":"ae-703924a1","f":"ae","u":24,"o":126,"lv":2,"q":"ミコフェノール酸モフェチル（セルセプト）の副作用と注意として正しいものはどれか。","ch":["高尿酸血症と痛風","歯肉の増殖と多毛","出血性膀胱炎","下痢と白血球減少"],"a":3,"cx":["高尿酸血症はシクロスポリン（ネオーラル）・利尿薬などで起こる。","歯肉の増殖・多毛はシクロスポリン（ほかにフェニトイン・カルシウム拮抗薬）の副作用。","出血性膀胱炎はシクロホスファミド（アクロレイン）。",""],"core":"MMF（mycophenolate mofetil：ミコフェノール酸モフェチル）＝下痢・腹痛（最も多い）、白血球減少、感染症（CMV（cytomegalovirus：サイトメガロウイルス） など）、催奇形性（妊娠の6週以上前に中止・確実な避妊）。","e":"ループス腎炎の導入は 2〜3 g/日、維持は 1〜2 g/日が目安。消化器症状は分割・減量で軽くなることが多い。\nMMF は全身性強皮症の間質性肺疾患・皮膚硬化、筋炎、血管炎の維持でも使われる（国内の保険適用はループス腎炎など）。\n制酸剤（マグネシウム・アルミニウム）・コレスチラミンで吸収が下がる。","tg":["ae"],"mt":["sletx"]},{"id":"ae-258b03ae","f":"ae","u":24,"o":127,"lv":3,"q":"40歳の女性。関節リウマチでインフリキシマブ（レミケード）を2年使用中。顔の紅斑と、両手の関節痛の悪化、胸膜炎が出た。抗核抗体 640倍、抗dsDNA（double-stranded DNA：二本鎖DNA） 抗体陽性、抗ヒストン抗体陽性、補体は正常、腎・中枢症状なし。対応として最も適切なのはどれか。","ch":["すぐに血漿交換を行う","インフリキシマブを増量する","インフリキシマブを中止し、他の薬に替える","SLE（systemic lupus erythematosus：全身性エリテマトーデス） と診断し、IVCY（intravenous cyclophosphamide：シクロホスファミド間欠静注） を始める"],"a":2,"cx":["血漿交換が必要な重症の状態ではない。","薬剤誘発性ループスでは原因薬を続けると悪化する。","","腎・中枢症状のない薬剤誘発性ループスに、強い免疫抑制は不要（多くは中止で良くなる）。"],"core":"TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬による薬剤誘発性ループス＝抗dsDNA 抗体も陽性になりやすい（ほかの薬剤性ループスと違う）。皮疹・関節炎・漿膜炎。中止で数週〜数か月で良くなる。RA（rheumatoid arthritis：関節リウマチ） の治療は別の作用の薬（IL-6（interleukin-6：インターロイキン6）・アバタセプト・JAK（Janus kinase：ヤヌスキナーゼ））へ。","e":"TNF 阻害薬で抗核抗体・抗dsDNA 抗体が陽性になる人は多いが、症状が出る（ループス）のは少数。抗体陽性だけなら中止は必須ではない。\n症状が強ければ短期のステロイド・ヒドロキシクロロキン。\n同じ TNF 阻害薬の別の製剤でも起こりうる。","tg":["ae","cs"]},{"id":"preg-7b7dd4ce","f":"preg","u":25,"o":128,"lv":1,"q":"妊娠を計画している女性で、妊娠前に中止（または変更）しなければならない薬はどれか。","ch":["タクロリムス（プログラフ）の内服","ミコフェノール酸モフェチル（セルセプト）","アザチオプリン（イムラン、アザニン）","ヒドロキシクロロキン（プラケニル）"],"a":1,"cx":["タクロリムスは妊娠中も使える（2018年に国内の添付文書の禁忌から外れた）。","","アザチオプリンは妊娠中も使える免疫抑制薬。","ヒドロキシクロロキンは妊娠中も続ける（中止すると SLE（systemic lupus erythematosus：全身性エリテマトーデス） が再燃しやすく、先天性心ブロックの予防にもなる）。"],"core":"妊娠前に止める：MTX（1月経周期以上前）・ミコフェノール酸（6週間以上前）・シクロホスファミド・レフルノミド（ウォッシュアウト）・ワルファリン・JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬。続けてよい：PSL（prednisolone：プレドニゾロン）・HCQ（hydroxychloroquine：ヒドロキシクロロキン）・SASP（salazosulfapyridine：サラゾスルファピリジン）・AZA（azathioprine：アザチオプリン）・タクロリムス・シクロスポリン・TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬。","e":"ミコフェノール酸は流産と先天異常（口唇口蓋裂・小耳症・外耳道閉鎖など）を起こす。妊娠を計画するなら少なくとも6週間前にアザチオプリンなどへ替え、病気が落ち着いていることを確かめてから妊娠する。\nワルファリン（ワーファリン）は妊娠6〜12週で胎児のワルファリン胎芽症（鼻の低形成・点状軟骨異形成）を起こすので、妊娠がわかったらすぐ（できれば6週までに）ヘパリンへ替える。\nACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬・ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬） は妊娠中期以降に胎児の腎障害を起こすので、妊娠の計画とともに替える。\nボセンタン（トラクリア）などエンドセリン受容体拮抗薬も催奇形性があり禁忌。","tg":["ae"],"mt":["preg"]},{"id":"preg-2a8ce32d","f":"preg","u":25,"o":129,"lv":2,"q":"妊娠中の関節リウマチ患者に TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬を使うとき、胎盤を通りにくく、妊娠後期まで使いやすいとされるのはどれか。","ch":["アダリムマブ（ヒト型の抗体）","ゴリムマブ（ヒト型の抗体）","インフリキシマブ（点滴の抗体）","セルトリズマブペゴル（シムジア）"],"a":3,"cx":["アダリムマブも IgG1 で、妊娠後期に胎児へ移行する。","ゴリムマブも IgG1 で、同じように移行する。","インフリキシマブは IgG1 の抗体で、妊娠後期に胎盤を通り、出生児の血中に数か月残る。",""],"core":"Fc をもたないセルトリズマブペゴルは、胎盤の FcRn に運ばれず、臍帯血にほとんど出ない。","e":"IgG の胎盤移行は妊娠20週ごろから増え、後期に最も多くなる。そのため、ほかの TNF 阻害薬は病気が落ち着いていれば妊娠中期〜後期に休薬を考えることがある（再燃の危険と比べて決める）。\n妊娠後期まで Fc をもつ生物学的製剤を使った母親の児は、生後6か月まで BCG・ロタウイルスなどの生ワクチンを避ける。\n授乳中は、ほとんどの生物学的製剤は母乳への移行が少なく、児の腸でも吸収されにくいので続けられる。","tg":["ae"],"mt":["preg","bdmard"]},{"id":"preg-aa208ec9","f":"preg","u":25,"o":130,"lv":2,"q":"授乳中に「原則として使わない」とされる薬はどれか。","ch":["プレドニゾロン（プレドニン） 10 mg/日","ヒドロキシクロロキン（プラケニル）","メトトレキサート（リウマトレックス、皮下注はメトジェクト）","エタネルセプト（エンブレル）"],"a":2,"cx":["プレドニゾロンは母乳への移行が少ない。20 mg/日を超えるときは、内服から4時間ほどあけて授乳すると児への量がさらに減る。","ヒドロキシクロロキンは授乳中も使える。","","エタネルセプトなどの生物学的製剤は大きな分子で、母乳への移行と児の吸収が少ない。"],"core":"授乳中に避ける：MTX（methotrexate：メトトレキサート）・ミコフェノール酸・シクロホスファミド・レフルノミド・JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬（データ不足）。使える：PSL（prednisolone：プレドニゾロン）・HCQ（hydroxychloroquine：ヒドロキシクロロキン）・SASP（salazosulfapyridine：サラゾスルファピリジン）・AZA（azathioprine：アザチオプリン）・タクロリムス・シクロスポリン・ほとんどの生物学的製剤・NSAIDs（イブプロフェンなど）。","e":"MTX は少量でも母乳に移行して児の体内に蓄積しうるので、国内の添付文書では授乳婦に禁忌。\nサラゾスルファピリジン（アザルフィジンEN）は、早産児・黄疸・G6PD（glucose-6-phosphate dehydrogenase：グルコース-6-リン酸脱水素酵素） 欠損の児では注意（ビリルビンを押し出す）。\n授乳中の NSAIDs は半減期が短いもの（イブプロフェン・ロキソプロフェン）が選ばれる。","tg":["ae"],"mt":["preg"]},{"id":"preg-4bab0ec7","f":"preg","u":25,"o":131,"lv":3,"q":"30歳の女性。SLE（ループス腎炎 III 型の既往）で妊娠を希望している。プレドニゾロン（プレドニン） 7.5 mg・ミコフェノール酸モフェチル 2 g・ヒドロキシクロロキンを内服中で、この1年は活動性が低く、尿蛋白は陰性。抗SS-A 抗体陽性、抗リン脂質抗体陰性。妊娠に向けた対応として最も適切なのはどれか。","ch":["MMF（mycophenolate mofetil：ミコフェノール酸モフェチル） を AZA（azathioprine：アザチオプリン） などに替え、HCQ（hydroxychloroquine：ヒドロキシクロロキン） は続け、半年安定を確かめる","すべての薬を中止して、すぐに妊娠を試みる","MMF（mycophenolate mofetil：ミコフェノール酸モフェチル） は続け、ヒドロキシクロロキン（プラケニル）を中止する","抗SS-A 抗体陽性なので妊娠は勧められないと伝える"],"a":0,"cx":["","薬を全部やめると再燃しやすく、腎炎の再燃は母児ともに危険。","逆。ミコフェノール酸は催奇形性があり替える。ヒドロキシクロロキンは続けた方が再燃と先天性心ブロックを減らす。","抗SS-A 抗体陽性でも多くは無事に出産できる（先天性心ブロックは約1〜2%）。胎児心エコーで見ていく。"],"core":"SLE の妊娠＝病気が6か月以上落ち着いてから計画。MMF→AZA/タクロリムス（プログラフ）、HCQ は継続、抗SS-A 陽性は妊娠16〜26週ごろに胎児心拍・心エコーで心ブロックを確認。","e":"妊娠中に起こりやすいこと：SLE の再燃、妊娠高血圧腎症、早産、胎児発育不全。抗リン脂質抗体陽性なら低用量アスピリン（＋既往によりヘパリン）。\n妊娠高血圧腎症の予防として、SLE の妊婦では低用量アスピリンを妊娠12〜16週ごろから使うことが多い。\n抗SS-A 抗体：胎盤を通って胎児の心臓の伝導系を傷つける。前の児に心ブロックがあった人は再発率が約15〜20%に上がる。ヒドロキシクロロキンで再発が減ると報告されている。新生児ループス（環状紅斑・肝障害・血球減少）は生後6か月ごろまでに消える。","tg":["ae","cs"],"mt":["preg"]},{"id":"preg-a9bc3e1f","f":"preg","u":25,"o":132,"lv":2,"q":"妊娠30週の SLE（systemic lupus erythematosus：全身性エリテマトーデス） の女性に、高血圧と蛋白尿が新たに出た。ループス腎炎の再燃よりも妊娠高血圧腎症を考える所見はどれか。","ch":["補体正常・抗dsDNA（double-stranded DNA：二本鎖DNA） 上昇なし・円柱なし","尿沈渣に赤血球円柱・変形赤血球がある","皮疹や関節炎など他の症状も出ている","補体が下がり、抗dsDNA（double-stranded DNA：二本鎖DNA） 抗体が上がる"],"a":0,"cx":["","活動性の尿沈渣（赤血球円柱）は糸球体腎炎を示す。","腎以外の SLE 症状を伴えば、再燃の可能性が高い。","補体の低下と抗dsDNA 抗体の上昇は SLE の活動性を示し、腎炎の再燃を考える。"],"core":"妊娠高血圧腎症＝妊娠20週以降・補体正常・沈渣は非活動性・血小板減少・肝酵素上昇・尿酸↑。腎炎の再燃＝補体↓・抗dsDNA↑・活動性沈渣。","e":"両方が重なることもある。区別がつかないときは、sFlt-1/PlGF 比（妊娠高血圧腎症で上がる）も参考になる。\n妊娠高血圧腎症の根本治療は分娩。腎炎の再燃なら、妊娠中も使えるステロイド・アザチオプリン・タクロリムスで治療する。\n妊娠中は生理的に補体が上がるので、「正常範囲だが前より下がった」も意味がある。","tg":["ae"]},{"id":"preg-c1bbf338","f":"preg","u":25,"o":133,"lv":1,"q":"関節リウマチの妊娠中と産後の経過として、一般的に知られているものはどれか。","ch":["妊娠は経過にまったく影響しない","妊娠すると関節リウマチは完全に治る","妊娠中は軽くなり、産後に悪化しやすい","妊娠中に必ず悪化し、産後に自然に治る"],"a":2,"cx":["影響は大きく、とくに産後3か月以内の再燃が多い。","妊娠中に軽くなっても、治るわけではない。","","妊娠中に悪化する人もいるが、半数前後は軽くなる。産後に治ることはない。"],"core":"RA（rheumatoid arthritis：関節リウマチ）：妊娠中は約半数で軽快、産後3か月以内の再燃が多い（産後に治療を早めに再開・調整）。SLE（systemic lupus erythematosus：全身性エリテマトーデス） は妊娠中・産後とも再燃しうる。","e":"妊娠中の免疫の変化（制御性T細胞の増加・Th2 優位・胎盤のホルモン）で RA は軽くなりやすい。ACPA（anti-citrullinated protein antibody：抗シトルリン化タンパク抗体）・RF（rheumatoid factor：リウマトイド因子） 陰性の人の方が軽くなりやすいとの報告がある。\n疾患活動性が高いまま妊娠すると、早産・低出生体重が増えるので、妊娠前から病気を落ち着かせ、妊娠中も使える薬で管理する。\n授乳中も使える薬を選べば、授乳は可能。","tg":["ae"],"mt":["preg"]},{"id":"preg-657cb251","f":"preg","u":25,"o":134,"lv":2,"q":"男性の患者で、精子をつくる働き（妊孕性）への影響を考えて、治療の前に精子の凍結保存を相談する薬はどれか。","ch":["TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬","シクロホスファミド（エンドキサン）","ヒドロキシクロロキン（プラケニル）","アザチオプリン（イムラン、アザニン）"],"a":1,"cx":["TNF 阻害薬は男性の妊孕性・胎児への影響の報告が乏しく、続けてよいとされる。","","ヒドロキシクロロキンは男性の妊孕性への影響が少ない。","アザチオプリンは男性で続けてよいとされる。"],"core":"シクロホスファミド＝男女とも性腺毒性（累積量・年齢で増える）。可能なら精子・卵子の保存、女性は GnRH アゴニストで卵巣保護。SASP（salazosulfapyridine：サラゾスルファピリジン） は可逆的な精子減少。","e":"男性の薬の扱いの目安（海外の推奨）：シクロホスファミドは妊娠計画の3か月前に中止。サラゾスルファピリジン（アザルフィジンEN）は精子数が減って不妊の原因になりうる（中止で回復）。MTX（methotrexate：メトトレキサート） は男性では中止不要とする海外の推奨と、中止を勧める国内の資料がある。\n若い人の重い腎炎・血管炎では、性腺毒性の少ない治療（MMF（mycophenolate mofetil：ミコフェノール酸モフェチル）・リツキシマブ）を選ぶことも多い。","tg":["ae"],"mt":["preg"]},{"id":"preg-c2279363","f":"preg","u":25,"o":135,"lv":2,"q":"妊娠が「勧められない（危険が非常に高い）」病態はどれか。","ch":["抗SS-A 抗体陽性で症状のないシェーグレン病","6か月以上落ち着いている SLE（systemic lupus erythematosus：全身性エリテマトーデス）","寛解している関節リウマチ","重い肺動脈性肺高血圧症"],"a":3,"cx":["抗SS-A 抗体陽性でも、胎児の心拍を見ながら多くは無事に出産できる。","6か月以上落ち着いている SLE は妊娠を計画しやすい状態。","寛解している RA（rheumatoid arthritis：関節リウマチ） は妊娠に適した状態。",""],"core":"重い PAH（母体の死亡率が高い）・重い心不全・重い腎機能障害・強皮症の腎クリーゼの直後・活動性のループス腎炎では、妊娠は勧められない（または延期）。","e":"妊娠中は循環血液量が約4〜5割増え、右心に大きな負担がかかる。PAH の妊婦の死亡率は高い。\n妊娠を避けるべき病態の患者には、確実な避妊法（エストロゲンを含む薬は血栓の危険がある人では避ける）を相談する。\n抗リン脂質抗体陽性の人はエストロゲン製剤で血栓が増えるので、黄体ホルモン単独や子宮内避妊具を考える。","tg":["ae"]},{"id":"preg-7edd6504","f":"preg","u":25,"o":136,"lv":3,"q":"32歳の女性。関節リウマチで MTX（methotrexate：メトトレキサート） 12 mg/週とアダリムマブ（ヒュミラ）で寛解している。1年以内の妊娠を希望。治療の調整として最も適切なのはどれか。","ch":["MTX を1月経周期以上前に中止し、TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬で管理する","MTX をレフルノミド（アラバ）に替えて妊娠を試みる","MTX とアダリムマブを続けたまま妊娠を試みる","すべての薬をやめ、NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） だけで妊娠を待つ"],"a":0,"cx":["","レフルノミドも催奇形性があり、さらに体内に長く残る（コレスチラミン（クエストラン）での除去が必要）。","MTX は催奇形性があり、妊娠前に中止が必要。","全部やめると再燃しやすく、再燃は妊娠の成績を悪くする。NSAIDs は妊娠後期に禁忌。"],"core":"RA（rheumatoid arthritis：関節リウマチ） の妊娠準備＝MTX を1月経周期以上前に中止（葉酸は続ける）、TNF 阻害薬（妊娠中はセルトリズマブペゴル（シムジア）が使いやすい）・SASP（salazosulfapyridine：サラゾスルファピリジン）・PSL（prednisolone：プレドニゾロン）・タクロリムスで落ち着かせる。","e":"アダリムマブのまま妊娠し、病気が落ち着いていれば、妊娠中期以降に休薬するか、セルトリズマブペゴルへ替えることを考える。\n産後の再燃に備え、産後早めに治療を再開・強化する。授乳中も TNF 阻害薬は使える。\n妊娠前から葉酸（神経管閉鎖障害の予防）を内服する。","tg":["ae","cs"],"mt":["preg"]},{"id":"preg-508e612e","f":"preg","u":26,"o":137,"lv":2,"q":"関節リウマチで人工膝関節置換術を予定している。ACR（American College of Rheumatology：米国リウマチ学会）/AAHKS（米国股関節膝関節外科学会）の周術期の指針（2022年）に沿った薬の扱いとして正しいものはどれか。","ch":["ステロイドは手術の1週間前から中止する","MTX（methotrexate：メトトレキサート） は手術の2か月前から中止しておく","MTX（methotrexate：メトトレキサート） は継続、生物学的製剤は間隔の終わりに手術","生物学的製剤は続け、投与日の翌日に手術する"],"a":2,"cx":["ステロイドは急に止めると副腎不全を起こす。普段の量を続ける。","MTX を続けても創部の感染は増えず、止めると再燃しやすい。続ける。","","投与直後は薬の血中濃度が最も高い。次の投与日の直前（間隔の終わり）に手術を予定する。"],"core":"周術期：MTX・SASP（salazosulfapyridine：サラゾスルファピリジン）・HCQ（hydroxychloroquine：ヒドロキシクロロキン）・レフルノミドは継続、生物学的製剤は「間隔の終わり」に手術、JAK（Janus kinase：ヤヌスキナーゼ） は3日前に中止、ステロイドは普段の量を続ける。再開は創が治ってから（目安2週間）。","e":"生物学的製剤の例（指針の考え方）：4週ごとの薬なら最後の投与の5週目に手術、2週ごとなら3週目。\n傷が問題なく治り、抜糸がすみ、感染がなければ（おおむね術後14日）再開する。\nSLE（systemic lupus erythematosus：全身性エリテマトーデス） では重症例なら免疫抑制薬（ミコフェノール酸・タクロリムス・アザチオプリン）を続け、軽症なら術前1週間ほど止めるという考え方。\nステロイドについて、指針は人工関節の手術では「普段の量を続け、余分なストレス量は使わない」としている。大手術・長期大量使用では、内分泌の考え方に沿って補う施設も多い。","tg":["ae"]},{"id":"preg-7e05db3f","f":"preg","u":27,"o":138,"lv":2,"q":"高齢で発症した関節リウマチ（EORA）の特徴として正しいものはどれか。","ch":["男女比は若年発症より女性に大きく偏っている","RF（rheumatoid factor：リウマトイド因子）・ACPA（anti-citrullinated protein antibody：抗シトルリン化タンパク抗体） の陽性率は若年発症より高い","急な発症で大関節が目立ち、PMR（polymyalgia rheumatica：リウマチ性多発筋痛症） と紛らわしい","腎機能が良いので MTX（methotrexate：メトトレキサート） を多めに使える"],"a":2,"cx":["高齢発症では男女差が小さくなる。","RF・ACPA 陰性の例が若年より多い。","","高齢者は腎機能が落ちていることが多く、MTX は少なめ（週4〜6 mg）から始める。"],"core":"EORA（60〜65歳以降の発症）＝急な発症・大関節・男女差が小さい・血清反応陰性が多い → PMR・RS3PE（remitting seronegative symmetrical synovitis with pitting edema）・偽痛風・腫瘍随伴症候群と鑑別。","e":"鑑別のポイント：\n・PMR：肩・腰帯のこわばり、末梢の滑膜炎は少ない、少量ステロイド（PSL（prednisolone：プレドニゾロン） 12.5〜25 mg/日）に劇的に反応。巨細胞性動脈炎の合併に注意。\n・RS3PE：手背・足背の圧痕性浮腫、急な発症、血清反応陰性、ステロイドが著効、悪性腫瘍の合併を探す。\n・偽痛風（CPPD（calcium pyrophosphate deposition：ピロリン酸カルシウム沈着症））：手関節・膝、X線の軟骨石灰化。\n高齢者の治療の注意：腎機能・肺病変（間質性肺炎）・感染症・骨粗鬆症。生物学的製剤はアバタセプト（オレンシア）など感染の少ない薬が選ばれることもある。","tg":["ae"],"mt":["elderly"]},{"id":"preg-b8490fea","f":"preg","u":27,"o":139,"lv":2,"q":"若年性特発性関節炎（JIA（juvenile idiopathic arthritis：若年性特発性関節炎））のうち、少関節型で抗核抗体陽性の幼児に特に注意すべき合併症と、その対策はどれか。","ch":["無症状のぶどう膜炎：定期的な眼科検査","大動脈弁閉鎖不全：毎月の心エコー","MAS（マクロファージ活性化）：毎週フェリチン","環軸椎亜脱臼：毎月の頸椎 MRI（magnetic resonance imaging）"],"a":0,"cx":["","大動脈弁閉鎖不全は強直性脊椎炎（体軸性脊椎関節炎）・再発性多発軟骨炎などで起こる。","マクロファージ活性化症候群（MAS）は全身型 JIA の重い合併症。","頸椎病変は多関節型で起こりうるが、毎月の MRI は不要。"],"core":"少関節型 JIA＋抗核抗体陽性＋幼い女児＝無症状の慢性前部ぶどう膜炎 → 3か月ごとなど定期的な眼科検査（症状が出たときは手遅れのことがある）。","e":"JIA（16歳未満で発症し6週間以上続く原因不明の関節炎）の病型：\n・全身型：弛張熱（1日1〜2回のスパイク）、サーモンピンク疹、肝脾腫・漿膜炎。MAS（フェリチン著増・血球減少・凝固異常）が重い合併症。治療はステロイド、トシリズマブ（アクテムラ）、カナキヌマブ（イラリス）。\n・少関節型（4関節以下）：最も多い。膝・足関節。抗核抗体陽性の幼児はぶどう膜炎が多い。\n・多関節型（RF（rheumatoid factor：リウマトイド因子） 陽性・陰性）：RF 陽性は成人 RA（rheumatoid arthritis：関節リウマチ） とほぼ同じ。\n・付着部炎関連関節炎（年長の男児、HLA（human leukocyte antigen：ヒト白血球抗原）-B27）、乾癬性関節炎。\n多関節型の治療は MTX（methotrexate：メトトレキサート）→生物学的製剤（TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬・トシリズマブ・アバタセプト）。JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬はバリシチニブ（2024年）・ウパダシチニブ（2026年）が多関節型に承認された。","tg":["ae"]},{"id":"preg-0addbae7","f":"preg","u":27,"o":140,"lv":2,"q":"全身型若年性特発性関節炎（sJIA（systemic JIA：全身型若年性特発性関節炎））で、急に血球が減り、フェリチンが著しく上がり、フィブリノゲンが低下し、肝機能が悪化した。最も考えられる合併症と治療はどれか。","ch":["敗血症：抗菌薬だけで治療する","MDS：そのまま経過観察する","MAS（macrophage activation syndrome：マクロファージ活性化症候群）：パルスとシクロスポリン（ネオーラル）","鉄欠乏性貧血：鉄剤を内服する"],"a":2,"cx":["感染症の除外は必要だが、フェリチン著増・フィブリノゲン低下の組み合わせは MAS（macrophage activation syndrome：マクロファージ活性化症候群） を強く疑う。","急性の経過で、経過観察は危険。","","鉄欠乏ではフェリチンは低い。"],"core":"MAS（マクロファージ活性化症候群）＝sJIA・成人スチル病・SLE（systemic lupus erythematosus：全身性エリテマトーデス） の重い合併症。フェリチン著増・血球減少・フィブリノゲン↓・中性脂肪↑・肝障害・赤沈の低下（フィブリノゲンが減るため）。","e":"原病が活動していると赤沈は上がるが、MAS ではフィブリノゲンが消費されて赤沈がむしろ下がるのが手がかり。\n治療：ステロイドパルス、シクロスポリン、IVIG（intravenous immunoglobulin：免疫グロブリン大量静注療法）、重症例はエトポシド（ベプシド、ラステット）・血漿交換。抗IL-1（interleukin-1：インターロイキン1）・抗IL-6（interleukin-6：インターロイキン6） は原病の治療で使われる。\n感染症（EBV（Epstein-Barr virus） など）が引き金になることがあり、同時に調べる。","tg":["ae"],"mt":["fever"]},{"id":"spa-48c8583a","f":"spa","u":28,"o":141,"lv":1,"q":"「炎症性腰背部痛」の特徴として正しいものはどれか。","ch":["安静にすると改善し、朝のこわばりはない","運動で良くなり、安静では良くならない","50歳を過ぎてから急に始まる","夜間の痛みはなく、日中の動作で悪化する"],"a":1,"cx":["安静で良くなるのは機械的腰痛。炎症性は朝のこわばりが30分以上続く。","","発症は40歳未満（多くは10代後半〜30代）で、じわじわ始まる。","夜間（とくに明け方）の痛みで目が覚めるのが特徴。動作で悪化するのは機械的腰痛。"],"core":"炎症性腰背部痛（ASAS（Assessment of SpondyloArthritis international Society））＝40歳未満の発症・潜行性・運動で改善・安静で改善しない・夜間痛（起きると良くなる）。3か月以上続く。","e":"5項目のうち4項目以上で「炎症性」と判断する（ASAS の専門家の基準）。ほかに、殿部の左右に移る痛み（仙腸関節炎）、NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） がよく効くことも手がかり。\n体軸性脊椎関節炎は、X線で仙腸関節炎がはっきりする「強直性脊椎炎（r-axSpA（axial spondyloarthritis：体軸性脊椎関節炎））」と、X線では変化がなく MRI（magnetic resonance imaging） で炎症が見える「nr-axSpA（non-radiographic axSpA：X線基準を満たさない体軸性脊椎関節炎）」を合わせた概念。","tg":[],"fig":["enthesis"],"mt":["spa"]},{"id":"spa-86bb7388","f":"spa","u":28,"o":142,"lv":1,"q":"ASAS（Assessment of SpondyloArthritis international Society） の体軸性脊椎関節炎の分類基準（3か月以上の腰背部痛・45歳未満の発症）を満たすのはどれか。","ch":["MRI（magnetic resonance imaging） で仙腸関節炎があり、アキレス腱付着部炎がある","HLA（human leukocyte antigen：ヒト白血球抗原）-B27 陽性だけで、ほかの所見がない","50歳で発症し、X線で仙腸関節炎がある","HLA（human leukocyte antigen：ヒト白血球抗原）-B27 陰性で、MRI（magnetic resonance imaging）・X線とも正常、炎症性腰背部痛だけがある"],"a":0,"cx":["","HLA-B27 陽性のときは、SpA（spondyloarthritis：脊椎関節炎） の特徴が2つ以上必要。","発症が45歳以上は、この基準の対象外。","画像の仙腸関節炎も HLA-B27 もないので、どちらの入口にも入らない。"],"core":"ASAS：画像の仙腸関節炎＋SpA（spondyloarthritis：脊椎関節炎） の特徴1つ以上、または HLA-B27＋SpA の特徴2つ以上。","e":"SpA の特徴：炎症性腰背部痛、関節炎、付着部炎（踵）、ぶどう膜炎、指炎、乾癬、クローン病・潰瘍性大腸炎、NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） がよく効く、SpA の家族歴、HLA-B27、CRP（C-reactive protein：C反応性タンパク） 上昇。\n画像の仙腸関節炎＝MRI の活動性炎症（STIR 像の骨髄浮腫）、または改訂ニューヨーク基準を満たす X線の変化（両側 grade 2 以上、片側 grade 3 以上）。\n日本人は HLA-B27 の保有率が低いため、画像の確認がとくに大事。","tg":["gl"],"mt":["spa"]},{"id":"spa-8721dd4a","f":"spa","u":28,"o":143,"lv":2,"q":"体軸性脊椎関節炎の治療の順番として正しいものはどれか。","ch":["NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）→効かなければ TNF（tumor necrosis factor：腫瘍壊死因子）/IL-17（interleukin-17：インターロイキン17） 阻害薬","サラゾスルファピリジン（アザルフィジンEN）で体軸の炎症も十分抑える","まず MTX（methotrexate：メトトレキサート） を使い、効かなければ生物学的製剤","まずプレドニゾロン（プレドニン） 20 mg/日を長く使う"],"a":0,"cx":["","サラゾスルファピリジンも体軸には効かない（末梢関節炎には使う）。","MTX は体軸（脊椎・仙腸関節）の炎症には効かない。末梢関節炎には効くことがある。","全身のステロイドの長期使用は勧められない（効果も乏しい）。"],"core":"axSpA（axial spondyloarthritis：体軸性脊椎関節炎）：①NSAIDs（運動療法とともに）→ ②効かなければ TNF 阻害薬・IL-17 阻害薬（または JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬）。csDMARD（conventional synthetic DMARD：従来型合成抗リウマチ薬） は体軸に無効。","e":"国内で体軸性脊椎関節炎（強直性脊椎炎）に使える薬：TNF 阻害薬（アダリムマブ（ヒュミラ）・インフリキシマブ・セルトリズマブペゴルなど）、IL-17 阻害薬（セクキヌマブ（コセンティクス）・イキセキズマブ・ビメキズマブなど）、JAK 阻害薬（ウパダシチニブ（リンヴォック））。\nIL-23（interleukin-23：インターロイキン23） 阻害薬（グセルクマブ（トレムフィア）・リサンキズマブ）・IL-12/23 阻害薬（ウステキヌマブ（ステラーラ））は、強直性脊椎炎の臨床試験で効果が示されなかった（乾癬・乾癬性関節炎の末梢病変には効く）。\n運動療法・禁煙も大切。","tg":[],"mt":["spa","il17"]},{"id":"spa-44a04469","f":"spa","u":28,"o":144,"lv":2,"q":"強直性脊椎炎の患者で、クローン病を合併している。生物学的製剤の選び方として最も適切なのはどれか。","ch":["IL-17（interleukin-17：インターロイキン17） 阻害薬（セクキヌマブ（コセンティクス）など）","エタネルセプト（TNF（tumor necrosis factor：腫瘍壊死因子） 受容体製剤）","抗 TNF（tumor necrosis factor：腫瘍壊死因子） 抗体（アダリムマブ（ヒュミラ）など）","アバタセプト（CTLA-4（cytotoxic T-lymphocyte-associated protein 4） 融合タンパク）"],"a":2,"cx":["IL-17 阻害薬は炎症性腸疾患を悪化させる・新たに起こすことがあるので避ける。","エタネルセプトは炎症性腸疾患に効かない（受容体の製剤で、腸の炎症には効果がない）。","","アバタセプトは脊椎関節炎にも炎症性腸疾患にも効果が乏しい。"],"core":"腸炎あり＝抗 TNF 抗体（アダリムマブ・インフリキシマブ）。IL-17 阻害薬は腸炎を悪くする。エタネルセプトは腸炎・ぶどう膜炎に効きにくい。","e":"IL-17 は腸の粘膜のバリアを守る働きもあるため、阻害すると腸炎が悪化することがある。\nぶどう膜炎をくり返す人も、抗 TNF 抗体（アダリムマブはぶどう膜炎に適応がある）が選ばれる。\nウパダシチニブ（リンヴォック）は脊椎関節炎と潰瘍性大腸炎・クローン病の両方に使える。","tg":[],"mt":["spa","il17"]},{"id":"spa-2dde88bd","f":"spa","u":28,"o":145,"lv":2,"q":"HLA（human leukocyte antigen：ヒト白血球抗原）-B27 関連の急性前部ぶどう膜炎の特徴はどれか。","ch":["片眼に急に起こり、痛みと充血を伴う","両眼に慢性に起こり、症状がほとんどない","網膜血管炎を起こし、視力の予後が悪い","肉芽腫性で豚脂様の角膜後面沈着物を伴う"],"a":0,"cx":["","両眼の無症状の慢性ぶどう膜炎は、少関節型 JIA（抗核抗体陽性）の特徴。","網膜血管炎と後眼部の重い病変はベーチェット病の特徴。","肉芽腫性（豚脂様沈着物）はサルコイドーシス・Vogt-小柳-原田病。"],"core":"B27 のぶどう膜炎＝急性・片眼・前部・痛みと充血・くり返す（左右交互）。ステロイド点眼と散瞳薬。","e":"体軸性脊椎関節炎の約3割に起こる。前房にフィブリンや前房蓄膿が出ることもある。\n予防には抗 TNF（tumor necrosis factor：腫瘍壊死因子） 抗体が有効（エタネルセプト（エンブレル）は効きにくい）。\n眼科の病型の鑑別：\n・ベーチェット病：両眼の非肉芽腫性・前房蓄膿・網膜血管炎（閉塞性）\n・サルコイドーシス：両眼の肉芽腫性（豚脂様角膜後面沈着物・隅角結節・雪玉状硝子体混濁）\n・Vogt-小柳-原田病：両眼の汎ぶどう膜炎・漿液性網膜剝離・髄膜刺激・難聴・白髪","tg":[]},{"id":"spa-04736080","f":"spa","u":28,"o":146,"lv":3,"q":"24歳の男性。2年前から腰と殿部の痛みがあり、明け方に痛みで目が覚め、起きて動くと楽になる。最近は右のアキレス腱付着部も痛む。CRP（C-reactive protein：C反応性タンパク） 1.8 mg/dL、HLA（human leukocyte antigen：ヒト白血球抗原）-B27 陽性。仙腸関節の X線は正常だが、MRI（magnetic resonance imaging） の STIR 像で両側の仙腸関節に骨髄浮腫がある。最初の治療として最も適切なのはどれか。","ch":["すぐに TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬を始める","MTX（methotrexate：メトトレキサート） を週 8 mg で始める","プレドニゾロン（プレドニン） 30 mg/日を始める","NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） を十分量使い、運動療法を指導"],"a":3,"cx":["NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） を2種類以上・十分量で試して効かないときに生物学的製剤へ進む。","MTX は体軸性の炎症に効かない。","全身ステロイドは体軸性脊椎関節炎には勧められない。",""],"core":"nr-axSpA（X線正常・MRI で仙腸関節炎）でも治療の順番は同じ：NSAIDs＋運動 → 効かなければ TNF/IL-17（interleukin-17：インターロイキン17） 阻害薬。","e":"NSAIDs は症状を取るだけでなく、毎日続けると脊椎の骨新生の進行を遅らせる可能性も報告されている。\n疾患活動性の指標：BASDAI（患者が答える6問、4以上で高活動性）、ASDAS（CRP を含み、2.1以上で高活動性・1.3未満で非活動性）。\nX 線の進行：仙腸関節の硬化・びらん・強直 → 脊椎の靱帯骨棘（syndesmophyte）・竹様脊椎（bamboo spine）。","tg":["cs"],"mt":["spa"]},{"id":"spa-98069ca0","f":"spa","u":28,"o":147,"lv":2,"q":"高齢男性の脊椎の X線で、前縦靱帯の連続した骨化が4椎体以上にみられ、椎間板の高さは保たれ、仙腸関節には異常がない。最も考えられるのはどれか。","ch":["乾癬性脊椎炎（体軸型の PsA（psoriatic arthritis：乾癬性関節炎））","後縦靱帯骨化症（OPLL）","びまん性特発性骨増殖症（DISH）","強直性脊椎炎（AS（ankylosing spondylitis：強直性脊椎炎） の晩期像）"],"a":2,"cx":["乾癬性脊椎炎は非対称で太い骨化（傍脊椎骨化）が多く、仙腸関節炎も片側が多い。","後縦靱帯骨化症は脊柱管の中（椎体の後ろ）の骨化で、脊髄の圧迫が問題になる。","","強直性脊椎炎は若い発症で仙腸関節炎が必ずあり、細く対称な靱帯骨棘（syndesmophyte）ができる。"],"core":"DISH＝高齢男性・前縦靱帯の流れるような骨化（右側優位・4椎体以上）・椎間板と仙腸関節は正常。糖尿病・肥満と関連。","e":"DISH は炎症の病気ではなく、CRP（C-reactive protein：C反応性タンパク） は上がらない。脊椎が硬くなるため、軽い転倒でも脊椎の骨折（不安定）を起こしやすい（強直性脊椎炎も同じ）。\n付着部（踵・膝蓋骨など）にも骨化が出る。","tg":[]},{"id":"spa-81f0e78e","f":"spa","u":28,"o":148,"lv":2,"q":"強直性脊椎炎の関節外の合併症として正しいものはどれか。","ch":["急速進行性の糸球体腎炎","口腔と陰部の再発性潰瘍","肺動脈性肺高血圧症が最多","大動脈弁閉鎖不全と伝導障害"],"a":3,"cx":["急速進行性の糸球体腎炎は ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） 関連血管炎など。AS（ankylosing spondylitis：強直性脊椎炎） では IgA 腎症・AA アミロイドーシスが起こることはある。","口腔・陰部の潰瘍はベーチェット病。","PAH（pulmonary arterial hypertension：肺動脈性肺高血圧症） は全身性強皮症・MCTD（mixed connective tissue disease：混合性結合組織病） の合併症。",""],"core":"AS（ankylosing spondylitis：強直性脊椎炎） の関節外：急性前部ぶどう膜炎（最多）・大動脈炎/大動脈弁閉鎖不全・房室ブロック・肺尖部の線維化・骨粗鬆症と脊椎骨折・炎症性腸疾患・乾癬。","e":"脊椎が強直すると、軽い転倒でも脊椎が折れやすく（不安定な骨折）、神経障害を起こすことがある。首や背中の痛みが急に強くなったら CT・MRI（magnetic resonance imaging） で確かめる。\n胸郭の動きが悪くなると、呼吸機能（拘束性障害）も落ちる。\n強直性脊椎炎は国の指定難病。","tg":["ae"],"mt":["spa"]},{"id":"spa-f0decfd5","f":"spa","u":29,"o":149,"lv":1,"q":"CASPAR（乾癬性関節炎の分類基準）で点数になる項目として正しいものはどれか。","ch":["左右対称の多関節炎（2点）","RF（rheumatoid factor：リウマトイド因子） 陽性（2点）と ACPA（anti-citrullinated protein antibody：抗シトルリン化タンパク抗体） 陽性（1点）","HLA（human leukocyte antigen：ヒト白血球抗原）-B27 陽性（1点）と仙腸関節炎","現在の乾癬（2点）と RF（rheumatoid factor：リウマトイド因子） 陰性（1点）"],"a":3,"cx":["関節炎の分布は点数にならない（炎症性関節疾患があることが入口）。","RF「陰性」が1点。陽性は点にならない。","HLA-B27 は CASPAR の項目にない。",""],"core":"CASPAR：炎症性の関節・脊椎・付着部疾患があり、現在の乾癬2点・乾癬の既往または家族歴1点・爪病変1点・RF 陰性1点・指炎1点・関節近傍の骨新生（X線）1点で、3点以上。","e":"乾癬が皮膚にまだ出ていない人（関節炎が先に出るのは約15%）でも、家族歴・爪・指炎・RF 陰性などで分類できる。\n爪病変（点状陥凹・爪甲剝離・爪甲下角化）は DIP（distal interphalangeal：遠位指節間） 関節炎と強く関連する（爪の基部が DIP の付着部とつながっているため）。\n皮膚の乾癬は、頭皮・臍・殿裂・耳介など見落としやすい場所も確認する。","tg":["gl"],"mt":["spa"]},{"id":"spa-bf25554a","f":"spa","u":29,"o":150,"lv":2,"q":"乾癬性関節炎の病型と所見の組み合わせで正しいものはどれか。","ch":["体軸型 ― 両側対称の細い靱帯骨棘","DIP（distal interphalangeal：遠位指節間） 関節型 ― 爪病変は少ない","ムチランス型 ― pencil-in-cup 変形","対称性多関節型 ― RF（rheumatoid factor：リウマトイド因子） が高力価で陽性"],"a":2,"cx":["乾癬性脊椎炎は、非対称で太い傍脊椎の骨化が多い（細い対称の靱帯骨棘は強直性脊椎炎）。","DIP 関節型は爪病変の合併が最も多い。","","対称性多関節型は RA（rheumatoid arthritis：関節リウマチ） に似るが、RF は陰性がふつう。"],"core":"PsA（psoriatic arthritis：乾癬性関節炎）＝骨の破壊（pencil-in-cup・骨溶解）と骨新生（骨膜反応・骨性強直）が同じ人に起こる。指炎・付着部炎・爪。","e":"Moll と Wright の5病型：DIP 型、少関節型（非対称、最も多い）、多関節型（対称）、ムチランス型、体軸型（脊椎炎）。経過で入れかわる。\n指炎（ソーセージ指）は、関節だけでなく腱鞘・軟部組織まで指全体が腫れる状態で、関節破壊の予後不良因子。\nX 線：DIP のびらん、pencil-in-cup、骨膜反応、骨性強直、末節骨の吸収（acro-osteolysis）。","tg":[]},{"id":"spa-d241dfe2","f":"spa","u":29,"o":151,"lv":2,"q":"乾癬性関節炎の治療薬とその標的の組み合わせで正しいものはどれか。","ch":["アプレミラスト（オテズラ） ― JAK1 の阻害","グセルクマブ（トレムフィア） ― IL-23（interleukin-23：インターロイキン23） の p19","ウステキヌマブ（ステラーラ） ― TNF（tumor necrosis factor：腫瘍壊死因子）-α","セクキヌマブ（コセンティクス） ― IL-6（interleukin-6：インターロイキン6） 受容体"],"a":1,"cx":["アプレミラストは PDE4（ホスホジエステラーゼ4）阻害薬の内服薬。","","ウステキヌマブは IL-12 と IL-23（interleukin-23：インターロイキン23） に共通の p40 サブユニットに対する抗体。","セクキヌマブは IL-17A に対する抗体。"],"core":"PsA（psoriatic arthritis：乾癬性関節炎） の薬：TNF 阻害薬、IL-17A（セクキヌマブ・イキセキズマブ）・IL-17A/F（ビメキズマブ（ビンゼレックス））・IL-17（interleukin-17：インターロイキン17）受容体（ブロダルマブ（ルミセフ））、IL-23 p19（グセルクマブ・リサンキズマブ）、IL-12/23 p40（ウステキヌマブ）、PDE4（アプレミラスト）、JAK（ウパダシチニブ（リンヴォック））。","e":"選び方の目安：\n・皮膚の乾癬が重い → IL-17・IL-23 阻害薬（皮膚への効果が高い）\n・体軸病変 → TNF 阻害薬・IL-17 阻害薬（IL-23 阻害薬は体軸への効果が確かでない）\n・炎症性腸疾患 → 抗 TNF 抗体・IL-23 阻害薬（IL-17 阻害薬は避ける）\n・ぶどう膜炎 → 抗 TNF 抗体\nアプレミラスト：開始時は下痢・吐き気・頭痛が出やすいので、10 mg から1日ずつ増やして6日目に 30 mg を1日2回にする（漸増）。重い腎機能障害では減量。体重減少・抑うつにも注意。\nIL-17 阻害薬の副作用：カンジダ症（口腔・食道）、炎症性腸疾患の悪化、好中球減少。ブロダルマブは自殺念慮の注意喚起がある。","tg":[],"mt":["il17"]},{"id":"spa-38d9fe76","f":"spa","u":29,"o":152,"lv":2,"q":"乾癬性関節炎の末梢関節炎（体軸病変なし）で、最初に使うことが多い薬はどれか。","ch":["IL-23（interleukin-23：インターロイキン23） 阻害薬を全員に第一選択","全身ステロイドの長期投与","MTX（methotrexate：メトトレキサート） などの csDMARD（conventional synthetic DMARD：従来型合成抗リウマチ薬）","ヒドロキシクロロキン（プラケニル）"],"a":2,"cx":["生物学的製剤は、csDMARD（conventional synthetic DMARD：従来型合成抗リウマチ薬） で効かない人・予後不良因子のある人・付着部炎や指炎が中心の人などで使う。","全身ステロイドは乾癬を減量時に悪化（膿疱化）させることがあり、長期使用は勧められない。","","ヒドロキシクロロキンは乾癬を悪化させることがあり、PsA（psoriatic arthritis：乾癬性関節炎） には使わない。"],"core":"PsA（psoriatic arthritis：乾癬性関節炎） の末梢関節炎＝NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） → csDMARD（MTX・SASP（salazosulfapyridine：サラゾスルファピリジン）・レフルノミド）→ 効かなければ生物学的製剤・JAK（Janus kinase：ヤヌスキナーゼ）。付着部炎・体軸病変・重い皮膚は早めに生物学的製剤。","e":"MTX は皮膚の乾癬にも効く。\n予後不良因子（多関節・骨びらん・CRP（C-reactive protein：C反応性タンパク） 高値・指炎・爪病変）があれば早めに生物学的製剤を考える（EULAR（European Alliance of Associations for Rheumatology：欧州リウマチ学会） 2023）。\nアプレミラスト（オテズラ）は関節への効果は中等度だが、皮膚・付着部にも効き、検査の監視が少なくてすむ。","tg":[],"mt":["il17"]},{"id":"spa-450970b2","f":"spa","u":29,"o":153,"lv":2,"q":"IL-17（interleukin-17：インターロイキン17） 阻害薬で特に注意する副作用はどれか。","ch":["帯状疱疹と静脈血栓塞栓症","カンジダ症と炎症性腸疾患","低ガンマグロブリン血症と PML（progressive multifocal leukoencephalopathy：進行性多巣性白質脳症）","脱髄疾患と心不全の悪化"],"a":1,"cx":["帯状疱疹・VTE（venous thromboembolism：静脈血栓塞栓症） は JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬で問題になる。","","低ガンマグロブリン血症・PML はリツキシマブ（リツキサン）。","脱髄・心不全は TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬で禁忌とされる。"],"core":"IL-17＝真菌（カンジダ）への粘膜の防御と腸のバリアに必要 → 阻害でカンジダ症・IBD（inflammatory bowel disease：炎症性腸疾患） の発症/悪化。結核の再燃は TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬より少ない。","e":"IL-17 の経路の先天的な異常（IL-17RA 欠損など）では、慢性粘膜皮膚カンジダ症が起こる。\nIL-17 阻害薬のカンジダ症は多くが軽く、抗真菌薬で治り、薬を続けられることが多い。\nビメキズマブ（IL-17A と F の両方）はカンジダ症がやや多い。","tg":["ae"],"mt":["il17"]},{"id":"spa-2378c6de","f":"spa","u":30,"o":154,"lv":3,"q":"28歳の男性。2週間前に排尿時痛があった。数日前から右膝と左足関節が腫れて痛み、両眼が充血している。足底に膿疱と角化を伴う皮疹がある。最も考えられる診断と、その原因として多い病原体の組み合わせはどれか。","ch":["反応性関節炎 ― Chlamydia trachomatis","淋菌性関節炎 ― Neisseria gonorrhoeae（関節内で菌が増える）","痛風 ― 尿酸塩結晶","化膿性関節炎 ― 黄色ブドウ球菌"],"a":0,"cx":["","淋菌性関節炎は、関節内に菌がいる「感染性関節炎」で、移動性の多関節痛・腱鞘炎・膿疱を伴う皮疹が特徴。反応性関節炎の結膜炎・角化性の皮疹とは違う。","若い男性の尿道炎後の少関節炎＋結膜炎は痛風では説明できない。","化膿性関節炎はふつう1関節で、結膜炎や尿道炎の先行は典型でない。"],"core":"反応性関節炎＝感染（尿道炎：クラミジア／腸炎：サルモネラ・赤痢菌・エルシニア・カンピロバクター）の1〜4週後の下肢の非対称少関節炎＋結膜炎・尿道炎・付着部炎・皮疹。関節に菌はいない。","e":"皮膚粘膜の所見：膿漏性角化症（足底の膿疱・角化）、連環状亀頭炎、口腔潰瘍。HLA（human leukocyte antigen：ヒト白血球抗原）-B27 陽性が多い。\n治療：NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）、関節内ステロイド注射。長引けばサラゾスルファピリジン（アザルフィジンEN）・MTX（methotrexate：メトトレキサート）、体軸病変には TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬。\nクラミジアの尿道炎そのものは抗菌薬で治療し、パートナーも治療する（関節炎の経過は抗菌薬で大きくは変わらない）。","tg":["cs"]},{"id":"spa-a8e69057","f":"spa","u":30,"o":155,"lv":2,"q":"炎症性腸疾患に伴う関節炎について正しいものはどれか。","ch":["大関節の少関節型は腸炎の活動性と並行する","体軸病変は腸炎の治療だけで必ず良くなる","関節炎には NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） を大量に長く使うのがよい","小関節の多関節型は腸炎の悪化時にだけ起こる"],"a":0,"cx":["","体軸病変（仙腸関節炎・脊椎炎）は腸炎の活動性と独立して進む。","NSAIDs は腸炎を悪化させることがあるので、短期間・慎重に使う。","小関節の多関節型（2型）は、腸炎の活動性と関係なく続くことが多い。"],"core":"IBD（inflammatory bowel disease：炎症性腸疾患） の関節炎：1型（膝など大関節・少関節・腸炎と並行）、2型（手などの小関節・多関節・腸炎と独立）、体軸病変（腸炎と独立）。抗 TNF（tumor necrosis factor：腫瘍壊死因子） 抗体は腸と関節の両方に効く。","e":"サラゾスルファピリジン（アザルフィジンEN）は潰瘍性大腸炎と末梢関節炎の両方に使える。\nIL-17（interleukin-17：インターロイキン17） 阻害薬は腸炎を悪くするので避ける。ウパダシチニブ（リンヴォック）・抗 TNF 抗体は腸と関節の両方に使える。\n皮膚の合併症：結節性紅斑（腸炎と並行）、壊疽性膿皮症（独立）。","tg":[]},{"id":"spa-a6f46f93","f":"spa","u":30,"o":156,"lv":2,"q":"日本人に多い「掌蹠膿疱症性骨関節炎」で、最も典型的に侵される部位はどれか。","ch":["第1中足趾節関節（母趾）","膝関節（荷重のかかる関節）","前胸壁（胸鎖関節など）","手の DIP（distal interphalangeal：遠位指節間） 関節（遠位の指）"],"a":2,"cx":["第1中足趾節関節は痛風の好発部位。","膝関節は多くの関節炎で侵されるが、掌蹠膿疱症性骨関節炎の典型ではない。","","DIP 関節は乾癬性関節炎・変形性関節症。"],"core":"掌蹠膿疱症＋前胸壁の痛み・腫れ（胸鎖関節の骨肥厚）＝掌蹠膿疱症性骨関節炎（SAPHO（synovitis, acne, pustulosis, hyperostosis, osteitis） 症候群の一つ）。喫煙・扁桃炎・歯性病巣が悪化因子。","e":"SAPHO 症候群：滑膜炎（Synovitis）・ざ瘡（Acne）・膿疱症（Pustulosis）・骨化過剰（Hyperostosis）・骨炎（Osteitis）。骨シンチグラフィーで胸鎖関節周囲の集積（牛の頭のような形：bull’s head sign）。\n治療：禁煙、病巣（扁桃・歯）の治療、NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）、ビスホスホネート、TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬。掌蹠膿疱症の皮膚には IL-23（interleukin-23：インターロイキン23） 阻害薬（グセルクマブ（トレムフィア）・リサンキズマブ）が国内で使える。","tg":[]},{"id":"crys-eefb4f89","f":"crys","u":31,"o":157,"lv":1,"q":"痛風発作のときの対応として正しいものはどれか。","ch":["発作の最中に尿酸降下薬を新しく始めて下げる","コルヒチンは発作3日目から大量に使うと効く","すでに飲んでいる尿酸降下薬は発作中は中止する","前兆期にコルヒチン1錠、NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） は短期に多め"],"a":3,"cx":["発作中に尿酸を急に下げると、結晶が溶けたり剝がれたりして発作が長引く・悪化する。新しく始めるのは発作が落ち着いてから。","コルヒチンは発作の前兆〜発症12時間以内が最も効き、時間がたつと効きにくい。大量は下痢・神経筋障害の危険がある。","すでに飲んでいる尿酸降下薬は、量を変えずに続ける。",""],"core":"痛風発作＝コルヒチン（前兆期に1錠）・NSAIDs パルス（短期大量）・ステロイド（NSAIDs が使えないとき）。尿酸降下薬は「始めない・やめない」。","e":"NSAIDs パルス療法：例としてナプロキセン（ナイキサン）300 mg を3時間ごとに3回（1日だけ）。腎機能が悪い人・胃潰瘍の人・抗凝固薬を飲む人では、ステロイド（プレドニゾロン（プレドニン） 20〜30 mg/日を数日で漸減、または関節内注射）を使う。\nコルヒチンの注意：腎機能・肝機能の悪い人、CYP3A4（cytochrome P450 3A4：薬物代謝酵素） 阻害薬（クラリスロマイシン（クラリス）・アゾール系）や P 糖蛋白阻害薬（シクロスポリン（ネオーラル））との併用で中毒（下痢・骨髄抑制・横紋筋融解）。\n発作の痛みは 24 時間以内にピークになり、1〜2週間で治まる。母趾の MTP（metatarsophalangeal：中足趾節） 関節（足の親指の付け根）が最も多い。","tg":[],"mt":["gout"]},{"id":"crys-04aacec1","f":"crys","u":31,"o":158,"lv":2,"q":"痛風の診断の確定として最も確実なものはどれか。","ch":["発作中の血清尿酸値が 7.0 mg/dL を超える","関節液で負の複屈折の針状結晶を見る","母趾の MTP（metatarsophalangeal：中足趾節） 関節が赤く腫れている","コルヒチンを飲んだら痛みが消えた"],"a":1,"cx":["発作中は尿酸値がむしろ下がることがあり（3〜4割は正常値）、高くても診断の決め手にはならない。","","母趾の発赤腫脹は化膿性関節炎・偽痛風・蜂窩織炎でも起こる。","コルヒチンは偽痛風など他の結晶性関節炎にも効く。"],"core":"確定診断＝関節液の結晶（尿酸塩：針状・負の複屈折＝鋭敏色板の軸と平行で黄色）。白血球に貪食された結晶を見る。","e":"発作中は炎症で尿酸の排泄が増え、血清尿酸値が下がることがある。発作が治まってから測り直す。\n結晶があっても、化膿性関節炎の合併は否定できないので、グラム染色・培養も出す。\n画像：エコーの double contour sign、デュアルエナジーCT（DECT）で尿酸塩の沈着を色で示す、X 線の打ち抜き像（punched out）と張り出した縁（overhanging edge）。","tg":[],"mt":["crystal"]},{"id":"crys-26bae895","f":"crys","u":31,"o":159,"lv":3,"q":"75歳の男性。eGFR（estimated glomerular filtration rate：推算糸球体濾過量） 22 mL/分/1.73m²、心房細動でワルファリン（ワーファリン）を内服中。今朝から右母趾の付け根が赤く腫れて激痛があり、関節液で尿酸塩結晶を認めた。発作の治療として最も適切なのはどれか。","ch":["NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） パルス療法を行う","コルヒチンを大量に内服させる","プレドニゾロン（プレドニン）の短期内服か関節内注射","すぐにアロプリノール（ザイロリック） 300 mg/日を始める"],"a":2,"cx":["高度の腎機能低下とワルファリン（出血）があり、NSAIDs は避ける。","腎機能が悪い人のコルヒチンは中毒の危険が高く、大量は禁忌に近い。","","発作中に尿酸降下薬を新しく始めない。腎機能低下ではアロプリノールの通常量も危険。"],"core":"NSAIDs・コルヒチンが使いにくい（腎障害・抗凝固薬・消化性潰瘍）痛風発作＝ステロイド（PSL（prednisolone：プレドニゾロン） 20〜30 mg/日を数日で漸減、または関節内注射）。","e":"関節内注射は1つの大きな関節なら効果が高く、全身の副作用が少ない（感染を除外してから）。\n発作が治まったら、腎機能に合わせて尿酸降下薬（フェブキソスタット（フェブリク）・トピロキソスタットなど）を少量から始める。\n糖尿病の人では、ステロイドで血糖が上がるので監視する。","tg":["cs"],"mt":["gout"]},{"id":"crys-1dddeb03","f":"crys","u":32,"o":160,"lv":1,"q":"痛風の患者で、尿酸降下薬を使うときの血清尿酸値の目標はどれか。","ch":["7.0 mg/dL 以下","6.0 mg/dL 以下","8.0 mg/dL 以下","3.0 mg/dL 以下"],"a":1,"cx":["7.0 mg/dL を超えると「高尿酸血症」。目標はそれより低い 6.0 以下（結晶が溶ける濃度）。","","8.0 mg/dL は無症候性高尿酸血症で薬を考え始める線（合併症があるとき）。","3.0 mg/dL 未満まで下げる必要はない（下げすぎの害の可能性も議論されている）。"],"core":"高尿酸血症＝7.0 mg/dL 超。痛風・痛風結節がある人の目標＝6.0 mg/dL 以下（結晶が溶けて発作・結節がなくなる）。","e":"尿酸ナトリウムは 6.8 mg/dL 付近で溶けきれずに結晶になる。6.0 以下を続けると、結晶が少しずつ溶けて発作が減り、痛風結節も小さくなる。\n無症候性高尿酸血症（ガイドラインの流れ図）：8.0 以上で合併症（腎障害・尿路結石・高血圧・虚血性心疾患・糖尿病・メタボリックシンドローム）があれば薬を考え、9.0 以上なら薬を考える。まず生活の改善（飲酒・果糖を含む清涼飲料・肥満）。\n尿酸値を上げる薬：サイアザイド・ループ利尿薬、少量アスピリン、シクロスポリン（ネオーラル）、ピラジナミド。下げる薬：ロサルタン（ニューロタン）、フェノフィブラート、SGLT2 阻害薬。","tg":[],"fig":["urate"],"mt":["gout"]},{"id":"crys-2f65707c","f":"crys","u":32,"o":161,"lv":2,"q":"尿酸降下薬とその特徴の組み合わせで正しいものはどれか。","ch":["ベンズブロマロン（ユリノーム） ― 尿路結石の人に第一に選ぶ","フェブキソスタット（フェブリク） ― 腎機能で大きく減量が必要","アロプリノール（ザイロリック） ― アザチオプリン（イムラン、アザニン）と安全に併用","ドチヌラド（ユリス） ― URAT1（urate transporter 1：尿酸トランスポーター1） を選択的に阻害する"],"a":3,"cx":["ベンズブロマロンなど排泄促進薬は尿中の尿酸を増やすので、尿路結石では避けるか、尿をアルカリ化して使う。重い肝障害に注意。","フェブキソスタットは主に肝臓で代謝され、軽度〜中等度の腎機能障害でも減量がいらない（アロプリノール（ザイロリック）は腎機能で減量が必要）。","アロプリノールはアザチオプリンの分解を止めて骨髄抑制を起こすので、併用するならアザチオプリンを大きく減らす（フェブキソスタット（フェブリク）・トピロキソスタットは併用禁忌）。",""],"core":"産生抑制（XO（xanthine oxidase：キサンチンオキシダーゼ） 阻害）：アロプリノール（腎で減量・HLA（human leukocyte antigen：ヒト白血球抗原）-B*58:01 で重症薬疹）、フェブキソスタット、トピロキソスタット（トピロリック、ウリアデック）。排泄促進（URAT1 阻害）：ベンズブロマロン（劇症肝炎）、ドチヌラド、プロベネシド。","e":"使い分け：尿酸の排泄が少ない「排泄低下型」が日本人に多いが、実際には腎機能・結石・肝障害・併用薬で選ぶ。\n・アロプリノール：活性代謝物オキシプリノールが腎排泄なので、腎機能が落ちると蓄積し、重症薬疹（SJS/TEN・DIHS）が増える。HLA-B*58:01 は漢民族・韓国人に多い（日本人は少ない）。\n・フェブキソスタット：米国の CARES 試験で、心血管病のある人でアロプリノールより心血管死が多かった（日本の試験では差がなかった）。心血管病のある人では慎重に。\n・ベンズブロマロン：劇症肝炎が報告されているので、開始後少なくとも6か月は肝機能を定期的に測る。\n・尿のアルカリ化：クエン酸カリウム・ナトリウム（ウラリット）で尿 pH を 6.0〜7.0 に保つ（尿酸結石の予防）。","tg":["ae"],"fig":["urate"],"mt":["gout"]},{"id":"crys-02868dc9","f":"crys","u":32,"o":162,"lv":2,"q":"尿酸降下薬を始めるときの注意として正しいものはどれか。","ch":["発作が起きたら、その日に尿酸降下薬を中止する","少量から増やし、初めはコルヒチンを併用することがある","最初から最大量で始め、すぐ 3 mg/dL まで下げる","尿酸値が 6.0 mg/dL 以下になったらすぐに中止する"],"a":1,"cx":["飲んでいる尿酸降下薬は発作中も続ける。","","急に下げると「尿酸降下薬の開始時の発作」が増える。","中止すると尿酸値は戻り、発作が再発する。長く続ける薬。"],"core":"尿酸降下薬は「少量から・ゆっくり」。開始初期は発作が起こりやすいので、コルヒチン・カバー（1日1錠）を考える。目標に達しても続ける。","e":"目標（6.0 mg/dL 以下）に達するまで、2〜4週ごとに尿酸値を測って量を調整する（treat to target）。\n痛風結節がある人は、結節がなくなるまでさらに低く（5.0 程度）保つこともある。\n腫瘍崩壊症候群の予防・治療には、尿酸を酵素で分解するラスブリカーゼ（ラスリテック）を使う（G6PD（glucose-6-phosphate dehydrogenase：グルコース-6-リン酸脱水素酵素） 欠損では溶血を起こすので禁忌）。","tg":["ae"],"mt":["gout"]},{"id":"crys-3974903b","f":"crys","u":32,"o":163,"lv":1,"q":"高尿酸血症・痛風の生活の指導として正しいものはどれか。","ch":["プリン体の多い食品は無制限に食べてよい","アルコールは尿酸を下げるので毎日飲む","水分は少なめにして尿を濃くする","果糖を多く含む清涼飲料とビールを控える"],"a":3,"cx":["プリン体の多い食品（レバー・魚卵・干物など）は控えめにする。","アルコール（とくにビール）は尿酸を上げ、排泄を減らす。","水分を多くとり、尿量を1日2 L 以上に保つと尿路結石を防げる。",""],"core":"生活指導＝減量・節酒（ビール・日本酒・ウイスキーも量に応じて）・果糖の清涼飲料を控える・プリン体を控えめに・水分を十分に・運動（激しい無酸素運動は避ける）。","e":"果糖は肝臓で ATP を分解して尿酸をつくり、尿酸の排泄も減らす。\n乳製品・コーヒーは尿酸を下げる方向の報告がある。\n急な減量や激しい運動（無酸素運動）は、かえって尿酸を上げて発作を起こすことがある。","tg":["ae"],"mt":["gout"]},{"id":"crys-a09ce8cb","f":"crys","u":32,"o":164,"lv":2,"q":"日本人の高尿酸血症の原因として注目され、腸管からの尿酸の排泄が減る「腎外排泄低下型」に関わるトランスポーターはどれか。","ch":["GLUT9 だけ","URAT1（urate transporter 1：尿酸トランスポーター1）","ABCG2","SGLT2"],"a":2,"cx":["GLUT9 も腎の尿酸の再吸収に関わるが、腸管の排泄の主役ではない。","URAT1 は腎臓の尿細管で尿酸を再吸収する（ベンズブロマロン（ユリノーム）・ドチヌラドの標的）。","","SGLT2 はブドウ糖の再吸収。阻害薬は尿酸の排泄を増やして尿酸値を下げる。"],"core":"ABCG2＝腸と腎から尿酸を出すポンプ。機能が低い遺伝子型は日本人に多く、腸からの排泄が減る（腎外排泄低下型）→ 尿酸の産生が多いように見える。","e":"病型の分類（ガイドライン第3版）：腎負荷型（産生過剰型・腎外排泄低下型）と、尿酸排泄低下型、混合型。尿中尿酸排泄量と尿酸クリアランスで調べる。\nABCG2 の機能低下は若い年齢での痛風の発症とも関係する。\n病型で薬を選ぶ考え方（排泄低下型に排泄促進薬など）もあるが、実際には腎機能・結石・併用薬で選ぶことが多い。","tg":[],"fig":["urate"]},{"id":"crys-ec5baf17","f":"crys","u":32,"o":165,"lv":3,"q":"78歳の男性。eGFR（estimated glomerular filtration rate：推算糸球体濾過量） 25 mL/分/1.73m²。無症候性の高尿酸血症（9.5 mg/dL）に対してアロプリノール（ザイロリック） 300 mg/日が始まり、3週間後に発熱・全身の紅斑・粘膜のびらん・肝障害が出た。対応として正しいものはどれか。","ch":["アロプリノールを倍量にして尿酸を早く下げる","アロプリノールを続け、抗ヒスタミン薬を追加","アロプリノールを中止して重症薬疹として治療","痛風発作としてコルヒチンを追加して様子見"],"a":2,"cx":["増量は誤り。","重症薬疹の疑いでは原因薬をすぐ止める。続けると命に関わる。","","関節症状の記載がなく、全身の皮疹と粘膜病変は痛風発作では説明できない。"],"core":"アロプリノール＋腎機能低下（オキシプリノールの蓄積）＝SJS/TEN・DIHS の危険。腎機能に合わせて少量から。HLA（human leukocyte antigen：ヒト白血球抗原）-B*58:01 も危険因子。","e":"腎機能に応じた量（ガイドラインの目安）：Ccr 30 を超え 50 以下で 100 mg/日、30 以下で 50 mg/日 など。\n腎機能の悪い人では、肝臓で代謝されるフェブキソスタット（フェブリク）やトピロキソスタット（トピロリック、ウリアデック）が使いやすい。\n粘膜病変（口唇・眼・陰部）・水疱・表皮の剝離があれば SJS/TEN として入院治療。","tg":["ae","cs"],"mt":["gout"]},{"id":"crys-d47e6725","f":"crys","u":33,"o":166,"lv":2,"q":"高齢者の CPPD（ピロリン酸カルシウム沈着症）について正しいものはどれか。","ch":["膝・手関節に多く、軟骨の石灰化が見える","母趾の MTP（metatarsophalangeal：中足趾節） 関節が最も多い","結晶は針状で負の複屈折を示す","若年例でも原因となる病気は探さなくてよい"],"a":0,"cx":["","母趾 MTP は痛風。CPPD は膝が最も多い。","針状・負の複屈折は尿酸塩。CPP は短い棒状・菱形で、弱い正の複屈折（軸と平行で青）。","60歳未満や多関節の CPPD は、副甲状腺機能亢進症・ヘモクロマトーシス・低マグネシウム血症・低ホスファターゼ症を調べる。"],"core":"CPPD＝高齢者の膝・手関節の急性関節炎（偽痛風）。X 線の軟骨石灰化、結晶は弱い正の複屈折。若年なら代謝の病気を探す。","e":"CPPD の病型：急性 CPP 結晶性関節炎（偽痛風）、慢性 CPP 結晶性関節炎（RA（rheumatoid arthritis：関節リウマチ） に似た多関節炎）、CPPD を伴う変形性関節症、無症状の軟骨石灰化。\n誘因：手術・脳卒中などの全身の負担、副甲状腺摘出後、関節内のヒアルロン酸注射。\n治療：NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）、コルヒチン、関節内ステロイド注射。尿酸のように結晶を溶かす薬はない。\n2023年に ACR（American College of Rheumatology：米国リウマチ学会）/EULAR（European Alliance of Associations for Rheumatology：欧州リウマチ学会） の CPPD 分類基準ができ、「環軸椎の偽痛風（crowned dens syndrome）」や関節液中の CPP 結晶があれば、それだけで分類される。","tg":[],"mt":["crystal"]},{"id":"crys-3e62575b","f":"crys","u":33,"o":167,"lv":3,"q":"82歳の女性。急に強い後頸部痛と 38.5℃の発熱が出て、首を回せない。項部硬直のように見えるが意識は清明。CRP（C-reactive protein：C反応性タンパク） 15 mg/dL。髄液検査は正常。最も診断に役立つ検査はどれか。","ch":["血液培養だけを出して経過を見る","側頭動脈生検（巨細胞性動脈炎）","環軸椎の CT（歯突起周囲の石灰化）","抗核抗体を測定する（膠原病の検索）"],"a":2,"cx":["血液培養は出すべきだが、それだけでは診断できない。","頭痛・顎跛行・視力障害など巨細胞性動脈炎の症状がなく、まず頸部の局所の原因を探す。","","抗核抗体は高齢者で偽陽性も多く、この経過の診断には役立たない。"],"core":"Crowned dens syndrome＝歯突起の周り（横靱帯）への CPP 沈着による急性の頸部痛・発熱。髄膜炎・巨細胞性動脈炎・リウマチ性多発筋痛症と間違えやすい。CT で冠状の石灰化。","e":"高齢者の「発熱＋後頸部痛＋CRP 高値」で、髄膜炎が否定的なら考える。NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） やコルヒチン、短期のステロイドで数日〜数週で良くなる。\nほかの結晶：塩基性リン酸カルシウム（ハイドロキシアパタイト）は、石灰沈着性腱板炎（肩）や、高齢女性の破壊性の肩関節症（Milwaukee 肩）を起こす。偏光顕微鏡では見えない（アリザリンレッド染色）。","tg":["cs"]},{"id":"crys-e6d87c40","f":"crys","u":33,"o":168,"lv":2,"q":"若い年齢で多関節の CPPD（calcium pyrophosphate deposition：ピロリン酸カルシウム沈着症） があり、第2・第3 MCP（metacarpophalangeal：中手指節） 関節の鉤状の骨棘がみられた。まず調べるべき病気はどれか。","ch":["関節リウマチ（RA（rheumatoid arthritis：関節リウマチ））","強直性脊椎炎（AS（ankylosing spondylitis：強直性脊椎炎））","ヘモクロマトーシス","全身性エリテマトーデス"],"a":2,"cx":["RA は MCP を侵すが、鉤状の骨棘ではなく骨びらん・骨萎縮が特徴。","強直性脊椎炎は体軸と下肢の大関節が中心。","","SLE（systemic lupus erythematosus：全身性エリテマトーデス） の関節炎は骨を壊さない（Jaccoud 関節症）。"],"core":"第2・3 MCP の鉤状骨棘＋CPPD＝ヘモクロマトーシス。若年・多関節の CPPD は代謝疾患（副甲状腺機能亢進症・ヘモクロマトーシス・低 Mg 血症・低ホスファターゼ症）を探す。","e":"ヘモクロマトーシス：フェリチン・トランスフェリン飽和度の上昇、肝障害（肝硬変）、糖尿病、皮膚の色素沈着、心筋症、性腺機能低下。関節症は瀉血をしても戻りにくい。\n低マグネシウム血症（Gitelman 症候群・PPI（proton pump inhibitor：プロトンポンプ阻害薬） の長期使用など）も CPPD の原因になる。","tg":[]},{"id":"crys-6f769193","f":"crys","u":33,"o":169,"lv":3,"q":"84歳の女性。大腿骨頸部骨折の手術から3日後、右膝が急に腫れて熱を持ち、38℃の発熱が出た。X 線で膝の半月板の石灰化がある。まず行うべきことはどれか。","ch":["手術の合併症ではないので何もしない","すぐ関節内にステロイドを注射する","X 線の所見だけで偽痛風と決めて経過を見る","関節穿刺で結晶とグラム染色・培養を調べる"],"a":3,"cx":["手術の後は偽痛風も感染も起こりやすく、放置はできない。","感染を除外する前のステロイド注射は、化膿性関節炎を悪化させる。","軟骨石灰化は高齢者によくあり、それだけで今の関節炎の原因とは言えない。感染を除外する必要がある。",""],"core":"術後・脳卒中後の急性単関節炎＝偽痛風が多いが、化膿性関節炎を必ず除外（穿刺→結晶・白血球数・グラム染色・培養）。結晶があっても感染は否定できない。","e":"偽痛風の誘因：手術・脳卒中・重い病気、副甲状腺摘出術後、利尿薬など。\n治療：NSAIDs（腎機能に注意）、コルヒチン、感染を否定したら関節内ステロイド。\n関節液を十分に抜くだけでも痛みが軽くなる。","tg":["cs"],"mt":["crystal","synovial"]},{"id":"crys-6fb49b7c","f":"crys","u":34,"o":170,"lv":1,"q":"手の変形性関節症の結節とその部位の組み合わせで正しいものはどれか。","ch":["Bouchard 結節 ― DIP（distal interphalangeal：遠位指節間） 関節","Heberden 結節 ― DIP（distal interphalangeal：遠位指節間） 関節","Bouchard 結節 ― MCP（metacarpophalangeal：中手指節） 関節","Heberden 結節 ― 手関節"],"a":1,"cx":["DIP 関節は Heberden 結節。","","Bouchard 結節は PIP（proximal interphalangeal：近位指節間） 関節。MCP 関節の変形性関節症はまれで、あればヘモクロマトーシスや CPPD（calcium pyrophosphate deposition：ピロリン酸カルシウム沈着症） を考える。","手関節は変形性関節症では侵されにくい（外傷後・CPPD（calcium pyrophosphate deposition：ピロリン酸カルシウム沈着症） を考える）。"],"core":"Heberden＝DIP・Bouchard＝PIP（ヘバーデン＝遠い・ブシャール＝近い）。母指の CM 関節も多い。MCP・手関節は RA（rheumatoid arthritis：関節リウマチ） の場所。","e":"手の OA（osteoarthritis：変形性関節症） は中高年の女性に多い。X 線：関節裂隙の不均等な狭小化、骨棘、軟骨下骨の硬化、骨嚢胞。\nびらん性（炎症性）手 OA：DIP・PIP に急な炎症と中央のびらん（gull-wing：かもめの翼の形）。RF（rheumatoid factor：リウマトイド因子） 陰性。\n治療：手の運動・装具、外用 NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）、内服 NSAIDs は短期。母指 CM 関節には装具や関節内ステロイド。","tg":[],"fig":["hand"]},{"id":"crys-a8e552de","f":"crys","u":34,"o":171,"lv":2,"q":"膝の変形性関節症の治療として、推奨の強いもの（まず行うもの）はどれか。","ch":["運動療法と減量","最初からのオピオイドの長期投与","関節鏡下の洗浄とデブリドマン","抗菌薬の長期の内服"],"a":0,"cx":["","強いオピオイドは依存や転倒の害が大きく、最初の治療ではない。","関節鏡の洗浄・デブリドマンは、変形性膝関節症の痛みに効果がないとされる。","感染症ではないので抗菌薬は使わない。"],"core":"膝 OA（osteoarthritis：変形性関節症） の基本＝運動療法＋減量＋患者教育。薬は外用 NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）→内服 NSAIDs（短期）・アセトアミノフェン・デュロキセチン。関節内注射（ステロイド・ヒアルロン酸）。進行すれば人工膝関節。","e":"デュロキセチン（サインバルタ）は国内で「変形性関節症に伴う疼痛」に適応がある（中枢の痛みの調整）。\n関節内ステロイド注射は数週間の効果で、頻回の注射は軟骨を傷めるおそれがある（年に数回まで）。\nX 線の重症度：Kellgren-Lawrence 分類（グレード0〜4：骨棘と関節裂隙の狭小化で評価）。\n内側型が多く、O 脚になる。","tg":["ae","gl"]},{"id":"crys-3b00638d","f":"crys","u":34,"o":172,"lv":2,"q":"糖尿病で神経障害のある人の足関節が、痛みが少ないのに急に腫れて変形し、X 線で骨の破壊と骨片が多くみられた。最も考えられるのはどれか。","ch":["付着部炎（脊椎関節炎）","関節リウマチ（RA（rheumatoid arthritis：関節リウマチ））","Charcot 関節","痛風結節（慢性痛風）"],"a":2,"cx":["付着部炎は踵などの痛みで、関節の高度な破壊は起こさない。","RA は痛みを伴う多関節の滑膜炎で、片側の足の高度な破壊を急に起こすことは少ない。","","痛風では強い痛みを伴う。痛風結節は痛みの少ない腫瘤だが、骨片の多い破壊とは違う。"],"core":"Charcot 関節＝痛みの感覚がなくなった関節がくり返す負担で壊れる。糖尿病（足・足関節）、脊髄空洞症（肩・肘）、脊髄癆。","e":"急性期は赤く腫れて熱を持ち、蜂窩織炎・骨髄炎・痛風と間違えやすい。\n治療は免荷（ギプス・装具）が中心で、骨髄炎の合併は MRI（magnetic resonance imaging）・骨生検で区別する。","tg":[]},{"id":"crys-d7a05585","f":"crys","u":35,"o":173,"lv":3,"q":"74歳の男性。糖尿病がある。2日前から右膝が急に腫れて熱を持ち、歩けない。体温 38.6℃。関節液は混濁し、白血球 85,000/μL（好中球 95%）、偏光顕微鏡で CPP 結晶をわずかに認めた。次の対応として最も適切なのはどれか。","ch":["NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） だけで1週間様子を見る","培養の結果が出るまで抗菌薬は始めない","化膿性関節炎として培養後すぐ抗菌薬と排液","CPP 結晶があり偽痛風：関節内ステロイド注射"],"a":2,"cx":["化膿性関節炎は数日で軟骨が壊れる緊急疾患。様子を見てはいけない。","検体を採ったら結果を待たずに経験的に抗菌薬を始める。","","結晶があっても感染の合併は否定できない。白血球 5 万以上・発熱・糖尿病では化膿性関節炎として扱う。ステロイド注射は感染を悪化させる。"],"core":"結晶があっても感染は否定できない。急性単関節炎＋発熱＋関節液白血球 5 万以上＝化膿性関節炎を前提に、培養→すぐ抗菌薬＋排液（穿刺・関節鏡・切開）。","e":"原因菌：黄色ブドウ球菌が最も多い（MRSA も）、レンサ球菌、高齢者・糖尿病ではグラム陰性桿菌も。若い性活動のある人では淋菌（移動性の関節痛・腱鞘炎・膿疱）。人工関節では表皮ブドウ球菌（コアグラーゼ陰性ブドウ球菌）。\n経験的治療の例：グラム陽性球菌なら MRSA を考えてバンコマイシン（塩酸バンコマイシン）、グラム陰性なら第3世代セフェムなど。培養結果で絞る。\n排液は毎日の穿刺か、関節鏡で洗う。人工関節の感染は整形外科と相談（デブリドマン・入れ替え）。\nRA（rheumatoid arthritis：関節リウマチ）・ステロイド・生物学的製剤の使用中の患者は、熱や炎症が目立たないことがあり、1つの関節だけが急に悪化したら感染をまず疑う。","tg":["cs"],"mt":["synovial"]},{"id":"crys-d5a3ad59","f":"crys","u":35,"o":174,"lv":2,"q":"若い性活動のある女性で、移動する多関節の痛み、手首の腱鞘炎、四肢の少数の膿疱がある。最も考えられる原因菌はどれか。","ch":["淋菌","結核菌","パルボウイルスB19","黄色ブドウ球菌"],"a":0,"cx":["","結核性関節炎は慢性の単関節炎（膝・股関節・脊椎）。","パルボウイルスB19 は手の小関節の対称性多関節炎で、膿疱や腱鞘炎は典型でない。","黄色ブドウ球菌の関節炎はふつう1関節（膝など）の強い化膿性関節炎。"],"core":"播種性淋菌感染症＝移動性多関節痛＋腱鞘炎＋膿疱性皮疹（関節炎・皮膚炎症候群）。月経・妊娠と関連。セフトリアキソン（ロセフィン）で治療（クラミジアの同時治療も）。","e":"関節液・血液の培養は陽性率が低い。尿道・子宮頸部・咽頭・直腸の核酸増幅検査（PCR）が役立つ。\nパートナーの検査と治療も必要。\nほかの若い人の急性関節炎：反応性関節炎・ウイルス性・SLE（systemic lupus erythematosus：全身性エリテマトーデス）・成人スチル病。","tg":["ae"]},{"id":"crys-fa330da6","f":"crys","u":35,"o":175,"lv":2,"q":"人工膝関節置換術から2年後、膝の痛みがゆっくり続き、X 線で人工関節の周りの透亮像（ゆるみ）が出てきた。発熱はなく CRP（C-reactive protein：C反応性タンパク） は軽度上昇。考えるべき原因と検査はどれか。","ch":["遅発性感染：関節液の培養と白血球数","RA（rheumatoid arthritis：関節リウマチ） の再燃：抗CCP（cyclic citrullinated peptide：環状シトルリン化ペプチド） 抗体を再検査する","痛風：血清尿酸値だけを測る","線維筋痛症：圧痛点だけを診察する"],"a":0,"cx":["","人工関節のゆるみは RA の再燃では説明できない。","尿酸値だけでは人工関節の感染やゆるみを調べられない。","X 線でゆるみがあり、身体所見だけで済ませてはいけない。"],"core":"人工関節周囲感染＝術後早期（急性）と遅発性（表皮ブドウ球菌・アクネ菌など弱い菌、ゆるみ・慢性痛）。関節液の白血球（人工関節では 3,000/μL 程度から疑う）・培養（長めに）・組織の培養。","e":"人工関節の感染の目安となる関節液の白血球数は、自分の関節（5万以上）よりずっと低い。\n治療は、急性ならデブリドマンと人工関節の部品交換、慢性なら抜去して抗菌薬入りのスペーサー→再置換（二期的再置換）。\n生物学的製剤の使用中の人は周術期の休薬と感染の監視が大切。","tg":[]},{"id":"sle-a456f2b8","f":"sle","u":36,"o":176,"lv":1,"q":"2019 EULAR（European Alliance of Associa
