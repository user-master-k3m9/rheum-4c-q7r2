<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>リウマチ専門医 4択</title>
<meta name="theme-color" content="#7a3b6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="リウマチ4択">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.offline{max-width:680px;margin-inline:auto;font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.offline b{color:var(--c2)}
</style>
<style>
/* Layout: 家計簿の方眼ノートの上に、1枚ずつめくる問題カード。採点は赤ペンの○ */
:root{
  --paper:#f5f4ee; --grid:rgba(31,107,92,.07); --card:#ffffff; --ink:#1f2a2a; --muted:#5b6866; --line:#d9ddd6;
  --acc:#1f6b5c; --acc-soft:#e1efeb; --maru:#cf3b2a; --maru-soft:#fbe7e3; --batsu:#46566a; --batsu-soft:#e8ecf1;
  --hl:#ffe9a0; --hl-ink:#1f2a2a; --hl-fill:#fff7d6;
  --c1:#1f6b5c; --c2:#2c5d8a; --c3:#a5661a; --c4:#7a4f8f; --c5:#8a5a3c; --c6:#b0405a;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121716; --grid:rgba(120,200,180,.06); --card:#1a2221; --ink:#e4ecea; --muted:#9aa9a6; --line:#2e3a38;
  --acc:#7cc7b3; --acc-soft:#1b332e; --maru:#ff7b67; --maru-soft:#3a201c; --batsu:#a9b8cc; --batsu-soft:#253039;
  --hl:#5c4e10; --hl-ink:#fff6cf; --hl-fill:#332c12;
  --c1:#7cc7b3; --c2:#82b2df; --c3:#e3a75c; --c4:#c59ed8; --c5:#d9a27e; --c6:#ec8ea3; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121716; --grid:rgba(120,200,180,.06); --card:#1a2221; --ink:#e4ecea; --muted:#9aa9a6; --line:#2e3a38;
  --acc:#7cc7b3; --acc-soft:#1b332e; --maru:#ff7b67; --maru-soft:#3a201c; --batsu:#a9b8cc; --batsu-soft:#253039;
  --hl:#5c4e10; --hl-ink:#fff6cf; --hl-fill:#332c12;
  --c1:#7cc7b3; --c2:#82b2df; --c3:#e3a75c; --c4:#c59ed8; --c5:#d9a27e; --c6:#ec8ea3; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.8;
  padding-inline:16px; padding-block:12px 48px;
}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
mark{background:linear-gradient(transparent 45%,var(--hl) 45%);color:inherit;padding:0 2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand .seal{width:40px;height:40px;border-radius:50%;border:3px solid var(--maru);color:var(--maru);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:13px;line-height:1;transform:rotate(-8deg);flex:none}
.brand b{font-family:var(--display);font-size:20px;font-weight:900;letter-spacing:.02em}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}

/* home */
.hero{display:flex;flex-direction:column;gap:10px;padding-block:8px}
.hero h1{font-size:clamp(26px,6vw,34px);font-weight:900}
.hero h1 .ox{color:var(--maru)}
.hero p{margin:0;color:var(--muted);max-width:34em}
.total{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;font-size:14px;color:var(--muted)}
.total strong{font-family:var(--display);font-size:28px;color:var(--ink);font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--maru);border-radius:99px;transition:width .4s}

.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.fields{grid-template-columns:1fr}}
.field{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;border-top:5px solid var(--fc)}
.field:hover{border-color:var(--fc)}
.field .tag{font-size:12px;letter-spacing:.08em;color:var(--fc);font-weight:700}
.field h3{font-size:19px}
.field p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.field .stat{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.field .meter i{background:var(--fc)}
.field .go{margin-top:2px;font-family:var(--display);font-weight:700;color:var(--fc);font-size:15px}

.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-family:var(--display);font-weight:700;font-size:16px;background:var(--acc);color:var(--card)}
.btn.sub{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:default}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel summary{font-family:var(--display);font-weight:700;font-size:17px;cursor:pointer}
.panel[open] summary{margin-bottom:10px}
.panel p{margin:.4em 0}
.stack{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:10px 0 6px}
.stack span{display:grid;place-items:center;color:var(--card);font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px;font-size:13px}
.legend div{display:flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.qhead .fl{color:var(--fc);font-weight:700}
.qhead .n{margin-left:auto;font-variant-numeric:tabular-nums}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:18px;position:relative}
.qno{font-family:var(--display);font-size:13px;color:var(--fc);letter-spacing:.1em;font-weight:700}
.qtext{font-size:clamp(18px,4.6vw,21px);line-height:1.75;font-weight:700;font-family:var(--body)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:14px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s}
.choice:active{transform:scale(.97)}
.choice .mk{font-family:var(--display);font-size:46px;font-weight:900;line-height:1}
.choice .lb{font-size:13px;color:var(--muted)}
.choice.o .mk{color:var(--maru)}
.choice.x .mk{color:var(--batsu)}
.choice:hover{border-color:var(--acc)}
.choice.picked{border-color:var(--ink)}
.choice[disabled]{cursor:default}
.choice.dim{opacity:.4}

.verdict{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px}
.verdict.ok{background:var(--maru-soft)}
.verdict.ng{background:var(--batsu-soft)}
.verdict .big{font-family:var(--display);font-weight:900;font-size:52px;line-height:1;flex:none;width:58px;text-align:center}
.verdict.ok .big{color:var(--maru)}
.verdict.ng .big{color:var(--batsu)}
.verdict h3{font-size:20px}
.verdict p{margin:0;font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.verdict .big{animation:stamp .35s ease-out}}
@keyframes stamp{from{transform:scale(1.8) rotate(-15deg);opacity:0}to{transform:none;opacity:1}}

.exp{display:flex;flex-direction:column;gap:14px}
.exp h4{font-family:var(--display);font-size:15px;margin:0;color:var(--acc);letter-spacing:.04em}
.exp .body p{margin:0 0 .6em}
.point{border:2px dashed var(--maru);border-radius:12px;padding:10px 14px;font-weight:700;display:flex;gap:10px;align-items:flex-start}
.point::before{content:"覚える";flex:none;font-size:11px;background:var(--maru);color:var(--card);border-radius:6px;padding:2px 6px;margin-top:4px;letter-spacing:.06em}
.hon{background:var(--paper);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.75}
.hon .lbl{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:2px}
.words{display:flex;flex-direction:column;gap:6px;font-size:14px}
.words div{display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.words dt{font-weight:700;margin:0}
.words dt rt{font-size:10px;color:var(--muted);font-weight:400}
.words dd{margin:0;color:var(--muted)}
.fig{border:1px solid var(--line);border-radius:12px;padding:14px 10px;background:var(--paper);overflow-x:auto}
.fig .cap{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.qnav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.qnav .btn{flex:1 1 auto}
.kbd{font-size:12px;color:var(--muted);text-align:center}

/* figures */
.fig-svg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.fig-svg text{fill:var(--ink);font-size:13px;font-family:var(--body)}
.fig-svg text.sm{font-size:11px;fill:var(--muted)}
.fig-svg text.b{font-weight:700}
.fig-svg text.red{fill:var(--maru);font-weight:700}
.fig-svg text.acc{fill:var(--acc);font-weight:700}
.fig-svg .bx{fill:var(--card);stroke:var(--ink);stroke-width:1.4}
.fig-svg .ax{fill:var(--acc-soft);stroke:var(--acc);stroke-width:1.4}
.fig-svg .hx{fill:var(--hl-fill);stroke:var(--maru);stroke-width:1.6}
.fig-svg .gx{fill:var(--line);stroke:none}
.fig-svg .ln{stroke:var(--ink);stroke-width:1.4;fill:none}
.fig-svg .ln.d{stroke-dasharray:5 4}
.fig-svg .ln.red{stroke:var(--maru);stroke-width:2}
.fig-svg .ln.thick{stroke-width:5}
.fig-svg .ah{fill:var(--ink)}
.fig-svg .ah.red{fill:var(--maru)}
.fig-svg .dot{fill:var(--maru)}
.fig-svg .tree{fill:var(--c2)}
.ft{width:100%;border-collapse:collapse;font-size:14px;min-width:300px;background:var(--card)}
.ft th,.ft td{border:1px solid var(--line);padding:7px 8px;text-align:center;vertical-align:middle;line-height:1.5}
.ft th{background:var(--acc-soft);font-weight:700}
.ft td.l,.ft th.l{text-align:left}
.ft .y{color:var(--maru);font-weight:700;font-size:17px}
.ft .n{color:var(--batsu);font-weight:700;font-size:17px}
.ft .hit{background:var(--hl-fill)}

/* end */
.end{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.score{font-family:var(--display);font-weight:900;font-size:56px;line-height:1;color:var(--maru);font-variant-numeric:tabular-nums}
.score small{font-size:22px;color:var(--muted)}
.miss{display:flex;flex-direction:column;gap:8px;width:100%}
.miss button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6}
.miss button b{color:var(--batsu);margin-right:6px}
.foot{font-size:12px;color:var(--muted);line-height:1.7}

/* levels */
.lvls{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.lvbtn{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;font-size:14px;text-align:left;line-height:1.3}
.lvbtn:hover{border-color:var(--fc)}
.lvbtn .nm{font-weight:700}
.lvbtn .nm small{font-weight:400;color:var(--muted);margin-left:6px;font-size:12px}
.lvbtn .sc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lvbtn .done{color:var(--maru)}
.lvdot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:13px;color:var(--card);flex:none}
.lvdot.l1,.chip.l1{background:var(--c2)}
.lvdot.l2,.chip.l2{background:var(--c3)}
.lvdot.l3,.chip.l3{background:var(--maru)}
.chip{color:var(--card);font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px}
.lvsum{font-size:13px}
.steps{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.step{display:flex;align-items:center;gap:8px;min-width:0}
.step b{display:block;font-family:var(--display);font-size:15px;line-height:1.2}
.step small{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.steps .arrow{color:var(--muted)}
.goro8{font-family:var(--display);font-size:clamp(16px,4.2vw,19px);line-height:1.7;text-align:center;padding:10px 8px 14px}
.goro8 b{color:var(--maru)}
.goro{border-radius:12px;padding:10px 14px;background:var(--hl-fill);font-size:14px;line-height:1.75}
.goro .lbl{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em}
.goro .g{font-family:var(--display);font-size:16px}
.goro .g b{color:var(--maru)}
.resume{display:flex;flex-direction:column;gap:8px}
.resume h2{font-size:16px}
.resitem{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--fc);border-radius:12px;padding:10px 12px}
.resitem .t{font-weight:700;font-size:15px;line-height:1.4;min-width:0}
.resitem .t small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.resitem .btn{padding:8px 14px;font-size:14px}
.resitem .ghost{font-size:12px}
.qtools{display:flex;justify-content:flex-end;gap:8px;margin-top:-10px}
.qtools .ghost{font-size:12px;padding:4px 12px}

.flead{margin:0 4px 10px;font-weight:700;font-size:15px;line-height:1.6}
.fnote{margin:8px 4px 0;font-size:13px;color:var(--muted);line-height:1.6}
.point::before{content:none}
.point{flex-direction:column;gap:2px}
.plbl{display:inline-block;font-size:11px;background:var(--maru);color:var(--card);border-radius:6px;padding:1px 8px;margin-bottom:4px;letter-spacing:.06em}
.point > span{display:flex;flex-direction:column;align-items:flex-start}
.ft td{text-align:left}
.ft td:has(.y:only-child),.ft td:has(.n:only-child){text-align:center}
.ft{font-size:13.5px}
.ft th:not(:first-child),.ft td{min-width:5.2em}
.ft tbody th.l{min-width:7em;max-width:14em}
/* 第5版：今日のおすすめ・本番形式 */
.today{background:var(--card);border:2px solid var(--maru);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.tdhead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.tdlbl{font-family:var(--display);font-weight:900;font-size:20px}
.tdsub{font-size:13px;color:var(--muted)}
.btn.big{font-size:18px;padding:14px 18px;background:var(--maru)}
.tdstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tdstats div{display:flex;flex-direction:column;align-items:flex-start;gap:0;background:var(--paper);border-radius:10px;padding:8px 10px;min-width:0}
.tdstats b{font-family:var(--display);font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.tdstats span{font-size:12px;color:var(--muted);line-height:1.4}
.tdstats small{display:block;font-size:10px}
.est{margin:0;font-size:14px}
.est b{font-family:var(--display);font-size:18px;color:var(--maru)}
.est small{color:var(--muted)}
.exam{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.exam h2,.sec{font-size:18px}
.exam p{margin:0;font-size:14px;color:var(--muted)}
.hi{color:var(--c3);font-size:13px;letter-spacing:.05em}
.exhead{font-weight:700;font-size:16px;line-height:1.7}
.stl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.stl li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:15px;line-height:1.75;padding:10px 12px;border-radius:10px;background:var(--paper)}
.stl li.sf{background:var(--batsu-soft)}
.stl li.st{background:var(--maru-soft)}
.stl .sn{font-family:var(--display);font-weight:900;font-size:16px;min-width:1.4em;text-align:center;color:var(--acc)}
.stl .tx{min-width:0}
.stl .tv{display:block;font-size:13px;margin-top:2px}
.stl li.sf .tv{color:var(--batsu)}
.stl li.st .tv{color:var(--maru)}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 4px;font-size:16px;font-family:var(--display);font-weight:700}
.opt:hover{border-color:var(--acc)}
.opt.right{border-color:var(--maru);background:var(--maru-soft);color:var(--maru)}
.opt.wrongpick{border-color:var(--batsu);background:var(--batsu-soft)}
.opt.dim{opacity:.45}
.opt[disabled]{cursor:default}
.exexp{display:flex;flex-direction:column;gap:8px}
.stexp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
.stexp summary{cursor:pointer;font-weight:700;font-size:14px;line-height:1.6}
.stexp summary .y{color:var(--maru)}
.stexp summary .n{color:var(--batsu)}
.stexp .exp{margin-top:10px}
.timer{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.byf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.byf div{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--fc);border-radius:10px;padding:8px 12px;font-size:14px}
.byf b{font-variant-numeric:tabular-nums}
.qtools{justify-content:space-between;align-items:center}
.qtools .back{font-weight:700}
.seen{font-size:11px;color:var(--muted);margin-left:8px;letter-spacing:0;font-weight:400}
.miss b.okm{color:var(--maru)}
.qnav .btn.sub{flex:0 1 auto}

.rlist{display:grid;gap:8px}
.rrow{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px solid var(--line);border-left:5px solid var(--fc);border-radius:10px;padding:8px 12px;background:var(--card)}
.rrow span{font-size:14.5px;font-weight:700}.rrow small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.rrow .ghost{min-height:40px;white-space:nowrap}.rrow .ghost:disabled{opacity:.35}
.ghost.danger{color:var(--ng,#c2410c);border-color:var(--ng,#c2410c)}
.selfmark .qclr{display:block;margin-top:8px;font-size:13px;min-height:36px}
.rbar{margin:28px 0 8px;padding-top:14px;border-top:1px dashed var(--line);text-align:center}
.rbar>.ghost{min-height:40px;color:var(--muted)}

その他","short":"その他の疾患","color":"#1f6b5c","desc":"ベーチェット病の病型と薬、成人スチル病、リウマチ性多発筋痛症と RS3PE、家族性地中海熱など、再発性多発軟骨炎・VEXAS、線維筋痛症、irAE、悪性関節リウマチ"},"surg":{"name":"16. 外科的治療・リハビリテーション","short":"手術・リハ","color":"#5b6866","desc":"手術の適応と時期（腱断裂・頸椎・足・手）、人工関節、周術期の血栓予防、リハビリ・装具・関節保護"},"sys":{"name":"17. 医療倫理・医療安全・医療制度","short":"倫理・安全・制度","color":"#8a5a3c","desc":"説明と同意、適応外使用、研究倫理と臨床研究法、副作用報告と被害救済、MTX の誤服用を防ぐ工夫、指定難病・高額療養費・介護保険、臨床研究の読み方"}};

const Q=[{"id":"kiso-72fcf7ac","f":"kiso","u":0,"o":0,"lv":1,"q":"滑膜関節で、関節リウマチの炎症が最初に起こる場所はどこか。","ch":["関節軟骨の表面（硝子軟骨）","靱帯が骨につく付着部（enthesis）","軟骨下骨の骨髄（海綿骨）","滑膜（関節包の内側をおおう膜）"],"a":3,"cx":["軟骨は血管がなく、増殖した滑膜（パンヌス）に侵されて壊れる「被害者」の側。","付着部炎は脊椎関節炎（強直性脊椎炎・乾癬性関節炎）の主座。","RA（rheumatoid arthritis：関節リウマチ）ではMRI（magnetic resonance imaging）で骨髄浮腫を見るが、炎症の主座は滑膜。骨髄から始まるのは骨髄炎など。",""],"core":"RA（rheumatoid arthritis：関節リウマチ）＝滑膜炎（主座は滑膜）。脊椎関節炎＝付着部炎。変形性関節症＝軟骨の変性。","e":"滑膜は表層の細胞（A型＝マクロファージ様、B型＝線維芽細胞様）と血管の多い間質からなり、関節液をつくる。RAでは滑膜が増殖して絨毛状になり、肉芽組織（パンヌス）として軟骨と骨の境目（bare area：軟骨におおわれていない骨の部分）から骨を侵す。このため最初の骨びらんは関節の辺縁（marginal erosion）に出る。\n付着部炎（腱・靱帯が骨につく所）は脊椎関節炎の特徴で、アキレス腱付着部炎・足底腱膜炎・指炎（ソーセージ指）になる。変形性関節症は軟骨の変性が先で、滑膜炎は二次的。","tg":[],"fig":["joint"]},{"id":"kiso-584cb92b","f":"kiso","u":0,"o":1,"lv":1,"q":"関節リウマチの骨びらんで、骨を直接こわす細胞はどれか。","ch":["骨芽細胞","軟骨細胞","形質細胞","破骨細胞"],"a":3,"cx":["骨芽細胞は骨をつくる側。RA（rheumatoid arthritis：関節リウマチ）では骨形成はむしろ抑えられる（骨棘が少ない）。","軟骨細胞は軟骨の基質を保つ細胞。軟骨はMMPなどで分解される。","形質細胞は抗体（RF（rheumatoid factor：リウマトイド因子）・ACPA（anti-citrullinated protein antibody：抗シトルリン化タンパク抗体））をつくる細胞で、骨を直接は壊さない。",""],"core":"骨を壊すのは破骨細胞。滑膜線維芽細胞とT細胞の RANKL（receptor activator of NF-κB ligand） が破骨細胞をつくらせる。","e":"滑膜の線維芽細胞やTh17（IL-17を産生するヘルパーT細胞）細胞が RANKL（破骨細胞を分化させる信号）を出し、TNF（tumor necrosis factor：腫瘍壊死因子）・IL-6（interleukin-6：インターロイキン6）・IL-17（interleukin-17：インターロイキン17） がこれを強める。破骨細胞が骨を溶かして骨びらんになる。軟骨は MMP-3（matrix metalloproteinase-3：マトリックスメタロプロテイナーゼ3） などのタンパク分解酵素で壊れる（血清 MMP-3 が滑膜炎の量を反映するのはこのため）。\n抗RANKL抗体のデノスマブ（プラリア）は、国内では「関節リウマチに伴う骨びらんの進行抑制」の適応もある（骨粗鬆症より短い間隔の投与が可能）。","tg":[],"fig":["joint"]},{"id":"kiso-4772a4b5","f":"kiso","u":0,"o":2,"lv":1,"q":"関節液の所見で「炎症性」と判断する白血球数の目安はどれか。","ch":["200/μL 以上","2,000/μL 以上","100,000/μL 以上","50,000/μL 以上"],"a":1,"cx":["200/μL未満が正常。200〜2,000/μLは非炎症性（変形性関節症など）。","","100,000/μL を超えれば化膿性関節炎の可能性がさらに高いが、「炎症性」の線ではない。","50,000/μL以上は化膿性関節炎を強く疑う値（結晶性関節炎でも出ることがある）。"],"core":"関節液の白血球：〜200 正常／200〜2,000 非炎症性／2,000〜 炎症性／50,000〜 化膿性を疑う。","e":"関節液は「色・透明度・粘稠度・白血球数・好中球の割合・結晶・グラム染色と培養」をセットで見る。\n・非炎症性（変形性関節症・外傷）：黄色透明、粘稠度高い、白血球 200〜2,000/μL。\n・炎症性（RA（rheumatoid arthritis：関節リウマチ）・結晶・脊椎関節炎）：黄色混濁、粘稠度低い（ヒアルロン酸が分解される）、2,000〜50,000/μL、好中球が多い。\n・化膿性：膿性、50,000/μL以上（好中球 90%以上）。ただし結晶でも高くなり、化膿性でも低いことがあるので、グラム染色と培養は必ず出す。結晶があっても感染は否定できない（合併がある）。\n・血性：外傷、色素性絨毛結節性滑膜炎（PVNS）、血友病、抗凝固薬。","tg":[],"mt":["synovial"]},{"id":"kiso-c0afdf17","f":"kiso","u":0,"o":3,"lv":1,"q":"関節軟骨（硝子軟骨）の主な成分の組み合わせとして正しいものはどれか。","ch":["III 型コラーゲンとフィブリン","II 型コラーゲンとアグリカン","I 型コラーゲンとエラスチン","IV 型コラーゲンとラミニン"],"a":1,"cx":["III 型コラーゲンは血管・肉芽組織の細い線維。フィブリンは血液凝固の産物。","","I 型コラーゲンは骨・腱・皮膚の主成分。エラスチンは弾性線維（血管・肺）。","IV 型コラーゲンとラミニンは基底膜の成分（抗GBM 病の標的は IV 型コラーゲン α3 鎖）。"],"core":"硝子軟骨＝II 型コラーゲン（形）＋アグリカン（水を抱えてクッション）。血管・神経・リンパ管がなく、壊れると治りにくい。","e":"アグリカンは負に荷電したグリコサミノグリカン（コンドロイチン硫酸・ケラタン硫酸）を多く持ち、水を引き寄せて圧に耐える。軟骨細胞は関節液から拡散で栄養を受ける。\n再発性多発軟骨炎では II 型コラーゲンに対する自己免疫が想定されている。\n変形性関節症ではアグリカンが ADAMTS（アグリカナーゼ）で、コラーゲンが MMP-13 で分解される。","tg":[]},{"id":"kiso-7d40dd33","f":"kiso","u":0,"o":4,"lv":1,"q":"骨のリモデリングで、骨細胞がつくり骨形成を抑える物質で、ロモソズマブ（イベニティ）の標的はどれか。","ch":["オステオプロテゲリン（OPG）","PTH（副甲状腺ホルモン）","スクレロスチン","RANKL（receptor activator of NF-κB ligand）"],"a":2,"cx":["OPG は骨芽細胞がつくる RANKL（receptor activator of NF-κB ligand） の「おとり受容体」で、破骨細胞を抑える。","PTH は間欠的に使うと骨形成を促す（テリパラチド（連日はフォルテオ、週1・2回はテリボン）・アバロパラチドの原理）。","","RANKL は破骨細胞を分化させる信号で、デノスマブ（プラリア）の標的。"],"core":"スクレロスチン（骨細胞）→Wnt 信号を止めて骨形成を抑える。抗スクレロスチン抗体＝ロモソズマブ（骨形成↑・骨吸収↓の両方）。","e":"骨の細胞の役割：骨芽細胞（骨をつくる・RANKL と OPG を出す）、破骨細胞（骨を溶かす）、骨細胞（骨に埋まった司令塔：スクレロスチン・RANKL を出す）。\nRA（rheumatoid arthritis：関節リウマチ） ではリンパ球・滑膜線維芽細胞の RANKL が増えて骨びらんと関節周囲の骨粗鬆症が起こる。ステロイドは骨芽細胞と骨細胞の働きを抑え、骨形成を落とす（GIOP（glucocorticoid-induced osteoporosis：グルココルチコイド誘発性骨粗鬆症））。","tg":[],"fig":["cyto"]},{"id":"kiso-1a53fc01","f":"kiso","u":1,"o":5,"lv":1,"q":"抗原提示細胞がT細胞を活性化するとき、MHC（major histocompatibility complex：主要組織適合遺伝子複合体）と抗原の結合（第1シグナル）に加えて必要な「第2シグナル」の組み合わせはどれか。","ch":["BLyS（B lymphocyte stimulator：B細胞活性化因子（BAFF）） と BAFF受容体","CD80/86 と CD28","CD40 と CD20","PD-1 と CTLA-4（cytotoxic T-lymphocyte-associated protein 4）"],"a":1,"cx":["BLyS（BAFF）はB細胞の生存因子。ベリムマブ（ベンリスタ）の標的で、T細胞の共刺激ではない。","","CD20はB細胞の目印（リツキシマブ（リツキサン）の標的）。CD40–CD40LはB細胞の活性化に関わる別の信号。","PD-1とCTLA-4はどちらもT細胞にあるブレーキ役の分子で、互いに結合はしない。"],"core":"T細胞の活性化＝抗原（MHC）＋共刺激（CD80/86→CD28）。アバタセプト（CTLA-4-Ig）がCD80/86をふさぐ。","e":"CTLA-4 はT細胞のブレーキで、CD28 より強く CD80/86 に結合して共刺激を奪う。アバタセプト（オレンシア）は CTLA-4 の細胞外部分とヒトIgGのFcをつないだ融合タンパクで、抗原提示細胞の CD80/86 をふさぎ、T細胞の活性化の入口を止める。\n逆に、免疫チェックポイント阻害薬（抗CTLA-4抗体・抗PD-1抗体）はブレーキを外すので、関節炎・筋炎・血管炎などの「免疫関連有害事象（irAE）」を起こす。","tg":[],"fig":["cyto"]},{"id":"kiso-dbbffeb7","f":"kiso","u":1,"o":6,"lv":1,"q":"自己免疫に対して「ブレーキ」として働き、FOXP3 を発現するT細胞はどれか。","ch":["Th1細胞","濾胞ヘルパーT細胞（Tfh）","Th17（IL-17を産生するヘルパーT細胞）細胞","制御性T細胞（Treg（regulatory T cell：制御性T細胞））"],"a":3,"cx":["Th1はIFN（interferon：インターフェロン）-γを出し、細胞内寄生菌（結核など）に対する免疫と肉芽腫に関わる。","Tfhはリンパ濾胞でB細胞の抗体産生を助ける。SLE（systemic lupus erythematosus：全身性エリテマトーデス）・IgG4関連疾患などで増える側。","Th17はIL-17（interleukin-17：インターロイキン17）を出し、乾癬・脊椎関節炎・RA（rheumatoid arthritis：関節リウマチ）の炎症を進める側。",""],"core":"Treg（FOXP3＋、IL-2で維持）＝自己免疫のブレーキ。FOXP3の異常は IPEX 症候群。","e":"Treg は IL-2 で増え、IL-10・TGF-β や CTLA-4（cytotoxic T-lymphocyte-associated protein 4） で他のT細胞を抑える。FOXP3 遺伝子の異常（IPEX症候群）では乳児期から重い自己免疫疾患（1型糖尿病・腸炎・皮膚炎）が起こる。低用量IL-2 療法が SLE（systemic lupus erythematosus：全身性エリテマトーデス） で研究されているのは Treg を増やすため。\nTh17 は IL-6（interleukin-6：インターロイキン6）＋TGF-β で分化し、IL-23（interleukin-23：インターロイキン23） で維持される。IL-17A/F が好中球を呼び、付着部炎・乾癬・骨びらんに関わる（IL-17（interleukin-17：インターロイキン17）・IL-23 阻害薬の標的）。","tg":[],"fig":["cyto"]},{"id":"kiso-ad846ca3","f":"kiso","u":1,"o":7,"lv":2,"q":"SLE（systemic lupus erythematosus：全身性エリテマトーデス） で血中・組織で増え、病態の中心とされる「I型インターフェロン」を主につくる細胞はどれか。","ch":["破骨細胞（多核の巨細胞）","肥満細胞（マスト細胞）","好中球（多形核白血球）","形質細胞様樹状細胞（pDC（plasmacytoid dendritic cell：形質細胞様樹状細胞））"],"a":3,"cx":["破骨細胞は骨吸収の細胞で、インターフェロンの主な産生源ではない。","肥満細胞はIgEを介したI型アレルギーの主役。","好中球は NETs（好中球細胞外トラップ）で核酸を放出し、pDC（plasmacytoid dendritic cell：形質細胞様樹状細胞） を刺激する側。",""],"core":"SLE＝I型IFN（interferon：インターフェロン）の病気。pDC が自己の核酸（免疫複合体）を TLR7/9 で感知して IFN-α を大量につくる。","e":"核酸を含む免疫複合体が pDC の Fc受容体から取り込まれ、エンドソームの TLR7（RNA）・TLR9（DNA）を刺激して IFN-α を出す。IFN は B細胞の分化・自己抗体の産生を強め、さらに免疫複合体が増える悪循環になる（インターフェロン・シグネチャー）。\nアニフロルマブ（サフネロー）は I型IFN受容体（IFNAR1）に対する抗体で、皮膚・関節の症状に効く。ヒドロキシクロロキン（プラケニル）はエンドソームの酸性化を妨げて TLR7/9 の信号を弱める。","tg":[],"fig":["cyto"]},{"id":"kiso-2fede961","f":"kiso","u":1,"o":8,"lv":1,"q":"補体の古典経路を最初に活性化するものはどれか。","ch":["自然に少しずつ分解されるC3（tick-over）","C5a による好中球の遊走","微生物表面のマンノースとMBL（マンノース結合レクチン）","抗原に結合した IgG・IgM（免疫複合体）と C1q"],"a":3,"cx":["C3の自然な分解から始まるのは第二経路（代替経路）。","C5aは補体が活性化した結果できる産物で、経路の入口ではない。","MBLから始まるのはレクチン経路。",""],"core":"古典経路＝免疫複合体＋C1q→C4・C2→C3。SLE（systemic lupus erythematosus：全身性エリテマトーデス）で C3・C4・CH50 が下がるのはこの経路の消費。","e":"SLEの活動期には免疫複合体が古典経路を使い、C3・C4・CH50（補体全体の働き）が下がる。抗dsDNA（double-stranded DNA：二本鎖DNA）抗体の上昇と補体の低下は、腎炎の活動性の目安になる。\n逆に、C1q・C2・C4 の遺伝的欠損は SLE を起こしやすい（C1q欠損では9割以上）。免疫複合体やアポトーシス細胞の片付けができないため。\nC3だけが低い→第二経路（C3腎炎・感染後糸球体腎炎・C3NeF）。C4だけが極端に低い→クリオグロブリン血症・遺伝性血管性浮腫（C1インヒビター欠損）。","tg":[],"mt":["complement"]},{"id":"kiso-f87212e5","f":"kiso","u":1,"o":9,"lv":2,"q":"補体の検査で「C4 が著明に低く、C3 はほぼ正常」のときに、まず考える病態はどれか。","ch":["C3腎症（第二経路の異常）","炎症による急性期反応","クリオグロブリン血症","溶連菌感染後糸球体腎炎"],"a":2,"cx":["C3腎症は第二経路の異常で、C3が低くC4は正常になる。","急性期反応では補体は肝臓でつくられて、むしろ上昇する。","","感染後糸球体腎炎も主に第二経路でC3が下がり、8週以内に戻る。"],"core":"C4だけ低い＝古典経路の早い段階の消費（クリオグロブリン血症、遺伝性血管性浮腫）。C3だけ低い＝第二経路。","e":"クリオグロブリン血症（多くはC型肝炎に伴う混合型：単クローン性IgM-RF（rheumatoid factor：リウマトイド因子）＋多クローン性IgG）は、紫斑・関節痛・末梢神経障害・膜性増殖性糸球体腎炎を起こし、C4がとくに低い。採血後に37℃で保温して運ばないと偽陰性になる。\n遺伝性血管性浮腫（C1インヒビター欠損）は発作時も非発作時もC4が低い。\nSLE（systemic lupus erythematosus：全身性エリテマトーデス）では C3・C4 の両方が下がることが多い。","tg":[],"mt":["complement"]},{"id":"kiso-bd6f86ea","f":"kiso","u":1,"o":10,"lv":1,"q":"痛風発作で、尿酸ナトリウム結晶がマクロファージの中で活性化させ、IL-1（interleukin-1：インターロイキン1）β をつくらせる仕組みはどれか。","ch":["Toll 様受容体4（TLR4）だけ","JAK（Janus kinase：ヤヌスキナーゼ）-STAT 経路だけ","補体の第二経路だけ","NLRP3 インフラマソーム"],"a":3,"cx":["TLR（Toll-like receptor：Toll様受容体） は「準備の信号」（IL-1β の前駆体をつくる）として関わるが、結晶で IL-1β を切り出すのはインフラマソーム。","JAK-STAT はサイトカイン受容体の後ろの信号で、結晶の感知には関わらない。","補体も炎症に関わるが、IL-1β をつくらせる中心ではない。",""],"core":"結晶（尿酸・CPP）・コレステロール→NLRP3 インフラマソーム→カスパーゼ1→IL-1β。コルヒチンは微小管を止めてこの流れと好中球の動きを抑える。","e":"NLRP3 遺伝子の機能獲得型の変異は CAPS（クリオピリン関連周期熱症候群）を起こし、抗IL-1β 抗体カナキヌマブ（イラリス）が効く。\n家族性地中海熱はパイリン（MEFV（Mediterranean fever 遺伝子））インフラマソームの異常で、やはり IL-1β が過剰になる。\nIL-1β は発熱・好中球性の炎症・急性期反応を起こす。","tg":[]},{"id":"kiso-0da0d9c9","f":"kiso","u":1,"o":11,"lv":1,"q":"リツキシマブ（抗CD20 抗体）を使っても、すでにある自己抗体の多くがすぐには消えない理由として正しいものはどれか。","ch":["成熟 B 細胞には CD20 がないから","形質細胞は CD20 を持たないから","リツキシマブは T 細胞だけを除くから","自己抗体は肝臓でつくられるから"],"a":1,"cx":["CD20 は未熟 B 細胞〜成熟 B 細胞・記憶 B 細胞にある。ないのは前駆細胞と形質細胞。","","リツキシマブは B 細胞（CD20 陽性）を除く薬で、T 細胞は標的ではない。","抗体をつくるのは形質細胞で、肝臓ではない。"],"core":"CD20 は pre-B〜記憶 B 細胞にあり、形質細胞にはない（形質細胞は CD38・CD138）。だから抗体価はゆっくりしか下がらず、ワクチン抗体も一部は残る。","e":"B 細胞の目印：CD19（pre-B から形質芽細胞まで広く：イネビリズマブ（ユプリズナ）の標的）、CD20（リツキシマブ・オビヌツズマブ）、CD38（ダラツムマブ：形質細胞）。\nB 細胞の生存因子 BLyS（BAFF）を止めるのがベリムマブ（ベンリスタ）。\nリツキシマブ後は B 細胞が6〜12か月ほど回復しない。","tg":["ae"],"fig":["cyto"]},{"id":"kiso-120b57ea","f":"kiso","u":1,"o":12,"lv":1,"q":"抗体医薬の名前の語尾と構造の組み合わせで正しいものはどれか。","ch":["-cept ― 低分子の内服薬","-ximab ― キメラ抗体","-umab ― マウス抗体","-zumab ― 完全ヒト抗体"],"a":1,"cx":["-cept は受容体と Fc の融合タンパク（エタネルセプト（エンブレル）・アバタセプト）。内服薬は -tinib など。","","-umab は完全ヒト抗体（アダリムマブ（ヒュミラ）・ゴリムマブ・セクキヌマブなど）。","-zumab はヒト化抗体（抗原と結合する部分だけマウス：トシリズマブ（アクテムラ）・セルトリズマブなど）。"],"core":"-ximab＝キメラ（インフリキシマブ（レミケード）・リツキシマブ）、-zumab＝ヒト化、-umab＝ヒト、-cept＝融合タンパク、-tinib＝キナーゼ阻害薬（JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬）。","e":"マウスの部分が多いほど抗薬物抗体ができやすく、投与時反応や二次無効の原因になる（インフリキシマブで MTX（methotrexate：メトトレキサート） 併用が必須なのはこのため）。\nIgG の Fc 部分は新生児 Fc 受容体（FcRn）で分解から守られ、半減期が約3週間と長い。同じ FcRn が胎盤で IgG を胎児へ運ぶ。","tg":[]},{"id":"kiso-74e446d9","f":"kiso","u":1,"o":13,"lv":2,"q":"アレルギー（過敏症）の型と、リウマチ性疾患の病態の組み合わせで正しいものはどれか。","ch":["III 型（免疫複合体） ― ループス腎炎・血清病","II 型（抗体が細胞・組織に結合） ― 結核の肉芽腫","IV 型（T 細胞） ― 自己免疫性溶血性貧血","I 型（IgE） ― 抗 GBM 病"],"a":0,"cx":["","結核の肉芽腫・ツベルクリン反応は IV 型（遅延型）。","自己免疫性溶血性貧血は赤血球に抗体が結合する II 型。","抗 GBM 病は基底膜に抗体が直接結合する II 型。"],"core":"I 型＝IgE（即時型）、II 型＝抗体が細胞や組織に直接（溶血・ITP・抗GBM・重症筋無力症）、III 型＝免疫複合体の沈着（SLE（systemic lupus erythematosus：全身性エリテマトーデス）・血清病・クリオ・IgA 血管炎）、IV 型＝T 細胞（肉芽腫・接触皮膚炎・薬疹の多く）。","e":"III 型は、抗原と抗体の複合体が血管壁・糸球体に沈着して補体を活性化し、好中球を呼んで傷つける（補体が下がる）。\nIV 型の遅延型薬疹（DIHS・SJS/TEN）は、アロプリノール（ザイロリック）・サラゾスルファピリジン・カルバマゼピンなどで起こり、HLA（human leukocyte antigen：ヒト白血球抗原） との関係が強い。","tg":[]},{"id":"kiso-dc86ba80","f":"kiso","u":2,"o":14,"lv":1,"q":"IL-6（interleukin-6：インターロイキン6） の働きとして正しいものはどれか。","ch":["IgE を増やし好酸球を増やす","破骨細胞を抑えて骨をつくる","肝臓で CRP（C-reactive protein：C反応性タンパク）・ヘプシジンをつくらせる","好中球を呼び寄せる主な走化因子になる"],"a":2,"cx":["IgE と好酸球は IL-4・IL-13・IL-5（2型炎症）。","IL-6 は逆に破骨細胞の分化を促し、骨を減らす側。","","好中球の主な走化因子は IL-8（CXCL8）や C5a、LTB4。"],"core":"IL-6＝急性期反応（CRP・発熱・貧血）の司令塔。だからIL-6阻害中はCRPが上がらず、感染に気づきにくい。","e":"IL-6 は肝臓に CRP・血清アミロイドA・フィブリノゲン・ヘプシジンをつくらせる。ヘプシジンが鉄の吸収と放出を止めるので、慢性炎症の貧血（鉄はあるのに使えない：フェリチン高値・血清鉄低値）になる。ほかに発熱、血小板増加、B細胞の抗体産生、Th17（IL-17を産生するヘルパーT細胞）の分化、破骨細胞の分化にも働く。\nトシリズマブ（アクテムラ）・サリルマブ（ケブザラ）は IL-6 受容体をふさぐので、CRP・赤沈・発熱が感染症でも出にくくなる。肺炎や大腸憩室穿孔を見逃さないよう、症状と診察・画像で判断する。","tg":[],"fig":["cyto"]},{"id":"kiso-d72a87d4","f":"kiso","u":2,"o":15,"lv":1,"q":"強直性脊椎炎と最も強く関連する HLA（human leukocyte antigen：ヒト白血球抗原） はどれか。","ch":["HLA-B27","HLA-B51","HLA-DR4","HLA-B52"],"a":0,"cx":["","HLA-B51 はベーチェット病。","HLA-DR4（shared epitope をもつ DRB1 アレル）は関節リウマチ。","HLA-B52 は高安動脈炎（日本人に多い）。"],"core":"B27＝強直性脊椎炎・反応性関節炎、B51＝ベーチェット、B52＝高安、DR4（shared epitope）＝RA（rheumatoid arthritis：関節リウマチ）。","e":"強直性脊椎炎の患者の HLA-B27 陽性率は欧米で約90%。日本人の一般人口の B27 保有率は1%未満と低く、そのぶん患者も少ない。B27 陽性でも大多数は発症しない（「あれば確率が上がる」だけ）。\nほかに覚えるもの：HLA-B*58:01＝アロプリノール（ザイロリック）の重症薬疹（SJS/TEN）、HLA-B*15:02＝カルバマゼピンの SJS/TEN（主にアジア人）、HLA-A*31:01＝カルバマゼピンの薬疹（日本人）、HLA-DRB1*04:05＝日本人のRA、HLA-B*08・DR3＝シェーグレン・SLE（白人）、HLA-Cw6＝尋常性乾癬。","tg":[],"mt":["hla"]},{"id":"kiso-6a9053ca","f":"kiso","u":2,"o":16,"lv":2,"q":"関節リウマチの発症の危険因子として、ACPA（抗CCP（cyclic citrullinated peptide：環状シトルリン化ペプチド）抗体）陽性のRA（rheumatoid arthritis：関節リウマチ）と特に強く関係する環境因子はどれか。","ch":["肥満","飲酒","高尿酸血症","喫煙"],"a":3,"cx":["肥満は RA の疾患活動性や治療反応の低さと関連するが、ACPA とのつながりは喫煙ほど強くない。","飲酒は RA の発症とはむしろ逆の関連（少量で低い）が報告されている。","高尿酸血症は痛風の危険因子。",""],"core":"喫煙＋shared epitope（HLA（human leukocyte antigen：ヒト白血球抗原）-DRB1）→ 肺でタンパクがシトルリン化 → ACPA が発症の何年も前から出る。","e":"シトルリン化はペプチジルアルギニンデイミナーゼ（PAD（peripheral artery disease：末梢動脈疾患））がアルギニンをシトルリンに変える反応。喫煙で肺に起こり、shared epitope をもつ人では免疫反応（ACPA）が起こる。歯周病菌（Porphyromonas gingivalis）も PAD をもつ。\nACPA は発症の数年前から陽性になる（前臨床期）。禁煙は発症予防と治療効果の両方に役立つ（喫煙者は MTX（methotrexate：メトトレキサート）・TNF（tumor necrosis factor：腫瘍壊死因子）阻害薬が効きにくい）。","tg":[]},{"id":"kiso-62bf0317","f":"kiso","u":2,"o":17,"lv":2,"q":"結核の防御に特に重要で、阻害すると結核の再燃が増えるサイトカインの組み合わせはどれか。","ch":["IL-4 と IgE","IL-5（interleukin-5：インターロイキン5） と IL-13","IL-17（interleukin-17：インターロイキン17） と IL-22","TNF（tumor necrosis factor：腫瘍壊死因子） と IFN（interferon：インターフェロン）-γ"],"a":3,"cx":["IL-4 と IgE は2型炎症・アレルギーの中心。","IL-5・IL-13 は2型炎症（好酸球・喘息）のサイトカイン。","IL-17・IL-22 は皮膚・粘膜の細菌・真菌の防御（IL-17 阻害でカンジダ症が増える）。",""],"core":"結核は肉芽腫で閉じ込めて抑える。肉芽腫を保つのは TNF と IFN-γ（Th1）。TNF 阻害薬で結核が再燃し、肺外・播種性になりやすい。","e":"TNF 阻害薬の中でも、膜型 TNF にも結合して細胞を壊す抗体製剤（インフリキシマブ（レミケード）・アダリムマブ）は、受容体製剤のエタネルセプト（エンブレル）より結核が多いと報告されている。\nIL-12/IFN-γ の経路の先天的な異常（メンデル遺伝型マイコバクテリア易感染症）では、BCG・非結核性抗酸菌の重い感染が起こる。","tg":["ae"]},{"id":"kensa-905603b0","f":"kensa","u":3,"o":18,"lv":1,"q":"抗核抗体（間接蛍光抗体法、HEp-2細胞）について正しいものはどれか。","ch":["健常人でも 40倍の陽性はよくある","陰性なら全身性強皮症は否定できる","160倍以上なら SLE（systemic lupus erythematosus：全身性エリテマトーデス） と診断してよい","力価は SLE（systemic lupus erythematosus：全身性エリテマトーデス） の活動性とよく相関する"],"a":0,"cx":["","強皮症の約9割以上は陽性だが、陰性の例もあり否定はできない。","高い力価でも健常人・ほかの膠原病・薬剤・感染でみられる。診断は症状と特異抗体で行う。","抗核抗体の力価は活動性と相関しない。活動性は抗dsDNA（double-stranded DNA：二本鎖DNA）抗体と補体で見る。"],"core":"ANA（antinuclear antibody：抗核抗体） はふるい（感度が高い）。40倍は健常人の2〜3割、160倍でも数%。陽性＝膠原病ではない。","e":"ANA が陰性なら SLE の可能性はかなり低い（2019 EULAR（European Alliance of Associations for Rheumatology：欧州リウマチ学会）/ACR（American College of Rheumatology：米国リウマチ学会） 分類基準では ANA 80倍以上が「入口」）。陽性のときは染色型と疾患特異抗体（抗dsDNA（double-stranded DNA：二本鎖DNA）・抗Sm・抗SS-A・抗U1-RNP・抗セントロメア・抗トポイソメラーゼI など）で絞り込む。\n抗SS-A抗体（Ro52/60）や抗ARS（aminoacyl-tRNA synthetase：アミノアシルtRNA合成酵素）抗体（抗Jo-1 など）は細胞質・核の抗原が少なく、HEp-2 の ANA が陰性〜低力価のことがある。症状が合えば個別に測る。\n薬剤誘発性ループス（プロカインアミド・ヒドララジン・TNF（tumor necrosis factor：腫瘍壊死因子）阻害薬など）では抗ヒストン抗体が陽性になる。","tg":[],"fig":["ana"]},{"id":"kensa-3a2c33e8","f":"kensa","u":3,"o":19,"lv":1,"q":"抗核抗体の「discrete speckled（散在斑紋型）」の染色型が示す抗体はどれか。","ch":["抗RNAポリメラーゼIII抗体","抗セントロメア抗体","抗dsDNA（double-stranded DNA：二本鎖DNA）抗体","抗トポイソメラーゼI抗体"],"a":1,"cx":["抗RNAポリメラーゼIII抗体は speckled（核小体も）。","","抗dsDNA抗体は homogeneous（均質型）と、辺縁型（peripheral）。","抗トポイソメラーゼI抗体は細かい speckled＋核小体型を示すことが多い。"],"core":"散在斑紋型（数十個の点）＝抗セントロメア抗体＝限局皮膚硬化型SSc（systemic sclerosis：全身性強皮症）・PAH（pulmonary arterial hypertension：肺動脈性肺高血圧症）・原発性胆汁性胆管炎。","e":"代表的な染色型：\n・homogeneous（均質型）：抗dsDNA抗体・抗ヒストン抗体（SLE（systemic lupus erythematosus：全身性エリテマトーデス）・薬剤誘発性ループス）\n・speckled（斑紋型）：抗U1-RNP・抗Sm・抗SS-A・抗SS-B\n・nucleolar（核小体型）：抗トポイソメラーゼI・抗RNAポリメラーゼIII・抗Th/To・抗PM（polymyositis：多発性筋炎）-Scl（いずれも強皮症）\n・discrete speckled（散在斑紋型）：抗セントロメア抗体\n・cytoplasmic（細胞質型）：抗ARS（aminoacyl-tRNA synthetase：アミノアシルtRNA合成酵素）・抗ミトコンドリア・抗リボソームP\n抗セントロメア抗体陽性の強皮症は、皮膚硬化が手指〜前腕にとどまり、晩期に肺動脈性肺高血圧症（PAH）を起こしやすい。原発性胆汁性胆管炎（抗ミトコンドリア抗体）・シェーグレンとの合併も多い。","tg":[],"fig":["ana"],"mt":["autoab"]},{"id":"kensa-8dcbbeec","f":"kensa","u":3,"o":20,"lv":2,"q":"抗dsDNA（double-stranded DNA：二本鎖DNA）抗体について正しいものはどれか。","ch":["シェーグレン病に特異的である","治療しても下がることはない","ループス腎炎の活動性と相関する","薬剤誘発性ループスで高頻度に陽性"],"a":2,"cx":["シェーグレン病に多いのは抗SS-A・抗SS-B抗体。","治療で下がり、再燃で上がるので、経過の指標に使う。","","薬剤誘発性ループスは抗ヒストン抗体が典型で、抗dsDNA抗体はふつう陰性（TNF（tumor necrosis factor：腫瘍壊死因子）阻害薬では例外的に陽性になる）。"],"core":"抗dsDNA抗体＝SLE（systemic lupus erythematosus：全身性エリテマトーデス）に特異的・活動性（とくに腎炎）と相関。抗Sm抗体＝最も特異的だが活動性と相関しない。","e":"SLEの抗体の使い分け：\n・抗dsDNA抗体：陽性率70%程度。活動性・腎炎と相関し、補体（C3・C4・CH50）の低下と一緒に見る。\n・抗Sm抗体：陽性率は日本人で10〜30%と低いが、特異度が非常に高い。活動性とは相関しない。\n・抗リボソームP抗体：精神神経ループス（とくに精神症状）との関連。\n・抗リン脂質抗体：血栓・流産（抗リン脂質抗体症候群）。\n・抗SS-A抗体：新生児ループス・先天性心ブロック、亜急性皮膚ループス。\n・抗C1q抗体：ループス腎炎と関連。","tg":[],"mt":["autoab"]},{"id":"kensa-1e6e38eb","f":"kensa","u":4,"o":21,"lv":1,"q":"関節リウマチの診断で、リウマトイド因子（RF（rheumatoid factor：リウマトイド因子））と比べた抗CCP（cyclic citrullinated peptide：環状シトルリン化ペプチド）抗体（ACPA（anti-citrullinated protein antibody：抗シトルリン化タンパク抗体））の特徴はどれか。","ch":["感度がRFよりもはるかに低く、早期には陰性が多い","疾患活動性とよく相関するので治療効果判定に使う","特異度が高く、陽性なら骨びらんが進みやすい","感染症や肝疾患でもRFと同じくらい陽性になる"],"a":2,"cx":["感度はRFと同じくらい（約70〜80%）で、発症前から陽性になる。","ACPA の値は治療で大きく変わらず、効果判定には使わない（活動性は関節所見と CRP（C-reactive protein：C反応性タンパク）・赤沈で見る）。","","感染症（C型肝炎・結核・感染性心内膜炎）・肝硬変・高齢者で陽性になりやすいのはRFの方。"],"core":"ACPA＝特異度約95%・予後不良（骨破壊）のサイン。RF＝感度は似るが特異度が低い（感染・肝疾患・高齢者・シェーグレン）。","e":"RF は IgG の Fc 部分に対する自己抗体（ふつう測るのは IgM-RF）。シェーグレン病（7割以上）・クリオグロブリン血症（C型肝炎）・感染性心内膜炎・結核・サルコイドーシス・高齢者でも陽性になる。\nACPA は特異度が高く、高値陽性・RF との両方陽性は骨破壊が早い予後不良因子。2010 ACR（American College of Rheumatology：米国リウマチ学会）/EULAR（European Alliance of Associations for Rheumatology：欧州リウマチ学会） 分類基準では、RF と ACPA の「どちらか陽性」で点数をつけ、基準値上限の3倍を超える高値陽性は3点、それ以下の陽性は2点。\nどちらも陰性の RA（血清反応陰性 RA）もあり、陰性でも RA は否定できない。","tg":[],"mt":["ra2010"]},{"id":"kensa-2493ed0a","f":"kensa","u":4,"o":22,"lv":2,"q":"血清 MMP-3（マトリックスメタロプロテイナーゼ3）について正しいものはどれか。","ch":["RA（rheumatoid arthritis：関節リウマチ） に特異的で、ほかの病気では上がらない","滑膜炎を反映し、ステロイド内服でも上がる","女性の基準値は男性より高い","軟骨の量を表し、高いほど軟骨が多い"],"a":1,"cx":["リウマチ性多発筋痛症・乾癬性関節炎・SLE（systemic lupus erythematosus：全身性エリテマトーデス） などの滑膜炎でも上がる。","","基準値は男性の方が高い（男性 約37〜121 ng/mL、女性 約18〜60 ng/mL）。","MMP-3 は軟骨を壊す酵素。高いほど関節破壊が進みやすい。"],"core":"MMP-3＝滑膜炎の量と関節破壊の予測。ただしステロイド・腎機能低下で偽高値、男性で高い。","e":"MMP-3 は滑膜の線維芽細胞がつくる。CRP（C-reactive protein：C反応性タンパク） が下がっても MMP-3 が高いままなら滑膜炎が残っている可能性がある。プレドニゾロン（プレドニン）の内服で上がるので、ステロイド使用中の評価には注意する。\nリウマチ性多発筋痛症（PMR（polymyalgia rheumatica：リウマチ性多発筋痛症））でも高値になるのが特徴（肩の滑液包炎・滑膜炎のため）で、高齢発症RAとの鑑別には決め手にならない。","tg":["ae"]},{"id":"kensa-fd4bd85d","f":"kensa","u":4,"o":23,"lv":2,"q":"発熱と関節痛の患者で、「赤沈が著明に亢進しているのに CRP（C-reactive protein：C反応性タンパク） がほとんど上がらない」とき、まず考えるのはどれか。","ch":["成人スチル病","巨細胞性動脈炎","細菌性の肺炎","活動性の SLE（systemic lupus erythematosus：全身性エリテマトーデス）"],"a":3,"cx":["成人スチル病は CRP・フェリチンがともに著明に高い。","巨細胞性動脈炎は CRP も赤沈も高いことが多い。","細菌感染症では CRP が大きく上がる。SLE（systemic lupus erythematosus：全身性エリテマトーデス） の患者で CRP が高ければ、まず感染症・漿膜炎を疑う。",""],"core":"SLE は赤沈↑・CRP 正常〜軽度（I型IFN（interferon：インターフェロン） が CRP の産生を抑える）。SLE で CRP が高い＝感染・漿膜炎・関節炎を考える。","e":"赤沈は免疫グロブリン（高γグロブリン血症）・フィブリノゲンの増加、貧血で亢進する。SLE・シェーグレン病・多発性骨髄腫では、CRP が低いのに赤沈が高い「解離」が起こる。\nCRP は IL-6（interleukin-6：インターロイキン6） で肝臓がつくり、半日〜1日で上がり、半減期は約19時間と速く変わる。赤沈はゆっくり変わる。\nトシリズマブ（アクテムラ）など IL-6 阻害薬の使用中は、どちらも上がりにくくなる。","tg":[]},{"id":"kensa-191a7869","f":"kensa","u":4,"o":24,"lv":2,"q":"膠原病の治療中の発熱で、「病気の再燃」より「細菌感染症」を考える所見として役立つものはどれか。","ch":["補体（C3・C4）の低下","プロカルシトニンの上昇","抗核抗体の力価の上昇","抗dsDNA（double-stranded DNA：二本鎖DNA） 抗体の上昇"],"a":1,"cx":["補体の低下は SLE（systemic lupus erythematosus：全身性エリテマトーデス） などの再燃を示す（感染症では補体はむしろ上がる）。","","抗核抗体の力価は活動性とも感染とも相関しない。","抗dsDNA 抗体の上昇は SLE（systemic lupus erythematosus：全身性エリテマトーデス） の再燃を示す。"],"core":"細菌感染＝プロカルシトニン↑・CRP（C-reactive protein：C反応性タンパク） 高値（SLE（systemic lupus erythematosus：全身性エリテマトーデス） では CRP が上がりにくい）。再燃＝補体↓・抗dsDNA↑・血球減少。","e":"プロカルシトニンは細菌感染で上がり、ウイルス感染・自己免疫の炎症では上がりにくい。ただし成人スチル病や重い炎症・腎機能低下でも上がることがあり、単独では決めない。\nIL-6（interleukin-6：インターロイキン6） 阻害薬の使用中は CRP は上がらないが、プロカルシトニンは比較的保たれるとされる。\n必ず血液培養・尿・胸部画像など、感染の検索を同時に行う。","tg":["ae"]},{"id":"kensa-fca32061","f":"kensa","u":4,"o":25,"lv":1,"q":"間質性肺疾患の活動性・広がりの血清マーカーとして、膠原病で使われるものはどれか。","ch":["MMP-3（matrix metalloproteinase-3：マトリックスメタロプロテイナーゼ3） と RF（rheumatoid factor：リウマトイド因子）","CK（creatine kinase：クレアチンキナーゼ） とアルドラーゼ","KL-6（Krebs von den Lungen-6：間質性肺炎のマーカー） と SP-D","フェリチンと ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素）"],"a":2,"cx":["MMP-3・RF は関節リウマチの滑膜炎と診断のマーカー。","CK・アルドラーゼは筋の障害のマーカー。","","フェリチンは成人スチル病・MAS（macrophage activation syndrome：マクロファージ活性化症候群）、ACE はサルコイドーシスのマーカー。"],"core":"KL-6・SP-D＝II 型肺胞上皮細胞から出る間質性肺疾患のマーカー。抗MDA5（melanoma differentiation-associated gene 5） 抗体の急速進行性 ILD（interstitial lung disease：間質性肺疾患） では初期に KL-6 が低いことがある。","e":"KL-6 は線維化の広がりと相関し、経過観察に使う。SP-D はより早く変化する。\nニューモシスチス肺炎・薬剤性肺障害でも上がるので、原因の区別には使えない。\n肺の評価には HRCT（high-resolution CT：高分解能CT） と呼吸機能（FVC（forced vital capacity：努力肺活量）・%DLco（diffusing capacity for carbon monoxide：肺拡散能））が基本。","tg":[],"mt":["ctdild"]},{"id":"kensa-3fa66f53","f":"kensa","u":4,"o":26,"lv":2,"q":"日本人で体軸性脊椎関節炎を疑うとき、HLA（human leukocyte antigen：ヒト白血球抗原）-B27 検査について正しいものはどれか。","ch":["陰性でも否定できない","陽性なら AS（ankylosing spondylitis：強直性脊椎炎） と確定してよい","陰性なら SpA（spondyloarthritis：脊椎関節炎） は否定できる","経過中に何度も測り直す"],"a":0,"cx":["","B27 陽性の人の大多数は発症しない。陽性は「確率が上がる」だけ。","日本人の患者の B27 陽性率は欧米より低く（約半数以下とされる）、陰性でも否定できない。","B27 は遺伝子の型なので、一度調べれば十分。くり返し測る意味はない。"],"core":"B27 は「確率を上げる」検査。日本人は一般人口の保有率が1%未満で、患者でも陰性が多い → 画像（MRI（magnetic resonance imaging） の仙腸関節炎）が大切。","e":"ASAS（Assessment of SpondyloArthritis international Society） 基準でも B27 は「入口」の1つだが、日本人では画像で確かめる経路が重要になる。\nB27 は急性前部ぶどう膜炎・反応性関節炎・大動脈弁閉鎖不全・伝導障害とも関連する。","tg":[],"mt":["hla"]},{"id":"kensa-1dcef3f5","f":"kensa","u":5,"o":27,"lv":1,"q":"MPO（myeloperoxidase：ミエロペルオキシダーゼ）-ANCA（anti-neutrophil cytoplasmic antibody：抗好中球細胞質抗体） と最も関連が深い血管炎はどれか。","ch":["結節性多発動脈炎（PAN（polyarteritis nodosa：結節性多発動脈炎））","IgA血管炎","顕微鏡的多発血管炎（MPA（microscopic polyangiitis：顕微鏡的多発血管炎））","多発血管炎性肉芽腫症（GPA（granulomatosis with polyangiitis：多発血管炎性肉芽腫症））の欧米例"],"a":2,"cx":["PAN は ANCA 陰性が定義。中型血管の壊死性血管炎で、糸球体腎炎を起こさない。","IgA血管炎は IgA の沈着による小型血管炎で、ANCA とは無関係。","","GPA は欧米では PR3（proteinase 3：プロテイナーゼ3）-ANCA が多い（日本ではMPO-ANCA陽性のGPAも多い）。"],"core":"MPO-ANCA（P-ANCA）＝MPA・EGPA（約4割）・腎限局型。PR3（proteinase 3：プロテイナーゼ3）-ANCA（C-ANCA）＝GPA。日本は MPO が多い。","e":"日本の ANCA 関連血管炎は MPA が最も多く、高齢者の RPGN（急速進行性糸球体腎炎）や間質性肺炎として見つかる。\nANCA の測定は ELISA/CLEIA（MPO・PR3 の抗原特異的）が標準で、蛍光抗体法の P-ANCA/C-ANCA は補助。\n偽陽性：感染性心内膜炎（PR3）、薬剤（プロピルチオウラシル・ヒドララジン・ミノサイクリン：MPO が多い）、潰瘍性大腸炎（非典型 P-ANCA）、コカイン（レバミゾール混入）。\nANCA 陰性でも AAV（ANCA-associated vasculitis：ANCA関連血管炎） は否定できない（とくに EGPA の6割・GPA の限局型）。","tg":[],"mt":["vasc"]},{"id":"kensa-d862f805","f":"kensa","u":5,"o":28,"lv":2,"q":"抗リン脂質抗体の検査について正しいものはどれか。","ch":["梅毒の検査で偽陽性が出ることはない","ループスアンチコアグラントはワルファリン（ワーファリン）内服中でも正確に測れる","陽性なら12週以上あけて再検査し、持続陽性を確認する","抗カルジオリピン抗体は低値陽性でも分類基準を満たす"],"a":2,"cx":["カルジオリピンは梅毒の脂質抗原（RPR・VDRL）と同じなので、梅毒の生物学的偽陽性（BFP）が出る。","ループスアンチコアグラント（LA（lupus anticoagulant：ループスアンチコアグラント））は凝固時間で測るので、ワルファリン・ヘパリン・DOAC（direct oral anticoagulant：直接経口抗凝固薬） 内服中は偽陽性・偽陰性になりやすい。","","分類基準では中等度以上の値（40 GPL/MPL 以上、または99パーセンタイル超）が必要。"],"core":"抗リン脂質抗体は「12週以上あけて2回以上」陽性で持続を確認。LA（lupus anticoagulant：ループスアンチコアグラント）・抗カルジオリピン・抗β2GPI の3種類。","e":"感染症などで一時的に陽性になることがあるので、12週以上あけて再検査する。\n・ループスアンチコアグラント（LA）：リン脂質依存性の凝固時間（APTT・希釈ラッセル蛇毒時間）が延長し、正常血漿を混ぜても補正されない。血栓のリスクが最も高い。\n・抗カルジオリピン抗体（IgG/IgM）、抗β2グリコプロテインI抗体（IgG/IgM）。\n3つとも陽性（トリプルポジティブ）は血栓リスクが最も高く、DOAC（direct oral anticoagulant：直接経口抗凝固薬） ではなくワルファリンを使う。\nAPTT が延長しているのに血栓を起こす、という逆説がLAの特徴。","tg":[],"mt":["aps"]},{"id":"kensa-1e31a8e1","f":"kensa","u":6,"o":29,"lv":1,"q":"関節リウマチの手のX線写真で、早期から見られる所見はどれか。","ch":["遠位指節間（DIP（distal interphalangeal：遠位指節間））関節の「pencil-in-cup」変形","関節周囲の骨萎縮（骨粗鬆化）と軟部組織の腫脹","骨棘の形成と軟骨下骨の硬化","関節軟骨の線状石灰化（軟骨石灰化症）"],"a":1,"cx":["pencil-in-cup 変形は乾癬性関節炎（ムチランス型）の所見。","","骨棘・軟骨下骨硬化は変形性関節症の所見（RA（rheumatoid arthritis：関節リウマチ） は骨をつくる反応が乏しい）。","軟骨の線状石灰化は CPPD（ピロリン酸カルシウム沈着症）の所見。"],"core":"RA（rheumatoid arthritis：関節リウマチ） のX線：軟部腫脹→関節周囲の骨萎縮→辺縁の骨びらん→関節裂隙の均等な狭小化→亜脱臼・強直。","e":"RA は MCP（metacarpophalangeal：中手指節）・PIP（proximal interphalangeal：近位指節間）・手関節・MTP（metatarsophalangeal：中足趾節） に左右対称に起こり、関節裂隙は「均等に」狭くなる（OA（osteoarthritis：変形性関節症） は荷重部だけ偏って狭くなる）。骨びらんは軟骨に覆われない関節辺縁（bare area）から始まる。尺骨茎状突起・第5MTP関節は早期にびらんが出やすい場所。\n進行度の評価は Steinbrocker 分類（Stage I〜IV）や、骨びらんと関節裂隙狭小化を点数にする modified Total Sharp Score（mTSS）。\n超音波（グレースケールの滑膜肥厚＋パワードプラの血流）と MRI（滑膜炎・骨髄浮腫）は X線より早く炎症を捉える。MRI の骨髄浮腫は、将来の骨びらんの最も強い予測因子。","tg":[],"fig":["joint","hand"]},{"id":"kensa-34e91402","f":"kensa","u":6,"o":30,"lv":2,"q":"痛風と CPPD（偽痛風）を関節エコーで見分けるとき、痛風に特徴的な所見はどれか。","ch":["滑膜肥厚のない関節液の貯留だけ","軟骨の「中」の点状〜線状の高エコー","軟骨表面の線（double contour）","腱付着部の骨びらんと骨新生"],"a":2,"cx":["関節液だけでは結晶の種類はわからない。","軟骨の中（硝子軟骨・線維軟骨の内部）の沈着はピロリン酸カルシウム（CPPD）の特徴。","","付着部の骨びらん・骨新生は脊椎関節炎の付着部炎の所見。"],"core":"double contour sign＝軟骨の「表面」に尿酸塩が沈着（痛風）。軟骨の「内部」の石灰化＝CPPD。","e":"痛風のエコー所見：double contour sign、痛風結節（tophus）、関節液中の高エコー点（snowstorm）。デュアルエナジーCT（DECT）は尿酸塩を色分けして表示できる。\nCPPD は膝の半月板（線維軟骨）・手関節の三角線維軟骨複合体（TFCC）・恥骨結合の石灰化が典型。\n確定診断はどちらも関節液の偏光顕微鏡：尿酸ナトリウムは針状で「負の複屈折」（鋭敏色板の軸と平行で黄色）、ピロリン酸カルシウムは短い棒状・菱形で「正の複屈折」（平行で青色）で弱い。","tg":[],"mt":["crystal"]},{"id":"kensa-71e8d4cd","f":"kensa","u":6,"o":31,"lv":1,"q":"関節リウマチの滑膜炎を関節エコーで評価するとき、「活動性の炎症」を示す所見はどれか。","ch":["関節軟骨の表面の double contour sign","軟骨の中の点状の高エコー","付着部の骨棘（骨新生）","パワードプラでの滑膜の血流シグナル"],"a":3,"cx":["double contour sign は痛風（尿酸塩の沈着）。","軟骨の中の高エコーは CPPD（calcium pyrophosphate deposition：ピロリン酸カルシウム沈着症）。","付着部の骨新生は脊椎関節炎や変形性関節症で見られる慢性の変化。",""],"core":"エコー：グレースケールで滑膜の肥厚、パワードプラで血流（＝活動性）。診察で腫れがなくても滑膜炎が見つかる（潜在性滑膜炎）。","e":"関節エコーは骨びらんも X 線より早く見つける。腱鞘滑膜炎（手関節の尺側手根伸筋腱など）も RA（rheumatoid arthritis：関節リウマチ） の早期の手がかり。\n臨床的寛解でもパワードプラの信号が残る人は再燃・骨破壊の進行が多いとされる。\nMRI（magnetic resonance imaging） は滑膜炎・腱鞘炎・骨髄浮腫（骨びらんの前触れ）を見られる。","tg":[],"fig":["joint"]},{"id":"kensa-a9c8e974","f":"kensa","u":6,"o":32,"lv":2,"q":"大型血管炎やリウマチ性多発筋痛症の評価に役立ち、全身の炎症の場所を見つける画像検査はどれか。","ch":["腹部エコー（大動脈）","FDG-PET（fluorodeoxyglucose positron emission tomography）/CT","単純 X 線撮影（胸部）","骨シンチグラフィー"],"a":1,"cx":["腹部エコーは腹部臓器の検査で、大動脈の分枝全体の炎症は評価できない。","","X 線は血管壁の炎症を見られない。","骨シンチは骨の代謝（骨転移・骨折・SAPHO（synovitis, acne, pustulosis, hyperostosis, osteitis） など）を見る。"],"core":"FDG-PET/CT＝大動脈と分枝の壁の集積（高安・巨細胞性動脈炎）、PMR（polymyalgia rheumatica：リウマチ性多発筋痛症） の肩・股関節周囲・棘突起間の集積。不明熱の原因探し（悪性腫瘍・感染）にも。","e":"国内では FDG-PET は「大型血管炎（高安動脈炎・巨細胞性動脈炎）の診断・病変の広がりの評価」に保険適用がある（ほかの検査で診断が難しい場合など条件あり）。\nステロイドを始めると集積が数日〜数週で下がるので、できれば治療前に撮る。","tg":[]},{"id":"ra-0d61207b","f":"ra","u":7,"o":33,"lv":1,"q":"2010 ACR（American College of Rheumatology：米国リウマチ学会）/EULAR（European Alliance of Associations for Rheumatology：欧州リウマチ学会） 関節リウマチ分類基準を使うときの前提（対象となる患者）はどれか。","ch":["手のX線で骨びらんが2か所以上ある","RF（rheumatoid factor：リウマトイド因子） か ACPA（anti-citrullinated protein antibody：抗シトルリン化タンパク抗体） のどちらかが陽性である","6週間以上続く朝のこわばりがある","腫脹関節が1つ以上あり、他の病気で説明できない"],"a":3,"cx":["典型的な骨びらんがあれば、点数をつけずに RA（rheumatoid arthritis：関節リウマチ） と分類してよい（例外）。前提ではない。","血清反応は点数の項目のひとつで、陰性でも関節の点数などで6点に届けば RA（rheumatoid arthritis：関節リウマチ） と分類される。","朝のこわばりは1987年の旧基準の項目。2010年基準には入っていない。",""],"core":"2010基準：腫脹関節が1つ以上＋他疾患で説明できない → 関節（0〜5）＋血清（0〜3）＋炎症反応（0〜1）＋期間（0〜1）で6点以上。","e":"配点：\n・関節：大関節1か所＝0、大関節2〜10か所＝1、小関節1〜3か所＝2、小関節4〜10か所＝3、11か所以上（小関節を1つ以上含む）＝5\n・血清：RF・ACPA ともに陰性＝0、どちらかが低値陽性（基準値上限の3倍以下）＝2、高値陽性＝3\n・急性期反応：CRP（C-reactive protein：C反応性タンパク）・赤沈ともに正常＝0、どちらか異常＝1\n・症状の期間：6週未満＝0、6週以上＝1\n小関節＝MCP（metacarpophalangeal：中手指節）・PIP（proximal interphalangeal：近位指節間）・第2〜5MTP・母指IP・手関節。DIP（distal interphalangeal：遠位指節間）・第1MTP・第1CMC は「数えない」（OA（osteoarthritis：変形性関節症）・痛風で侵されやすいため）。\n分類基準は早く見つけるための「研究用のものさし」で、診断には鑑別（SLE（systemic lupus erythematosus：全身性エリテマトーデス）・乾癬性関節炎・PMR（polymyalgia rheumatica：リウマチ性多発筋痛症）・ウイルス性関節炎・痛風など）が欠かせない。","tg":["gl"],"fig":["hand"],"mt":["ra2010"]},{"id":"ra-56de4801","f":"ra","u":7,"o":34,"lv":2,"q":"2010 ACR（American College of Rheumatology：米国リウマチ学会）/EULAR（European Alliance of Associations for Rheumatology：欧州リウマチ学会） 分類基準で関節リウマチと分類されるのはどれか（ほかの病気は否定されているとする）。","ch":["左手関節1か所の腫脹、ACPA（anti-citrullinated protein antibody：抗シトルリン化タンパク抗体）低値陽性、CRP（C-reactive protein：C反応性タンパク）正常、症状は10週間","両膝と両肩の腫脹、RF（rheumatoid factor：リウマトイド因子）・ACPA（anti-citrullinated protein antibody：抗シトルリン化タンパク抗体）陰性、CRP（C-reactive protein：C反応性タンパク）上昇、症状は8週間","両手のDIP（distal interphalangeal：遠位指節間）関節6か所の腫脹、RF（rheumatoid factor：リウマトイド因子）・ACPA（anti-citrullinated protein antibody：抗シトルリン化タンパク抗体）陰性、CRP（C-reactive protein：C反応性タンパク）上昇、症状は12週間","両手のMCP（metacarpophalangeal：中手指節）関節4か所の腫脹、RF（rheumatoid factor：リウマトイド因子）低値陽性、CRP（C-reactive protein：C反応性タンパク）上昇、症状は3週間"],"a":3,"cx":["小関節1か所（2点）＋低値陽性（2点）＋CRP正常（0点）＋6週以上（1点）＝5点。","大関節4か所（1点）＋血清0＋CRP（1点）＋6週以上（1点）＝3点で6点に届かない。","DIP関節は数えないので関節0点。CRP（1点）＋6週以上（1点）＝2点。",""],"core":"計算は「関節＋血清＋炎症＋期間」。小関節4〜10か所は3点、低値陽性2点、CRP異常1点で、6週未満でも6点になる。","e":"小関節4か所（3点）＋RF低値陽性（2点）＋CRP上昇（1点）＋3週間（0点）＝6点で RA（rheumatoid arthritis：関節リウマチ） と分類される。\n症状が6週未満でも点数が届けば分類される一方、ウイルス性関節炎（パルボウイルスB19・風疹・B型肝炎など）は数週で自然に治ることが多く、早期例ほど鑑別が大事。\n血清反応陰性で大関節・下肢中心なら脊椎関節炎や結晶性関節炎、DIP中心なら変形性関節症（Heberden結節）・乾癬性関節炎を考える。","tg":["gl"],"mt":["ra2010"]},{"id":"ra-78ac77be","f":"ra","u":7,"o":35,"lv":3,"q":"35歳の女性。2週間前から両手指のこわばりと MCP（metacarpophalangeal：中手指節）・PIP（proximal interphalangeal：近位指節間） 関節の腫脹、発熱、顔面の淡い紅斑が出た。保育士で、職場で「りんご病」がはやっている。RF（rheumatoid factor：リウマトイド因子）弱陽性、ACPA（anti-citrullinated protein antibody：抗シトルリン化タンパク抗体） 陰性、CRP（C-reactive protein：C反応性タンパク） 0.8 mg/dL。最も考えられる診断はどれか。","ch":["全身性エリテマトーデスの初発","尿道炎後の反応性関節炎","早期の関節リウマチ（血清陽性）","パルボウイルスB19 の急性関節炎"],"a":3,"cx":["一過性に ANA（antinuclear antibody：抗核抗体）・抗dsDNA（double-stranded DNA：二本鎖DNA） が陽性になることもあり SLE（systemic lupus erythematosus：全身性エリテマトーデス） に似るが、補体・腎・血球の所見で区別し、経過をみる。","反応性関節炎は尿道炎・腸炎の1〜4週後の下肢中心の少関節炎で、手の小関節の対称性多発関節炎は典型でない。","発症2週間・ACPA 陰性・流行歴があり、まずウイルス性を考える。数週で自然に治ることが多い。",""],"core":"成人のパルボB19 感染＝手の小関節の対称性多関節炎（RA（rheumatoid arthritis：関節リウマチ）そっくり）。小児との接触歴、IgM 抗体で診断、多くは数週で治る。","e":"成人（とくに女性）では皮疹がはっきりしないことも多く、RA に似た対称性多関節炎として来る。RF・ANA（antinuclear antibody：抗核抗体） が一過性に陽性になることもある。診断はパルボウイルスB19 IgM 抗体（国内では保険で測れる場面が限られている）。\n合併症：溶血性貧血の患者では無形成発作、妊婦では胎児水腫（貧血）。\n治療は NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） などの対症療法。いきなり MTX（methotrexate：メトトレキサート） を始めず、6週以上続くかを見る。ほかに急性多関節炎を起こすウイルス：風疹（ワクチン後も）、B型肝炎（前駆期、蕁麻疹を伴う）、C型肝炎（クリオグロブリン）、HIV、チクングニア。","tg":["cs"]},{"id":"ra-75570fd2","f":"ra","u":7,"o":36,"lv":1,"q":"日本の関節リウマチについて正しいものはどれか。","ch":["男女差はなく80歳代に多い","発症は10歳未満が最も多い","有病率は約0.6〜1%で女性に多い","有病率は約10%で男性に多い"],"a":2,"cx":["女性が男性の約3〜4倍。高齢発症も増えているが、男女差がないわけではない。","16歳未満の慢性関節炎は若年性特発性関節炎として別に扱う。RA（rheumatoid arthritis：関節リウマチ） の発症は30〜60歳代が多い。","","有病率はそこまで高くなく、女性に多い。"],"core":"RA（rheumatoid arthritis：関節リウマチ）：国内の患者は約80万人前後（0.6〜1%）、女性が3〜4倍、発症は30〜60歳代が中心（高齢発症が増加）。","e":"危険因子：女性、家族歴、HLA（human leukocyte antigen：ヒト白血球抗原）-DRB1（shared epitope）、喫煙、歯周病、肥満。\n予後不良因子（関節破壊が早い）：RF（rheumatoid factor：リウマトイド因子）・ACPA（anti-citrullinated protein antibody：抗シトルリン化タンパク抗体） の高値陽性、早期からの骨びらん、CRP（C-reactive protein：C反応性タンパク）・赤沈の高値、多くの関節の腫脹、身体機能の低下。","tg":[]},{"id":"ra-415cfb5b","f":"ra","u":7,"o":37,"lv":2,"q":"数時間〜数日で消える単関節の発作をくり返し、発作の間は全く症状がない。のちに約3分の1〜半数が関節リウマチに移行するといわれ、ACPA（anti-citrullinated protein antibody：抗シトルリン化タンパク抗体） 陽性なら移行が多い。この病態はどれか。","ch":["偽痛風（CPPD（calcium pyrophosphate deposition：ピロリン酸カルシウム沈着症））の慢性型","線維筋痛症（慢性疼痛）","回帰性リウマチ","家族性地中海熱の関節炎"],"a":2,"cx":["偽痛風の慢性型は高齢者の持続する多関節炎で、発作間の無症状期がはっきりしない。","線維筋痛症は腫れのない全身の慢性痛。","","FMF（familial Mediterranean fever：家族性地中海熱） は発熱と漿膜炎の発作が中心で、関節炎は下肢の大関節に多い。"],"core":"回帰性リウマチ＝くり返す短い単関節炎（発赤・腫脹）、間欠期は無症状。ACPA 陽性は RA（rheumatoid arthritis：関節リウマチ） への移行が多い。","e":"発作は手指・手関節・膝などに多く、関節周囲の皮膚の発赤を伴うことがある。\n痛風・偽痛風を関節液で除外する。\nヒドロキシクロロキン（国内では保険適用外）やサラゾスルファピリジン（アザルフィジンEN）で発作が減り、RA への移行を遅らせる可能性がある。","tg":[]},{"id":"ra-28fc16ef","f":"ra","u":8,"o":38,"lv":1,"q":"SDAI（Simplified Disease Activity Index）の計算に使わないものはどれか。","ch":["28関節の圧痛関節数","赤沈（ESR（erythrocyte sedimentation rate：赤沈））","患者全般評価（0〜10）","CRP（mg/dL）"],"a":1,"cx":["圧痛関節数（28関節）は SDAI・CDAI（Clinical Disease Activity Index）・DAS28（Disease Activity Score 28（28関節の疾患活動性スコア）） のすべてに入る。","","患者全般評価（PtGA（patient global assessment：患者全般評価））と医師全般評価（EGA（evaluator global assessment：医師全般評価））を 0〜10 で足す。","SDAI＝CDAI（Clinical Disease Activity Index）＋CRP（mg/dL）。CRP は入る。"],"core":"SDAI＝圧痛28＋腫脹28＋患者全般（0-10）＋医師全般（0-10）＋CRP（mg/dL）。CDAI（Clinical Disease Activity Index） は CRP を除いたもの。","e":"基準：\n・SDAI：寛解 ≦3.3、低 ≦11、中 ≦26、高 >26\n・CDAI：寛解 ≦2.8、低 ≦10、中 ≦22、高 >22\n・DAS28（Disease Activity Score 28（28関節の疾患活動性スコア））-ESR：寛解 <2.6、低 ≦3.2、中 ≦5.1、高 >5.1（DAS28-CRP は同じ線を使うが ESR 版より低く出やすい）\nCDAI は採血がいらず、その場で計算できる。IL-6（interleukin-6：インターロイキン6） 阻害薬・JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬は CRP・赤沈を強く下げるので、DAS28 や SDAI は実際より良く見えやすい。そのときは CDAI を使う。\n28関節に含まれないもの：足関節・足趾（MTP（metatarsophalangeal：中足趾節））。足の評価を忘れない。","tg":[],"mt":["das"]},{"id":"ra-9c8695da","f":"ra","u":8,"o":39,"lv":2,"q":"ACR（American College of Rheumatology：米国リウマチ学会）/EULAR（European Alliance of Associations for Rheumatology：欧州リウマチ学会） の Boolean 寛解（2022年改訂）の条件として正しいものはどれか。","ch":["DAS28（Disease Activity Score 28（28関節の疾患活動性スコア））-ESR（erythrocyte sedimentation rate：赤沈） が 2.6 未満の状態が6か月続く","圧痛0・腫脹0・CRP（C-reactive protein：C反応性タンパク） 陰性・患者全般評価0","SDAI（Simplified Disease Activity Index） が 11 以下で、かつ HAQ（Health Assessment Questionnaire：身体機能の質問票） が 0.5 以下","圧痛≦1・腫脹≦1・CRP（C-reactive protein：C反応性タンパク）≦1 mg/dL・患者全般≦2"],"a":3,"cx":["DAS28<2.6 は DAS28 の寛解で、Boolean とは別の定義。関節が残っていても達成しやすい。","0 をすべて求めるのは厳しすぎ、実際の基準は「1以下」。","SDAI≦11 は「低疾患活動性」。HAQ は身体機能の指標で、寛解の定義には入らない。",""],"core":"Boolean 寛解＝TJC（tender joint count：圧痛関節数）≦1・SJC（swollen joint count：腫脹関節数）≦1・CRP≦1 mg/dL・PtGA（patient global assessment：患者全般評価）≦2（2022年に PtGA を≦1 から≦2 へ緩めた）。","e":"寛解の基準のうち、Boolean と SDAI≦3.3 は「関節が本当に残っていない」ことと関節破壊の進まないことに対応する（臨床試験の標準）。\n患者全般評価は痛み・疲労・気分・線維筋痛症の影響を受けやすく、炎症がなくても高くなるため、2022年に≦2 へ緩められた。\nT2T（treat to target）：寛解（難しければ低疾患活動性）を目標に、1〜3か月ごとに評価して、3か月で改善がなければ・6か月で目標に届かなければ治療を変える。","tg":[],"mt":["das"]},{"id":"ra-c48bcce3","f":"ra","u":8,"o":40,"lv":1,"q":"関節リウマチの身体機能の評価として、日常生活の動作（着替え・起立・食事など）を患者が答える質問票はどれか。","ch":["ESSDAI（臓器ごとの活動性）","HAQ（Health Assessment Questionnaire：身体機能の質問票）","mRSS（皮膚硬化の点数）","BASDAI（脊椎関節炎の質問票）"],"a":1,"cx":["ESSDAI はシェーグレン病の臓器ごとの活動性。","","mRSS は全身性強皮症の皮膚硬化の点数。","BASDAI は体軸性脊椎関節炎の疾患活動性（患者が答える6問）。"],"core":"HAQ（0〜3点）＝RA（rheumatoid arthritis：関節リウマチ） の身体機能。0.5 以下を「機能的寛解」とすることが多い。関節破壊が進むと治療しても戻らない部分が増える。","e":"機能の古い分類：Steinbrocker の class 分類（I：普通の仕事が全部できる〜IV：寝たきり）。\nX 線の進行度：Steinbrocker の stage 分類（I：骨萎縮のみ〜IV：強直）、modified Total Sharp Score（骨びらん＋関節裂隙狭小化の合計）。\n「臨床的寛解」「構造的寛解（X 線の進行なし）」「機能的寛解（HAQ≦0.5）」の3つをそろえるのが理想。","tg":[]},{"id":"ra-f70219d8","f":"ra","u":8,"o":41,"lv":2,"q":"2つ以上の生物学的製剤・JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬（作用の違うもの）で効果不十分が続く関節リウマチ（difficult-to-treat RA（rheumatoid arthritis：関節リウマチ））の対応として、まず行うべきことはどれか。","ch":["ステロイドを大量に長く使う","炎症が本当に残っているか確かめる","すぐに3剤目の生物学的製剤を加える","もう治療法はないと伝える"],"a":1,"cx":["ステロイドの長期大量は害が大きい。","","切り替えの前に、症状が炎症によるものか（線維筋痛症・変形性関節症・関節破壊の痛みではないか）や服薬状況を確かめる。","作用の違う薬への切り替え・併用薬の見直し・手術など、選択肢は残っている。"],"core":"D2T RA（EULAR（European Alliance of Associations for Rheumatology：欧州リウマチ学会） 2021）：まず「炎症が残っているか」をエコーなどで確かめ、線維筋痛症・OA（osteoarthritis：変形性関節症）・服薬不良・合併症（感染・肺）を見直す。","e":"EULAR の定義：csDMARD（conventional synthetic DMARD：従来型合成抗リウマチ薬） に加え、作用の異なる2剤以上の b/tsDMARD（targeted synthetic DMARD：分子標的型合成抗リウマチ薬） が効かない、活動性の徴候（中等度以上の疾患活動性・ステロイドを減らせない・進行など）があり、医師か患者が扱いにくいと感じている状態。\n疼痛が炎症と関係ないとき（中枢性感作）は、運動療法・睡眠・薬（デュロキセチン（サインバルタ）など）を考える。","tg":[]},{"id":"ra-c8830069","f":"ra","u":9,"o":42,"lv":2,"q":"関節リウマチに合併する間質性肺疾患で、最も多い画像パターンで、かつ予後が悪いとされるのはどれか。","ch":["通常型間質性肺炎（UIP（usual interstitial pneumonia：通常型間質性肺炎））パターン","非特異性間質性肺炎（NSIP（nonspecific interstitial pneumonia：非特異性間質性肺炎））パターン","器質化肺炎（OP）パターン","リンパ球性間質性肺炎（LIP）パターン"],"a":0,"cx":["","NSIP は全身性強皮症・筋炎に多いパターンで、RA（rheumatoid arthritis：関節リウマチ） でもあるが、予後は UIP（usual interstitial pneumonia：通常型間質性肺炎） より良い。","器質化肺炎はステロイドがよく効く。RA（rheumatoid arthritis：関節リウマチ） や薬剤（MTX（methotrexate：メトトレキサート） など）で起こる。","LIP はシェーグレン病に特徴的。"],"core":"RA（rheumatoid arthritis：関節リウマチ）-ILD（interstitial lung disease：間質性肺疾患） は UIP（蜂巣肺・牽引性気管支拡張）が多く予後不良。危険因子：男性・高齢・喫煙・高力価 RF（rheumatoid factor：リウマトイド因子）/ACPA（anti-citrullinated protein antibody：抗シトルリン化タンパク抗体）。","e":"RA の死因として呼吸器病変は大きい。UIP パターンは特発性肺線維症と似て進行性で、抗線維化薬ニンテダニブ（オフェブ）が「進行性線維化を伴う間質性肺疾患（PF-ILD）」として使える。\nRA の肺病変はほかに：気道病変（細気管支炎・気管支拡張）、胸膜炎（関節液のように糖が低い滲出液）、リウマチ結節、Caplan 症候群（じん肺＋リウマチ結節）。\n治療の注意：既存の ILD がある人に MTX（methotrexate：メトトレキサート）・レフルノミドを使うと肺障害の悪化が問題になりうる。JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬・アバタセプトなどを選ぶことが多い。治療開始前に胸部 X線（できれば CT）を撮っておく。","tg":[]},{"id":"ra-6754f9b0","f":"ra","u":9,"o":43,"lv":2,"q":"Felty 症候群の三徴はどれか。","ch":["関節リウマチ・肺結節・じん肺","関節リウマチ・リンパ節腫脹・好酸球増加","関節リウマチ・肝腫・血小板減少","関節リウマチ・脾腫・好中球減少"],"a":3,"cx":["肺結節＋じん肺は Caplan 症候群。","好酸球増加は EGPA（eosinophilic granulomatosis with polyangiitis：好酸球性多発血管炎性肉芽腫症）・薬剤性などを考える。","血小板減少は三徴に入らない。脾腫で起こることはある。",""],"core":"Felty 症候群＝長期の血清反応陽性 RA（rheumatoid arthritis：関節リウマチ）＋脾腫＋好中球減少。大顆粒リンパ球（LGL）白血病と近い。","e":"長い経過の、RF（rheumatoid factor：リウマトイド因子） 高値・関節破壊の強い RA に多い。好中球減少のため感染症をくり返し、下腿潰瘍を伴うこともある。治療は RA のコントロール（MTX（methotrexate：メトトレキサート））、重症の好中球減少では G-CSF、難治例で脾摘。\n大顆粒リンパ球白血病（T-LGL）は RA に合併し、好中球減少・脾腫を起こす「Felty と似た病態」。\n鑑別：MTX による血球減少（葉酸不足・腎機能低下・ST合剤との併用で起こる）を必ず考える。","tg":[]},{"id":"ra-19139b02","f":"ra","u":9,"o":44,"lv":2,"q":"長期の関節リウマチで、ネフローゼ症候群と腎機能低下、下痢が出てきた。腸管生検で Congo red 染色陽性の沈着を認めた。最も考えられる病態と、治療の考え方の組み合わせはどれか。","ch":["AA アミロイドーシス：炎症を抑え SAA（serum amyloid A：血清アミロイドA） を下げる","ATTR アミロイドーシス：TTR 安定化薬を使う","AL アミロイドーシス：形質細胞の化学療法","β2MG アミロイドーシス：透析の方法を変える"],"a":0,"cx":["","ATTR は遺伝性または加齢（野生型）で、心臓・手根管症候群が中心。慢性炎症とは無関係。","AL は単クローン性の免疫グロブリン軽鎖による。RA（rheumatoid arthritis：関節リウマチ） の長期炎症ではなく、形質細胞疾患に伴う。","透析アミロイドーシス（β2ミクログロブリン）は長期透析患者の手根管症候群・骨嚢胞。"],"core":"慢性炎症（RA（rheumatoid arthritis：関節リウマチ）・FMF（familial Mediterranean fever：家族性地中海熱）・炎症性腸疾患）→ 血清アミロイドA（SAA）が沈着＝AA アミロイドーシス。腎・腸・甲状腺。治療は原病の炎症を消すこと。","e":"SAA は IL-6（interleukin-6：インターロイキン6）・IL-1（interleukin-1：インターロイキン1）・TNF（tumor necrosis factor：腫瘍壊死因子） で肝臓がつくる急性期タンパク。炎症が長く続くと、その断片が組織に沈着する。腎（蛋白尿・ネフローゼ）、消化管（下痢・吸収不良）が多い。\n診断：消化管・腹壁脂肪・腎の生検で Congo red 染色（偏光で apple-green の複屈折）、免疫染色で AA を確認。\n治療：原病の炎症を完全に抑えて SAA を正常にする。トシリズマブ（アクテムラ）は SAA を強く下げ、AA アミロイドーシスに有効とする報告が多い。FMF ではコルヒチンで予防できる。","tg":["ae"]},{"id":"ra-3c897624","f":"ra","u":9,"o":45,"lv":3,"q":"68歳の男性。罹病25年の関節リウマチ。この2週間で頸部の痛みが強くなり、両手のしびれと歩きにくさが出てきた。最初に考えるべき病態と検査はどれか。","ch":["PMR（polymyalgia rheumatica：リウマチ性多発筋痛症） の合併：CRP（C-reactive protein：C反応性タンパク） と MMP-3（matrix metalloproteinase-3：マトリックスメタロプロテイナーゼ3） の測定","頸椎症性神経根症：神経伝導検査","環軸椎亜脱臼：頸椎の前後屈X線と MRI（magnetic resonance imaging）","手根管症候群：手関節の超音波検査"],"a":2,"cx":["PMR は肩・腰帯の痛みとこわばりで、しびれや歩行障害は起こさない。","神経根症では片側の上肢の痛みが中心で、歩行障害（脊髄症）は説明しにくい。","","手根管症候群は手のしびれを起こすが、頸部痛・歩行障害は説明できない。"],"core":"長期 RA（rheumatoid arthritis：関節リウマチ） の頸部痛＋上下肢のしびれ・歩行障害＝環軸椎亜脱臼（環椎歯突起間距離 ADI の開大）→脊髄症。挿管・頸の過屈曲に注意。","e":"RA は滑膜関節の環軸関節を侵し、横靱帯がゆるんで環椎が前にずれる（前方亜脱臼が最多）。ほかに垂直性亜脱臼（歯突起が大後頭孔へ）、軸椎下亜脱臼。\nX線の側面像（前屈・後屈）で環椎歯突起間距離（ADI）が3 mm を超えると異常（とくに前屈時）。脊髄の圧迫は MRI で見る。\n脊髄症の症状（手指の巧緻運動障害・歩行障害・膀胱直腸障害・腱反射亢進）があれば整形外科で固定術を考える。全身麻酔の挿管時には頸椎を過度に動かさない。","tg":["cs"]},{"id":"ra-910b3cb4","f":"ra","u":9,"o":46,"lv":1,"q":"関節リウマチの手の変形で、PIP（proximal interphalangeal：近位指節間） 関節が過伸展し DIP（distal interphalangeal：遠位指節間） 関節が屈曲する変形はどれか。","ch":["尺側偏位","ボタン穴変形（ボタンホール変形）","Z 変形（母指）","スワンネック変形"],"a":3,"cx":["尺側偏位は MCP（metacarpophalangeal：中手指節） 関節で指が小指側へ傾く変形。","ボタン穴変形は PIP 関節が屈曲し、DIP 関節が過伸展する（中央索がゆるみ、側索が掌側に落ちる）。","Z 変形は母指の MCP（metacarpophalangeal：中手指節） 屈曲・IP 過伸展。",""],"core":"スワンネック＝PIP 過伸展＋DIP 屈曲。ボタン穴＝PIP 屈曲＋DIP 過伸展。MCP（metacarpophalangeal：中手指節） は尺側偏位・掌側亜脱臼。","e":"ほかの手の合併症：\n・伸筋腱の断裂：尺骨頭の突出部でこすれて、第4・5指から伸びなくなる（Vaughan-Jackson 症候群）。早めの手術が必要。\n・手根管症候群：手関節の腱鞘滑膜炎で正中神経が圧迫される。\n・ムチランス変形：骨が溶けて指が短くなる（オペラグラス手）。\n足：外反母趾、MTP（metatarsophalangeal：中足趾節） 関節の亜脱臼と足底の胼胝（たこ）。","tg":[]},{"id":"ra-724851a0","f":"ra","u":9,"o":47,"lv":2,"q":"リウマトイド結節について正しいものはどれか。","ch":["悪性化しやすく、すぐ切除する","関節の屈側の皮下にできやすい","RF（rheumatoid factor：リウマトイド因子） 陰性の RA（rheumatoid arthritis：関節リウマチ） に特に多い","RF（rheumatoid factor：リウマトイド因子） 陽性に多く、MTX（methotrexate：メトトレキサート） で増えうる"],"a":3,"cx":["良性の病変で、悪性化はしない。困るときだけ局所注射・切除。","圧のかかる伸側（肘頭・前腕の伸側・アキレス腱など）にできやすい。","RF 陽性・活動性の高い RA に多い。",""],"core":"リウマトイド結節＝RF 陽性・肘の伸側など。病理は中心のフィブリノイド壊死を組織球が柵状に囲む。MTX で増える（accelerated nodulosis）ことがある。","e":"肺・心臓・強膜など内臓にもできる（肺の結節は空洞化することがあり、結核・腫瘍と区別する）。\nじん肺（炭鉱夫など）に RA が合併し、多発肺結節ができるのが Caplan 症候群。\nMTX による結節の増加は、ほかの治療へ変えると小さくなることがある。","tg":[]},{"id":"ra-6afee8f4","f":"ra","u":9,"o":48,"lv":2,"q":"関節リウマチの胸水の性状として典型的なものはどれか。","ch":["血性で、腫瘍細胞を多く含む","漏出液で、糖は血糖と同じ","滲出液で、糖が著しく低い","乳び胸水で、中性脂肪が高い"],"a":2,"cx":["血性で腫瘍細胞があれば癌性胸膜炎。","RA（rheumatoid arthritis：関節リウマチ） の胸水は蛋白・LDH の高い滲出液。","","乳び胸水はリンパ管の障害（リンパ腫・外傷など）。RA（rheumatoid arthritis：関節リウマチ） では長く続くと偽性乳び胸（コレステロール）になることはある。"],"core":"RA（rheumatoid arthritis：関節リウマチ） の胸水＝滲出液・糖が著しく低い（<30 mg/dL のことも）・pH 低い・LDH 高い・補体低い・RF（rheumatoid factor：リウマトイド因子） 陽性。男性に多い。","e":"糖が低い胸水の鑑別：RA、膿胸、結核、悪性腫瘍、食道破裂。結核（ADA（adenosine deaminase：アデノシンデアミナーゼ） 高値・リンパ球優位）と膿胸（細菌）は必ず除外する。\nSLE（systemic lupus erythematosus：全身性エリテマトーデス） の胸水は糖が保たれ、抗核抗体陽性・補体低値のことがある。","tg":[]},{"id":"ra-32e6c522","f":"ra","u":9,"o":49,"lv":3,"q":"60歳の女性。関節リウマチで治療中。昨日から右のふくらはぎが急に腫れて痛くなった。膝の裏に以前から腫れがあった。下肢静脈エコーで深部静脈血栓はなく、膝窩からふくらはぎに液体の貯留がある。最も考えられるのはどれか。","ch":["下腿の蜂窩織炎","腓腹筋の肉ばなれ","Baker 嚢胞の破裂","閉塞性動脈硬化症"],"a":2,"cx":["蜂窩織炎では皮膚の発赤・熱感が広がり、液体の袋状の貯留とは違う。","肉ばなれは運動中の急な痛みが典型で、膝窩の嚢胞とつながる液体は説明できない。","","動脈硬化症は歩くと痛む跛行で、ふくらはぎの腫れは起こさない。"],"core":"膝の滑膜炎→関節液が膝窩嚢胞にたまる→破裂するとふくらはぎが急に腫れて痛む（偽性血栓性静脈炎）。深部静脈血栓をまずエコーで除外。","e":"破裂した液体の刺激で、くるぶしの周りに内出血のような皮下出血（crescent sign）が出ることがある。\n治療：安静・挙上・NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）、膝の関節炎のコントロール（関節内ステロイド注射）。抗凝固薬は不要（血栓がなければ）。\n逆に、深部静脈血栓を Baker 嚢胞の破裂と思い込まないよう、エコーで確かめる。","tg":["cs"]},{"id":"ra-113c6917","f":"ra","u":9,"o":50,"lv":2,"q":"関節リウマチの眼の合併症で、痛みが強く、放置すると眼球に穴があくおそれがあるものはどれか。","ch":["壊死性強膜炎","乾燥性角結膜炎（二次性シェーグレン）","上強膜炎","前部虚血性視神経症"],"a":0,"cx":["","ドライアイは最も多いが、穿孔の危険はふつうない（重いと角膜潰瘍になることはある）。","上強膜炎は軽い充血と違和感で、多くは自然に治る。","前部虚血性視神経症は巨細胞性動脈炎の失明の原因。"],"core":"RA（rheumatoid arthritis：関節リウマチ） の眼：ドライアイ（最多）＞上強膜炎（軽い）＞強膜炎（痛い・重い）。壊死性強膜炎は血管炎（悪性関節リウマチ）のサインで、強力な免疫抑制が必要。","e":"痛みのない強膜の菲薄化（穿孔性強膜軟化症）もある。\n強膜炎は RA のほか、多発血管炎性肉芽腫症・再発性多発軟骨炎・IBD（inflammatory bowel disease：炎症性腸疾患） でも起こる。眼科と連携し、ステロイド・免疫抑制薬（シクロホスファミド（エンドキサン）・リツキシマブ・TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬）を使う。","tg":[]},{"id":"ra-c0483772","f":"ra","u":9,"o":51,"lv":2,"q":"関節リウマチの患者の心血管病について正しいものはどれか。","ch":["一般の人より心血管病はむしろ少ない","NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） を長く使うほど心血管病が減る","ステロイドを長く使うほど心血管病は減る","一般の人より多く、炎症の抑制も予防になる"],"a":3,"cx":["RA（rheumatoid arthritis：関節リウマチ） の人は心筋梗塞・心不全が一般の約1.5〜2倍とされる。","NSAIDs は心血管イベントを増やしうる。","ステロイドの長期使用は、血圧・血糖・脂質を悪くし心血管病を増やす。",""],"core":"RA（rheumatoid arthritis：関節リウマチ） は心血管病の危険因子（炎症による動脈硬化）。疾患活動性を抑え、喫煙・血圧・脂質・糖尿病を管理する（EULAR（European Alliance of Associations for Rheumatology：欧州リウマチ学会） は心血管リスクの評価を勧める）。","e":"活動性が高いと LDL コレステロールがむしろ低く見える（lipid paradox）。治療で炎症が収まると脂質が上がるが、心血管のリスクは下がる。\nJAK（Janus kinase：ヤヌスキナーゼ） 阻害薬は、心血管の危険因子が多い人では慎重に（ORAL Surveillance）。","tg":[]},{"id":"ra-c6c14fc8","f":"ra","u":9,"o":52,"lv":2,"q":"悪性関節リウマチ（リウマトイド血管炎）の症状として典型的なものはどれか。","ch":["肩と腰帯の朝のこわばり","口腔と陰部の再発性潰瘍","両手の DIP（distal interphalangeal：遠位指節間） 関節の骨棘","皮膚潰瘍・多発性単神経炎"],"a":3,"cx":["肩・腰帯のこわばりはリウマチ性多発筋痛症。","口腔と陰部の潰瘍はベーチェット病。","DIP の骨棘は変形性関節症（Heberden 結節）。",""],"core":"リウマトイド血管炎＝長期・RF（rheumatoid factor：リウマトイド因子） 高値・関節破壊の強い RA（rheumatoid arthritis：関節リウマチ） に起こる中小血管炎。皮膚潰瘍・爪周囲の梗塞・多発性単神経炎・強膜炎・内臓の梗塞。低補体・クリオグロブリンを伴うことも。","e":"国内では「悪性関節リウマチ」として指定難病。\n治療：ステロイド＋シクロホスファミド（重症）またはリツキシマブ（リツキサン）、血漿交換（全身性の重い血管炎）。\n近年は RA の治療が進み、まれになった。","tg":[]},{"id":"ratx-c8cf6772","f":"ratx","u":10,"o":53,"lv":1,"q":"関節リウマチ診療ガイドライン2024 の薬物治療アルゴリズムで、診断後に最初に使う薬（フェーズI）として推奨されるのはどれか。","ch":["少量ステロイドの長期単独投与","TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬（生物学的製剤）","禁忌がなければ MTX（methotrexate：メトトレキサート）","JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬（内服の分子標的薬）"],"a":2,"cx":["ステロイドは「短期間の補助」。長期の単独使用は勧められない。","生物学的製剤は MTX（methotrexate：メトトレキサート） で効果不十分なとき（フェーズII）に追加する。","","JAK 阻害薬もフェーズII以降。長期安全性と医療経済の点から、生物学的製剤を優先して考える。"],"core":"フェーズI＝MTX（使えなければ他の csDMARD（conventional synthetic DMARD：従来型合成抗リウマチ薬））。フェーズII＝bDMARD（biological DMARD：生物学的製剤） か JAK を追加（bDMARD を優先）。フェーズIII＝別の bDMARD/JAK へ切り替え。","e":"目標は臨床的寛解（難しければ低疾患活動性）。開始後3か月で改善がない、または6か月で目標に届かなければ次のフェーズへ進む（T2T（treat to target：目標達成に向けた治療））。\n・フェーズI：MTX が第一選択。禁忌（妊娠・重い腎障害など）や副作用で使えないときは、サラゾスルファピリジン（アザルフィジンEN）・ブシラミン（リマチル）・イグラチモド（ケアラム）・タクロリムス（プログラフ）など。\n・フェーズII：MTX 併用で bDMARD（TNF阻害薬・IL-6（interleukin-6：インターロイキン6）受容体抗体・アバタセプト）または JAK 阻害薬を追加。MTX が使えない人では bDMARD 単独（IL-6 阻害薬は単独でも効きやすい）。\n・フェーズIII：作用の違う別の bDMARD／JAK 阻害薬に切り替える。\n・2024年の主な変更：MTX 皮下注（メトジェクト）を経口と区別しない、リツキシマブ（国内では RA（rheumatoid arthritis：関節リウマチ） に保険適用外）をリンパ増殖性疾患の合併例などの選択肢として追加、バイオシミラーを先行品と同等に推奨。","tg":["ae","gl"],"fig":["raalg"]},{"id":"ratx-dedeb1c1","f":"ratx","u":10,"o":54,"lv":2,"q":"関節リウマチの治療開始時の副腎皮質ステロイドの使い方として、ガイドラインの考え方に合うものはどれか。","ch":["MTX（methotrexate：メトトレキサート） が効くまでの短期の「つなぎ」に限る","MTX（methotrexate：メトトレキサート） の効果を弱めるので、同時には使わない","高齢者は副作用が少ないので長く使ってよい","骨破壊を防ぐため、少量を5年以上続ける"],"a":0,"cx":["","MTX の効果を弱めることはなく、効果発現までの橋渡しとして使われる。","高齢者ほど骨折・感染・白内障などの害が大きい。","長期の使用は骨粗鬆症・感染・糖尿病・心血管病を増やす。目標は中止。"],"core":"RA（rheumatoid arthritis：関節リウマチ） のステロイド＝橋渡し（bridging）。少量・短期・早く減らす。長期使用は害が上回る。","e":"MTX は効果が出るまで1〜3か月かかるため、その間の症状を抑える目的で少量（プレドニゾロン（プレドニン）換算 5〜10 mg/日程度）を短期間使うことがある。EULAR（European Alliance of Associations for Rheumatology：欧州リウマチ学会） 推奨でも「できるだけ早く（臨床的に可能なら3か月以内に）漸減・中止」。\n関節内注射（トリアムシノロン（ケナコルト）：ケナコルト）は、1〜2関節だけ炎症が残るときに有効。\n長く使うなら GIOP（グルココルチコイド誘発性骨粗鬆症）の予防（骨折リスクの点数化→ビスホスホネートなど）を同時に行う。","tg":["gl"]},{"id":"ratx-a0523870","f":"ratx","u":10,"o":55,"lv":2,"q":"関節リウマチで6か月以上の寛解が続き、MTX（methotrexate：メトトレキサート）＋TNF（tumor necrosis factor：腫瘍壊死因子）阻害薬で治療中。治療を減らすときの順番として、一般的に勧められるのはどれか。","ch":["ステロイド→生物学的製剤の順に減らす","まず MTX を中止し、生物学的製剤は続ける","すべての薬を同時に中止して経過を見る","寛解中でもどの薬も減らさないで続ける"],"a":0,"cx":["","MTX は生物学的製剤の効果を保ち、抗薬物抗体を防ぐ「土台」なので、先に止めると再燃しやすい。","一度に全部止めると再燃が多い。","持続寛解なら、慎重に減らすことは選択肢になる（再燃しても多くは再開で戻る）。"],"core":"減らす順＝ステロイド→生物学的製剤（減量・間隔延長・中止）→csDMARD（conventional synthetic DMARD：従来型合成抗リウマチ薬）。持続寛解（6か月以上）を確認してから、1つずつ。","e":"生物学的製剤の休薬は、深い寛解（Boolean・SDAI（Simplified Disease Activity Index） 寛解）で、罹病期間が短く、関節破壊の少ない人ほど成功しやすい。インフリキシマブ（レミケード）・アダリムマブ・エタネルセプトなどで「バイオフリー寛解」の報告がある。\n減量するときは、再燃したらすぐ戻せるよう、間隔の延長から始めることが多い。","tg":["ae"]},{"id":"ratx-656a860a","f":"ratx","u":10,"o":56,"lv":1,"q":"バイオシミラー（バイオ後続品）について正しいものはどれか。","ch":["先行品と同等で、薬価が安い","先行品より効果が強いことが条件","化学合成でつくった内服薬である","RA（rheumatoid arthritis：関節リウマチ） には使えない（他の病気だけ）"],"a":0,"cx":["","効果を上回る必要はなく、「同等・同質」であることが条件。","バイオシミラーは生物学的製剤（タンパク質）で、内服薬ではない。化学合成の後発品は「ジェネリック」。","インフリキシマブ（レミケード）・エタネルセプト・アダリムマブなどのバイオシミラーが RA に使える。"],"core":"バイオシミラー＝先行の生物学的製剤と同等・同質と確かめた後続品。ガイドライン2024 で先行品と同等に推奨。費用を下げられる。","e":"生物学的製剤は細胞でつくる大きなタンパク質なので、完全に同じものはつくれない。そのため臨床試験で同等性を確かめる。\n先行品から切り替えても（ノセボ効果を除けば）効果は保たれると報告されている。\n高額療養費の自己負担限度に達していない人では、費用の面で利点が大きい。","tg":["gl"]},{"id":"ratx-aa06ea28","f":"ratx","u":10,"o":57,"lv":2,"q":"既存の間質性肺疾患がある関節リウマチ患者の治療薬を選ぶとき、肺障害の悪化が特に問題になり、慎重に考える薬の組み合わせはどれか。","ch":["アバタセプト（オレンシア）とトシリズマブ（アクテムラ）","サラゾスルファピリジン（アザルフィジンEN）とタクロリムス（プログラフ）","MTX（methotrexate：メトトレキサート） とレフルノミド（アラバ）","ヒドロキシクロロキン（プラケニル）とプレドニゾロン（プレドニン）"],"a":2,"cx":["アバタセプト・IL-6（interleukin-6：インターロイキン6） 阻害薬は ILD（interstitial lung disease：間質性肺疾患） 合併 RA（rheumatoid arthritis：関節リウマチ） で比較的使われることが多い（悪化の報告もあり経過観察は必要）。","サラゾスルファピリジン・タクロリムスも ILD（interstitial lung disease：間質性肺疾患） 合併例で選ばれることがある（タクロリムスは筋炎の ILD の治療薬）。","","ヒドロキシクロロキンは国内で RA（rheumatoid arthritis：関節リウマチ） に適応がない。プレドニゾロンは ILD（interstitial lung disease：間質性肺疾患） の治療にも使う。"],"core":"RA（rheumatoid arthritis：関節リウマチ）-ILD（interstitial lung disease：間質性肺疾患）：MTX（MTX 肺炎）・レフルノミド（日本人で重い間質性肺炎）は慎重に。アバタセプト・IL-6（interleukin-6：インターロイキン6） 阻害薬・タクロリムス・JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬などを考え、進行性線維化にはニンテダニブ（オフェブ）。","e":"近年の研究では、MTX 自体が RA-ILD を新たに起こしたり悪化させたりする危険は以前考えられたほど高くないという報告もある。ただし重い ILD・呼吸機能の低い人ではほかの薬を選ぶのが一般的。\nTNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬でも ILD の急性増悪が報告されている。\n開始前に胸部 CT と呼吸機能を確認し、治療中も咳・息切れに注意する。","tg":[],"mt":["ctdild"]},{"id":"ratx-ef8326cf","f":"ratx","u":10,"o":58,"lv":3,"q":"45歳の女性。3か月前から両手の MCP（metacarpophalangeal：中手指節）・PIP（proximal interphalangeal：近位指節間） 関節と手関節の腫れと朝のこわばり（1時間）。ACPA（anti-citrullinated protein antibody：抗シトルリン化タンパク抗体） 高値陽性、CRP（C-reactive protein：C反応性タンパク） 2.1 mg/dL、手の X 線で小さな骨びらん。腎機能・肝機能は正常、妊娠の予定なし。最初の治療として最も適切なのはどれか。","ch":["結核・肝炎を確かめて MTX（methotrexate：メトトレキサート） と葉酸を始める","NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） だけで半年ほど様子を見る","すぐに TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬を単独で始める","プレドニゾロン（プレドニン） 30 mg/日を長期に続ける"],"a":0,"cx":["","予後不良因子（ACPA 高値・骨びらん）があり、早く DMARD（disease-modifying antirheumatic drug：抗リウマチ薬） を始めるべき。NSAIDs は骨破壊を止めない。","生物学的製剤はフェーズ II（MTX（methotrexate：メトトレキサート） で効果不十分のとき）。","ステロイドは短期の橋渡しにとどめる。"],"core":"診断がついたらすぐ MTX（フェーズ I）。開始前に、胸部 X 線（CT）・HBV（HBs（hepatitis B surface：B型肝炎ウイルス表面） 抗原・HBc（hepatitis B core：B型肝炎ウイルスコア）/HBs 抗体）・腎機能・肝機能・血算・結核の問診（生物学的製剤の前には IGRA（interferon-gamma release assay：インターフェロンγ遊離試験））を確認する。","e":"「発症早期に治療を始めるほど、関節破壊を止めやすい（window of opportunity）」。\nMTX は週8 mg 前後から始め、効果を見て2〜4週ごとに増やす。葉酸は最後の MTX の24〜48時間後に週5 mg 以内。\n開始後1〜3か月ごとに疾患活動性（CDAI（Clinical Disease Activity Index）/SDAI（Simplified Disease Activity Index））を評価し、3か月で改善がない・6か月で目標に届かなければ次のフェーズへ。\n禁煙・歯周病の治療・ワクチン（インフルエンザ・肺炎球菌・組換え帯状疱疹）も勧める。","tg":["ae","cs"],"fig":["raalg"]},{"id":"ratx-cd6f41ab","f":"ratx","u":10,"o":59,"lv":3,"q":"52歳の女性。関節リウマチで MTX（methotrexate：メトトレキサート） 16 mg/週を4か月使っている。腫脹関節6、圧痛関節8、CDAI（Clinical Disease Activity Index） 25。結核・B 型肝炎の確認は済んでいる。心血管の危険因子はない。次の対応として最も適切なのはどれか。","ch":["ステロイドを長期に追加する","MTX を週 25 mg に増やす","MTX に生物学的製剤を追加する","今の治療のまま1年経過を見る"],"a":2,"cx":["ステロイドの長期追加は勧められない。","国内の内服の最大量は週16 mg。それ以上には増やさない。","","CDAI 25 は高疾患活動性。3か月で目標に届かなければ治療を変えるのが T2T（treat to target：目標達成に向けた治療）。"],"core":"MTX で効果不十分（フェーズ II）＝MTX 併用で bDMARD（TNF（tumor necrosis factor：腫瘍壊死因子）・IL-6（interleukin-6：インターロイキン6）・アバタセプト）を追加。JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬も選べるが、長期安全性と医療経済から bDMARD を優先して考える。","e":"選び方の目安：\n・妊娠の希望：セルトリズマブペゴル（シムジア）\n・感染の不安・高齢・合併症が多い：アバタセプト（オレンシア）\n・MTX を増やせない／単独で使いたい：IL-6 阻害薬\n・費用を抑えたい：バイオシミラー\n・大腸憩室炎の既往：IL-6 阻害薬は避ける\n・心不全・脱髄疾患：TNF 阻害薬は避ける\n・自己注射が難しい：点滴製剤（インフリキシマブ（レミケード）・トシリズマブ・アバタセプト）","tg":["ae","cs"],"mt":["bdmard"]},{"id":"ratx-515f13bb","f":"ratx","u":10,"o":60,"lv":3,"q":"82歳の女性。関節リウマチを新たに診断した。eGFR（estimated glomerular filtration rate：推算糸球体濾過量） 35 mL/分/1.73m²、体重 40 kg、軽い間質性肺炎の陰影がある。MTX（methotrexate：メトトレキサート） の使い方として最も適切なのはどれか。","ch":["MTX 週16 mg から始める","葉酸を併用すれば量を気にしなくてよい","MTX を毎日 2 mg 内服させる","MTX を避け、他の薬を考える"],"a":3,"cx":["高齢・腎機能低下・低体重・肺病変は MTX の副作用の危険因子が重なっていて、最大量からの開始は危険。","葉酸で副作用は減るが、腎機能低下による蓄積は防げない。","MTX は週1回の薬。毎日の内服は重い中毒になる。",""],"core":"高齢・eGFR 低値（30〜60）・低体重・肺病変・低アルブミン＝MTX の危険因子。使うなら少量（週2〜6 mg）で慎重に、重なるならサラゾスルファピリジン（アザルフィジンEN）・アバタセプトなどを考える。","e":"eGFR 30 未満は MTX の禁忌。30〜60 は減量して慎重に。\n高齢者では、肺の評価（CT・KL-6（Krebs von den Lungen-6：間質性肺炎のマーカー））と感染症の予防（ワクチン）がとくに大切。\n高齢者の RA（rheumatoid arthritis：関節リウマチ） にもガイドラインのアルゴリズムは同じだが、薬の量と合併症に合わせて選ぶ。","tg":["cs"],"mt":["csdmard","elderly"]},{"id":"ratx-9a208463","f":"ratx","u":10,"o":61,"lv":3,"q":"50歳の女性。関節リウマチで MTX（methotrexate：メトトレキサート） と TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬を使用中。圧痛関節が12あるため CDAI（Clinical Disease Activity Index） 18 だが、腫脹関節は0、CRP（C-reactive protein：C反応性タンパク） 0.05 mg/dL。関節エコーで滑膜炎はない。全身の痛み・不眠・疲労が強い。次の対応として最も適切なのはどれか。","ch":["線維筋痛症の合併を考え、薬の追加は控える","MTX を週 20 mg に増やす","ステロイドを 20 mg/日追加する","すぐ JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬に切り替える"],"a":0,"cx":["","MTX の最大量は週16 mg で、炎症がない痛みには効かない。","ステロイドは線維筋痛症に効かない。","炎症が残っていない（腫脹0・CRP 正常・エコー正常）のに、抗リウマチ薬を強めても良くならない。"],"core":"圧痛だけが多く、腫脹・CRP・エコーが正常＝線維筋痛症（中枢性感作）の合併。CDAI・DAS28（Disease Activity Score 28（28関節の疾患活動性スコア）） が過大評価される → 治療を強めず、運動・睡眠・プレガバリン/デュロキセチン（サインバルタ）など。","e":"RA（rheumatoid arthritis：関節リウマチ） の約1〜2割に線維筋痛症が合併するといわれる。\n患者全般評価と圧痛関節数が高く、腫脹関節と CRP が低い「解離」が手がかり。\n関節エコー・MRI（magnetic resonance imaging） で炎症がないことを確かめると、不要な治療の強化を防げる。","tg":["cs"]},{"id":"ratx-c1ad444a","f":"ratx","u":11,"o":62,"lv":1,"q":"MTX（methotrexate：メトトレキサート） 内服中の葉酸（フォリアミン）の使い方として正しいものはどれか。","ch":["最後の MTX の24〜48時間後に週5 mg 以内","副作用が出てから始め、予防には使わない","葉酸は MTX の効果を消すので併用しない","MTX と同じ時刻に毎日 5 mg ずつ内服する"],"a":0,"cx":["","MTX 診療ガイドライン2023 では、葉酸を併用する前提で MTX を始める。","週5 mg 以内なら有効性への影響は小さく、肝障害・口内炎・消化器症状・血球減少を減らす。","MTX と同時に飲むと、MTX の効果まで弱める可能性がある。毎日は不要。"],"core":"MTX は週1〜2日に分けて飲み、葉酸は最後の MTX から 24〜48 時間後に週 5 mg 以内。2023年版から「葉酸を併用して導入」。","e":"MTX は葉酸の代謝（ジヒドロ葉酸還元酵素）を阻害する。葉酸不足による副作用（口内炎・肝障害・消化器症状・血球減少）は、少量の葉酸で予防できる。\n大量の MTX 中毒（誤って毎日内服した・腎機能が急に落ちた）による骨髄抑制には、葉酸ではなくホリナート（ロイコボリン）を使う。ホリナートは還元型の葉酸で、阻害された酵素を通らずに働ける。\n飲み方の例：週8 mg なら「月曜の朝・夕・火曜の朝」のように12時間ごとに分けて、24〜36時間で飲み切る。","tg":["ae"],"fig":["mtxweek"],"mt":["csdmard"]},{"id":"ratx-d977a653","f":"ratx","u":11,"o":63,"lv":2,"q":"MTX（methotrexate：メトトレキサート） 診療ガイドライン2023 に基づく MTX の用量として正しいものはどれか。","ch":["週25 mg で開始し、効いたら減らす","週2 mg で開始し、最大量は週8 mg","週8 mg 前後で開始し、最大は週16 mg","高齢者は週20 mg 以上を使う"],"a":2,"cx":["国内の承認上の最大量は週16 mg（内服）。週25 mg は海外の上限に近い量。","週2 mg は少なすぎる。危険因子がある人でも開始は週4〜6 mg（2023年版で変更）。","","高齢者は腎機能が落ちていることが多く、少なめに始める。"],"core":"MTX：開始 週8 mg（危険因子あり 4〜6 mg）→ 効果をみて増量 → 内服は最大 週16 mg、皮下注（メトジェクト）は最大 週15 mg。","e":"副作用の危険因子：高齢、腎機能低下（eGFR（estimated glomerular filtration rate：推算糸球体濾過量） が低い）、低アルブミン血症、肺病変、アルコール多飲、多剤併用。\n増量は効果と副作用を見ながら、2〜4週ごとに 2〜4 mg ずつ。皮下注は消化器症状で内服を増やせない人や、内服で効果不十分な人に使い、吸収が安定する。\nモニタリング：血算・AST/ALT・アルブミン・腎機能を、開始や増量後は2〜4週ごと、安定したら1〜3か月ごと。","tg":["ae","gl"],"mt":["csdmard"]},{"id":"ratx-ee5c9a0a","f":"ratx","u":11,"o":64,"lv":2,"q":"MTX（methotrexate：メトトレキサート） の禁忌・投与の判断として正しいものはどれか。","ch":["妊娠は禁忌で、1月経周期以上前に中止する","eGFR（estimated glomerular filtration rate：推算糸球体濾過量） 40 mL/分/1.73m² なら必ず禁忌である","胸水があれば量によらず必ず禁忌である","HBs（hepatitis B surface：B型肝炎ウイルス表面）抗原陽性でも専門医に相談せず使ってよい"],"a":0,"cx":["","重い腎障害（eGFR 30未満が目安）は禁忌。eGFR 30〜60 では減量して慎重に使う。","2023年版では、ドレナージが必要ない程度の胸水・腹水なら、少量で慎重に始めることが許容された（MTX が水分にたまるので注意は必要）。","HBs抗原陽性は核酸アナログの予防投与が必要で、肝臓専門医と連携する。"],"core":"MTX 禁忌：妊娠（催奇形性）・授乳・重い腎障害・重い肝障害・重い骨髄抑制・活動性結核・重い感染症。妊娠計画は1月経周期以上前に中止。","e":"MTX は腎臓から排泄されるので、腎機能が落ちると血中に残り、骨髄抑制や重い口内炎が出る。脱水（下痢・発熱・食事が取れない）・NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬） の併用・ST合剤（腎からの排泄を競合し、さらに葉酸代謝も阻害）でも危険が増す。\n「シックデイ」には一時休薬を指導する。\n男性の内服については、日本の添付文書・指針の書きぶりと海外の推奨（中止不要とするもの）が異なる。試験では女性の「1月経周期前の中止」を確実に覚える。","tg":["ae"],"mt":["csdmard","preg"]},{"id":"ratx-cbc92b6d","f":"ratx","u":11,"o":65,"lv":3,"q":"78歳の女性。関節リウマチで MTX（methotrexate：メトトレキサート） 週10 mg を内服中。尿路感染症で他院から ST合剤（スルファメトキサゾール・トリメトプリム：バクタ）を処方された。5日後から口内炎がひどく食事がとれず、白血球 1,200/μL、血小板 3.5万/μL。この時点の対応として最も適切なのはどれか。","ch":["MTX を週16 mg に増やして関節炎を抑える","葉酸（フォリアミン）を週5 mg 内服させる","G-CSF だけを投与し、MTX はそのまま続ける","MTX と ST合剤を中止し、ホリナート（ロイコボリン）を投与"],"a":3,"cx":["骨髄抑制の原因である MTX を増やすのは誤り。","週5 mg の葉酸は「予防」の量で、MTX 中毒による骨髄抑制には効かない（還元型のホリナート（ロイコボリン）が必要）。","原因薬を止めずに G-CSF だけでは不十分。G-CSF は中止とホリナート（ロイコボリン）に加えて使うもの。",""],"core":"MTX 中毒（高齢・腎機能低下・脱水・ST合剤）→ MTX 中止＋ホリナート（ロイコボリン）＋補液・感染対策。","e":"ST合剤のトリメトプリムは葉酸の代謝を阻害し、さらに MTX の腎排泄を減らすので、併用で骨髄抑制が起こりやすい。ニューモシスチス肺炎の予防量（1日1錠、週3回など）でも注意が必要。\n重い骨髄抑制では、ホリナートを静注・内服で血球が回復するまで使い、発熱性好中球減少症には広域抗菌薬。MTX の血中濃度が高いときは尿のアルカリ化と補液で排泄を促す。\n予防：腎機能に合わせた量、シックデイの休薬、薬の飲み方（週1回）の確認。","tg":["ae","cs"]},{"id":"ratx-497adc0f","f":"ratx","u":11,"o":66,"lv":3,"q":"65歳の男性。関節リウマチで MTX（methotrexate：メトトレキサート） 週12 mg を1年内服中。1週間前から乾いた咳と発熱、息切れが出た。SpO2 91%、胸部CTで両側びまん性のすりガラス影。β-D-グルカンは基準範囲内。最も考えられる病態と対応の組み合わせはどれか。","ch":["PCP（Pneumocystis pneumonia：ニューモシスチス肺炎）：ST合剤（スルファメトキサゾール・トリメトプリム：バクタ）の治療量、MTX はそのまま続ける","細菌性肺炎：抗菌薬を使い、MTX は増量する","RA（rheumatoid arthritis：関節リウマチ） の UIP（usual interstitial pneumonia：通常型間質性肺炎） の進行：ニンテダニブ（オフェブ）を追加する","MTX 肺炎：MTX を中止し、ステロイドを使う"],"a":3,"cx":["β-D-グルカンが正常で、PCP の可能性は低い（ただし完全には否定できず、喀痰の PCR を出すこともある）。いずれにせよ MTX は止める。","両側びまん性のすりガラス影と乾性咳は細菌性肺炎の典型ではない。MTX の増量は誤り。","1週間の急性の経過・すりガラス影は、慢性に進む UIP の進行とは合わない。",""],"core":"MTX 内服中の急な乾性咳・発熱・呼吸困難・すりガラス影＝MTX 肺炎か PCP。どちらでも MTX はすぐ中止。β-D-グルカン・KL-6（Krebs von den Lungen-6：間質性肺炎のマーカー）・喀痰 PCR で区別。","e":"MTX 肺炎は量に関係なく起こる（過敏反応）。開始後1年以内が多い。危険因子：高齢、既存の間質性肺疾患、糖尿病、低アルブミン血症。\n対応：MTX を中止し、感染症（PCP・細菌・ウイルス・結核）を除外しながら、重ければステロイドパルスを含むステロイド。再投与はしない。\nPCP との違い：PCP は β-D-グルカン高値・LDH 高値・急速進行。区別がつかないときは両方を治療することもある。\n患者には「乾いた咳・息切れ・発熱が出たらすぐ MTX を止めて連絡」と指導する。","tg":["ae","cs"]},{"id":"ratx-b34b8bcf","f":"ratx","u":11,"o":67,"lv":3,"q":"72歳の女性。関節リウマチで MTX（methotrexate：メトトレキサート） 内服中（8年）。2か月前から頸部のリンパ節が腫れて、微熱と体重減少がある。LDH・sIL-2R（soluble interleukin-2 receptor：可溶性IL-2受容体） 高値。生検で EBV（Epstein-Barr virus） 陽性のびまん性大細胞型B細胞リンパ腫。最初に行うべき対応はどれか。","ch":["MTX を増量して自己免疫を抑える","MTX を中止して、退縮するかを経過観察する","生物学的製剤を追加する","すぐに R-CHOP 療法を始め、MTX は続ける"],"a":1,"cx":["MTX が原因の可能性があるのに増量するのは誤り。","","腫瘍が疑われる状態で免疫抑制を強めるのは不適切。","化学療法は、MTX 中止後2〜4週程度で退縮しない例や進行が速い例で考える。まず中止が先。"],"core":"MTX-LPD（MTX関連リンパ増殖性疾患）＝まず MTX 中止。EBV 陽性例ほど自然に小さくなりやすい（半数前後）。","e":"MTX-LPD はリンパ節だけでなく、節外（皮膚・肺・口腔・消化管）にも出る。びまん性大細胞型B細胞リンパ腫と Hodgkin 様が多い。\nMTX を中止すると数週で小さくなることが多いが、一度小さくなったあと再燃する例もあり、血液内科と連携して経過を見る。\nRA（rheumatoid arthritis：関節リウマチ） の治療の再開：MTX は再開しない。2023年の MTX ガイドラインで「MTX-LPD 後の TNF（tumor necrosis factor：腫瘍壊死因子） 阻害薬は禁止」という記載は外された。アバタセプト（オレンシア）・IL-6（interleukin-6：インターロイキン6） 阻害薬・TNF 阻害薬などで慎重に治療する。JAK（Janus kinase：ヤヌスキナーゼ） 阻害薬や生物学的製剤の使用は血液内科と相談して決める。","tg":["ae","cs"]},{"id":"ratx-23a1dc82","f":"ratx","u":11,"o":68,"lv":2,"q":"MTX（methotrexate：メトトレキサート） の血中濃度を上げ、骨髄抑制などの副作用を起こしやすくする併用薬はどれか。","ch":["葉酸・ビタミンB12・鉄剤","カルシウム製剤・制酸剤","ST合剤（スルファメトキサゾール・トリメトプリム：バクタ）・NSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）・プロベネシド","アセトアミノフェン（カロナール）・漢方薬"],"a":2,"cx":["葉酸は副作用を減らす薬。ビタミンB12・鉄は影響しない。","PPI（proton pump inhibitor：プロトンポンプ阻害薬） は大量 MTX（抗癌剤の量）で排泄を遅らせる報告があるが、ほかにも重要な相互作用がある。","","アセトアミノフェン・カルシウム製剤に大きな相互作用はない。"],"core":"MTX の排泄を減らす：NSAIDs（腎血流↓）・プロベネシド・ペニシリン系（尿細管分泌の競合）・ST合剤（排泄↓＋葉酸代謝阻害）。脱水・腎機能低下も同じ。","e":"高齢者では、少しの腎機能の変化で MTX が蓄積する。\n他院で風邪・膀胱炎の薬（ST合剤）や鎮痛薬を出されることが多いので、「MTX 手帳」や薬手帳で伝えるよう指導する。\nアルコールは肝障害を増やすので控える。","tg":["ae"],"mt":["csdmard"]},{"id":"ratx-3e1b2cac","f":"ratx","u":11,"o":69,"lv":2,"q":"MTX（methotrexate：メトトレキサート） 内服中に AST・ALT が上がったときの対応として正しいものはどれか。","ch":["値によらず MTX を増やして続ける","軽い上昇でも二度と MTX を使えない","上限の3倍を超えたら中止・減量する","肝酵素が上がったら葉酸を中止する"],"a":2,"cx":["増量は肝障害を悪化させる。","軽度の上昇は葉酸の増量・減量で戻ることが多く、再開できることも多い。","","葉酸は肝障害を減らす側の薬なので、むしろ増やすことを考える。"],"core":"MTX の肝障害：基準値上限の3倍未満なら葉酸の増量・減量で様子を見て、3倍を超えたら中止（減量）して原因を探す（脂肪肝・飲酒・ウイルス性肝炎・ほかの薬）。","e":"肝障害を起こしやすい人：肥満・糖尿病（代謝機能障害関連脂肪性肝疾患）、飲酒、B 型・C 型肝炎。\n長期の使用で肝線維化が問題になることがあり、血小板の低下・アルブミンの低下・線維化マーカーに注意する。\nB 型肝炎の既往感染者は、肝酵素の上昇時に HBV（hepatitis B virus：B型肝炎ウイルス）-DNA を必ず確認する。","tg":["ae"]},{"id":"ratx-256204d1","f":"ratx","u":11,"o":70,"lv":3,"q":"80歳の女性。関節リウマチで MTX（methotrexate：メトトレキサート） 週6 mg。3日前から胃腸炎で嘔吐と下痢があり、食事・水分がとれていない。この時期の MTX の扱いとして最も適切なのはどれか。","ch":["いつもどおり MTX を飲ませる","回復するまで MTX を休む","飲めない分を翌日にまとめて飲む","MTX を毎日少しずつ飲ませる"],"a":1,"cx":["脱水で腎機能が落ちると MTX が蓄積し、骨髄抑制・口内炎が起こる。","","まとめ飲みは過量になり危険。","MTX を毎日飲むのは重大な誤り（中毒）。"],"core":"シックデイ（発熱・下痢・嘔吐・食事がとれない）＝MTX を休む。脱水で腎機能が落ちると中毒になる。回復後に再開する。","e":"高齢者・腎機能の低い人では、とくに事前にシックデイの指導をしておく。\nNSAIDs（non-steroidal anti-inflammatory drugs：非ステロイド性抗炎症薬）・利尿薬・ACE（angiotensin-converting enzyme：アンジオテンシン変換酵素） 阻害薬/ARB（angiotensin II receptor blocker：アンジオテンシンII受容体拮抗薬）・SGLT2 阻害薬もシックデイには休薬を考える薬。\n口内炎・発熱・咳が出たら連絡するよう伝える。","tg":["ae","cs"]},{"id":"ratx-3b5547e9","f":"ratx","u":11,"o":71,"lv":2,"q":"MTX（methotrexate：メトトレキサート） の皮下注射製剤（メトジェクト）について正しいものはどれか。","ch":["毎日1回皮下注射する","葉酸の併用は不要である","妊娠中でも安全に使える","週1回で、最大は週15 mg"],"a":3,"cx":["MTX は皮下注も週1回。毎日の注射は中毒になる。","皮下注でも葉酸は併用する。","内服と同じく妊娠は禁忌。",""],"core":"メトジェクト＝週1回の皮下注（7.5 mg から始め最大 15 mg）。吸収が安定し、消化器症状で内服を増やせない人・内服で効かない人の選択肢。","e":"内服の MTX は量が増えると吸収が頭打ちになるが、皮下注は量に比例して血中濃度が上がる。\nガイドライン2024 では、アルゴリズムの中で内服と皮下注を区別しない。\n自己注射の手技の指導と、針の廃棄方法も説明する。","tg":[]},{"id":"ratx-1a4c0b3a","f":"ratx","u":12,"o":72,"lv":2,"q":"サラゾスルファピリジン（アザルフィジンEN）について正しいものはどれか。","ch":["国内では関節リウマチに保険適用がない","ワルファリン（ワーファリン）との併用は禁忌である","主な副作用は膜性腎症による蛋白尿","妊娠中も使え、男性で可逆的な精子減少"],"a":3,"cx":["関節リウマチに保険適用がある（腸溶錠のアザルフィジンEN）。","ワルファリンとの併用が禁忌なのはイグラチモド（ケアラム）。","蛋白尿（膜性腎症）が有名なのはブシラミン（リマチル）。",""],"core":"SASP（salazosulfapyridine：サラゾスルファピリジン）：妊娠中も可（葉酸補充）・男性の可逆的な精子減少・皮疹（DIHS）・無顆粒球症（開始後3か月以内）・尿や汗の黄色。","e":"副作用：皮疹（重症薬疹・DIHS（薬剤性過敏症症候群）を含む）、肝障害、無顆粒球症、消化器症状、尿・汗・ソフトコンタクトレンズの黄染。サルファ剤アレルギーの人には使わない。\nスルファピリジンの部分が葉酸の吸収を妨げるので、妊娠中は葉酸を補う。\n乾癬性関節炎・脊椎関節炎の末梢関節炎にも使われる（体軸病変には効かない）。","tg":["ae"],"mt":["csdmard"]},{"id":"ratx-7b895ed9","f":"ratx","u":12,"o":73,"lv":2,"q":"csDMARD（conventional synthetic DMARD：従来型合成抗リウマチ薬） とその特徴的な副作用の組み合わせで正しいものはどれか。","ch":["ブシラミン（リマチル） ― 蛋白尿（膜性腎症）","レフルノミド（アラバ） ― 尿の黄染","イグラチモド（ケアラム） ― 視力障害（網膜症）","タクロリムス（プログラフ） ― 低血糖"],"a":0,"cx":["","尿の黄染はサラゾスルファピリジン（アザルフィジンEN）。レフルノミドは間質性肺炎（日本人で重い）・肝障害・催奇形性。","網膜症はヒドロキシクロロキン（プラケニル）。イグラチモドは肝障害・ワルファリンとの相互作用（併用禁忌）。","タクロリムスはむしろ高血糖（膵β細胞への作用）・腎障害・高血圧・低マグネシウム血症。"],"core":"ブシラミン＝蛋白尿・黄色爪、イグラチモド＝ワルファリン（ワーファリン）禁忌、タクロリムス＝腎障害・高血糖、レフルノミド＝間質性肺炎・催奇形性。","e":"・ブシラミン（リマチル）：SH 基をもつ。蛋白尿（膜性腎症、中止で多くは回復）、皮疹、味覚障害、黄色爪症候群。国内の最大量は1日300 mg。\n・イグラチモド（ケアラム）：国内で開発。ワルファリンの作用を強めて重い出血を起こすので併用禁忌。肝障害、消化性潰瘍。\n・タクロリムス（プログラフ）：カルシニューリン阻害薬。腎障害・高血糖・高血圧・振戦・低マグネシウム血症。CYP3A4（cytochrome P450 3A4：薬物代謝酵素） で代謝されるため、クラリスロマイシン（クラリス）・アゾール系抗真菌薬・グレープフルーツで血中濃度が上がる。トラフ濃度を測る。\n・レフルノミド（アラバ）：活性代謝物の半減期が長い（約2週間〜）ので、妊娠希望や重い副作用ではコレスチラミン（クエストラン）で除去（ウォッシュアウト）する。","tg":["ae"],"mt":["csdmard"]},{"id":"ratx-bfe511b5","f":"ratx","u":12,"o":74,"lv":2,"q":"ヒドロキシクロロキン（プラケニル）について、国内の承認として正しいものはどれか。","ch":["妊娠中は催奇形性があるので禁忌である","SLE（systemic lupus erythematosus：全身性エリテマトーデス） と皮膚エリテマトーデスに適応がある","関節リウマチの第一選択として適応がある","1日量は実際の体重だけで決めている"],"a":1,"cx":["妊娠中も続けることが勧められる（中止すると SLE（systemic lupus erythematosus：全身性エリテマトーデス） が再燃しやすい）。","","海外では RA（rheumatoid arthritis：関節リウマチ） の併用療法（MTX（methotrexate：メトトレキサート）＋SASP（salazosulfapyridine：サラゾスルファピリジン）＋HCQ（hydroxychloroquine：ヒドロキシクロロキン））に使われるが、国内では RA に保険適用がない。","国内では身長から計算する理想体重で1日量を決める（過量で網膜症が増えるため）。"],"core":"HCQ（国内）＝SLE・皮膚エリテマトーデスに適応。量は理想体重で決め、網膜症の検査を年1回。","e":"網膜症（ブルズアイ黄斑症）は累積量と1日量（実体重あたり5 mg/kg を超える）で増える。開始時と、その後は年1回の眼科検査（視野・OCT（optical coherence tomography：光干渉断層計） など）。\n国内の用量（理想体重）：31〜46 kg 未満は 200 mg/日、46〜62 kg 未満は 200 mg と 400 mg を1日おき、62 kg 以上は 400 mg/日。理想体重は身長から計算する（ブローカ式桂変法：女性＝(身長cm−100)×0.85、男性＝(身長cm−100)×0.9）。体重ではなく「身長」で決まる。\nほかの副作用：皮疹、低血糖、心筋症・QT 延長（まれ）、溶血（G6PD（glucose-6-phosphate dehydrogenase：グルコース-6-リン酸脱水素酵素） 欠損）。","tg":[],"mt":["sletx"]},{"id":"ratx-cf948984","f":"ratx","u":12,"o":75,"lv":3,"q":"45歳の女性。関節リウマチでサラゾスルファピリジン（アザルフィジンEN）を始めて4週間後、38℃の発熱と全身の紅
